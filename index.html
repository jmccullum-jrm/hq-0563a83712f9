      const [filter, setFilter] = useState('all');

      const filtered = useMemo(() => {
        return filter === 'all' ? log : log.filter(l => l.kind === filter);
      }, [log, filter]);

      // Group by relative bucket
      const buckets = useMemo(() => {
        const out = { 'Today': [], 'This week': [], 'This month': [], 'Earlier': [] };
        const now = new Date();
        const startOfDay = new Date(now); startOfDay.setHours(0,0,0,0);
        const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate() - now.getDay()); startOfWeek.setHours(0,0,0,0);
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
        filtered.forEach(l => {
          const d = new Date(l.completedAt);
          if (d >= startOfDay) out['Today'].push(l);
          else if (d >= startOfWeek) out['This week'].push(l);
          else if (d >= startOfMonth) out['This month'].push(l);
          else out['Earlier'].push(l);
        });
        return out;
      }, [filtered]);

      const KIND_LABELS = { maint:'Maintenance', vendor:'Vendor', warranty:'Warranty', property:'Property', sub:'Subscription' };
      const KIND_ICONS  = { maint:'wrench', vendor:'users', warranty:'cube', property:'key', sub:'receipt' };

      const counts = useMemo(() => {
        const c = { all: log.length };
        log.forEach(l => { c[l.kind] = (c[l.kind]||0) + 1; });
        return c;
      }, [log]);

      const kinds = ['all', ...Object.keys(KIND_LABELS).filter(k => counts[k])];

      return (
        <div className="space-y-5 max-w-4xl">
          <div className="flex items-baseline justify-between gap-3 flex-wrap">
            <p className="text-ink-300 text-sm max-w-2xl">
              Running history of items checked off the dashboard. {log.length} total · most recent first.
            </p>
            {log.length > 0 && (
              <button onClick={ctx.clearCompleted} className="text-ink-400 hover:text-ember-400 text-xs underline-offset-2 hover:underline transition">
                Clear history
              </button>
            )}
          </div>

          {log.length === 0 ? (
            <Empty icon="check" title="Nothing completed yet"
              body="When you tick the round checkbox on overdue or upcoming items, they'll be logged here." />
          ) : (
            <>
              <div className="flex gap-2 overflow-x-auto no-bar -mx-1 px-1">
                {kinds.map(k => (
                  <button key={k} onClick={() => setFilter(k)}
                     className={`shrink-0 px-3 py-1.5 rounded-full text-xs border transition whitespace-nowrap ${
                       filter === k ? 'bg-ink-100 text-ink-900 border-ink-100' : 'border-ink-600 text-ink-200 hover:bg-ink-800'
                     }`}>
                    {k === 'all' ? `All · ${counts.all}` : `${KIND_LABELS[k]} · ${counts[k]}`}
                  </button>
                ))}
              </div>

              {Object.entries(buckets).filter(([_,items]) => items.length > 0).map(([bucket, items]) => (
                <section key={bucket}>
                  <div className="text-[11px] uppercase tracking-[0.18em] text-ink-400 mb-2.5">{bucket}</div>
                  <div className="space-y-2">
                    {items.map(l => {
                      const d = new Date(l.completedAt);
                      const when = d.toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
                      return (
                        <div key={l.id} className="card p-3 md:p-4 flex items-start gap-3 group">
                          <div className="w-7 h-7 rounded-full bg-sage-400/15 grid place-items-center text-sage-400 shrink-0 mt-0.5">
                            <Icon name="check" size={13} />
                          </div>
                          <div className="w-9 h-9 rounded-lg bg-ink-700 grid place-items-center text-ink-300 shrink-0">
                            <Icon name={KIND_ICONS[l.kind]||'dot'} size={15} />
                          </div>
                          <div className="min-w-0 flex-1">
                            <div className="text-sm text-ink-100 line-through decoration-ink-500/40 decoration-1">{l.title}</div>
                            {l.sub && <div className="text-ink-400 text-xs mt-0.5 truncate">{l.sub}</div>}
                            <div className="text-ink-400 text-[11px] mt-1">
                              <span className="uppercase tracking-wider">{KIND_LABELS[l.kind]||l.kind}</span> · {when}
                              {l.originalDue && <span className="text-ink-500"> · was due {fmtDate(l.originalDue,{month:'short',day:'numeric'})}</span>}
                            </div>
                          </div>
                          <button onClick={() => ctx.undoDone(l.id)} title="Undo"
                             className="opacity-0 group-hover:opacity-100 transition text-ink-400 hover:text-gold-300 text-xs px-2 py-1">
                            Undo
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </section>
              ))}
            </>
          )}
        </div>
      );
    };

    const StatTile = ({ label, value, tone, hint }) => (
      <div className="card p-4 md:p-5 flex flex-col gap-1.5">
        <div className="text-[11px] uppercase tracking-[0.16em] text-ink-400">{label}</div>
        <div className="flex items-baseline gap-2">
          <div className={`font-display text-3xl md:text-4xl tabular-nums ${
            tone==='overdue' ? 'text-ember-400' :
            tone==='soon'    ? 'text-gold-400'  :
            tone==='ok'      ? 'text-sage-400'  :
            'text-ink-100'
          }`}>{value}</div>
          {hint && <div className="text-ink-400 text-xs">{hint}</div>}
        </div>
      </div>
    );

    const DashboardItem = ({ item, kind, onComplete, onJump }) => {
      const [checking, setChecking] = useState(false);
      const firedRef = useRef(false);
      const handleCheck = (e) => {
        e.stopPropagation();
        if (!onComplete || firedRef.current) return;
        firedRef.current = true;
        setChecking(true);
        // Brief visual feedback before mutating state (which removes the card)
        setTimeout(() => onComplete(), 280);
      };
      return (
        <div className={`card p-4 flex items-start gap-3 transition-all ${checking ? 'opacity-40 scale-95' : ''}`}>
          {onComplete && (
            <button onClick={handleCheck} title="Mark done"
              className={`w-6 h-6 mt-0.5 rounded-full border-2 grid place-items-center shrink-0 transition-all ${
                checking
                  ? 'bg-sage-400 border-sage-400 scale-110'
                  : 'border-ink-500 hover:border-sage-400 hover:bg-sage-400/10'
              }`}>
              <Icon name="check" size={12} className={checking ? 'text-ink-900' : 'text-transparent'} />
            </button>
          )}
          <div className={`w-10 h-10 rounded-xl grid place-items-center shrink-0 ${kind==='overdue'?'bg-ember-500/12 text-ember-400':'bg-ink-700 text-gold-400'}`}>
            <Icon name={
              item.kind==='maint'?'wrench':
              item.kind==='vendor'?'users':
              item.kind==='property'?'key':
              item.kind==='sub'?'receipt':
              'cube'

          </div>
          <div className={`min-w-0 flex-1 ${checking ? 'line-through text-ink-400' : ''}`}>
            <div className="text-sm font-medium truncate">{item.title}</div>

            <div className="mt-2 flex items-center gap-2 flex-wrap">
              <Pill tone={kind==='overdue'?'overdue':'soon'} dot>{kind==='overdue'?`${Math.abs(item.n)}d overdue`:fmtRelative(item.when)}</Pill>
              <span className="text-ink-400 text-xs">{fmtDate(item.when,{month:'short',day:'numeric'})}</span>
            </div>
          </div>
          <button onClick={onJump} title="Open" className="w-9 h-9 rounded-lg grid place-items-center text-ink-300 hover:bg-ink-700 shrink-0"><Icon name="chevR" size={16}/></button>
        </div>
      );
    };

    const DigestModal = ({ text, onClose }) => {
      const [copied, setCopied] = useState(false);
      const copy = async () => {
        try { await navigator.clipboard.writeText(text); setCopied(true); setTimeout(()=>setCopied(false), 1500); } catch {}
      };
      const mailto = () => {
        const url = `mailto:?subject=${encodeURIComponent("Home HQ weekly digest")}&body=${encodeURIComponent(text)}`;
        window.location.href = url;
      };
      return (
        <>
          <ModalHeader title="This week's digest" subtitle="Forward this to yourself or your spouse." onClose={onClose} />
          <div className="p-5 md:p-6">
            <textarea readOnly value={text} className="font-mono text-[12.5px] leading-relaxed h-72 resize-none" />
            <div className="flex items-center justify-end gap-2 mt-4">
              <Btn variant="ghost" icon="mail" onClick={mailto}>Email</Btn>
              <Btn icon="copy" onClick={copy}>{copied ? 'Copied' : 'Copy'}</Btn>
            </div>
          </div>
        </>

    /* ===================== VENDORS ===================== */
    const VendorsView = () => {
      const ctx = useContext(Ctx);
      const { state, setModal } = ctx;
      const [filter, setFilter] = useState('all');
      const [thisWeek, setThisWeek] = useState(false);
      const [query, setQuery] = useState('');

        return ['all', ...Array.from(set).sort()];
      }, [state.vendors]);

      const filtered = useMemo(() => {
        return state.vendors.filter(v => {
          if (!inScope(v, ctx.propertyScope)) return false;
          if (filter !== 'all' && v.serviceType !== filter) return false;
          if (thisWeek) { const n = daysUntil(v.nextVisit); if (n === null || n < 0 || n > 7) return false; }
          if (query) {
            const q = query.toLowerCase();
            if (!`${v.name} ${v.company} ${v.serviceType} ${v.notes||''}`.toLowerCase().includes(q)) return false;
          }
          return true;
        });
      }, [state.vendors, filter, thisWeek, query, ctx.propertyScope]);

      const open = (v) => setModal(<VendorForm vendor={v} onClose={()=>setModal(null)} />);

      return (

            <Btn icon="plus" onClick={()=>open(null)}>Add vendor</Btn>

          <div className="flex items-center gap-2">
            <div className="relative flex-1">
              <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-ink-400" />

            <button onClick={()=>setThisWeek(s=>!s)} className={`shrink-0 inline-flex items-center gap-2 px-3 py-2 rounded-xl text-sm border ${thisWeek?'bg-gold-400/12 border-gold-400/40 text-gold-300':'border-ink-600 text-ink-200 hover:bg-ink-800'}`}>
              <Icon name="calendar" size={15} /> This week

          </div>

          <div className="flex gap-2 overflow-x-auto no-bar -mx-1 px-1">
            {types.map(t => (
              <button key={t} onClick={()=>setFilter(t)}
                className={`shrink-0 px-3 py-1.5 rounded-full text-xs border transition ${filter===t ? 'bg-ink-100 text-ink-900 border-ink-100' : 'border-ink-600 text-ink-200 hover:bg-ink-800'}`}>
                {t === 'all' ? 'All' : t}
              </button>
            ))}
          </div>

          {filtered.length === 0 ? (
            <Empty icon="users" title="No vendors match" body="Try clearing the filter, or add a new vendor." cta={<Btn icon="plus" onClick={()=>open(null)}>Add vendor</Btn>} />

            <div className="grid md:grid-cols-2 gap-3">
              {filtered.map(v => <VendorCard key={v.id} v={v} onEdit={()=>open(v)} />)}

                <div className="text-[11px] uppercase tracking-wider text-ink-400">{v.serviceType}</div>
                {v.placeholder && <PlaceholderBadge/>}

            <button onClick={onEdit} className="w-9 h-9 rounded-lg grid place-items-center text-ink-300 hover:bg-ink-700 shrink-0"><Icon name="edit" size={15}/></button>

          <div className="mt-3 flex items-center gap-2 flex-wrap">
            {v.nextVisit && (
              <Pill tone={nextN<0?'overdue':nextN<=7?'soon':'info'} dot>

            <Pill tone="muted">{sched}</Pill>
            {v.rate && <Pill tone="muted">{v.rate}</Pill>}
          </div>
          {v.notes && <div className="text-ink-300 text-xs mt-3 line-clamp-2 leading-relaxed">{v.notes}</div>}
          <div className="divider my-4" />
          <div className="flex items-center gap-2">
            <a href={`tel:${v.phone}`} className="flex-1 inline-flex items-center justify-center gap-2 py-2 rounded-lg bg-ink-700 hover:bg-ink-600 text-ink-100 text-sm"><Icon name="phone" size={15}/> Call</a>
            <a href={`sms:${v.phone}`} className="flex-1 inline-flex items-center justify-center gap-2 py-2 rounded-lg bg-ink-700 hover:bg-ink-600 text-ink-100 text-sm"><Icon name="message" size={15}/> Text</a>
            <a href={`mailto:${v.email}`} className="flex-1 inline-flex items-center justify-center gap-2 py-2 rounded-lg bg-ink-700 hover:bg-ink-600 text-ink-100 text-sm"><Icon name="mail" size={15}/> Email</a>
          </div>
        <LinkChips links={v.links} entityKind="vendors" entityId={v.id} />
        </div>
      );

    const VendorForm = ({ vendor, onClose }) => {
      const ctx = useContext(Ctx);
      const isNew = !vendor;
      const [v, setV] = useState(vendor || {
        name:'', company:'', serviceType:'', phone:'', email:'', rate:'', property:'',
        schedule:{ recurring:false, freq:{count:1, unit:'months'}, dayOfWeek:'' },
        lastVisit:'', nextVisit:'', notes:''
      });
      const setField = (k, val) => setV(prev => ({...prev, [k]: val}));
      const setSched = (k, val) => setV(prev => ({...prev, schedule: {...prev.schedule, [k]: val}}));
      const setFreq = (k, val) => setV(prev => ({...prev, schedule: {...prev.schedule, freq: {...(prev.schedule.freq || {count:1, unit:'months'}), [k]: val}}}));

      const save = () => {
        const payload = {...v};
        if (!payload.schedule.recurring) payload.schedule = {...payload.schedule, recurring:false};
        if (isNew) ctx.addVendor(payload); else ctx.updateVendor(vendor.id, payload);
        ctx.showToast(isNew?'Vendor added':'Vendor updated');
        onClose();

        if (window.confirm(`Delete ${vendor.company}?`)) { ctx.deleteVendor(vendor.id); ctx.showToast('Vendor deleted'); onClose(); }

      return (

          <div className="p-5 md:p-6 space-y-4">

            <div className="card-soft p-3.5">
              <div className="flex items-center justify-between">

                <button type="button" onClick={()=>setV(prev => ({...prev, schedule: {...prev.schedule, recurring: !prev.schedule.recurring, freq: prev.schedule.freq || {count:1, unit:'months'}}}))}

                  <div><label>Day (opt.)</label>

    /* ===================== MAINTENANCE ===================== */

    const TaskForm = ({ task, onClose }) => {
      const ctx = useContext(Ctx);
      const isNew = !task;
      const [t, setT] = useState(task || { name:'', freq:{count:1, unit:'years'}, lastCompleted: toISO(today()), estimatedCost:0, notes:'', vendorHint:'', property:'' });

    const Timeline = ({ tasks, onPick }) => {
      const months = useMemo(() => {
        const arr = [];
        const start = new Date(today().getFullYear(), today().getMonth(), 1);
        for (let i=0; i<12; i++) {
          const m = new Date(start.getFullYear(), start.getMonth()+i, 1);
          arr.push(m);
        }
        return arr;
      }, []);
      const buckets = useMemo(() => {
        const map = months.map(()=>[]);
        tasks.forEach(t => {
          const next = maintenanceNextDue(t); if (!next) return;
          const d = parseDate(next);
          // Overdue from a prior month → surface in the current month instead of vanishing
          if (d < months[0]) { map[0].push(t); return; }
          months.forEach((m, i) => {
            const end = new Date(m.getFullYear(), m.getMonth()+1, 1);
            if (d >= m && d < end) map[i].push(t);
          });
        });
        return map;
      }, [tasks, months]);
      const unscheduled = useMemo(() => tasks.filter(t => !maintenanceNextDue(t)), [tasks]);
      const totalCost = (mIdx) => buckets[mIdx].reduce((acc,t)=>acc + (t.estimatedCost||0), 0);
      return (
        <div className="card p-4 md:p-5">
          <div className="text-ink-300 text-xs mb-3">Next 12 months — clusters help with budget planning. Tap a task to edit.</div>
          <div className="space-y-3">
            {months.map((m, i) => (
              <div key={i} className="flex gap-4 items-start">
                <div className="w-20 md:w-24 shrink-0 pt-1">
                  <div className="text-ink-100 text-sm font-medium">{m.toLocaleDateString(undefined,{month:'short'})}</div>
                  <div className="text-ink-400 text-[11px]">{m.getFullYear()}</div>
                  {totalCost(i) > 0 && <div className="text-gold-400 text-[11px] mt-0.5 tabular-nums">~${totalCost(i).toLocaleString()}</div>}
                </div>
                <div className="flex-1 min-h-[2rem] border-l border-dashed border-ink-600 pl-4 py-1">
                  {buckets[i].length === 0 ? (
                    <div className="text-ink-500 text-xs italic">—</div>

                    <div className="flex flex-wrap gap-1.5">
                      {buckets[i].map(t => {
                        const status = maintenanceStatus(t);
                        return (
                          <button key={t.id} onClick={()=>onPick(t)}
                            className={`text-[12px] px-2.5 py-1 rounded-lg border inline-flex items-center gap-1.5 transition hover:translate-y-[-1px] ${
                              status.tone==='overdue' ? 'border-ember-500/30 text-ember-400 bg-ember-500/10' :
                              status.tone==='soon'    ? 'border-gold-400/30 text-gold-300 bg-gold-400/10' :
                                                        'border-ink-600 text-ink-200 bg-ink-800'
                            }`}>
                            <span className="w-1.5 h-1.5 rounded-full bg-current opacity-70"/>
                            {t.name}
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>
            ))}
            {unscheduled.length > 0 && (
              <div className="flex gap-4 items-start pt-2 border-t border-ink-700">
                <div className="w-20 md:w-24 shrink-0 pt-1">
                  <div className="text-ink-300 text-sm font-medium">No date</div>
                  <div className="text-ink-400 text-[11px]">set last completed</div>
                </div>
                <div className="flex-1 min-h-[2rem] border-l border-dashed border-ink-600 pl-4 py-1">

    const FilePreviewModal = ({ file, onClose }) => {
      const { url, label } = file;
      const embed = toBoxEmbed(url);
      const [loaded, setLoaded] = useState(false);
      const [errored, setErrored] = useState(false);
      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        document.body.style.overflow = 'hidden';
        return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
      }, [onClose]);
      return (
        <div className="fixed inset-0 z-50 modal-backdrop flex items-end md:items-center justify-center px-3 md:px-6 pb-3 md:pb-0" onClick={onClose}>
          <div className="modal-shell w-full max-w-5xl h-[88vh] md:h-[82vh] flex flex-col anim-in overflow-hidden" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between gap-3 p-4 border-b border-ink-600">
              <div className="min-w-0 flex-1">
                <div className="font-display text-base leading-tight truncate">{label}</div>
                <div className="text-ink-400 text-[11px] mt-0.5 truncate">{(() => { try { return new URL(url).hostname; } catch { return url; } })()}</div>
              </div>
              <a href={url} target="_blank" rel="noreferrer" className="shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-ink-700 hover:bg-ink-600 text-ink-100 text-xs">
                <Icon name="link" size={13} className="text-gold-400"/> Open in Box
              </a>
              <button onClick={onClose} className="shrink-0 w-9 h-9 rounded-full grid place-items-center text-ink-300 hover:bg-ink-700">
                <Icon name="x" size={18}/>
              </button>
            </div>
            <div className="flex-1 bg-ink-850 relative">
              {embed && !errored ? (
                <>
                  {!loaded && (
                    <div className="absolute inset-0 grid place-items-center text-ink-400 text-sm">Loading preview…</div>
                  )}
                  <iframe
                    src={embed}
                    title={label}
                    className="w-full h-full border-0"
                    allow="fullscreen"
                    onLoad={() => setLoaded(true)}
                    onError={() => setErrored(true)}
                  />
                </>
              ) : (
                <div className="absolute inset-0 grid place-items-center px-6 text-center">
                  <div>
                    <div className="text-ink-100 mb-2">Inline preview not available.</div>
                    <div className="text-ink-300 text-sm mb-4">This link doesn't support embed-mode preview, or your Box session blocked it.</div>
                    <a href={url} target="_blank" rel="noreferrer" className="btn-primary inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-sm font-medium">
                      <Icon name="link" size={14}/> Open in Box

                  </div>
                </div>

        </div>
      );

    /* Visible "Placeholder" pill — surfaces seeded gap-fillers that need real data */
    const PlaceholderBadge = () => (

        <span className="w-1.5 h-1.5 rounded-full bg-gold-400 animate-pulse"/>
        Placeholder
      </span>
    );
    // Wrapper class fragment — apply to a card div to give it a dashed/dim look
    const phCard = (isPh, base='card') => `${base}${isPh ? ' border-dashed border-gold-400/30 opacity-90' : ''}`;

    const LinkChips = ({ links, entityKind, entityId }) => {
      const ctx = useContext(Ctx);
      const [adding, setAdding] = useState(false);
      const [label, setLabel] = useState('');
      const [url, setUrl] = useState('');
      const canEdit = !!(entityKind && entityId && ctx.addLink);
      const hasLinks = links && links.length > 0;
      if (!hasLinks && !canEdit) return null;
      const open = (l, e) => {
        e?.stopPropagation();
        if (toBoxEmbed(l.url)) {
          ctx.setPreviewFile(l);
        } else {
          window.open(l.url, '_blank', 'noopener,noreferrer');
        }
      };
      const reset = () => { setAdding(false); setLabel(''); setUrl(''); };
      const submit = (e) => {
        e?.preventDefault?.();
        const u = (url || '').trim();
        if (!u) return;
        let labelToUse = (label || '').trim();
        if (!labelToUse) {
          // Derive a default label from the URL (Box file/folder/shared-id)
          try {
            const parsed = new URL(u);
            const seg = parsed.pathname.split('/').filter(Boolean);
            labelToUse = seg.length ? `Document ${seg[seg.length-1].slice(0,8)}` : 'Document';
          } catch { labelToUse = 'Document'; }
        }
        ctx.addLink(entityKind, entityId, { label: labelToUse, url: u });
        ctx.showToast?.('Link added');
        reset();
      };
      const removeAt = (idx, e) => {
        e?.stopPropagation();
        if (!canEdit) return;
        ctx.removeLink(entityKind, entityId, idx);
      };
      return (
        <>
          <div className="divider my-4"/>
          <div>
            <div className="text-[11px] uppercase tracking-wider text-ink-400 mb-2">Documents</div>
            <div className="flex flex-wrap gap-1.5 items-center">
              {(links || []).map((l, i) => {
                const inlineable = !!toBoxEmbed(l.url);
                return (
                  <span key={i} className="group inline-flex items-center rounded-lg bg-ink-700 hover:bg-ink-600 transition">
                    <button type="button" onClick={(e) => open(l, e)}
                       title={inlineable ? 'Preview inline' : 'Open in Box'}
                       className="inline-flex items-center gap-1.5 pl-2.5 pr-1.5 py-1 text-ink-100 text-xs">
                      <Icon name="link" size={12} className="text-gold-400" />
                      {l.label}
                      {!inlineable && (
                        <span className="text-ink-400 text-[10px] ml-0.5">↗</span>
                      )}
                    </button>
                    {canEdit && (
                      <button type="button" onClick={(e) => removeAt(i, e)}
                         title="Remove link"
                         className="px-1.5 py-1 text-ink-400 opacity-0 group-hover:opacity-100 hover:text-ember-400 transition">
                        <Icon name="x" size={11}/>
                      </button>
                    )}
                  </span>
                );
              })}
              {canEdit && !adding && (
                <>
                  <button type="button" onClick={(e) => { e.stopPropagation(); setAdding(true); }}
                     className="inline-flex items-center gap-1 px-2 py-1 rounded-lg border border-dashed border-ink-500 text-ink-300 hover:text-gold-300 hover:border-gold-500/50 text-xs transition">
                    <Icon name="plus" size={11}/> Add link
                  </button>
                  <PhotoUploadButton entityKind={entityKind} entityId={entityId} />
                </>
              )}
            </div>
            {canEdit && adding && (
              <form onSubmit={submit} onClick={(e) => e.stopPropagation()}
                 className="mt-2 flex flex-col sm:flex-row gap-2">
                <input
                  autoFocus
                  type="text"
                  placeholder="Label (optional)"
                  value={label}
                  onChange={(e) => setLabel(e.target.value)}
                  className="flex-1 sm:max-w-[180px] px-2.5 py-1.5 rounded-lg bg-ink-800 border border-ink-600 text-ink-100 text-xs focus:outline-none focus:border-gold-500/50"
                />
                <input
                  type="url"
                  placeholder="Box URL (https://app.box.com/file/... or /folder/... or /s/...)"
                  value={url}
                  onChange={(e) => setUrl(e.target.value)}
                  className="flex-1 px-2.5 py-1.5 rounded-lg bg-ink-800 border border-ink-600 text-ink-100 text-xs focus:outline-none focus:border-gold-500/50"
                />
                <div className="flex gap-1.5">
                  <button type="submit" disabled={!url.trim()}
                     className="px-2.5 py-1.5 rounded-lg bg-gold-500 hover:bg-gold-400 text-ink-900 text-xs font-medium disabled:opacity-40 disabled:cursor-not-allowed">
                    Save
                  </button>
                  <button type="button" onClick={reset}
                     className="px-2.5 py-1.5 rounded-lg bg-ink-700 hover:bg-ink-600 text-ink-200 text-xs">
                    Cancel
                  </button>
                </div>
              </form>
            )}
          </div>
        </>
      );
    };

    /* Global quick-capture bar — uploads photos to Inbox without tying to a card,
       plus a "Box settings" button that opens BoxSettingsModal directly. */
    const QuickCaptureBar = () => {
      const ctx = useContext(Ctx);
      const inputRef = useRef(null);
      const [busy, setBusy] = useState(false);
      const [showSettings, setShowSettings] = useState(false);
      const [pending, setPending] = useState(null);
      const [err, setErr] = useState(null);

      const trigger = () => {
        setErr(null);
        const { token, expired } = loadBoxToken();
        const folders = loadBoxFolders();
        if (!token || expired || !folders.inbox) { setShowSettings(true); return; }
        inputRef.current?.click();
      };

      const doUpload = async (file) => {
        setBusy(true); setErr(null);
        try {
          const { token } = loadBoxToken();
          const folders = loadBoxFolders();
          const result = await uploadFileToBox(file, folders.inbox, token);
          ctx.showToast?.('Photo uploaded to Box Inbox');
          // Open the result inline so the user knows it landed
          ctx.setPreviewFile?.({ label: result.name, url: result.sharedUrl });
        } catch (ex) {
          const msg = (ex && ex.message) || 'Upload failed';
          setErr(msg);
          if (/401|token|auth/i.test(msg)) { setPending(file); setShowSettings(true); }
          else ctx.showToast?.(`Upload failed — ${msg.slice(0, 60)}`);
        } finally { setBusy(false); }
      };

      const onFileChange = async (e) => {
        const f = e.target.files?.[0]; e.target.value = '';
        if (f) await doUpload(f);
      };
      const onSettingsSaved = async () => {
        if (pending) { const f = pending; setPending(null); await doUpload(f); }
      };
      return (
        <div className="card p-4 flex flex-wrap items-center gap-3">
          <div className="flex-1 min-w-0">
            <div className="text-[11px] uppercase tracking-wider text-ink-400">Quick capture</div>
            <div className="text-sm text-ink-200 mt-0.5">Snap a photo or upload a file straight to your Box Inbox.</div>
          </div>
          <div className="flex items-center gap-2">
            <button type="button" onClick={trigger} disabled={busy}
              className="btn-primary px-3 py-1.5 rounded-lg text-sm font-medium inline-flex items-center gap-1.5 disabled:opacity-50">
              <Icon name="camera" size={14}/>{busy ? 'Uploading…' : 'Take / upload photo'}
            </button>
            <button type="button" onClick={() => setShowSettings(true)} title="Box settings"
              className="px-2.5 py-1.5 rounded-lg text-sm bg-ink-700 hover:bg-ink-600 text-ink-200 inline-flex items-center gap-1.5">
              <Icon name="gear" size={14}/>Box
            </button>
          </div>
          {err && <div className="w-full text-[11px] text-ember-400">{err}</div>}
          <input ref={inputRef} type="file" accept="image/*" onChange={onFileChange} className="hidden"/>
          {showSettings && <BoxSettingsModal onClose={() => setShowSettings(false)} onSaved={onSettingsSaved} kindHighlight="inbox"/>}
        </div>
      );
    };

    const FilesView = () => {
      const ctx = useContext(Ctx);
      const { state } = ctx;
      const files = state.files || [];
      const grouped = useMemo(() => {
        const out = {};
        files.forEach(f => { (out[f.category] = out[f.category] || []).push(f); });
        return out;
      }, [files]);
      const order = ['Insurance','Property','Vehicles','Planning','Reference'];
      const cats = order.filter(c => grouped[c]).concat(Object.keys(grouped).filter(c => !order.includes(c)));
      return (
        <div className="space-y-7 max-w-5xl">
          <QuickCaptureBar />
          <p className="text-ink-300 text-sm hidden md:block max-w-2xl">Direct links to source documents — Box folders, manuals, reference sheets. Click to open in a new tab.</p>
          {cats.length === 0 ? (
            <Empty icon="folder" title="No files yet" body="Document links you add will appear here, grouped by topic." />

            <section key={cat}>
              <div className="flex items-baseline justify-between mb-3">
                <h2 className="font-display text-xl tracking-tight">{cat}</h2>
                <span className="text-ink-400 text-xs">{grouped[cat].length}</span>
              </div>
              <div className="grid md:grid-cols-2 gap-3">
                {grouped[cat].map(f => {
                  const embeddable = !!toBoxEmbed(f.url);
                  const Inner = (
                    <>
                      <div className="w-10 h-10 rounded-xl bg-ink-700 grid place-items-center text-gold-400 shrink-0">
                        <Icon name={f.url.includes('/folder/') ? 'folder' : 'link'} size={18} />
                      </div>
                      <div className="min-w-0 flex-1">
                        <div className="text-sm font-medium text-ink-100 group-hover:text-gold-300 truncate">{f.label}</div>
                        {f.notes && <div className="text-ink-300 text-xs mt-0.5 line-clamp-2">{f.notes}</div>}
                        <div className="text-ink-400 text-[11px] mt-1.5 truncate">{(() => { try { return new URL(f.url).hostname; } catch { return f.url; } })()}</div>
                      </div>
                    </>
                  );
                  return embeddable ? (
                    <button key={f.id} type="button" onClick={() => ctx.setPreviewFile(f)}
                       className="card p-4 flex items-start gap-3 hover:border-gold-500/40 transition group text-left">
                      {Inner}
                    </button>
                  ) : (
                    <a key={f.id} href={f.url} target="_blank" rel="noreferrer"
                       className="card p-4 flex items-start gap-3 hover:border-gold-500/40 transition group">
                      {Inner}
                    </a>
                  );
                })}
              </div>
            </section>
          ))}
        </div>
      );

    async function decryptShared(password) {
      const data = Uint8Array.from(atob(ENCRYPTED_BLOB), c => c.charCodeAt(0));
      const salt = data.slice(0, 16);
      const nonce = data.slice(16, 28);
      const ct = data.slice(28);
      const enc = new TextEncoder();
      const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
        km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: nonce }, key, ct);
      return JSON.parse(new TextDecoder().decode(pt));
    }

      const [err, setErr] = useState(null);
      const submit = async (e) => {
        e?.preventDefault();
        if (!pw || busy) return;
        setBusy(true); setErr(null);
        try {
          const state = await decryptShared(pw);
          onUnlock(state);
        } catch (ex) {
          setErr("Password didn't work. Try again.");
          setBusy(false);
        }
      };
      return (
        <div className="min-h-screen relative z-10 flex items-center justify-center px-6">
          <form onSubmit={submit} className="card p-8 md:p-10 w-full max-w-sm anim-in">
            <div className="flex items-center gap-3 mb-6">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 grid place-items-center text-ink-900 font-display font-semibold text-lg">H</div>
              <div>
                <div className="font-display text-xl tracking-tight leading-none">Home HQ</div>
                <div className="text-ink-400 text-[11px] uppercase tracking-wider mt-1">Shared view</div>
              </div>
            </div>
            <div className="text-ink-200 text-sm mb-1">Welcome.</div>
            <div className="text-ink-300 text-sm mb-5">Enter the household password to view.</div>
            <input
              type="password"
              autoFocus
              value={pw}
              onChange={e => setPw(e.target.value)}
              placeholder="Password"
              disabled={busy}
              className="w-full px-3 py-2.5 rounded-xl bg-ink-800 border border-ink-600 text-ink-100 text-sm focus:outline-none focus:border-gold-500/50"
            />
            {err && <div className="text-ember-400 text-xs mt-2">{err}</div>}
            <button type="submit" disabled={busy || !pw}
              className="btn-primary w-full mt-4 px-3.5 py-2.5 rounded-xl text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed">
              {busy ? 'Unlocking…' : 'View dashboard'}
            </button>
            <div className="text-ink-500 text-[11px] mt-5 leading-relaxed">
              This is a private view of the McCullum household dashboard. Edits you make are saved on this device only.
            </div>
          </form>
        </div>
      );
    };

    const SharedRoot = () => {
      const [decrypted, setDecrypted] = useState(null);
      if (!decrypted) return <UnlockScreen onUnlock={(s) => {
        // Auto-populate Finnhub key from baked state if not already set locally
        try {
          if (s._finnhubKey && !localStorage.getItem('homehq.finnhubKey')) {
            localStorage.setItem('homehq.finnhubKey', s._finnhubKey);
          }
        } catch {}
        // Strip the key out of state before saving — keep it in localStorage only
        const stateForApp = { ...s };
        delete stateForApp._finnhubKey;
        window.__SHARED_INIT__ = stateForApp;
        setDecrypted(stateForApp);
      }} />;
      return <App />;
    };

    root.render(<SharedRoot />);
  </script>
</body>
</html>
