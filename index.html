    html, body { background: #0e0d0b; color: #e8e2d4; -webkit-font-smoothing: antialiased; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2723; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3631; }
    /* Subtle texture */
    .grain::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background-image: radial-gradient(rgba(255,255,255,0.012) 1px, transparent 1px);
      background-size: 3px 3px; opacity: .35; z-index: 0;

    /* Card */
    .card {

      background: #161410;
      border: 1px solid #24211c;
      border-radius: 16px;
    }
    .btn-primary {
      background: linear-gradient(180deg,#d4a96a,#c19654);
      color: #1a140a;
      font-weight: 600;

    .btn-ghost { background: transparent; color: #e8e2d4; }
    .btn-ghost:hover { background: #211f1a; }
    .pill { display: inline-flex; align-items: center; gap: .35rem; padding: .25rem .55rem; border-radius: 999px; font-size: .72rem; font-weight: 500; line-height: 1; }

    .pill-soon    { background: rgba(212,169,106,0.12); color: #e6c895; border: 1px solid rgba(212,169,106,0.25); }
    .pill-ok      { background: rgba(138,167,139,0.12); color: #a6c1a7; border: 1px solid rgba(138,167,139,0.25); }
    .pill-info    { background: rgba(140,160,200,0.10); color: #b5c2dc; border: 1px solid rgba(140,160,200,0.22); }
    .pill-muted   { background: #211f1a; color: #8b8478; border: 1px solid #2a2723; }
    .divider { height: 1px; background: linear-gradient(90deg, transparent, #2a2723, transparent); }
    input, select, textarea {
      background: #131210 !important; border: 1px solid #2a2723 !important; color: #e8e2d4 !important;
      border-radius: 12px; padding: .65rem .85rem; width: 100%; font-size: .95rem;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #c19654 !important; box-shadow: 0 0 0 3px rgba(193,150,84,.18); }
    label { font-size: .75rem; color: #8b8478; font-weight: 500; letter-spacing: .02em; text-transform: uppercase; margin-bottom: .35rem; display: block; }
    .modal-backdrop { background: rgba(8,7,5,0.7); backdrop-filter: blur(8px); }
    .modal-shell { background: #161410; border: 1px solid #2a2723; border-radius: 22px; }
    /* Anim */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }
    .anim-in { animation: fadeUp .25s ease-out both; }
    /* Hide scrollbar on horizontal chip rows */
    .no-bar::-webkit-scrollbar { display: none; }
    .no-bar { -ms-overflow-style: none; scrollbar-width: none; }
    /* iOS safe area */
    .pb-safe { padding-bottom: calc(.75rem + env(safe-area-inset-bottom)); }
    .pt-safe { padding-top: calc(.5rem + env(safe-area-inset-top)); }

  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useRef, useCallback, createContext, useContext } = React;

    /* ---------- date helpers ---------- */
    const DAY = 1000*60*60*24;
    const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
    const parseDate = (s) => { if (!s) return null; const d = new Date(s+'T00:00:00'); return isNaN(d) ? null : d; };
    const toISO = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return x.toISOString().slice(0,10); };
    const daysBetween = (a, b) => Math.round((parseDate(b) - parseDate(a)) / DAY);
    const daysUntil = (s) => { const d = parseDate(s); if (!d) return null; return Math.round((d - today())/DAY); };
    const fmtDate = (s, opts) => {
      const d = parseDate(s); if (!d) return '—';
      return d.toLocaleDateString(undefined, opts || { month:'short', day:'numeric', year:'numeric' });
    };
    const fmtRelative = (s) => {
      const n = daysUntil(s); if (n === null) return '—';
      if (n === 0) return 'today';
      if (n === 1) return 'tomorrow';
      if (n === -1) return 'yesterday';
      if (n < 0) return `${Math.abs(n)} days overdue`;
      if (n < 7) return `in ${n} days`;
      if (n < 30) return `in ${Math.round(n/7)} wk`;
      if (n < 365) return `in ${Math.round(n/30)} mo`;
      return `in ${(n/365).toFixed(1)} yr`;
    };
    const addInterval = (iso, freq) => {
      const d = parseDate(iso); if (!d || !freq) return null;
      const n = freq.count || 1;
      const x = new Date(d);
      if (freq.unit === 'days') x.setDate(x.getDate()+n);
      else if (freq.unit === 'weeks') x.setDate(x.getDate()+n*7);
      else if (freq.unit === 'months') x.setMonth(x.getMonth()+n);
      else if (freq.unit === 'years') x.setFullYear(x.getFullYear()+n);
      return toISO(x);
    };
    const freqLabel = (f) => {
      if (!f) return '—';
      const u = f.count === 1 ? f.unit.replace(/s$/,'') : f.unit;
      return `every ${f.count} ${u}`;
    };
    const uid = () => Math.random().toString(36).slice(2,10);

    // Box only honors session cookies on shared-link embeds (/s/<id>).
    // /file/<id> and /folder/<id> embed endpoints fall back to anonymous CAPTCHA,
    // so we treat those as "open in new tab" instead of inline-previewable.
    const toBoxEmbed = (url) => {
      if (!url) return null;
      try {
        const u = new URL(url);
        if (!u.hostname.endsWith('box.com')) return null;
        const m = u.pathname.match(/^\/s\/([^/]+)/);
        if (m) return `https://app.box.com/embed/s/${m[1]}`;
      } catch {}
      return null;
    };

    const isBoxLink = (url) => {
      try { return new URL(url).hostname.endsWith('box.com'); } catch { return false; }
    };

    /* ---------- Box upload (per-section + catchall folders) ---------- */
    // Storage keys for the Box upload feature
    const BOX_TOKEN_STORAGE   = 'homehq.boxToken';        // dev token (60-min expiry)
    const BOX_TOKEN_EXP_STORAGE = 'homehq.boxTokenExp';   // unix ms when token expires
    const BOX_FOLDERS_STORAGE = 'homehq.boxFolders.v1';   // {inbox, vendors, ...} folder IDs

    // Default folder mapping — all uploads land in Inbox unless a per-section folder is configured.
    // User can edit IDs in BoxSettingsModal. `inbox` is the catchall.
    const DEFAULT_BOX_FOLDERS = {
      inbox: '',          // catchall — required for uploads to work
      vendors: '',
      maintenance: '',
      appliances: '',
      insurance: '',
      property: '',
      vehicles: '',
      benefits: '',
      utilities: '',
    };

    const loadBoxFolders = () => {
      try {
        const raw = localStorage.getItem(BOX_FOLDERS_STORAGE);
        if (!raw) return { ...DEFAULT_BOX_FOLDERS };
        return { ...DEFAULT_BOX_FOLDERS, ...JSON.parse(raw) };
      } catch { return { ...DEFAULT_BOX_FOLDERS }; }
    };
    const saveBoxFolders = (f) => {
      try { localStorage.setItem(BOX_FOLDERS_STORAGE, JSON.stringify(f)); } catch {}
    };
    const loadBoxToken = () => {
      try {
        const tok = localStorage.getItem(BOX_TOKEN_STORAGE);
        const exp = parseInt(localStorage.getItem(BOX_TOKEN_EXP_STORAGE) || '0', 10);
        if (!tok) return { token: '', expired: true };
        const expired = exp ? Date.now() > exp : false;
        return { token: tok, expired, exp };
      } catch { return { token: '', expired: true }; }
    };
    const saveBoxToken = (token) => {
      try {
        if (token) {
          localStorage.setItem(BOX_TOKEN_STORAGE, token);
          // Default 55 min expiry (dev tokens last 60 min — buffer for clock skew)
          localStorage.setItem(BOX_TOKEN_EXP_STORAGE, String(Date.now() + 55 * 60 * 1000));
        } else {
          localStorage.removeItem(BOX_TOKEN_STORAGE);
          localStorage.removeItem(BOX_TOKEN_EXP_STORAGE);
        }
      } catch {}
    };

    // Pick the destination folder for an entity kind, fallback to inbox
    const pickBoxFolder = (folders, kind) => {
      if (!folders) return '';
      const specific = folders[kind];
      if (specific && String(specific).trim()) return String(specific).trim();
      return String(folders.inbox || '').trim();
    };

    // Upload a file to Box via dev token. Returns { id, name, sharedUrl } or throws.
    // Uses the upload API + creates a shared link so the asset becomes embeddable in our preview modal.
    const uploadFileToBox = async (file, folderId, token) => {
      if (!file) throw new Error('No file selected');
      if (!folderId) throw new Error('No Box folder configured. Open Box Settings to add an Inbox folder ID.');
      if (!token) throw new Error('No Box token. Open Box Settings to paste a 60-min dev token.');

      // Derive a clean filename — prefix with date so uploads sort nicely in Box
      const ts = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
      const ext = (file.name.match(/\.[A-Za-z0-9]+$/)?.[0]) || (file.type === 'image/jpeg' ? '.jpg' : (file.type === 'image/png' ? '.png' : ''));
      const baseName = file.name.replace(/\.[A-Za-z0-9]+$/, '') || 'photo';
      const name = `${ts}__${baseName}${ext}`;

      // 1) Upload — POST multipart to upload.box.com
      const fd = new FormData();
      fd.append('attributes', JSON.stringify({ name, parent: { id: String(folderId) } }));
      fd.append('file', file, name);
      const upRes = await fetch('https://upload.box.com/api/2.0/files/content', {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` },
        body: fd,
      });
      if (!upRes.ok) {
        const txt = await upRes.text().catch(() => '');
        throw new Error(`Upload failed (${upRes.status}): ${txt.slice(0, 240)}`);
      }
      const upJson = await upRes.json();
      const fileObj = (upJson.entries && upJson.entries[0]) || upJson;
      const fileId = fileObj.id;
      if (!fileId) throw new Error('Upload returned no file id');

      // 2) Create shared link so we can render inline + share the URL
      let sharedUrl = '';
      try {
        const shRes = await fetch(`https://api.box.com/2.0/files/${fileId}`, {
          method: 'PUT',
          headers: {
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ shared_link: { access: 'open' } }),
        });
        if (shRes.ok) {
          const shJson = await shRes.json();
          sharedUrl = shJson?.shared_link?.url || '';
        }
      } catch {}
      // Fallback to a regular file URL if shared link failed
      if (!sharedUrl) sharedUrl = `https://app.box.com/file/${fileId}`;
      return { id: fileId, name, sharedUrl };
    };


    /* ---------- icons (inline SVG, hairline weight) ---------- */
    const Icon = ({ name, size=18, className='' }) => {
      const props = { width:size, height:size, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:1.6, strokeLinecap:'round', strokeLinejoin:'round', className };

        users:       <><circle cx="9" cy="8" r="3.2"/><path d="M2.5 19c.7-3.1 3.4-5 6.5-5s5.8 1.9 6.5 5"/><circle cx="17" cy="9" r="2.6"/><path d="M21.5 18c-.4-2.2-2-3.6-4.5-3.6"/></>,
        wrench:      <><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4 2.5-2.5z"/></>,
        cube:        <><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></>,
        wine:        <><path d="M8 3h8l-1 7a4 4 0 1 1-6 0l-1-7z"/><path d="M12 17v4"/><path d="M9 21h6"/></>,
        plus:        <><path d="M12 5v14"/><path d="M5 12h14"/></>,
        sparkles:    <><path d="M12 4v3M12 17v3M4 12h3M17 12h3M6.3 6.3l2.1 2.1M15.6 15.6l2.1 2.1M6.3 17.7l2.1-2.1M15.6 8.4l2.1-2.1"/></>,
        phone:       <><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.7.6 2.5a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.8.3 1.6.5 2.5.6a2 2 0 0 1 1.7 2z"/></>,
        message:     <><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></>,
        mail:        <><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></>,
        edit:        <><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></>,
        trash:       <><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6 18 20a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></>,

        receipt:     <><path d="M5 3v18l3-2 3 2 3-2 3 2 3-2V3l-3 2-3-2-3 2-3-2-3 2z"/><path d="M9 9h6M9 13h6M9 17h4"/></>,
        key:         <><circle cx="8" cy="15" r="4"/><path d="m10.8 12.8 8.2-8.2 2 2-2 2 2 2-2 2-2-2-2 2"/></>,
        car:         <><path d="M5 17h14M3 13l2-6a2 2 0 0 1 2-1.5h10a2 2 0 0 1 2 1.5l2 6"/><path d="M3 13v5a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-2M21 13v5a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-2"/><circle cx="7.5" cy="14.5" r="1"/><circle cx="16.5" cy="14.5" r="1"/></>,
        heart:       <><path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.6l-1-1a5.5 5.5 0 0 0-7.8 7.8L12 22l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></>,
        folder:      <><path d="M3 6.5a2 2 0 0 1 2-2h4l2 2.2h8a2 2 0 0 1 2 2v8.8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></>,
        link:        <><path d="M10 14a4 4 0 0 0 5.6 0l3-3a4 4 0 0 0-5.6-5.6l-1 1"/><path d="M14 10a4 4 0 0 0-5.6 0l-3 3a4 4 0 0 0 5.6 5.6l1-1"/></>,
        building:    <><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 8h.01M15 8h.01M9 12h.01M15 12h.01M9 16h.01M15 16h.01M10 21v-4h4v4"/></>,
        more:        <><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></>,
        chart:       <><path d="M3 21V3"/><path d="M3 21h18"/><path d="M7 17V11"/><path d="M12 17V7"/><path d="M17 17V13"/></>,
        camera:      <><path d="M3 7a2 2 0 0 1 2-2h2.5l1.5-2h6l1.5 2H19a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></>,
        upload:      <><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2"/></>,
        gear:        <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></>,
      };
      return <svg {...props}>{paths[name] || null}</svg>;
    };

    /* ---------- storage ---------- */
    const STORAGE_KEY = 'homehq.shared.v1';
    const SCOPE_KEY = 'homehq.scope';
    const loadState = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch { return null; }
    };
    const saveState = (state) => {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
    };
    const loadScope = () => {
      try { return localStorage.getItem(SCOPE_KEY) || 'both'; } catch { return 'both'; }
    };
    const saveScope = (scope) => {
      try { localStorage.setItem(SCOPE_KEY, scope); } catch {}
    };

    /* ---------- property scope ---------- */
    const PROPERTIES = [
      { id:'both',           label:'Both',       short:'Both' },
      { id:'1619 Seattle',   label:'Seattle',    short:'Seattle' },
      { id:'4322 Sun Valley',label:'Sun Valley', short:'Sun Valley' },
    ];
    // Returns true if an item belongs to the given scope.
    // - scope='both' shows everything
    // - specific scope shows items with matching property OR no property field at all
    //   (no-property = "applies to everything", not bound to a property)
    const inScope = (item, scope) => {
      if (!scope || scope === 'both') return true;
      if (!item.property) return true;
      return item.property === scope;
    };
    const filterByScope = (list, scope) => (list || []).filter(x => inScope(x, scope));

    /* ---------- seed data ---------- */
    const todayISO = toISO(today());
    const offsetISO = (n) => toISO(new Date(today().getTime() + n*DAY));

    const seedVendors = [];

          const hasUHC = migrated.benefits.some(b => b.id === 'b-uhc');
          const hasBCCA = migrated.benefits.some(b => b.id === 'b-bcca');
          if (hasUHC || !hasBCCA) {
            migrated.benefits = migrated.benefits.filter(b => b.id !== 'b-uhc');
            if (!hasBCCA) {
              const seedBCCA = (initialState.benefits || []).find(b => b.id === 'b-bcca');
              if (seedBCCA) migrated.benefits = [seedBCCA, ...migrated.benefits];
            }
          }
        }
        // One-time: remove deleted placeholders (SV mortgage + SV hot tub) — confirmed N/A by user
        if (Array.isArray(migrated.property))   migrated.property   = migrated.property.filter(p   => p.id !== 'p-ph-mortgage-sv');
        if (Array.isArray(migrated.appliances)) migrated.appliances = migrated.appliances.filter(a => a.id !== 'a-ph-sv-hot-tub');
        // Merge in NEW seed entries (e.g. placeholders) by id — preserves user edits to existing items
        ['vendors','maintenance','appliances','insurance','vehicles','property','benefits','utilities','subscriptions','files'].forEach(k => {
          const baseList = initialState[k] || [];
          if (!baseList.length) return;
          const have = new Set((migrated[k]||[]).map(x => x.id));
          const newOnes = baseList.filter(x => !have.has(x.id));
          if (newOnes.length) migrated[k] = [...(migrated[k]||[]), ...newOnes];
        });
        // Backfill `property` field on maintenance/appliances if user is on an older save without it
        if (Array.isArray(migrated.maintenance)) {
          const seedById = Object.fromEntries((initialState.maintenance||[]).map(m => [m.id, m]));
          migrated.maintenance = migrated.maintenance.map(m => (!m.property && seedById[m.id]?.property) ? { ...m, property: seedById[m.id].property } : m);
        }
        if (Array.isArray(migrated.appliances)) {
          const seedById = Object.fromEntries((initialState.appliances||[]).map(a => [a.id, a]));
          migrated.appliances = migrated.appliances.map(a => (!a.property && seedById[a.id]?.property) ? { ...a, property: seedById[a.id].property } : a);
        }
        return migrated;
      });

        delete: (id)          => setState(s => ({...s, [key]: (s[key]||[]).filter(x => x.id!==id)})),
      });

      const vehOps  = mk('vehicles');

      const proOps  = mk('property');
      const subOps  = mk('subscriptions');
      const benOps  = mk('benefits');

        deleteVendor: (id) => setState(s => ({...s, vendors: s.vendors.filter(v => v.id!==id)})),
        // maintenance

        // mark a dashboard item done — applies kind-specific side effect + appends to completedLog
        markDone: (item) => {
          if (!item || !item.kind || !item.id) return;

            id: uid(),

            title: item.title || '',
            sub: item.sub || '',
            originalDue: item.when || '',
            completedAt: stamp,
          };
          setState(s => {
            const next = { ...s, completedLog: [logEntry, ...(s.completedLog || [])] };
            // kind-specific side effects
            if (item.kind === 'maint') {
              next.maintenance = (s.maintenance||[]).map(t => t.id === item.id ? { ...t, lastCompleted: todayISO } : t);
            } else if (item.kind === 'vendor') {
              next.vendors = (s.vendors||[]).map(v => v.id === item.id ? { ...v, lastVisit: todayISO, nextVisit: '' } : v);
            } else if (item.kind === 'warranty') {
              // dismiss the warranty alert without changing the warrantyExpires field
              next.appliances = (s.appliances||[]).map(a => a.id === item.id ? { ...a, warrantyDismissed: true } : a);
            } else if (item.kind === 'property') {
              // clear nextDue so it drops off "coming up"
              next.property = (s.property||[]).map(p => p.id === item.id ? { ...p, nextDue: '' } : p);
            } else if (item.kind === 'sub') {
              // clear renewalDate
              next.subscriptions = (s.subscriptions||[]).map(x => x.id === item.id ? { ...x, renewalDate: '' } : x);
            }
            return next;
          });
          showToast(`Done: ${item.title || 'item'}`);
        },
        undoDone: (logId) => {
          setState(s => {
            const entry = (s.completedLog || []).find(l => l.id === logId);
            if (!entry) return s;
            const next = { ...s, completedLog: (s.completedLog||[]).filter(l => l.id !== logId) };
            // best-effort revert of side effect
            if (entry.kind === 'warranty') {
              next.appliances = (s.appliances||[]).map(a => a.id === entry.refId ? { ...a, warrantyDismissed: false } : a);
            } else if (entry.kind === 'vendor' && entry.originalDue) {
              next.vendors = (s.vendors||[]).map(v => v.id === entry.refId ? { ...v, nextVisit: entry.originalDue } : v);
            }
            // for maint we don't revert lastCompleted — user can edit task to fix
            return next;
          });
          showToast('Undone');
        },
        clearCompleted: () => {
          if (!confirm('Clear the entire completion history? This cannot be undone.')) return;
          setState(s => ({ ...s, completedLog: [] }));
          showToast('History cleared');
        },
        // generic links manipulation (any module that supports a `links` array)
        addLink: (kind, id, link) => {
          if (!link || !link.url) return;
          setState(s => ({
            ...s,
            [kind]: (s[kind]||[]).map(e =>
              e.id === id ? { ...e, links: [...(e.links || []), link] } : e

            [kind]: (s[kind]||[]).map(e => {
              if (e.id !== id) return e;
              const next = [...(e.links || [])];
              next.splice(idx, 1);
              return { ...e, links: next };
            })
          }));
        },

        resetAll: () => { setState(initialState); showToast('Reset to seed data'); },
      };

      return (

        state.vendors.forEach(v => {
          if (!inS(v)) return;
          if (v.nextVisit && daysUntil(v.nextVisit) < 0) items.push({ kind:'vendor', id:v.id, title:`${v.serviceType} — ${v.company}`, when:v.nextVisit, n:daysUntil(v.nextVisit), sub:v.name });

          if (!inS(a)) return;
          if (a.warrantyDismissed) return;
          const n = daysUntil(a.warrantyExpires);
          if (n !== null && n < 0) items.push({ kind:'warranty', id:a.id, title:`${a.name} warranty`, when:a.warrantyExpires, n });

        return items.sort((a,b)=>a.n-b.n);

      const upcoming = useMemo(() => {
        const items = [];
        state.maintenance.forEach(m => {
          if (!inS(m)) return;
          const next = maintenanceNextDue(m);
          const n = daysUntil(next);
          if (n !== null && n >= 0 && n <= 30) items.push({ kind:'maint', id:m.id, title:m.name, when:next, n, sub:`~$${m.estimatedCost}` });
        });
        state.vendors.forEach(v => {
          if (!inS(v)) return;
          const n = daysUntil(v.nextVisit);
          if (n !== null && n >= 0 && n <= 30) items.push({ kind:'vendor', id:v.id, title:`${v.serviceType} — ${v.company}`, when:v.nextVisit, n, sub:v.name });
        });
        (state.property || []).forEach(p => {
          if (!inS(p)) return;
          const n = daysUntil(p.nextDue);
          if (n !== null && n >= 0 && n <= 30) items.push({ kind:'property', id:p.id, title:p.label, when:p.nextDue, n, sub:p.cadence ? `${p.cadence}${p.amount?` · $${p.amount}`:''}` : '' });

        // subscriptions are personal, not property-bound — show always
        (state.subscriptions || []).forEach(s => {
          const n = daysUntil(s.renewalDate);
          if (n !== null && n >= 0 && n <= 30) items.push({ kind:'sub', id:s.id, title:s.name, when:s.renewalDate, n, sub:s.cost?`$${s.cost} ${s.cadence}`:'' });

      const warranties = useMemo(() => {
        return state.appliances

                    <Icon name="chevR" size={14} className="text-ink-500 mt-1 opacity-0 group-hover:opacity-100 transition" />
                  </button>
                ))}

          {/* Drink now */}
          <section>
            <SectionHeader title="Drink now" count={drinkNow.length} hint="In their peak window — open something tonight." />
            {drinkNow.length === 0 ? (

          </section>
        </div>
      );

/* Live pricing via Finnhub (free tier, 60 req/min, supports CORS).
   Only fetches Stock + ETF symbols — mutual funds rarely covered on free tier;
   money market always trades at $1; private equity has no public quote. */
const FINNHUB_KEY_STORAGE = 'homehq.finnhubKey';
const QUOTES_CACHE_STORAGE = 'homehq.quotes.v1';
const QUOTES_FRESH_MS = 5 * 60 * 1000;  // 5 min freshness

const usePriceQuotes = () => {
  const [apiKey, setApiKey] = useState(() => { try { return localStorage.getItem(FINNHUB_KEY_STORAGE) || ''; } catch { return ''; } });
  const [quotes, setQuotes] = useState(() => {
    try { return JSON.parse(localStorage.getItem(QUOTES_CACHE_STORAGE) || '{}'); } catch { return {}; }
  });
  const [loading, setLoading] = useState(false);
  const [progress, setProgress] = useState({ done: 0, total: 0 });
  const [error, setError] = useState(null);

  const setKey = (key) => {
    setApiKey(key);
    try { if (key) localStorage.setItem(FINNHUB_KEY_STORAGE, key); else localStorage.removeItem(FINNHUB_KEY_STORAGE); } catch {}
  };

  const refresh = async (symbols) => {
    if (!apiKey) { setError('Need a Finnhub API key — open Settings.'); return; }
    if (!symbols.length) return;
    setLoading(true); setError(null); setProgress({ done: 0, total: symbols.length });
    const next = { ...quotes };
    const failed = [];
    // Finnhub allows ~30 req/sec, 60/min on free tier. Batch 25 in parallel, 1.2s between batches.
    const BATCH = 25, GAP_MS = 1200;
    for (let i = 0; i < symbols.length; i += BATCH) {
      const slice = symbols.slice(i, i + BATCH);
      await Promise.all(slice.map(async sym => {
        try {
          const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(sym)}&token=${apiKey}`);
          if (!r.ok) { failed.push(sym); return; }
          const j = await r.json();
          // Finnhub returns {c:0} for unknown symbols
          if (typeof j.c === 'number' && j.c > 0) {
            next[sym] = { price: j.c, change: j.d, pctChange: j.dp, asOf: Date.now() };
          } else {
            failed.push(sym);
          }
        } catch (e) { failed.push(sym); }
      }));
      setProgress({ done: Math.min(i + BATCH, symbols.length), total: symbols.length });
      if (i + BATCH < symbols.length) await new Promise(r => setTimeout(r, GAP_MS));
    }
    setQuotes(next);
    try { localStorage.setItem(QUOTES_CACHE_STORAGE, JSON.stringify(next)); } catch {}
    setLoading(false);
    if (failed.length) setError(`Couldn't quote ${failed.length} symbol${failed.length===1?'':'s'} (often mutual funds / inactive).`);
  };

  const clearQuotes = () => {
    setQuotes({});
    try { localStorage.removeItem(QUOTES_CACHE_STORAGE); } catch {}
  };

  return { apiKey, setKey, quotes, refresh, loading, progress, error, clearQuotes };
};

/* ---------- Photo upload button ----------
   Appears on each entity card. Click → opens camera on mobile, file picker on desktop.
   Uploads to the section's Box folder (or Inbox), then attaches the resulting shared link
   as a Documents chip via ctx.addLink. If no token/folder configured, opens BoxSettingsModal first. */
const PhotoUploadButton = ({ entityKind, entityId, label = 'Photo' }) => {
  const ctx = useContext(Ctx);
  const inputRef = useRef(null);
  const [busy, setBusy] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [pendingFile, setPendingFile] = useState(null);
  const [err, setErr] = useState(null);

  const trigger = (e) => {
    e?.stopPropagation();
    setErr(null);
    const { token, expired } = loadBoxToken();
    const folders = loadBoxFolders();
    const folderId = pickBoxFolder(folders, entityKind);
    if (!token || expired || !folderId) {
      // Need configuration first — open settings, then user re-clicks
      setShowSettings(true);
      return;
    }
    inputRef.current?.click();
  };

  const onFileChange = async (e) => {
    const file = e.target.files?.[0];
    e.target.value = ''; // allow re-pick of same file
    if (!file) return;
    await doUpload(file);
  };

  const doUpload = async (file) => {
    setBusy(true); setErr(null);
    try {
      const { token } = loadBoxToken();
      const folders = loadBoxFolders();
      const folderId = pickBoxFolder(folders, entityKind);
      const result = await uploadFileToBox(file, folderId, token);
      if (entityKind && entityId && ctx.addLink) {
        const labelText = `Photo ${new Date().toLocaleDateString(undefined, { month:'short', day:'numeric' })}`;
        ctx.addLink(entityKind, entityId, { label: labelText, url: result.sharedUrl });
      }
      ctx.showToast?.('Photo uploaded to Box');
      setPendingFile(null);
    } catch (ex) {
      console.error('Box upload failed', ex);
      const msg = (ex && ex.message) || 'Upload failed';
      setErr(msg);
      // If token-related, prompt for new token
      if (/401|token|auth/i.test(msg)) {
        setPendingFile(file);
        setShowSettings(true);
      } else {
        ctx.showToast?.(`Upload failed — ${msg.slice(0, 60)}`);
      }
    } finally {
      setBusy(false);
    }
  };

  const onSettingsSaved = async () => {
    if (pendingFile) {
      const f = pendingFile;
      setPendingFile(null);
      await doUpload(f);
    }
  };

  return (
    <>
      <button type="button" onClick={trigger} disabled={busy}
        className="inline-flex items-center gap-1 px-2 py-1 rounded-lg border border-dashed border-ink-500 text-ink-300 hover:text-gold-300 hover:border-gold-500/50 text-xs transition disabled:opacity-50 disabled:cursor-wait">
        <Icon name="camera" size={11}/> {busy ? 'Uploading…' : label}
      </button>
      <input ref={inputRef} type="file" accept="image/*" capture="environment"
        onChange={onFileChange} className="hidden" />
      {err && !showSettings && (
        <span className="text-ember-400 text-[10px] ml-1">{err.slice(0, 60)}</span>
      )}
      {showSettings && (
        <BoxSettingsModal
          onClose={() => setShowSettings(false)}
          onSaved={onSettingsSaved}
          kindHighlight={pickBoxFolder(loadBoxFolders(), entityKind) ? null : 'inbox'}
        />
      )}
    </>
  );
};

const PortfolioView = () => {

  const priceState = usePriceQuotes();
  const d = PORTFOLIO_DATA;
  const accounts = ['__all__', ...d.accounts.map(a => a.name)];

  // Symbols we can quote on the free tier (Stock + ETF; skip MF/MMF/PE)
  const fetchableSymbols = useMemo(() => {
    const s = new Set();
    d.holdings.forEach(h => { if (h.securityType === 'Stock' || h.securityType === 'ETF') s.add(h.symbol); });
    return Array.from(s).sort();
  }, []);

  // Apply live quotes to holdings (overlay; baseline preserved)
  const liveHoldings = useMemo(() => {
    return d.holdings.map(h => {
      const q = priceState.quotes[h.symbol];
      if (q && (h.securityType === 'Stock' || h.securityType === 'ETF') && h.quantity != null) {
        const liveValue = q.price * h.quantity;
        const live = {
          ...h,
          baselineValue: h.value,
          baselinePrice: h.price,
          value: liveValue,
          price: q.price,
          livePctChange: q.pctChange,
          live: true,
        };
        // Recompute unrealized G/L from live value if cost basis present
        if (h.costBasis != null) {
          live.unrealizedGL = liveValue - h.costBasis;
          live.unrealizedGLPct = h.costBasis ? (live.unrealizedGL / h.costBasis * 100) : null;
        }
        return live;
      }
      return h;
    });
  }, [priceState.quotes]);

  const rows = useMemo(() => scope === '__all__' ? liveHoldings : liveHoldings.filter(h => h.account === scope), [scope, liveHoldings]);

    return Object.entries(m).map(([key,value]) => ({key, value, pct: total ? value/total : 0})).sort((a,b) => b.value - a.value);
  };

  const ac = aggBy('assetClass').sort((a,b) => PORTFOLIO_AC_ORDER.indexOf(a.key) - PORTFOLIO_AC_ORDER.indexOf(b.key));
  const st = aggBy('securityType');

  const top10 = useMemo(() => {
    const m = {};

    /* ====================== DONE / COMPLETED LOG ====================== */
    const DoneView = () => {
      const ctx = useContext(Ctx);
      const log = ctx.state.completedLog || [];
      const [filter, setFilter] = useState('all');

      const filtered = useMemo(() => {
        return filter === 'all' ? log : log.filter(l => l.kind === filter);
      }, [log, filter]);

      // Group by relative bucket
      const buckets = useMemo(() => {
        const out = { 'Today': [], 'This week': [], 'This month': [], 'Earlier': [] };
        const now = new Date();
        const startOfDay = new Date(now); startOfDay.setHours(0,0,0,0);
        const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate() - now.getDay()); startOfWeek.setHours(0,0,0,0);
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
        filtered.forEach(l => {
          const d = new Date(l.completedAt);
          if (d >= startOfDay) out['Today'].push(l);
          else if (d >= startOfWeek) out['This week'].push(l);
          else if (d >= startOfMonth) out['This month'].push(l);
          else out['Earlier'].push(l);
        });
        return out;
      }, [filtered]);

      const KIND_LABELS = { maint:'Maintenance', vendor:'Vendor', warranty:'Warranty', property:'Property', sub:'Subscription' };
      const KIND_ICONS  = { maint:'wrench', vendor:'users', warranty:'cube', property:'key', sub:'receipt' };

      const counts = useMemo(() => {
        const c = { all: log.length };
        log.forEach(l => { c[l.kind] = (c[l.kind]||0) + 1; });
        return c;
      }, [log]);

      const kinds = ['all', ...Object.keys(KIND_LABELS).filter(k => counts[k])];

      return (
        <div className="space-y-5 max-w-4xl">
          <div className="flex items-baseline justify-between gap-3 flex-wrap">
            <p className="text-ink-300 text-sm max-w-2xl">
              Running history of items checked off the dashboard. {log.length} total · most recent first.
            </p>
            {log.length > 0 && (
              <button onClick={ctx.clearCompleted} className="text-ink-400 hover:text-ember-400 text-xs underline-offset-2 hover:underline transition">
                Clear history
              </button>
            )}
          </div>

          {log.length === 0 ? (
            <Empty icon="check" title="Nothing completed yet"
              body="When you tick the round checkbox on overdue or upcoming items, they'll be logged here." />
          ) : (
            <>
              <div className="flex gap-2 overflow-x-auto no-bar -mx-1 px-1">
                {kinds.map(k => (
                  <button key={k} onClick={() => setFilter(k)}
                     className={`shrink-0 px-3 py-1.5 rounded-full text-xs border transition whitespace-nowrap ${
                       filter === k ? 'bg-ink-100 text-ink-900 border-ink-100' : 'border-ink-600 text-ink-200 hover:bg-ink-800'
                     }`}>
                    {k === 'all' ? `All · ${counts.all}` : `${KIND_LABELS[k]} · ${counts[k]}`}
                  </button>
                ))}
              </div>

              {Object.entries(buckets).filter(([_,items]) => items.length > 0).map(([bucket, items]) => (
                <section key={bucket}>
                  <div className="text-[11px] uppercase tracking-[0.18em] text-ink-400 mb-2.5">{bucket}</div>
                  <div className="space-y-2">
                    {items.map(l => {
                      const d = new Date(l.completedAt);
                      const when = d.toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
                      return (
                        <div key={l.id} className="card p-3 md:p-4 flex items-start gap-3 group">
                          <div className="w-7 h-7 rounded-full bg-sage-400/15 grid place-items-center text-sage-400 shrink-0 mt-0.5">
                            <Icon name="check" size={13} />
                          </div>
                          <div className="w-9 h-9 rounded-lg bg-ink-700 grid place-items-center text-ink-300 shrink-0">
                            <Icon name={KIND_ICONS[l.kind]||'dot'} size={15} />
                          </div>
                          <div className="min-w-0 flex-1">
                            <div className="text-sm text-ink-100 line-through decoration-ink-500/40 decoration-1">{l.title}</div>
                            {l.sub && <div className="text-ink-400 text-xs mt-0.5 truncate">{l.sub}</div>}
                            <div className="text-ink-400 text-[11px] mt-1">
                              <span className="uppercase tracking-wider">{KIND_LABELS[l.kind]||l.kind}</span> · {when}
                              {l.originalDue && <span className="text-ink-500"> · was due {fmtDate(l.originalDue,{month:'short',day:'numeric'})}</span>}
                            </div>
                          </div>
                          <button onClick={() => ctx.undoDone(l.id)} title="Undo"
                             className="opacity-0 group-hover:opacity-100 transition text-ink-400 hover:text-gold-300 text-xs px-2 py-1">
                            Undo
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </section>
              ))}
            </>
          )}
        </div>
      );
    };

            tone==='ok'      ? 'text-sage-400'  :
            'text-ink-100'
          }`}>{value}</div>
          {hint && <div className="text-ink-400 text-xs">{hint}</div>}
        </div>
      </div>
    );

    const DashboardItem = ({ item, kind, onComplete, onJump }) => {
      const [checking, setChecking] = useState(false);
      const handleCheck = (e) => {
        e.stopPropagation();
        if (!onComplete || checking) return;
        setChecking(true);
        // Brief visual feedback before mutating state (which removes the card)
        setTimeout(() => onComplete(), 280);
      };
      return (
        <div className={`card p-4 flex items-start gap-3 transition-all ${checking ? 'opacity-40 scale-95' : ''}`}>
          {onComplete && (
            <button onClick={handleCheck} title="Mark done"
              className={`w-6 h-6 mt-0.5 rounded-full border-2 grid place-items-center shrink-0 transition-all ${
                checking
                  ? 'bg-sage-400 border-sage-400 scale-110'
                  : 'border-ink-500 hover:border-sage-400 hover:bg-sage-400/10'
              }`}>
              <Icon name="check" size={12} className={checking ? 'text-ink-900' : 'text-transparent'} />
            </button>
          )}
          <div className={`w-10 h-10 rounded-xl grid place-items-center shrink-0 ${kind==='overdue'?'bg-ember-500/12 text-ember-400':'bg-ink-700 text-gold-400'}`}>
            <Icon name={
              item.kind==='maint'?'wrench':
              item.kind==='vendor'?'users':
              item.kind==='property'?'key':
              item.kind==='sub'?'receipt':
              'cube'
            } size={18} />
          </div>
          <div className={`min-w-0 flex-1 ${checking ? 'line-through text-ink-400' : ''}`}>
            <div className="text-sm font-medium truncate">{item.title}</div>
            {item.sub && <div className="text-ink-300 text-xs mt-0.5 truncate">{item.sub}</div>}
            <div className="mt-2 flex items-center gap-2 flex-wrap">
              <Pill tone={kind==='overdue'?'overdue':'soon'} dot>{kind==='overdue'?`${Math.abs(item.n)}d overdue`:fmtRelative(item.when)}</Pill>
              <span className="text-ink-400 text-xs">{fmtDate(item.when,{month:'short',day:'numeric'})}</span>
            </div>
          </div>
          <button onClick={onJump} title="Open" className="w-9 h-9 rounded-lg grid place-items-center text-ink-300 hover:bg-ink-700 shrink-0"><Icon name="chevR" size={16}/></button>
        </div>
      );
    };

    const DigestModal = ({ text, onClose }) => {
      const [copied, setCopied] = useState(false);
      const copy = async () => {
        try { await navigator.clipboard.writeText(text); setCopied(true); setTimeout(()=>setCopied(false), 1500); } catch {}
      };
      const mailto = () => {
        const url = `mailto:?subject=${encodeURIComponent("Home HQ weekly digest")}&body=${encodeURIComponent(text)}`;
        window.location.href = url;
      };
      return (
        <>
          <ModalHeader title="This week's digest" subtitle="Forward this to yourself or your spouse." onClose={onClose} />
          <div className="p-5 md:p-6">
            <textarea readOnly value={text} className="font-mono text-[12.5px] leading-relaxed h-72 resize-none" />
            <div className="flex items-center justify-end gap-2 mt-4">
              <Btn variant="ghost" icon="mail" onClick={mailto}>Email</Btn>
              <Btn icon="copy" onClick={copy}>{copied ? 'Copied' : 'Copy'}</Btn>
            </div>
          </div>
        </>
      );
    };

    /* ===================== VENDORS ===================== */
    const VendorsView = () => {
      const ctx = useContext(Ctx);
      const { state, setModal } = ctx;
      const [filter, setFilter] = useState('all');
      const [thisWeek, setThisWeek] = useState(false);
      const [query, setQuery] = useState('');

      const types = useMemo(() => {
        const set = new Set(state.vendors.map(v => v.serviceType));
        return ['all', ...Array.from(set).sort()];
      }, [state.vendors]);

      const filtered = useMemo(() => {
        return state.vendors.filter(v => {
          if (!inScope(v, ctx.propertyScope)) return false;
          if (filter !== 'all' && v.serviceType !== filter) return false;
          if (thisWeek) { const n = daysUntil(v.nextVisit); if (n === null || n < 0 || n > 7) return false; }
          if (query) {
            const q = query.toLowerCase();
            if (!`${v.name} ${v.company} ${v.serviceType} ${v.notes||''}`.toLowerCase().includes(q)) return false;
          }
          return true;
        });
      }, [state.vendors, filter, thisWeek, query, ctx.propertyScope]);

      const open = (v) => setModal(<VendorForm vendor={v} onClose={()=>setModal(null)} />);

      return (
        <div className="space-y-5 max-w-5xl">
          <div className="flex items-center justify-between gap-3">
            <p className="text-ink-300 text-sm hidden md:block max-w-2xl">Everyone who works on the house. Tap to edit. Use the call/text/email buttons to reach out fast.</p>
            <Btn icon="plus" onClick={()=>open(null)}>Add vendor</Btn>
          </div>

          <div className="flex items-center gap-2">
            <div className="relative flex-1">
              <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-ink-400" />
              <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search vendors, notes, services…" className="!pl-9" />
            </div>
            <button onClick={()=>setThisWeek(s=>!s)} className={`shrink-0 inline-flex items-center gap-2 px-3 py-2 rounded-xl text-sm border ${thisWeek?'bg-gold-400/12 border-gold-400/40 text-gold-300':'border-ink-600 text-ink-200 hover:bg-ink-800'}`}>
              <Icon name="calendar" size={15} /> This week
            </button>
          </div>

          <div className="flex gap-2 overflow-x-auto no-bar -mx-1 px-1">
            {types.map(t => (
              <button key={t} onClick={()=>setFilter(t)}
                className={`shrink-0 px-3 py-1.5 rounded-full text-xs border transition ${filter===t ? 'bg-ink-100 text-ink-900 border-ink-100' : 'border-ink-600 text-ink-200 hover:bg-ink-800'}`}>
                {t === 'all' ? 'All' : t}
              </button>
            ))}
          </div>

          {filtered.length === 0 ? (
            <Empty icon="users" title="No vendors match" body="Try clearing the filter, or add a new vendor." cta={<Btn icon="plus" onClick={()=>open(null)}>Add vendor</Btn>} />
          ) : (
            <div className="grid md:grid-cols-2 gap-3">
              {filtered.map(v => <VendorCard key={v.id} v={v} onEdit={()=>open(v)} />)}
            </div>
          )}
        </div>
      );
    };

    const VendorCard = ({ v, onEdit }) => {
      const ctx = useContext(Ctx);
      const nextN = daysUntil(v.nextVisit);
      const sched = v.schedule?.recurring ? freqLabel(v.schedule.freq) + (v.schedule.dayOfWeek?` · ${v.schedule.dayOfWeek}s`:'') : 'On-demand';
      return (
        <div className={phCard(v.placeholder) + ' p-4 md:p-5'}>
          <div className="flex items-start justify-between gap-3">
            <div className="min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <div className="text-[11px] uppercase tracking-wider text-ink-400">{v.serviceType}</div>
                {v.placeholder && <PlaceholderBadge/>}
              </div>
              <div className="font-display text-lg leading-tight mt-0.5">{v.company}</div>

            <button onClick={onEdit} className="w-9 h-9 rounded-lg grid place-items-center text-ink-300 hover:bg-ink-700 shrink-0"><Icon name="edit" size={15}/></button>
          </div>
          <div className="mt-3 flex items-center gap-2 flex-wrap">
            {v.nextVisit && (
              <Pill tone={nextN<0?'overdue':nextN<=7?'soon':'info'} dot>
                {nextN<0?`${Math.abs(nextN)}d overdue`:`Next ${fmtDate(v.nextVisit,{month:'short',day:'numeric'})}`}
              </Pill>
            )}
            <Pill tone="muted">{sched}</Pill>
            {v.rate && <Pill tone="muted">{v.rate}</Pill>}
          </div>
          {v.notes && <div className="text-ink-300 text-xs mt-3 line-clamp-2 leading-relaxed">{v.notes}</div>}
          <div className="divider my-4" />
          <div className="flex items-center gap-2">
            <a href={`tel:${v.phone}`} className="flex-1 inline-flex items-center justify-center gap-2 py-2 rounded-lg bg-ink-700 hover:bg-ink-600 text-ink-100 text-sm"><Icon name="phone" size={15}/> Call</a>
            <a href={`sms:${v.phone}`} className="flex-1 inline-flex items-center justify-center gap-2 py-2 rounded-lg bg-ink-700 hover:bg-ink-600 text-ink-100 text-sm"><Icon name="message" size={15}/> Text</a>
            <a href={`mailto:${v.email}`} className="flex-1 inline-flex items-center justify-center gap-2 py-2 rounded-lg bg-ink-700 hover:bg-ink-600 text-ink-100 text-sm"><Icon name="mail" size={15}/> Email</a>
          </div>
        <LinkChips links={v.links} entityKind="vendors" entityId={v.id} />
        </div>
      );
    };

    const VendorForm = ({ vendor, onClose }) => {
      const ctx = useContext(Ctx);
      const isNew = !vendor;
      const [v, setV] = useState(vendor || {
        name:'', company:'', serviceType:'', phone:'', email:'', rate:'',
        schedule:{ recurring:false, freq:{count:1, unit:'months'}, dayOfWeek:'' },
        lastVisit:'', nextVisit:'', notes:''
      });
      const setField = (k, val) => setV(prev => ({...prev, [k]: val}));
      const setSched = (k, val) => setV(prev => ({...prev, schedule: {...prev.schedule, [k]: val}}));
      const setFreq = (k, val) => setV(prev => ({...prev, schedule: {...prev.schedule, freq: {...prev.schedule.freq, [k]: val}}}));

      const save = () => {
        const payload = {...v};
        if (!payload.schedule.recurring) payload.schedule = {recurring:false};
        if (isNew) ctx.addVendor(payload); else ctx.updateVendor(vendor.id, payload);
        ctx.showToast(isNew?'Vendor added':'Vendor updated');
        onClose();
      };
      const remove = () => {
        if (window.confirm(`Delete ${vendor.company}?`)) { ctx.deleteVendor(vendor.id); ctx.showToast('Vendor deleted'); onClose(); }
      };
      return (
        <>
          <ModalHeader title={isNew?'Add vendor':'Edit vendor'} subtitle={isNew?'Takes about 30 seconds.':v.company} onClose={onClose} />
          <div className="p-5 md:p-6 space-y-4">
            <div className="grid grid-cols-2 gap-3">
              <div><label>Service type</label><input value={v.serviceType} onChange={e=>setField('serviceType',e.target.value)} placeholder="e.g. House Cleaner"/></div>
              <div><label>Company</label><input value={v.company} onChange={e=>setField('company',e.target.value)} placeholder="Castillo Cleaning"/></div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div><label>Contact name</label><input value={v.name} onChange={e=>setField('name',e.target.value)} placeholder="Maria Castillo"/></div>
              <div><label>Rate</label><input value={v.rate} onChange={e=>setField('rate',e.target.value)} placeholder="$220 / visit"/></div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div><label>Phone</label><input value={v.phone} onChange={e=>setField('phone',e.target.value)} placeholder="+1 415 555 0000"/></div>
              <div><label>Email</label><input value={v.email} onChange={e=>setField('email',e.target.value)} placeholder="email@…"/></div>
            </div>
            <div className="card-soft p-3.5">
              <div className="flex items-center justify-between">
                <label className="!mb-0">Recurring schedule</label>
                <button type="button" onClick={()=>setSched('recurring', !v.schedule.recurring)}
                  className={`w-11 h-6 rounded-full relative transition ${v.schedule.recurring?'bg-gold-500':'bg-ink-600'}`}>
                  <span className={`absolute top-0.5 ${v.schedule.recurring?'left-[1.4rem]':'left-0.5'} w-5 h-5 rounded-full bg-ink-100 transition-all`}></span>
                </button>
              </div>
              {v.schedule.recurring && (
                <div className="grid grid-cols-3 gap-2 mt-3">
                  <div><label>Every</label><input type="number" min="1" value={v.schedule.freq.count} onChange={e=>setFreq('count', Math.max(1, +e.target.value))}/></div>
                  <div><label>Unit</label>
                    <select value={v.schedule.freq.unit} onChange={e=>setFreq('unit', e.target.value)}>
                      <option value="days">days</option><option value="weeks">weeks</option><option value="months">months</option><option value="years">years</option>
                    </select>
                  </div>
                  <div><label>Day (opt.)</label>
                    <select value={v.schedule.dayOfWeek} onChange={e=>setSched('dayOfWeek', e.target.value)}>
                      <option value="">—</option>
                      {['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(d=><option key={d} value={d}>{d}</option>)}
                    </select>
                  </div>
                </div>
              )}
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div><label>Last visit</label><input type="date" value={v.lastVisit||''} onChange={e=>setField('lastVisit', e.target.value)}/></div>
              <div><label>Next visit</label><input type="date" value={v.nextVisit||''} onChange={e=>setField('nextVisit', e.target.value)}/></div>
            </div>
            <div><label>Notes</label><textarea rows="3" value={v.notes||''} onChange={e=>setField('notes', e.target.value)} placeholder="Gate code, key location, what they're great/bad at…"/></div>
          </div>
          <div className="px-5 md:px-6 py-4 border-t border-ink-600 flex items-center justify-between gap-2 sticky bottom-0 bg-ink-850/95 backdrop-blur">
            {!isNew ? <Btn variant="danger" icon="trash" onClick={remove}>Delete</Btn> : <span/>}
            <div className="flex gap-2">
              <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
              <Btn icon="check" onClick={save}>{isNew?'Add vendor':'Save'}</Btn>
            </div>
          </div>
        </>
      );
    };

    /* ===================== MAINTENANCE ===================== */
    const MaintenanceView = () => {
      const ctx = useContext(Ctx);
      const { state, setModal } = ctx;
      const [tab, setTab] = useState('list'); // list | timeline

      const sorted = useMemo(() => {
        return filterByScope(state.maintenance, ctx.propertyScope).sort((a,b) => {
          const an = daysUntil(maintenanceNextDue(a)) ?? 9e9;
          const bn = daysUntil(maintenanceNextDue(b)) ?? 9e9;
          return an - bn;
        });
      }, [state.maintenance, ctx.propertyScope]);

      const open = (t) => setModal(<TaskForm task={t} onClose={()=>setModal(null)} />);

      return (
        <div className="space-y-5 max-w-5xl">
          <div className="flex items-center justify-between gap-3">
            <p className="text-ink-300 text-sm hidden md:block max-w-2xl">Big-ticket recurring tasks. Mark complete and the next due date rolls forward automatically.</p>
            <Btn icon="plus" onClick={()=>open(null)}>Add task</Btn>
          </div>

          <div className="inline-flex rounded-xl border border-ink-600 p-0.5 bg-ink-850">
            <button onClick={()=>setTab('list')}     className={`px-3.5 py-1.5 rounded-lg text-sm inline-flex items-center gap-2 ${tab==='list'?'bg-ink-700 text-ink-100':'text-ink-300'}`}><Icon name="list" size={14}/> List</button>
            <button onClick={()=>setTab('timeline')} className={`px-3.5 py-1.5 rounded-lg text-sm inline-flex items-center gap-2 ${tab==='timeline'?'bg-ink-700 text-ink-100':'text-ink-300'}`}><Icon name="calendar" size={14}/> 12-month timeline</button>
          </div>

          {tab === 'list' ? (
            <div className="grid md:grid-cols-2 gap-3">
              {sorted.map(m => <TaskCard key={m.id} m={m} onEdit={()=>open(m)} />)}
            </div>
          ) : (
            <Timeline tasks={sorted} onPick={(m)=>open(m)} />
          )}
        </div>
      );
    };

    const TaskCard = ({ m, onEdit }) => {
      const ctx = useContext(Ctx);
      const next = maintenanceNextDue(m);
      const status = maintenanceStatus(m);
      const vendor = ctx.state.vendors.find(v => v.company === m.vendorHint);
      return (
        <div className="card p-4 md:p-5">
          <div className="flex items-start justify-between gap-3">
            <div className="min-w-0">
              <div className="text-sm font-medium leading-snug">{m.name}</div>
              <div className="text-ink-300 text-xs mt-0.5">{freqLabel(m.freq)}{m.estimatedCost?` · ~$${m.estimatedCost}`:''}</div>
            </div>
            <button onClick={onEdit} className="w-9 h-9 rounded-lg grid place-items-center text-ink-300 hover:bg-ink-700 shrink-0"><Icon name="edit" size={15}/></button>
          </div>
          <div className="mt-3 flex items-center gap-2 flex-wrap">
            <Pill tone={status.tone} dot>{status.label}</Pill>
            <span className="text-ink-400 text-xs">Last: {fmtDate(m.lastCompleted)}</span>
            <span className="text-ink-400 text-xs">·</span>
            <span className="text-ink-400 text-xs">Next: {fmtDate(next)}</span>
          </div>
          {(m.notes || vendor || m.vendorHint) && (
            <div className="mt-3 text-ink-300 text-xs leading-relaxed">
              {(vendor || m.vendorHint) && <div className="mb-1"><span className="text-ink-400">Vendor:</span> {vendor?.company || m.vendorHint}</div>}
              {m.notes && <div className="line-clamp-2">{m.notes}</div>}
            </div>
          )}
          <div className="divider my-4"/>
          <div className="flex items-center gap-2">
            <button onClick={()=>{ ctx.completeTask(m.id); ctx.showToast(`Completed: ${m.name}`); }}
              className="flex-1 inline-flex items-center justify-center gap-2 py-2 rounded-lg bg-sage-500/10 text-sage-400 hover:bg-sage-500/15 border border-sage-500/25 text-sm">
              <Icon name="check" size={15}/> Mark complete
            </button>
          </div>
        </div>
      );
    };

    const TaskForm = ({ task, onClose }) => {
      const ctx = useContext(Ctx);
      const isNew = !task;
      const [t, setT] = useState(task || { name:'', freq:{count:1, unit:'years'}, lastCompleted: todayISO, estimatedCost:0, notes:'', vendorHint:'' });
      const setField = (k, val) => setT(prev => ({...prev, [k]: val}));
      const setFreq = (k, val) => setT(prev => ({...prev, freq: {...prev.freq, [k]: val}}));
      const save = () => {
        if (isNew) ctx.addTask(t); else ctx.updateTask(task.id, t);
        ctx.showToast(isNew?'Task added':'Task updated');
        onClose();
      };
      const remove = () => { if (window.confirm(`Delete ${task.name}?`)) { ctx.deleteTask(task.id); ctx.showToast('Task deleted'); onClose(); } };
      const vendors = ctx.state.vendors;
      return (
        <>
          <ModalHeader title={isNew?'Add maintenance task':'Edit task'} subtitle={isNew?'Recurring big-ticket items.':t.name} onClose={onClose} />
          <div className="p-5 md:p-6 space-y-4">
            <div><label>Task name</label><input value={t.name} onChange={e=>setField('name', e.target.value)} placeholder="e.g. Gutter cleaning"/></div>
            <div className="grid grid-cols-2 gap-3">
              <div><label>Every</label><input type="number" min="1" value={t.freq.count} onChange={e=>setFreq('count', Math.max(1, +e.target.value))}/></div>
              <div><label>Unit</label>
                <select value={t.freq.unit} onChange={e=>setFreq('unit', e.target.value)}>
                  <option value="days">days</option><option value="weeks">weeks</option><option value="months">months</option><option value="years">years</option>
                </select>
              </div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div><label>Last completed</label><input type="date" value={t.lastCompleted||''} onChange={e=>setField('lastCompleted', e.target.value)}/></div>
              <div><label>Est. cost ($)</label><input type="number" min="0" value={t.estimatedCost||0} onChange={e=>setField('estimatedCost', +e.target.value)}/></div>
            </div>
            <div><label>Preferred vendor</label>
              <select value={t.vendorHint||''} onChange={e=>setField('vendorHint', e.target.value)}>
                <option value="">— none —</option>
                {vendors.map(v => <option key={v.id} value={v.company}>{v.company} · {v.serviceType}</option>)}
              </select>
            </div>
            <div><label>Notes</label><textarea rows="3" value={t.notes||''} onChange={e=>setField('notes', e.target.value)} placeholder="Anything specific (paint code, sealant brand, prep, etc.)"/></div>
            {!isNew && (
              <div className="card-soft p-3 flex items-center justify-between">
                <div className="text-ink-300 text-xs">Next due: <span className="text-ink-100">{fmtDate(maintenanceNextDue(t))}</span></div>
                <Btn variant="soft" icon="check" onClick={()=>{ ctx.completeTask(task.id); ctx.showToast('Marked complete'); onClose(); }}>Mark complete now</Btn>
              </div>
            )}
          </div>
          <div className="px-5 md:px-6 py-4 border-t border-ink-600 flex items-center justify-between gap-2 sticky bottom-0 bg-ink-850/95 backdrop-blur">
            {!isNew ? <Btn variant="danger" icon="trash" onClick={remove}>Delete</Btn> : <span/>}
            <div className="flex gap-2">
              <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
              <Btn icon="check" onClick={save}>{isNew?'Add task':'Save'}</Btn>
            </div>
          </div>
        </>
      );
    };

    const Timeline = ({ tasks, onPick }) => {
      const months = useMemo(() => {
        const arr = [];
        const start = new Date(today().getFullYear(), today().getMonth(), 1);
        for (let i=0; i<12; i++) {
          const m = new Date(start.getFullYear(), start.getMonth()+i, 1);
          arr.push(m);
        }
        return arr;
      }, []);
      const buckets = useMemo(() => {
        const map = months.map(()=>[]);
        tasks.forEach(t => {
          const next = maintenanceNextDue(t); if (!next) return;
          const d = parseDate(next);
          months.forEach((m, i) => {
            const end = new Date(m.getFullYear(), m.getMonth()+1, 1);
            if (d >= m && d < end) map[i].push(t);
          });
        });
        return map;
      }, [tasks, months]);
      const totalCost = (mIdx) => buckets[mIdx].reduce((acc,t)=>acc + (t.estimatedCost||0), 0);
      return (
        <div className="card p-4 md:p-5">
          <div className="text-ink-300 text-xs mb-3">Next 12 months — clusters help with budget planning. Tap a task to edit.</div>
          <div className="space-y-3">
            {months.map((m, i) => (
              <div key={i} className="flex gap-4 items-start">
                <div className="w-20 md:w-24 shrink-0 pt-1">
                  <div className="text-ink-100 text-sm font-medium">{m.toLocaleDateString(undefined,{month:'short'})}</div>
                  <div className="text-ink-400 text-[11px]">{m.getFullYear()}</div>
                  {totalCost(i) > 0 && <div className="text-gold-400 text-[11px] mt-0.5 tabular-nums">~${totalCost(i).toLocaleString()}</div>}
                </div>
                <div className="flex-1 min-h-[2rem] border-l border-dashed border-ink-600 pl-4 py-1">
                  {buckets[i].length === 0 ? (
                    <div className="text-ink-500 text-xs italic">—</div>
                  ) : (
                    <div className="flex flex-wrap gap-1.5">
                      {buckets[i].map(t => {
                        const status = maintenanceStatus(t);
                        return (
                          <button key={t.id} onClick={()=>onPick(t)}
                            className={`text-[12px] px-2.5 py-1 rounded-lg border inline-flex items-center gap-1.5 transition hover:translate-y-[-1px] ${
                              status.tone==='overdue' ? 'border-ember-500/30 text-ember-400 bg-ember-500/10' :
                              status.tone==='soon'    ? 'border-gold-400/30 text-gold-300 bg-gold-400/10' :
                                                        'border-ink-600 text-ink-200 bg-ink-800'

                <Icon name="link" size={13} className="text-gold-400"/> Open in Box
              </a>
              <button onClick={onClose} className="shrink-0 w-9 h-9 rounded-full grid place-items-center text-ink-300 hover:bg-ink-700">
                <Icon name="x" size={18}/>
              </button>
            </div>
            <div className="flex-1 bg-ink-850 relative">
              {embed && !errored ? (
                <>
                  {!loaded && (
                    <div className="absolute inset-0 grid place-items-center text-ink-400 text-sm">Loading preview…</div>
                  )}
                  <iframe
                    src={embed}
                    title={label}
                    className="w-full h-full border-0"
                    allow="fullscreen"
                    onLoad={() => setLoaded(true)}
                    onError={() => setErrored(true)}
                  />
                </>
              ) : (
                <div className="absolute inset-0 grid place-items-center px-6 text-center">
                  <div>
                    <div className="text-ink-100 mb-2">Inline preview not available.</div>
                    <div className="text-ink-300 text-sm mb-4">This link doesn't support embed-mode preview, or your Box session blocked it.</div>
                    <a href={url} target="_blank" rel="noreferrer" className="btn-primary inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-sm font-medium">
                      <Icon name="link" size={14}/> Open in Box
                    </a>
                  </div>
                </div>
              )}
            </div>
            <div className="px-4 py-2 border-t border-ink-600 text-[11px] text-ink-400">
              Inline previews work for files with a Box shared link. Other files open in Box directly.
            </div>
          </div>
        </div>
      );
    };


    /* Visible "Placeholder" pill — surfaces seeded gap-fillers that need real data */
    const PlaceholderBadge = () => (
      <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-gold-400/12 border border-gold-400/30 text-gold-300 text-[10px] uppercase tracking-[0.14em]">
        <span className="w-1.5 h-1.5 rounded-full bg-gold-400 animate-pulse"/>
        Placeholder
      </span>
    );
    // Wrapper class fragment — apply to a card div to give it a dashed/dim look
    const phCard = (isPh, base='card') => `${base}${isPh ? ' border-dashed border-gold-400/30 opacity-90' : ''}`;

    const LinkChips = ({ links, entityKind, entityId }) => {
      const ctx = useContext(Ctx);
      const [adding, setAdding] = useState(false);
      const [label, setLabel] = useState('');
      const [url, setUrl] = useState('');
      const canEdit = !!(entityKind && entityId && ctx.addLink);
      const hasLinks = links && links.length > 0;
      if (!hasLinks && !canEdit) return null;
      const open = (l, e) => {
        e?.stopPropagation();
        if (toBoxEmbed(l.url)) {
          ctx.setPreviewFile(l);
        } else {
          window.open(l.url, '_blank', 'noopener,noreferrer');
        }
      };
      const reset = () => { setAdding(false); setLabel(''); setUrl(''); };
      const submit = (e) => {
        e?.preventDefault?.();
        const u = (url || '').trim();
        if (!u) return;
        let labelToUse = (label || '').trim();
        if (!labelToUse) {
          // Derive a default label from the URL (Box file/folder/shared-id)
          try {
            const parsed = new URL(u);
            const seg = parsed.pathname.split('/').filter(Boolean);
            labelToUse = seg.length ? `Document ${seg[seg.length-1].slice(0,8)}` : 'Document';
          } catch { labelToUse = 'Document'; }
        }
        ctx.addLink(entityKind, entityId, { label: labelToUse, url: u });
        ctx.showToast?.('Link added');
        reset();
      };
      const removeAt = (idx, e) => {
        e?.stopPropagation();
        if (!canEdit) return;
        ctx.removeLink(entityKind, entityId, idx);
      };
      return (
        <>
          <div className="divider my-4"/>
          <div>
            <div className="text-[11px] uppercase tracking-wider text-ink-400 mb-2">Documents</div>
            <div className="flex flex-wrap gap-1.5 items-center">
              {(links || []).map((l, i) => {
                const inlineable = !!toBoxEmbed(l.url);
                return (
                  <span key={i} className="group inline-flex items-center rounded-lg bg-ink-700 hover:bg-ink-600 transition">
                    <button type="button" onClick={(e) => open(l, e)}
                       title={inlineable ? 'Preview inline' : 'Open in Box'}
                       className="inline-flex items-center gap-1.5 pl-2.5 pr-1.5 py-1 text-ink-100 text-xs">
                      <Icon name="link" size={12} className="text-gold-400" />
                      {l.label}
                      {!inlineable && (
                        <span className="text-ink-400 text-[10px] ml-0.5">↗</span>
                      )}
                    </button>
                    {canEdit && (
                      <button type="button" onClick={(e) => removeAt(i, e)}
                         title="Remove link"
                         className="px-1.5 py-1 text-ink-400 opacity-0 group-hover:opacity-100 hover:text-ember-400 transition">
                        <Icon name="x" size={11}/>
                      </button>
                    )}
                  </span>
                );
              })}
              {canEdit && !adding && (
                <>
                  <button type="button" onClick={(e) => { e.stopPropagation(); setAdding(true); }}
                     className="inline-flex items-center gap-1 px-2 py-1 rounded-lg border border-dashed border-ink-500 text-ink-300 hover:text-gold-300 hover:border-gold-500/50 text-xs transition">
                    <Icon name="plus" size={11}/> Add link
                  </button>
                  <PhotoUploadButton entityKind={entityKind} entityId={entityId} />
                </>
              )}
            </div>
            {canEdit && adding && (
              <form onSubmit={submit} onClick={(e) => e.stopPropagation()}
                 className="mt-2 flex flex-col sm:flex-row gap-2">
                <input
                  autoFocus
                  type="text"
                  placeholder="Label (optional)"
                  value={label}
                  onChange={(e) => setLabel(e.target.value)}
                  className="flex-1 sm:max-w-[180px] px-2.5 py-1.5 rounded-lg bg-ink-800 border border-ink-600 text-ink-100 text-xs focus:outline-none focus:border-gold-500/50"
                />
                <input
                  type="url"
                  placeholder="Box URL (https://app.box.com/file/... or /folder/... or /s/...)"
                  value={url}
                  onChange={(e) => setUrl(e.target.value)}
                  className="flex-1 px-2.5 py-1.5 rounded-lg bg-ink-800 border border-ink-600 text-ink-100 text-xs focus:outline-none focus:border-gold-500/50"
                />
                <div className="flex gap-1.5">
                  <button type="submit" disabled={!url.trim()}
                     className="px-2.5 py-1.5 rounded-lg bg-gold-500 hover:bg-gold-400 text-ink-900 text-xs font-medium disabled:opacity-40 disabled:cursor-not-allowed">
                    Save
                  </button>
                  <button type="button" onClick={reset}
                     className="px-2.5 py-1.5 rounded-lg bg-ink-700 hover:bg-ink-600 text-ink-200 text-xs">
                    Cancel
                  </button>
                </div>
              </form>
            )}
          </div>
        </>
      );
    };

    /* Global quick-capture bar — uploads photos to Inbox without tying to a card,
       plus a "Box settings" button that opens BoxSettingsModal directly. */
    const QuickCaptureBar = () => {
      const ctx = useContext(Ctx);
      const inputRef = useRef(null);
      const [busy, setBusy] = useState(false);
      const [showSettings, setShowSettings] = useState(false);
      const [pending, setPending] = useState(null);
      const [err, setErr] = useState(null);

      const trigger = () => {
        setErr(null);
        const { token, expired } = loadBoxToken();
        const folders = loadBoxFolders();
        if (!token || expired || !folders.inbox) { setShowSettings(true); return; }
        inputRef.current?.click();
      };

      const doUpload = async (file) => {
        setBusy(true); setErr(null);
        try {
          const { token } = loadBoxToken();
          const folders = loadBoxFolders();
          const result = await uploadFileToBox(file, folders.inbox, token);
          ctx.showToast?.('Photo uploaded to Box Inbox');
          // Open the result inline so the user knows it landed
          ctx.setPreviewFile?.({ label: result.name, url: result.sharedUrl });
        } catch (ex) {
          const msg = (ex && ex.message) || 'Upload failed';
          setErr(msg);
          if (/401|token|auth/i.test(msg)) { setPending(file); setShowSettings(true); }
          else ctx.showToast?.(`Upload failed — ${msg.slice(0, 60)}`);
        } finally { setBusy(false); }
      };

      const onFileChange = async (e) => {
        const f = e.target.files?.[0]; e.target.value = '';
        if (f) await doUpload(f);
      };
      const onSettingsSaved = async () => {
        if (pending) { const f = pending; setPending(null); await doUpload(f); }
      };
      return (
        <div className="card p-4 flex flex-wrap items-center gap-3">
          <div className="flex-1 min-w-0">
            <div className="text-[11px] uppercase tracking-wider text-ink-400">Quick capture</div>
            <div className="text-sm text-ink-200 mt-0.5">Snap a photo or upload a file straight to your Box Inbox.</div>
          </div>
          <div className="flex items-center gap-2">
            <button type="button" onClick={trigger} disabled={busy}
              className="btn-primary px-3 py-1.5 rounded-lg text-sm font-medium inline-flex items-center gap-1.5 disabled:opacity-50">
              <Icon name="camera" size={14}/>{busy ? 'Uploading…' : 'Take / upload photo'}
            </button>
            <button type="button" onClick={() => setShowSettings(true)} title="Box settings"
              className="px-2.5 py-1.5 rounded-lg text-sm bg-ink-700 hover:bg-ink-600 text-ink-200 inline-flex items-center gap-1.5">
              <Icon name="gear" size={14}/>Box
            </button>
          </div>
          {err && <div className="w-full text-[11px] text-ember-400">{err}</div>}
          <input ref={inputRef} type="file" accept="image/*" capture="environment" onChange={onFileChange} className="hidden"/>
          {showSettings && <BoxSettingsModal onClose={() => setShowSettings(false)} onSaved={onSettingsSaved} kindHighlight="inbox"/>}
        </div>
      );
    };

    const FilesView = () => {
      const ctx = useContext(Ctx);
      const { state } = ctx;
      const files = state.files || [];
      const grouped = useMemo(() => {
        const out = {};
        files.forEach(f => { (out[f.category] = out[f.category] || []).push(f); });
        return out;
      }, [files]);
      const order = ['Insurance','Property','Vehicles','Planning','Reference'];
      const cats = order.filter(c => grouped[c]).concat(Object.keys(grouped).filter(c => !order.includes(c)));
      return (
        <div className="space-y-7 max-w-5xl">
          <QuickCaptureBar />
          <p className="text-ink-300 text-sm hidden md:block max-w-2xl">Direct links to source documents — Box folders, manuals, reference sheets. Click to open in a new tab.</p>
          {cats.length === 0 ? (
            <Empty icon="folder" title="No files yet" body="Document links you add will appear here, grouped by topic." />
          ) : cats.map(cat => (
            <section key={cat}>
              <div className="flex items-baseline justify-between mb-3">
                <h2 className="font-display text-xl tracking-tight">{cat}</h2>
                <span className="text-ink-400 text-xs">{grouped[cat].length}</span>
              </div>
              <div className="grid md:grid-cols-2 gap-3">
                {grouped[cat].map(f => {
                  const embeddable = !!toBoxEmbed(f.url);
                  const Inner = (
                    <>
                      <div className="w-10 h-10 rounded-xl bg-ink-700 grid place-items-center text-gold-400 shrink-0">
                        <Icon name={f.url.includes('/folder/') ? 'folder' : 'link'} size={18} />
                      </div>
                      <div className="min-w-0 flex-1">
                        <div className="text-sm font-medium text-ink-100 group-hover:text-gold-300 truncate">{f.label}</div>
                        {f.notes && <div className="text-ink-300 text-xs mt-0.5 line-clamp-2">{f.notes}</div>}
                        <div className="text-ink-400 text-[11px] mt-1.5 truncate">{(() => { try { return new URL(f.url).hostname; } catch { return f.url; } })()}</div>
                      </div>
                    </>
                  );
                  return embeddable ? (
                    <button key={f.id} type="button" onClick={() => ctx.setPreviewFile(f)}
                       className="card p-4 flex items-start gap-3 hover:border-gold-500/40 transition group text-left">
                      {Inner}
                    </button>
                  ) : (
                    <a key={f.id} href={f.url} target="_blank" rel="noreferrer"
                       className="card p-4 flex items-start gap-3 hover:border-gold-500/40 transition group">
                      {Inner}
                    </a>
                  );
                })}
              </div>
            </section>
          ))}
        </div>
      );
    };

    async function decryptShared(password) {
      const data = Uint8Array.from(atob(ENCRYPTED_BLOB), c => c.charCodeAt(0));
      const salt = data.slice(0, 16);
      const nonce = data.slice(16, 28);
      const ct = data.slice(28);
      const enc = new TextEncoder();
      const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
        km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: nonce }, key, ct);
      return JSON.parse(new TextDecoder().decode(pt));
    }

    const UnlockScreen = ({ onUnlock }) => {
      const [pw, setPw] = useState('');
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      const submit = async (e) => {
        e?.preventDefault();
        if (!pw || busy) return;
        setBusy(true); setErr(null);
        try {
          const state = await decryptShared(pw);
          onUnlock(state);
        } catch (ex) {
          setErr("Password didn't work. Try again.");
          setBusy(false);
        }
      };
      return (
        <div className="min-h-screen relative z-10 flex items-center justify-center px-6">
          <form onSubmit={submit} className="card p-8 md:p-10 w-full max-w-sm anim-in">
            <div className="flex items-center gap-3 mb-6">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 grid place-items-center text-ink-900 font-display font-semibold text-lg">H</div>
              <div>
                <div className="font-display text-xl tracking-tight leading-none">Home HQ</div>
                <div className="text-ink-400 text-[11px] uppercase tracking-wider mt-1">Shared view</div>
              </div>
            </div>
            <div className="text-ink-200 text-sm mb-1">Welcome.</div>
            <div className="text-ink-300 text-sm mb-5">Enter the household password to view.</div>
            <input
              type="password"
              autoFocus
              value={pw}
              onChange={e => setPw(e.target.value)}
              placeholder="Password"
              disabled={busy}
              className="w-full px-3 py-2.5 rounded-xl bg-ink-800 border border-ink-600 text-ink-100 text-sm focus:outline-none focus:border-gold-500/50"
            />
            {err && <div className="text-ember-400 text-xs mt-2">{err}</div>}
            <button type="submit" disabled={busy || !pw}
              className="btn-primary w-full mt-4 px-3.5 py-2.5 rounded-xl text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed">
              {busy ? 'Unlocking…' : 'View dashboard'}
            </button>
            <div className="text-ink-500 text-[11px] mt-5 leading-relaxed">
              This is a private view of the McCullum household dashboard. Edits you make are saved on this device only.
            </div>
          </form>
        </div>
      );
    };

    const SharedRoot = () => {
      const [decrypted, setDecrypted] = useState(null);
      if (!decrypted) return <UnlockScreen onUnlock={(s) => {
        // Auto-populate Finnhub key from baked state if not already set locally
        try {
          if (s._finnhubKey && !localStorage.getItem('homehq.finnhubKey')) {
            localStorage.setItem('homehq.finnhubKey', s._finnhubKey);
          }
        } catch {}
        // Strip the key out of state before saving — keep it in localStorage only
        const stateForApp = { ...s };
        delete stateForApp._finnhubKey;
        window.__SHARED_INIT__ = stateForApp;
        setDecrypted(stateForApp);
      }} />;
      return <App />;
    };

    root.render(<SharedRoot />);
  </script>
</body>
</html>
