                  <div key={l.id} className="card-soft p-3.5 flex items-start gap-3">
                    <div className="w-9 h-9 rounded-xl bg-ink-700 grid place-items-center text-gold-400 shrink-0"><Icon name="wine" size={16}/></div>
                    <div className="min-w-0 flex-1">
                      <div className="text-sm font-medium">{l.title}</div>
                      <div className="text-ink-400 text-[11px] mt-0.5">
                        {new Date(l.openedAt).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' })}
                        {l.rating ? <span className="text-gold-400"> · {'●'.repeat(l.rating)}{'○'.repeat(5-l.rating)}</span> : null}
                      </div>
                      {l.note && <div className="text-ink-300 text-xs mt-1.5 leading-relaxed">{l.note}</div>}
                    </div>
                  </div>
                ))}
              </div>
            </section>
          )}
        </div>
      );
    };
    // Wrapper class fragment — apply to a card div to give it a dashed/dim look
    const phCard = (isPh, base='card') => `${base}${isPh ? ' border-dashed border-gold-400/30 opacity-90' : ''}`;

    const LinkChips = ({ links, entityKind, entityId }) => {
      const ctx = useContext(Ctx);
      const [adding, setAdding] = useState(false);
      const [label, setLabel] = useState('');
      const [url, setUrl] = useState('');
      const canEdit = !!(entityKind && entityId && ctx.addLink);
      const hasLinks = links && links.length > 0;
      if (!hasLinks && !canEdit) return null;
      const open = (l, e) => {
        e?.stopPropagation();
        if (toBoxEmbed(l.url)) {
          ctx.setPreviewFile(l);
        } else {
          window.open(l.url, '_blank', 'noopener,noreferrer');
        }
      };
      const reset = () => { setAdding(false); setLabel(''); setUrl(''); };
      const submit = (e) => {
        e?.preventDefault?.();
        const u = (url || '').trim();
        if (!u) return;
        let labelToUse = (label || '').trim();
        if (!labelToUse) {
          // Derive a default label from the URL (Box file/folder/shared-id)
          try {
            const parsed = new URL(u);
            const seg = parsed.pathname.split('/').filter(Boolean);
            labelToUse = seg.length ? `Document ${seg[seg.length-1].slice(0,8)}` : 'Document';
          } catch { labelToUse = 'Document'; }
        }
        ctx.addLink(entityKind, entityId, { label: labelToUse, url: u });
        ctx.showToast?.('Link added');
        reset();
      };
      const removeAt = (idx, e) => {
        e?.stopPropagation();
        if (!canEdit) return;
        ctx.removeLink(entityKind, entityId, idx);
      };
      return (
        <>
          <div className="divider my-4"/>
          <div>
            <div className="text-[11px] uppercase tracking-wider text-ink-400 mb-2">Documents</div>
            <div className="flex flex-wrap gap-1.5 items-center">
              {(links || []).map((l, i) => {
                const inlineable = !!toBoxEmbed(l.url);
                return (
                  <span key={i} className="group inline-flex items-center rounded-lg bg-ink-700 hover:bg-ink-600 transition">
                    <button type="button" onClick={(e) => open(l, e)}
                       title={inlineable ? 'Preview inline' : 'Open in Box'}
                       className="inline-flex items-center gap-1.5 pl-2.5 pr-1.5 py-1 text-ink-100 text-xs">
                      <Icon name="link" size={12} className="text-gold-400" />
                      {l.label}
                      {!inlineable && (
                        <span className="text-ink-400 text-[10px] ml-0.5">↗</span>
                      )}
                    </button>
                    {canEdit && (
                      <button type="button" onClick={(e) => removeAt(i, e)}
                         title="Remove link"
                         className="px-1.5 py-1 text-ink-400 md:opacity-0 md:group-hover:opacity-100 hover:text-ember-400 transition">
                        <Icon name="x" size={11}/>
                      </button>
                    )}
                  </span>
                );
              })}
              {canEdit && !adding && (
                <>
                  <button type="button" onClick={(e) => { e.stopPropagation(); setAdding(true); }}
                     className="inline-flex items-center gap-1 px-2 py-1 rounded-lg border border-dashed border-ink-500 text-ink-300 hover:text-gold-300 hover:border-gold-500/50 text-xs transition">
                    <Icon name="plus" size={11}/> Add link
                  </button>
                  <PhotoUploadButton entityKind={entityKind} entityId={entityId} />
                </>
              )}
            </div>
            {canEdit && adding && (
              <form onSubmit={submit} onClick={(e) => e.stopPropagation()}
                 className="mt-2 flex flex-col sm:flex-row gap-2">
                <input
                  autoFocus
                  type="text"
                  placeholder="Label (optional)"
                  value={label}
                  onChange={(e) => setLabel(e.target.value)}
                  className="flex-1 sm:max-w-[180px] px-2.5 py-1.5 rounded-lg bg-ink-800 border border-ink-600 text-ink-100 text-xs focus:outline-none focus:border-gold-500/50"
                />
                <input
                  type="url"
                  placeholder="Box URL (https://app.box.com/file/... or /folder/... or /s/...)"
                  value={url}
                  onChange={(e) => setUrl(e.target.value)}
                  className="flex-1 px-2.5 py-1.5 rounded-lg bg-ink-800 border border-ink-600 text-ink-100 text-xs focus:outline-none focus:border-gold-500/50"
                />
                <div className="flex gap-1.5">
                  <button type="submit" disabled={!url.trim()}
                     className="px-2.5 py-1.5 rounded-lg bg-gold-500 hover:bg-gold-400 text-ink-900 text-xs font-medium disabled:opacity-40 disabled:cursor-not-allowed">
                    Save
                  </button>
                  <button type="button" onClick={reset}
                     className="px-2.5 py-1.5 rounded-lg bg-ink-700 hover:bg-ink-600 text-ink-200 text-xs">
                    Cancel
                  </button>
                </div>
              </form>
            )}
          </div>
        </>
      );
    };

    /* Global quick-capture bar — uploads photos to Inbox without tying to a card,
       plus a "Box settings" button that opens BoxSettingsModal directly. */
    const QuickCaptureBar = () => {
      const ctx = useContext(Ctx);
      const inputRef = useRef(null);
      const [busy, setBusy] = useState(false);
      const [showSettings, setShowSettings] = useState(false);
      const [pending, setPending] = useState(null);
      const [err, setErr] = useState(null);

      const trigger = () => {
        setErr(null);
        const { token, expired } = loadBoxToken();
        const folders = loadBoxFolders();
        if (!token || expired || !folders.inbox) { setShowSettings(true); return; }
        inputRef.current?.click();
      };

      const doUpload = async (file) => {
        setBusy(true); setErr(null);
        try {
          const { token } = loadBoxToken();
          const folders = loadBoxFolders();
          const result = await uploadFileToBox(file, folders.inbox, token);
          ctx.showToast?.('Photo uploaded to Box Inbox');
          // Open the result inline so the user knows it landed
          ctx.setPreviewFile?.({ label: result.name, url: result.sharedUrl });
        } catch (ex) {
          const msg = (ex && ex.message) || 'Upload failed';
          setErr(msg);
          if (/401|token|auth/i.test(msg)) { setPending(file); setShowSettings(true); }
          else ctx.showToast?.(`Upload failed — ${msg.slice(0, 60)}`);
        } finally { setBusy(false); }
      };

      const onFileChange = async (e) => {
        const f = e.target.files?.[0]; e.target.value = '';
        if (f) await doUpload(f);
      };
      const onSettingsSaved = async () => {
        if (pending) { const f = pending; setPending(null); await doUpload(f); }
      };
      return (
        <div className="card p-4 flex flex-wrap items-center gap-3">
          <div className="flex-1 min-w-0">
            <div className="text-[11px] uppercase tracking-wider text-ink-400">Quick capture</div>
            <div className="text-sm text-ink-200 mt-0.5">Snap a photo or upload a file straight to your Box Inbox.</div>
          </div>
          <div className="flex items-center gap-2">
            <button type="button" onClick={trigger} disabled={busy}
              className="btn-primary px-3 py-1.5 rounded-lg text-sm font-medium inline-flex items-center gap-1.5 disabled:opacity-50">
              <Icon name="camera" size={14}/>{busy ? 'Uploading…' : 'Take / upload photo'}
            </button>
            <button type="button" onClick={() => setShowSettings(true)} title="Box settings"
              className="px-2.5 py-1.5 rounded-lg text-sm bg-ink-700 hover:bg-ink-600 text-ink-200 inline-flex items-center gap-1.5">
              <Icon name="gear" size={14}/>Box
            </button>
          </div>
          {err && <div className="w-full text-[11px] text-ember-400">{err}</div>}
          <input ref={inputRef} type="file" accept="image/*" onChange={onFileChange} className="hidden"/>
          {showSettings && <BoxSettingsModal onClose={() => setShowSettings(false)} onSaved={onSettingsSaved} kindHighlight="inbox"/>}
        </div>
      );
    };

    const FilesView = () => {
      const ctx = useContext(Ctx);
      const { state } = ctx;
      const files = state.files || [];
      const grouped = useMemo(() => {
        const out = {};
        files.forEach(f => { (out[f.category] = out[f.category] || []).push(f); });
        return out;
      }, [files]);
      const order = ['Insurance','Property','Vehicles','Planning','Reference'];
      const cats = order.filter(c => grouped[c]).concat(Object.keys(grouped).filter(c => !order.includes(c)));
      return (
        <div className="space-y-7 max-w-5xl">
          <QuickCaptureBar />
          <p className="text-ink-300 text-sm hidden md:block max-w-2xl">Direct links to source documents — Box folders, manuals, reference sheets. Click to open in a new tab.</p>
          {cats.length === 0 ? (
            <Empty icon="folder" title="No files yet" body="Document links you add will appear here, grouped by topic." />
          ) : cats.map(cat => (
            <section key={cat}>
              <div className="flex items-baseline justify-between mb-3">
                <h2 className="font-display text-xl tracking-tight">{cat}</h2>
                <span className="text-ink-400 text-xs">{grouped[cat].length}</span>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {grouped[cat].map(f => {
                  const embeddable = !!toBoxEmbed(f.url);
                  const Inner = (
                    <>
                      <div className="w-10 h-10 rounded-xl bg-ink-700 grid place-items-center text-gold-400 shrink-0">
                        <Icon name={f.url.includes('/folder/') ? 'folder' : 'link'} size={18} />
                      </div>
                      <div className="min-w-0 flex-1">
                        <div className="text-sm font-medium text-ink-100 group-hover:text-gold-300 truncate">{f.label}</div>
                        {f.notes && <div className="text-ink-300 text-xs mt-0.5 line-clamp-2">{f.notes}</div>}
                        <div className="text-ink-400 text-[11px] mt-1.5 truncate">{(() => { try { return new URL(f.url).hostname; } catch { return f.url; } })()}</div>
                      </div>
                    </>
                  );
                  return embeddable ? (
                    <button key={f.id} type="button" onClick={() => ctx.setPreviewFile(f)}
                       className="card p-4 flex items-start gap-3 hover:border-gold-500/40 transition group text-left">
                      {Inner}
                    </button>
                  ) : (
                    <a key={f.id} href={f.url} target="_blank" rel="noreferrer"
                       className="card p-4 flex items-start gap-3 hover:border-gold-500/40 transition group">
                      {Inner}
                    </a>
                  );
                })}
              </div>
            </section>
          ))}
        </div>
      );
    };

    async function decryptShared(password) {
      const data = Uint8Array.from(atob(ENCRYPTED_BLOB), c => c.charCodeAt(0));
      const salt = data.slice(0, 16);
      const nonce = data.slice(16, 28);
      const ct = data.slice(28);
      const enc = new TextEncoder();
      const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
        km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: nonce }, key, ct);
      return JSON.parse(new TextDecoder().decode(pt));
    }

    const UnlockScreen = ({ onUnlock }) => {
      const [pw, setPw] = useState('');
      const [remember, setRemember] = useState(true);
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      const submit = async (e) => {
        e?.preventDefault();
        if (!pw || busy) return;
        setBusy(true); setErr(null);
        try {
          const state = await decryptShared(pw);
          onUnlock(state, remember, pw);
        } catch (ex) {
          setErr("Password didn't work. Try again.");
          setBusy(false);
        }
      };
      return (
        <div className="min-h-screen relative z-10 flex items-center justify-center px-6">
          <form onSubmit={submit} className="card p-8 md:p-10 w-full max-w-sm anim-in">
            <div className="flex items-center gap-3 mb-6">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 grid place-items-center text-ink-900 font-display font-semibold text-lg">H</div>
              <div>
                <div className="font-display text-xl tracking-tight leading-none">Home HQ</div>
                <div className="text-ink-400 text-[11px] uppercase tracking-wider mt-1">Shared view</div>
              </div>
            </div>
            <div className="text-ink-200 text-sm mb-1">Welcome.</div>
            <div className="text-ink-300 text-sm mb-5">Enter the household password to view.</div>
            <input
              type="password"
              autoFocus
              value={pw}
              onChange={e => setPw(e.target.value)}
              placeholder="Password"
              disabled={busy}
              className="w-full px-3 py-2.5 rounded-xl bg-ink-800 border border-ink-600 text-ink-100 text-sm focus:outline-none focus:border-gold-500/50"
            />
            {err && <div className="text-ember-400 text-xs mt-2">{err}</div>}
            <label className="flex items-center gap-2 mt-4 text-ink-300 text-xs cursor-pointer select-none">
              <input type="checkbox" checked={remember} onChange={e=>setRemember(e.target.checked)}
                style={{width:'1rem', height:'1rem', minHeight:0, accentColor:'#c19654'}} />
              Stay unlocked on this device
            </label>
            <button type="submit" disabled={busy || !pw}
              className="btn-primary w-full mt-4 px-3.5 py-2.5 rounded-xl text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed">
              {busy ? 'Unlocking…' : 'View dashboard'}
            </button>
            <div className="text-ink-500 text-[11px] mt-5 leading-relaxed">
              This is a private view of the McCullum household dashboard. Edits you make are saved on this device only.
            </div>
          </form>
        </div>
      );
    };

    const SharedRoot = () => {
      // "Stay unlocked": after a remembered unlock the decrypted state already lives
      // in this device's localStorage, so skipping the prompt adds no new exposure.
      const [decrypted, setDecrypted] = useState(() => {
        try {
          if (localStorage.getItem('homehq.unlockRemembered') === '1' && localStorage.getItem(STORAGE_KEY)) return true;
        } catch {}
        return null;
      });
      if (!decrypted) return <UnlockScreen onUnlock={(s, remember, pw) => {
        // Auto-populate Finnhub key from baked state if not already set locally
        try {
          if (s._finnhubKey && !localStorage.getItem('homehq.finnhubKey')) {
            localStorage.setItem('homehq.finnhubKey', s._finnhubKey);
          }
          if (remember) {
            localStorage.setItem('homehq.unlockRemembered', '1');
            // household key also unlocks the agent-published updates feed (Refresh button)
            if (pw) localStorage.setItem('homehq.k', btoa(pw));
          }
          else localStorage.removeItem('homehq.unlockRemembered');
        } catch {}
        // Strip the key out of state before saving — keep it in localStorage only
        const stateForApp = { ...s };
        delete stateForApp._finnhubKey;
        window.__SHARED_INIT__ = stateForApp;
        setDecrypted(stateForApp);
      }} />;
      return <App />;
    };

    root.render(<SharedRoot />);
  </script>
