      if (n === 1) return 'tomorrow';

          migrated.appliances = migrated.appliances.map(a => (!a.property && seedById[a.id]?.property) ? { ...a, property: seedById[a.id].property } : a);
        }
        return migrated;
      });
      const [view, setView] = useState('dashboard');
      const [modal, setModal] = useState(null);
      const [previewFile, setPreviewFile] = useState(null);
      const [toast, setToast] = useState(null);
      const [propertyScope, setPropertyScope] = useState(loadScope);

      useEffect(() => { saveState(state); }, [state]);
      useEffect(() => { saveScope(propertyScope); }, [propertyScope]);

      const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(null), 2400); };

      // generic CRUD factory for the new flat-list modules
      const mk = (key) => ({
        add:    (item)        => setState(s => ({...s, [key]:[{...item, id:uid()}, ...(s[key]||[])]})),
        update: (id, patch)   => setState(s => ({...s, [key]: (s[key]||[]).map(x => x.id===id?{...x,...patch}:x)})),
        delete: (id)          => setState(s => ({...s, [key]: (s[key]||[]).filter(x => x.id!==id)})),
      });
      const insOps  = mk('insurance');
      const vehOps  = mk('vehicles');
      const utiOps  = mk('utilities');
      const proOps  = mk('property');
      const subOps  = mk('subscriptions');
      const benOps  = mk('benefits');

      const ctx = {
        state, setState, view, setView, modal, setModal, showToast,
        previewFile, setPreviewFile,
        propertyScope, setPropertyScope,
        // vendors
        addVendor: (v) => setState(s => ({...s, vendors:[{...v, id:uid()}, ...s.vendors]})),
        updateVendor: (id, patch) => setState(s => ({...s, vendors: s.vendors.map(v => v.id===id?{...v,...patch}:v)})),
        deleteVendor: (id) => setState(s => ({...s, vendors: s.vendors.filter(v => v.id!==id)})),
        // maintenance
        addTask: (t) => setState(s => ({...s, maintenance:[{...t, id:uid()}, ...s.maintenance]})),
        updateTask: (id, patch) => setState(s => ({...s, maintenance: s.maintenance.map(t => t.id===id?{...t,...patch}:t)})),
        deleteTask: (id) => setState(s => ({...s, maintenance: s.maintenance.filter(t => t.id!==id)})),
        completeTask: (id) => setState(s => ({...s, maintenance: s.maintenance.map(t => t.id===id ? {...t, lastCompleted: todayISO} : t)})),
        // appliances
        addAppliance: (a) => setState(s => ({...s, appliances:[{...a, id:uid()}, ...s.appliances]})),
        updateAppliance: (id, patch) => setState(s => ({...s, appliances: s.appliances.map(a => a.id===id?{...a,...patch}:a)})),
        deleteAppliance: (id) => setState(s => ({...s, appliances: s.appliances.filter(a => a.id!==id)})),
        // wine
        addBottle: (w) => setState(s => ({...s, wine:[{...w, id:uid()}, ...s.wine]})),
        updateBottle: (id, patch) => setState(s => ({...s, wine: s.wine.map(w => w.id===id?{...w,...patch}:w)})),
        deleteBottle: (id) => setState(s => ({...s, wine: s.wine.filter(w => w.id!==id)})),
        // new modules
        addInsurance: insOps.add, updateInsurance: insOps.update, deleteInsurance: insOps.delete,
        addVehicle: vehOps.add, updateVehicle: vehOps.update, deleteVehicle: vehOps.delete,
        addUtility: utiOps.add, updateUtility: utiOps.update, deleteUtility: utiOps.delete,
        addProperty: proOps.add, updateProperty: proOps.update, deleteProperty: proOps.delete,
        addSubscription: subOps.add, updateSubscription: subOps.update, deleteSubscription: subOps.delete,
        addBenefit: benOps.add, updateBenefit: benOps.update, deleteBenefit: benOps.delete,
        // mark a dashboard item done — applies kind-specific side effect + appends to completedLog
        markDone: (item) => {
          if (!item || !item.kind || !item.id) return;
          const stamp = new Date().toISOString();
          const logEntry = {
            id: uid(),
            kind: item.kind,                      // maint | vendor | warranty | property | sub
            refId: item.id,                       // original entity id
            title: item.title || '',
            sub: item.sub || '',
            originalDue: item.when || '',
            completedAt: stamp,
          };
          setState(s => {
            const next = { ...s, completedLog: [logEntry, ...(s.completedLog || [])] };
            // kind-specific side effects
            if (item.kind === 'maint') {
              next.maintenance = (s.maintenance||[]).map(t => t.id === item.id ? { ...t, lastCompleted: todayISO } : t);
            } else if (item.kind === 'vendor') {
              next.vendors = (s.vendors||[]).map(v => v.id === item.id ? { ...v, lastVisit: todayISO, nextVisit: '' } : v);
            } else if (item.kind === 'warranty') {
              // dismiss the warranty alert without changing the warrantyExpires field
              next.appliances = (s.appliances||[]).map(a => a.id === item.id ? { ...a, warrantyDismissed: true } : a);
            } else if (item.kind === 'property') {
              // clear nextDue so it drops off "coming up"
              next.property = (s.property||[]).map(p => p.id === item.id ? { ...p, nextDue: '' } : p);
            } else if (item.kind === 'sub') {
              // clear renewalDate
              next.subscriptions = (s.subscriptions||[]).map(x => x.id === item.id ? { ...x, renewalDate: '' } : x);
            }
            return next;
          });
          showToast(`Done: ${item.title || 'item'}`);
        },
        undoDone: (logId) => {
          setState(s => {
            const entry = (s.completedLog || []).find(l => l.id === logId);
            if (!entry) return s;
            const next = { ...s, completedLog: (s.completedLog||[]).filter(l => l.id !== logId) };
            // best-effort revert of side effect
            if (entry.kind === 'warranty') {
              next.appliances = (s.appliances||[]).map(a => a.id === entry.refId ? { ...a, warrantyDismissed: false } : a);
            } else if (entry.kind === 'vendor' && entry.originalDue) {
              next.vendors = (s.vendors||[]).map(v => v.id === entry.refId ? { ...v, nextVisit: entry.originalDue } : v);
            }
            // for maint we don't revert lastCompleted — user can edit task to fix
            return next;
          });
          showToast('Undone');
        },
        clearCompleted: () => {
          if (!confirm('Clear the entire completion history? This cannot be undone.')) return;
          setState(s => ({ ...s, completedLog: [] }));
          showToast('History cleared');
        },
        // generic links manipulation (any module that supports a `links` array)
        addLink: (kind, id, link) => {
          if (!link || !link.url) return;
          setState(s => ({
            ...s,
            [kind]: (s[kind]||[]).map(e =>
              e.id === id ? { ...e, links: [...(e.links || []), link] } : e
            )
          }));
        },
        removeLink: (kind, id, idx) => {
          setState(s => ({
            ...s,
            [kind]: (s[kind]||[]).map(e => {
              if (e.id !== id) return e;
              const next = [...(e.links || [])];
              next.splice(idx, 1);
              return { ...e, links: next };
            })
          }));
        },
        // reset
        resetAll: () => { setState(initialState); showToast('Reset to seed data'); },
      };

      return (

            </Shell>
            {modal && <Modal onClose={()=>setModal(null)}>{modal}</Modal>}
            {previewFile && <FilePreviewModal file={previewFile} onClose={()=>setPreviewFile(null)} />}
            {toast && <Toast>{toast}</Toast>}
          </div>
        </Ctx.Provider>
      );
    };

    /* Property scope segmented control */

        return c;

      return (

                return (

                    className={`flex-1 flex flex-col items-center justify-center py-2.5 gap-1 ${active?'text-gold-400':'text-ink-300'}`}>

                      className={`card-soft p-4 flex items-center gap-3 text-left ${view===n.id?'border-gold-400/40':''}`}>
                      <div className="w-10 h-10 rounded-xl bg-ink-700 grid place-items-center text-gold-400 shrink-0">

    };

    /* ---------- shared UI ---------- */

    /* ===================== DASHBOARD ===================== */
    const DashboardView = () => {
      const ctx = useContext(Ctx);
      const { state, setView, setModal } = ctx;
      const scope = ctx.propertyScope;
      const inS = (x) => inScope(x, scope);

      const overdue = useMemo(() => {
        const items = [];
        state.maintenance.forEach(m => {
          if (!inS(m)) return;
          const next = maintenanceNextDue(m);
          const n = daysUntil(next);
          if (n !== null && n < 0) items.push({ kind:'maint', id:m.id, title:m.name, when:next, n });
        });
        state.vendors.forEach(v => {
          if (!inS(v)) return;
          if (v.nextVisit && daysUntil(v.nextVisit) < 0) items.push({ kind:'vendor', id:v.id, title:`${v.serviceType} — ${v.company}`, when:v.nextVisit, n:daysUntil(v.nextVisit), sub:v.name });
        });
        state.appliances.forEach(a => {
          if (!inS(a)) return;
          if (a.warrantyDismissed) return;
          const n = daysUntil(a.warrantyExpires);
          if (n !== null && n < 0) items.push({ kind:'warranty', id:a.id, title:`${a.name} warranty`, when:a.warrantyExpires, n });
        });
        return items.sort((a,b)=>a.n-b.n);
      }, [state, scope]);

      const upcoming = useMemo(() => {
        const items = [];
        state.maintenance.forEach(m => {
          if (!inS(m)) return;
          const next = maintenanceNextDue(m);
          const n = daysUntil(next);
          if (n !== null && n >= 0 && n <= 30) items.push({ kind:'maint', id:m.id, title:m.name, when:next, n, sub:`~$${m.estimatedCost}` });
        });
        state.vendors.forEach(v => {
          if (!inS(v)) return;
          const n = daysUntil(v.nextVisit);
          if (n !== null && n >= 0 && n <= 30) items.push({ kind:'vendor', id:v.id, title:`${v.serviceType} — ${v.company}`, when:v.nextVisit, n, sub:v.name });
        });
        (state.property || []).forEach(p => {
          if (!inS(p)) return;
          const n = daysUntil(p.nextDue);
          if (n !== null && n >= 0 && n <= 30) items.push({ kind:'property', id:p.id, title:p.label, when:p.nextDue, n, sub:p.cadence ? `${p.cadence}${p.amount?` · $${p.amount}`:''}` : '' });
        });
        // subscriptions are personal, not property-bound — show always
        (state.subscriptions || []).forEach(s => {
          const n = daysUntil(s.renewalDate);

/* Live pricing via Finnhub (free tier, 60 req/min, supports CORS).
   Only fetches Stock + ETF symbols — mutual funds rarely covered on free tier;
   money market always trades at $1; private equity has no public quote. */
const FINNHUB_KEY_STORAGE = 'homehq.finnhubKey';
const QUOTES_CACHE_STORAGE = 'homehq.quotes.v1';
const QUOTES_FRESH_MS = 5 * 60 * 1000;  // 5 min freshness

const usePriceQuotes = () => {
  const [apiKey, setApiKey] = useState(() => { try { return localStorage.getItem(FINNHUB_KEY_STORAGE) || ''; } catch { return ''; } });
  const [quotes, setQuotes] = useState(() => {
    try { return JSON.parse(localStorage.getItem(QUOTES_CACHE_STORAGE) || '{}'); } catch { return {}; }
  });
  const [loading, setLoading] = useState(false);
  const [progress, setProgress] = useState({ done: 0, total: 0 });
  const [error, setError] = useState(null);

  const setKey = (key) => {
    setApiKey(key);
    try { if (key) localStorage.setItem(FINNHUB_KEY_STORAGE, key); else localStorage.removeItem(FINNHUB_KEY_STORAGE); } catch {}
  };

  const refresh = async (symbols) => {
    if (!apiKey) { setError('Need a Finnhub API key — open Settings.'); return; }
    if (!symbols.length) return;
    setLoading(true); setError(null); setProgress({ done: 0, total: symbols.length });
    const next = { ...quotes };
    const failed = [];
    // Finnhub allows ~30 req/sec, 60/min on free tier. Batch 25 in parallel, 1.2s between batches.
    const BATCH = 25, GAP_MS = 1200;
    for (let i = 0; i < symbols.length; i += BATCH) {
      const slice = symbols.slice(i, i + BATCH);
      await Promise.all(slice.map(async sym => {
        try {
          const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(sym)}&token=${apiKey}`);
          if (!r.ok) { failed.push(sym); return; }
          const j = await r.json();
          // Finnhub returns {c:0} for unknown symbols
          if (typeof j.c === 'number' && j.c > 0) {
            next[sym] = { price: j.c, change: j.d, pctChange: j.dp, asOf: Date.now() };
          } else {
            failed.push(sym);
          }
        } catch (e) { failed.push(sym); }
      }));
      setProgress({ done: Math.min(i + BATCH, symbols.length), total: symbols.length });
      if (i + BATCH < symbols.length) await new Promise(r => setTimeout(r, GAP_MS));
    }
    setQuotes(next);
    try { localStorage.setItem(QUOTES_CACHE_STORAGE, JSON.stringify(next)); } catch {}
    setLoading(false);
    if (failed.length) setError(`Couldn't quote ${failed.length} symbol${failed.length===1?'':'s'} (often mutual funds / inactive).`);
  };

  const clearQuotes = () => {
    setQuotes({});
    try { localStorage.removeItem(QUOTES_CACHE_STORAGE); } catch {}
  };

  return { apiKey, setKey, quotes, refresh, loading, progress, error, clearQuotes };
};

        <span className={`w-2 h-2 rounded-full ${quotedCount > 0 ? 'bg-sage-400 animate-pulse' : 'bg-ink-500'}`}/>
        <span className="text-xs text-ink-200 font-medium">
          {quotedCount > 0 ? `Live · ${quotedCount}/${fetchableSymbols.length} quoted${ageStr ? ' · ' + ageStr : ''}` : 'Snapshot prices'}
        </span>
      </div>
      <div className="flex-1"/>
      {loading && (
        <div className="flex items-center gap-2 text-xs text-ink-400">
          <div className="w-32 h-1 bg-ink-700 rounded overflow-hidden">
            <div className="h-full bg-gold-400 transition-all" style={{width: progress.total ? (progress.done / progress.total * 100) + '%' : '0%'}}/>
          </div>
          {progress.done}/{progress.total}
        </div>
      )}
      <button onClick={onOpenSettings} title="Pricing settings"
         className="w-8 h-8 rounded-lg grid place-items-center text-ink-300 hover:bg-ink-700">
        <Icon name="filter" size={14} />
      </button>
      <button onClick={() => refresh(fetchableSymbols)} disabled={loading}
         className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${
           loading ? 'bg-ink-700 text-ink-400 cursor-wait' :
           apiKey ? 'bg-gradient-to-b from-gold-400 to-gold-500 text-ink-900 hover:from-gold-300' :
           'bg-ink-700 text-ink-200 hover:bg-ink-600'
         }`}>
        {loading ? 'Refreshing…' : apiKey ? (quotedCount > 0 ? 'Refresh' : 'Get live prices') : 'Set up live prices'}
      </button>
      {error && <div className="w-full text-[11px] text-ember-400">{error}</div>}
    </div>
  );
};

const PortfolioView = () => {
  const [scope, setScope] = useState('__all__');
  const [showSettings, setShowSettings] = useState(false);
  const priceState = usePriceQuotes();
  const d = PORTFOLIO_DATA;
  const accounts = ['__all__', ...d.accounts.map(a => a.name)];

  // Symbols we can quote on the free tier (Stock + ETF; skip MF/MMF/PE)
  const fetchableSymbols = useMemo(() => {
    const s = new Set();
    d.holdings.forEach(h => { if (h.securityType === 'Stock' || h.securityType === 'ETF') s.add(h.symbol); });
    return Array.from(s).sort();
  }, []);

  // Apply live quotes to holdings (overlay; baseline preserved)
  const liveHoldings = useMemo(() => {
    return d.holdings.map(h => {
      const q = priceState.quotes[h.symbol];
      if (q && (h.securityType === 'Stock' || h.securityType === 'ETF') && h.quantity != null) {
        const liveValue = q.price * h.quantity;
        const live = {
          ...h,
          baselineValue: h.value,
          baselinePrice: h.price,
          value: liveValue,
          price: q.price,
          livePctChange: q.pctChange,
          live: true,
        };
        // Recompute unrealized G/L from live value if cost basis present
        if (h.costBasis != null) {
          live.unrealizedGL = liveValue - h.costBasis;
          live.unrealizedGLPct = h.costBasis ? (live.unrealizedGL / h.costBasis * 100) : null;
        }
        return live;
      }
      return h;
    });
  }, [priceState.quotes]);

  const rows = useMemo(() => scope === '__all__' ? liveHoldings : liveHoldings.filter(h => h.account === scope), [scope, liveHoldings]);
  const total = useMemo(() => rows.reduce((s,h) => s + (h.value||0), 0), [rows]);
  const baselineTotal = useMemo(() => rows.reduce((s,h) => s + (h.baselineValue != null ? h.baselineValue : (h.value||0)), 0), [rows]);
  const liveDelta = total - baselineTotal;
  const isLive = Object.keys(priceState.quotes).length > 0;

  const aggBy = (key) => {
    const m = {};
    rows.forEach(r => { const k = r[key] || 'Other'; m[k] = (m[k]||0) + (r.value||0); });
    return Object.entries(m).map(([key,value]) => ({key, value, pct: total ? value/total : 0})).sort((a,b) => b.value - a.value);
  };

  const ac = aggBy('assetClass').sort((a,b) => PORTFOLIO_AC_ORDER.indexOf(a.key) - PORTFOLIO_AC_ORDER.indexOf(b.key));
  const st = aggBy('securityType');

  const top10 = useMemo(() => {
    const m = {};
    rows.forEach(h => { if (!m[h.symbol]) m[h.symbol] = { symbol:h.symbol, value:0 }; m[h.symbol].value += (h.value||0); });
    return Object.values(m).sort((a,b) => b.value - a.value).slice(0, 10);
  }, [rows]);

  const stocks = rows.filter(h => h.securityType === 'Stock');
  const stockTot = stocks.reduce((s,h) => s + (h.value||0), 0) || 1;
  const sectors = (() => {
    const m = {};
    stocks.forEach(h => { const k = h.sector || 'Other'; m[k] = (m[k]||0) + (h.value||0); });
    return Object.entries(m).map(([key,value]) => ({key, value, pct: value/stockTot})).sort((a,b) => b.value - a.value);
  })();

  const pltrVal = rows.filter(h => h.symbol === 'PLTR').reduce((s,h) => s + (h.value||0), 0);
  const amznVal = rows.filter(h => h.symbol === 'AMZN').reduce((s,h) => s + (h.value||0), 0);
  const cashVal = rows.filter(h => h.assetClass === 'Cash & Equivalents').reduce((s,h) => s + (h.value||0), 0);
  const fiVal   = rows.filter(h => h.assetClass === 'Fixed Income').reduce((s,h) => s + (h.value||0), 0);
  const sub5k   = rows.filter(h => (h.value||0) > 0 && (h.value||0) < 5000).length;
  const ugl     = rows.reduce((s,h) => s + (h.unrealizedGL||0), 0);

  const sortedHoldings = [...rows].sort((a,b) => (b.value||0) - (a.value||0));
  const isAll = scope === '__all__';

  return (
    <div className="space-y-6 max-w-6xl">
      {showSettings && <PriceSettingsModal priceState={priceState} onClose={() => setShowSettings(false)} />}

      <div>
        <p className="text-ink-300 text-sm max-w-2xl">
          Merrill Lynch — snapshot total {fmtMoney(d.totalValue)} across {d.numAccounts} accounts · {d.holdings.length} positions · as of {d.asOf}.
        </p>
        {isLive && (
          <div className="mt-2 flex items-baseline gap-3 flex-wrap">
            <span className="font-display text-2xl text-ink-100 tabular-nums">{fmtMoney(total)}</span>
            <span className="text-xs text-ink-400">live total{scope === '__all__' ? '' : ` · ${scope}`}</span>
            {Math.abs(liveDelta) >= 1 && (
              <span className={`text-xs tabular-nums ${liveDelta >= 0 ? 'text-sage-400' : 'text-ember-400'}`}>
                {liveDelta >= 0 ? '+' : ''}{fmtMoneyK(liveDelta)} vs snapshot
                {baselineTotal ? ` (${(liveDelta / baselineTotal * 100).toFixed(2)}%)` : ''}
              </span>
            )}
          </div>
        )}
      </div>

      {/* Live pricing controls */}
      <PortfolioPriceBar priceState={priceState} fetchableSymbols={fetchableSymbols} onOpenSettings={() => setShowSettings(true)} />

      {/* Account scope pills */}
      <div className="flex gap-2 overflow-x-auto no-bar -mx-1 px-1">
        {accounts.map(a => (
          <button key={a} onClick={() => setScope(a)}
             className={`shrink-0 px-3.5 py-1.5 rounded-full text-xs font-medium border transition whitespace-nowrap ${
               scope === a
                 ? 'bg-gradient-to-b from-gold-400 to-gold-500 border-gold-500 text-ink-900'
                 : 'border-ink-600 text-ink-200 hover:bg-ink-800'
             }`}>
            {a === '__all__' ? 'All Accounts' : a}
          </button>
        ))}
      </div>

      {/* Stats row */}
      <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
        <PortfolioStat label="Scope value" value={fmtMoneyK(total)} />
        <PortfolioStat label="Positions" value={rows.length.toLocaleString()} />
        <PortfolioStat label="Cash & MMF" value={fmtMoneyK(cashVal) + ' · ' + ((total ? cashVal/total*100 : 0)).toFixed(0) + '%'} tone={cashVal/total > 0.15 ? 'soon' : 'muted'} />
        <PortfolioStat label="PLTR + AMZN" value={fmtPct((pltrVal+amznVal)/total*100)} tone={(pltrVal+amznVal)/total > 0.25 ? 'overdue' : 'muted'} />
        <PortfolioStat label="Unrealized G/L" value={(ugl >= 0 ? '+' : '') + fmtMoneyK(ugl)} tone={ugl >= 0 ? 'ok' : 'overdue'} />
      </div>

      {/* Two-column area */}
      <div className="grid lg:grid-cols-2 gap-4">
        {/* Accounts overview (always shown, full data) */}
        <div className="card p-4 md:p-5 lg:col-span-2">
          <SectionHeader title="Accounts" hint="Tap a pill above to scope the rest of this view to one account." />
          <div className="overflow-x-auto -mx-1">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-[11px] uppercase tracking-wider text-ink-400">
                  <th className="text-left font-medium pb-2 px-1">Account</th>
                  <th className="text-left font-medium pb-2 px-1">Tax</th>
                  <th className="text-right font-medium pb-2 px-1">Value</th>
                  <th className="text-right font-medium pb-2 px-1">% Port</th>
                  <th className="text-right font-medium pb-2 px-1">Pos</th>
                  <th className="text-left font-medium pb-2 px-1 min-w-[140px]">Mix</th>
                </tr>
              </thead>
              <tbody>
                {d.accounts.map(a => {
                  const eqP = (a.assetClass['Equity']||0)/a.value*100;
                  const caP = (a.assetClass['Cash & Equivalents']||0)/a.value*100;
                  const flagEq = a.name === 'Conservative Legacy' && eqP >= 85;
                  const flagCa = a.name === 'Justin IRA' && caP >= 50;
                  return (
                    <tr key={a.accountNum} className="border-t border-ink-700">
                      <td className="py-2 px-1">
                        <div className="font-medium text-ink-100">{a.name}</div>
                        <div className="text-[11px] text-ink-400">{a.accountNum}</div>
                      </td>
                      <td className="py-2 px-1 text-ink-300">{a.taxType}</td>
                      <td className="py-2 px-1 text-right tabular-nums text-ink-100">{fmtMoneyK(a.value)}</td>
                      <td className="py-2 px-1 text-right tabular-nums text-ink-300">{(a.weight*100).toFixed(1)}%</td>
                      <td className="py-2 px-1 text-right tabular-nums text-ink-300">{a.positions}</td>
                      <td className="py-2 px-1">
                        <div className="flex h-2.5 rounded overflow-hidden bg-ink-700/50">
                          {PORTFOLIO_AC_ORDER.filter(k => a.assetClass[k]).map(k => {
                            const p = (a.assetClass[k]||0)/a.value*100;
                            return <div key={k} style={{width: p+'%', background: PORTFOLIO_AC_COLORS[k]}} title={`${k} ${p.toFixed(0)}%`} />;
                          })}
                        </div>
                        <div className="text-[10px] mt-1 text-ink-400">
                          <span className={flagEq?'text-ember-400':''}>Eq {eqP.toFixed(0)}%</span>
                          {' · '}
                          <span className={flagCa?'text-ember-400':''}>Cash {caP.toFixed(0)}%</span>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>

        {/* Key Concentrations */}
        {(d.keyPositions && (d.keyPositions.PLTR || d.keyPositions.AMZN)) && (
          <div className="card p-4 md:p-5 lg:col-span-2 border-ember-500/20 bg-ember-500/5">
            <SectionHeader title="Key Concentrations" hint="Single-position risk." />
            <div className="grid md:grid-cols-2 gap-3">
              {['PLTR','AMZN'].map(sym => {
                const positions = (d.keyPositions||{})[sym] || [];
                if (!positions.length) return null;
                const tv = positions.reduce((s,r) => s + (r.value||0), 0);
                const tg = positions.reduce((s,r) => s + (r.unrealizedGL||0), 0);
                const tq = positions.reduce((s,r) => s + (r.quantity||0), 0);
                return (
                  <div key={sym} className="rounded-xl border border-ember-500/30 bg-ember-500/8 p-4">
                    <div className="flex items-baseline gap-2">
                      <div className="font-display text-lg font-semibold">{sym}</div>
                      <div className="text-ink-300 text-xs">{(tv/d.totalValue*100).toFixed(1)}% of portfolio</div>
                    </div>
                    <div className="text-[11px] text-ink-400 mt-2 space-y-0.5">
                      {positions.map((r,i) => <div key={i}>{r.account} ({r.taxType}) — {fmtMoneyK(r.value)}</div>)}
                    </div>
                    <div className="mt-3 flex items-center justify-between text-sm">
                      <span className="text-ink-300">{tq.toLocaleString()} sh</span>
                      <span className="text-ink-100 tabular-nums">{fmtMoney(tv)}</span>
                    </div>
                    <div className="flex items-center justify-between text-sm mt-1">
                      <span className="text-ink-400 text-xs">Unrealized gain</span>
                      <span className="text-sage-400 tabular-nums">+{fmtMoney(tg)}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Asset Class Mix (scope-aware) */}
        <div className="card p-4 md:p-5 lg:col-span-2">
          <SectionHeader title="Asset Class Mix" hint={isAll ? 'Across all accounts.' : `Within ${scope}.`} />
          <div className="flex h-7 rounded overflow-hidden">
            {ac.map(x => {
              const p = x.pct*100;
              return <div key={x.key} style={{width: p+'%', background: PORTFOLIO_AC_COLORS[x.key]||'#5a554c'}}
                className="text-[10px] text-ink-900 px-1.5 flex items-center font-medium overflow-hidden whitespace-nowrap"
                title={`${x.key} ${p.toFixed(1)}%`}>
                {p > 8 ? `${x.key} ${p.toFixed(0)}%` : ''}
              </div>;
            })}
          </div>
          <div className="mt-2 flex flex-wrap gap-x-4 gap-y-1 text-[11px] text-ink-300">
            {ac.map(x => (
              <span key={x.key} className="inline-flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-sm" style={{background: PORTFOLIO_AC_COLORS[x.key]||'#5a554c'}}/>
                {x.key} {(x.pct*100).toFixed(1)}%
              </span>
            ))}
          </div>
        </div>

        {/* Top 10 Positions */}
        <div className="card p-4 md:p-5">
          <SectionHeader title="Top 10 Positions" hint={isAll ? '' : `Within ${scope}.`} />
          <div className="space-y-1.5">
            {top10.map(h => {
              const max = top10[0]?.value || 1;
              const w = h.value/max*100;
              const hot = h.symbol === 'PLTR' || h.symbol === 'AMZN';
              return (
                <div key={h.symbol} className="flex items-center gap-2.5 text-xs">
                  <div className="w-14 font-medium">{h.symbol}</div>
                  <div className="flex-1 h-2.5 rounded bg-ink-700/50 overflow-hidden">
                    <div style={{width: w+'%'}} className={`h-full ${hot ? 'bg-ember-500' : 'bg-gold-400'}`}/>
                  </div>
                  <div className="w-28 text-right tabular-nums text-ink-300">
                    {fmtMoneyK(h.value)} · {(h.value/total*100).toFixed(1)}%
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Security Type */}
        <div className="card p-4 md:p-5">
          <SectionHeader title="Security Type" hint={isAll ? '' : `Within ${scope}.`} />
          <div className="space-y-1.5">
            {st.map(x => {
              const max = st[0]?.value || 1;
              const w = x.value/max*100;
              return (
                <div key={x.key} className="flex items-center gap-2.5 text-xs">
                  <div className="w-24 text-ink-300">{x.key}</div>
                  <div className="flex-1 h-2.5 rounded bg-ink-700/50 overflow-hidden">
                    <div style={{width: w+'%', background: PORTFOLIO_ST_COLORS[x.key]||'#5a554c'}} className="h-full"/>
                  </div>
                  <div className="w-28 text-right tabular-nums text-ink-300">
                    {fmtMoneyK(x.value)} · {(x.pct*100).toFixed(1)}%
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Stock sector exposure */}
        <div className="card p-4 md:p-5">
          <SectionHeader title="Stock Sectors" hint={`Across ${stocks.length} individual stocks.`} />
          <table className="w-full text-xs">
            <thead className="text-ink-400 text-[10px] uppercase tracking-wider">
              <tr><th className="text-left pb-1.5">Sector</th><th className="text-right pb-1.5">Value</th><th className="text-right pb-1.5">% Stocks</th></tr>
            </thead>
            <tbody>
              {sectors.map(x => (
                <tr key={x.key} className="border-t border-ink-700">
                  <td className="py-1.5 text-ink-200">{x.key}</td>
                  <td className="py-1.5 text-right tabular-nums text-ink-300">{fmtMoneyK(x.value)}</td>
                  <td className="py-1.5 text-right tabular-nums text-ink-300">{(x.pct*100).toFixed(1)}%</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        {/* Tax-Loss Harvest */}
        <div className="card p-4 md:p-5">
          <SectionHeader title="Tax-Loss Harvest"
             hint={`Taxable accounts only · ${fmtMoneyK((d.taxableLosers||[]).reduce((s,x) => s + (x.unrealizedGL||0), 0))} harvestable.`} />

                  <td className="py-1.5 font-medium">{x.symbol}</td>
                  <td className="py-1.5 text-right tabular-nums text-ink-300">{fmtMoneyK(x.value)}</td>
                  <td className="py-1.5 text-right tabular-nums text-ember-400">{fmtMoney(x.unrealizedGL)}</td>
                  <td className="py-1.5 text-right tabular-nums text-ember-400">{x.unrealizedGLPct != null ? x.unrealizedGLPct.toFixed(1)+'%' : '—'}</td>

            </tbody>
          </table>

    /* ====================== DONE / COMPLETED LOG ====================== */
    const DoneView = () => {
      const ctx = useContext(Ctx);
      const log = ctx.state.completedLog || [];
      const [filter, setFilter] = useState('all');

      const filtered = useMemo(() => {
        return filter === 'all' ? log : log.filter(l => l.kind === filter);
      }, [log, filter]);

      // Group by relative bucket
      const buckets = useMemo(() => {
        const out = { 'Today': [], 'This week': [], 'This month': [], 'Earlier': [] };
        const now = new Date();
        const startOfDay = new Date(now); startOfDay.setHours(0,0,0,0);
        const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate() - now.getDay()); startOfWeek.setHours(0,0,0,0);
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
        filtered.forEach(l => {
          const d = new Date(l.completedAt);
          if (d >= startOfDay) out['Today'].push(l);
          else if (d >= startOfWeek) out['This week'].push(l);
          else if (d >= startOfMonth) out['This month'].push(l);
          else out['Earlier'].push(l);
        });
        return out;
      }, [filtered]);

      const KIND_LABELS = { maint:'Maintenance', vendor:'Vendor', warranty:'Warranty', property:'Property', sub:'Subscription' };
      const KIND_ICONS  = { maint:'wrench', vendor:'users', warranty:'cube', property:'key', sub:'receipt' };

      const counts = useMemo(() => {
        const c = { all: log.length };
        log.forEach(l => { c[l.kind] = (c[l.kind]||0) + 1; });
        return c;
      }, [log]);

      const kinds = ['all', ...Object.keys(KIND_LABELS).filter(k => counts[k])];

      return (
        <div className="space-y-5 max-w-4xl">
          <div className="flex items-baseline justify-between gap-3 flex-wrap">
            <p className="text-ink-300 text-sm max-w-2xl">
              Running history of items checked off the dashboard. {log.length} total · most recent first.
            </p>
            {log.length > 0 && (
              <button onClick={ctx.clearCompleted} className="text-ink-400 hover:text-ember-400 text-xs underline-offset-2 hover:underline transition">
                Clear history
              </button>
            )}
          </div>

          {log.length === 0 ? (
            <Empty icon="check" title="Nothing completed yet"
              body="When you tick the round checkbox on overdue or upcoming items, they'll be logged here." />
          ) : (
            <>
              <div className="flex gap-2 overflow-x-auto no-bar -mx-1 px-1">
                {kinds.map(k => (
                  <button key={k} onClick={() => setFilter(k)}
                     className={`shrink-0 px-3 py-1.5 rounded-full text-xs border transition whitespace-nowrap ${
                       filter === k ? 'bg-ink-100 text-ink-900 border-ink-100' : 'border-ink-600 text-ink-200 hover:bg-ink-800'
                     }`}>
                    {k === 'all' ? `All · ${counts.all}` : `${KIND_LABELS[k]} · ${counts[k]}`}
                  </button>
                ))}
              </div>

              {Object.entries(buckets).filter(([_,items]) => items.length > 0).map(([bucket, items]) => (
                <section key={bucket}>
                  <div className="text-[11px] uppercase tracking-[0.18em] text-ink-400 mb-2.5">{bucket}</div>
                  <div className="space-y-2">
                    {items.map(l => {
                      const d = new Date(l.completedAt);
                      const when = d.toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
                      return (
                        <div key={l.id} className="card p-3 md:p-4 flex items-start gap-3 group">
                          <div className="w-7 h-7 rounded-full bg-sage-400/15 grid place-items-center text-sage-400 shrink-0 mt-0.5">
                            <Icon name="check" size={13} />
                          </div>
                          <div className="w-9 h-9 rounded-lg bg-ink-700 grid place-items-center text-ink-300 shrink-0">
                            <Icon name={KIND_ICONS[l.kind]||'dot'} size={15} />
                          </div>
                          <div className="min-w-0 flex-1">
                            <div className="text-sm text-ink-100 line-through decoration-ink-500/40 decoration-1">{l.title}</div>
                            {l.sub && <div className="text-ink-400 text-xs mt-0.5 truncate">{l.sub}</div>}
                            <div className="text-ink-400 text-[11px] mt-1">
                              <span className="uppercase tracking-wider">{KIND_LABELS[l.kind]||l.kind}</span> · {when}
                              {l.originalDue && <span className="text-ink-500"> · was due {fmtDate(l.originalDue,{month:'short',day:'numeric'})}</span>}
                            </div>
                          </div>
                          <button onClick={() => ctx.undoDone(l.id)} title="Undo"
                             className="opacity-0 group-hover:opacity-100 transition text-ink-400 hover:text-gold-300 text-xs px-2 py-1">
                            Undo
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </section>
              ))}
            </>
          )}
        </div>
      );
    };

    const TaskCard = ({ m, onEdit }) => {

      const setFreq = (k, val) => setT(prev => ({...prev, freq: {...prev.freq, [k]: val}}));
      const save = () => {
        if (isNew) ctx.addTask(t); else ctx.updateTask(task.id, t);
        ctx.showToast(isNew?'Task added':'Task updated');

      const vendors = ctx.state.vendors;

        <>
          <ModalHeader title={isNew?'Add maintenance task':'Edit task'} subtitle={isNew?'Recurring big-ticket items.':t.name} onClose={onClose} />

            <div><label>Task name</label><input value={t.name} onChange={e=>setField('name', e.target.value)} placeholder="e.g. Gutter cleaning"/></div>
            <div className="grid grid-cols-2 gap-3">
              <div><label>Every</label><input type="number" min="1" value={t.freq.count} onChange={e=>setFreq('count', Math.max(1, +e.target.value))}/></div>

            {!isNew ? <Btn variant="danger" icon="trash" onClick={remove}>Delete</Btn> : <span/>}

              <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
              <Btn icon="check" onClick={save}>{isNew?'Add task':'Save'}</Btn>
            </div>
          </div>
        </>
      );
    };

    const Timeline = ({ tasks, onPick }) => {
      const months = useMemo(() => {
        const arr = [];
        const start = new Date(today().getFullYear(), today().getMonth(), 1);
        for (let i=0; i<12; i++) {
          const m = new Date(start.getFullYear(), start.getMonth()+i, 1);
          arr.push(m);
        }
        return arr;
      }, []);
      const buckets = useMemo(() => {
        const map = months.map(()=>[]);
        tasks.forEach(t => {
          const next = maintenanceNextDue(t); if (!next) return;
          const d = parseDate(next);
          months.forEach((m, i) => {
            const end = new Date(m.getFullYear(), m.getMonth()+1, 1);
            if (d >= m && d < end) map[i].push(t);
          });
        });
        return map;
      }, [tasks, months]);
      const totalCost = (mIdx) => buckets[mIdx].reduce((acc,t)=>acc + (t.estimatedCost||0), 0);
      return (
        <div className="card p-4 md:p-5">
          <div className="text-ink-300 text-xs mb-3">Next 12 months — clusters help with budget planning. Tap a task to edit.</div>
          <div className="space-y-3">
            {months.map((m, i) => (
              <div key={i} className="flex gap-4 items-start">
                <div className="w-20 md:w-24 shrink-0 pt-1">
                  <div className="text-ink-100 text-sm font-medium">{m.toLocaleDateString(undefined,{month:'short'})}</div>
                  <div className="text-ink-400 text-[11px]">{m.getFullYear()}</div>
                  {totalCost(i) > 0 && <div className="text-gold-400 text-[11px] mt-0.5 tabular-nums">~${totalCost(i).toLocaleString()}</div>}
                </div>
                <div className="flex-1 min-h-[2rem] border-l border-dashed border-ink-600 pl-4 py-1">
                  {buckets[i].length === 0 ? (
                    <div className="text-ink-500 text-xs italic">—</div>
                  ) : (
                    <div className="flex flex-wrap gap-1.5">
                      {buckets[i].map(t => {
                        const status = maintenanceStatus(t);
                        return (
                          <button key={t.id} onClick={()=>onPick(t)}
                            className={`text-[12px] px-2.5 py-1 rounded-lg border inline-flex items-center gap-1.5 transition hover:translate-y-[-1px] ${
                              status.tone==='overdue' ? 'border-ember-500/30 text-ember-400 bg-ember-500/10' :
                              status.tone==='soon'    ? 'border-gold-400/30 text-gold-300 bg-gold-400/10' :
                                                        'border-ink-600 text-ink-200 bg-ink-800'
                            }`}>
                            <span className="w-1.5 h-1.5 rounded-full bg-current opacity-70"/>
                            {t.name}
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    /* ===================== APPLIANCES ===================== */
    const AppliancesView = () => {
      const ctx = useContext(Ctx);

        return state.appliances.filter(a => {
          if (!inScope(a, ctx.propertyScope)) return false;
          if (filter !== 'all' && a.room !== filter) return false;
          if (query) {
            const q = query.toLowerCase();
            if (!`${a.name} ${a.brand} ${a.model} ${a.serial||''} ${a.notes||''}`.toLowerCase().includes(q)) return false;
          }
          return true;
        });
      }, [state.appliances, filter, query, ctx.propertyScope]);

      }, [onClose]);

    const LinkChips = ({ links, entityKind, entityId }) => {
      const ctx = useContext(Ctx);
      const [adding, setAdding] = useState(false);
      const [label, setLabel] = useState('');
      const [url, setUrl] = useState('');
      const canEdit = !!(entityKind && entityId && ctx.addLink);
      const hasLinks = links && links.length > 0;
      if (!hasLinks && !canEdit) return null;
      const open = (l, e) => {
        e?.stopPropagation();
        if (toBoxEmbed(l.url)) {
          ctx.setPreviewFile(l);
        } else {
          window.open(l.url, '_blank', 'noopener,noreferrer');
        }
      };
      const reset = () => { setAdding(false); setLabel(''); setUrl(''); };
      const submit = (e) => {
        e?.preventDefault?.();
        const u = (url || '').trim();
        if (!u) return;
        let labelToUse = (label || '').trim();
        if (!labelToUse) {
          // Derive a default label from the URL (Box file/folder/shared-id)
          try {
            const parsed = new URL(u);
            const seg = parsed.pathname.split('/').filter(Boolean);
            labelToUse = seg.length ? `Document ${seg[seg.length-1].slice(0,8)}` : 'Document';
          } catch { labelToUse = 'Document'; }
        }
        ctx.addLink(entityKind, entityId, { label: labelToUse, url: u });
        ctx.showToast?.('Link added');
        reset();
      };
      const removeAt = (idx, e) => {
        e?.stopPropagation();
        if (!canEdit) return;
        ctx.removeLink(entityKind, entityId, idx);
      };
      return (
        <>
          <div className="divider my-4"/>
          <div>
            <div className="text-[11px] uppercase tracking-wider text-ink-400 mb-2">Documents</div>
            <div className="flex flex-wrap gap-1.5 items-center">

                const inlineable = !!toBoxEmbed(l.url);
                return (
                  <span key={i} className="group inline-flex items-center rounded-lg bg-ink-700 hover:bg-ink-600 transition">
                    <button type="button" onClick={(e) => open(l, e)}
                       title={inlineable ? 'Preview inline' : 'Open in Box'}
                       className="inline-flex items-center gap-1.5 pl-2.5 pr-1.5 py-1 text-ink-100 text-xs">
                      <Icon name="link" size={12} className="text-gold-400" />
                      {l.label}
                      {!inlineable && (
                        <span className="text-ink-400 text-[10px] ml-0.5">↗</span>
                      )}
                    </button>
                    {canEdit && (
                      <button type="button" onClick={(e) => removeAt(i, e)}
                         title="Remove link"
                         className="px-1.5 py-1 text-ink-400 opacity-0 group-hover:opacity-100 hover:text-ember-400 transition">
                        <Icon name="x" size={11}/>
                      </button>
                    )}
                  </span>
                );

              {canEdit && !adding && (
                <button type="button" onClick={(e) => { e.stopPropagation(); setAdding(true); }}

                  <Icon name="plus" size={11}/> Add link
                </button>

            </div>
            {canEdit && adding && (

    async function decryptShared(password) {
      const data = Uint8Array.from(atob(ENCRYPTED_BLOB), c => c.charCodeAt(0));
      const salt = data.slice(0, 16);
      const nonce = data.slice(16, 28);
      const ct = data.slice(28);
      const enc = new TextEncoder();
      const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
        km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: nonce }, key, ct);
      return JSON.parse(new TextDecoder().decode(pt));
    }

    const UnlockScreen = ({ onUnlock }) => {
      const [pw, setPw] = useState('');
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      const submit = async (e) => {
        e?.preventDefault();
        if (!pw || busy) return;
        setBusy(true); setErr(null);
        try {
          const state = await decryptShared(pw);
          onUnlock(state);
        } catch (ex) {
          setErr("Password didn't work. Try again.");
          setBusy(false);
        }
      };
      return (
        <div className="min-h-screen relative z-10 flex items-center justify-center px-6">
          <form onSubmit={submit} className="card p-8 md:p-10 w-full max-w-sm anim-in">
            <div className="flex items-center gap-3 mb-6">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 grid place-items-center text-ink-900 font-display font-semibold text-lg">H</div>
              <div>
                <div className="font-display text-xl tracking-tight leading-none">Home HQ</div>
                <div className="text-ink-400 text-[11px] uppercase tracking-wider mt-1">Shared view</div>
              </div>
            </div>
            <div className="text-ink-200 text-sm mb-1">Welcome.</div>
            <div className="text-ink-300 text-sm mb-5">Enter the household password to view.</div>
            <input
              type="password"
              autoFocus
              value={pw}
              onChange={e => setPw(e.target.value)}
              placeholder="Password"
              disabled={busy}
              className="w-full px-3 py-2.5 rounded-xl bg-ink-800 border border-ink-600 text-ink-100 text-sm focus:outline-none focus:border-gold-500/50"
            />
            {err && <div className="text-ember-400 text-xs mt-2">{err}</div>}
            <button type="submit" disabled={busy || !pw}
              className="btn-primary w-full mt-4 px-3.5 py-2.5 rounded-xl text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed">
              {busy ? 'Unlocking…' : 'View dashboard'}
            </button>
            <div className="text-ink-500 text-[11px] mt-5 leading-relaxed">
              This is a private view of the McCullum household dashboard. Edits you make are saved on this device only.
            </div>
          </form>
        </div>
      );
    };

    const SharedRoot = () => {
      const [decrypted, setDecrypted] = useState(null);
      if (!decrypted) return <UnlockScreen onUnlock={(s) => { window.__SHARED_INIT__ = s; setDecrypted(s); }} />;
      return <App />;
    };

    root.render(<SharedRoot />);
  </script>
</body>
</html>
