    const VendorForm = ({ vendor, onClose }) => {
      const ctx = useContext(Ctx);
      const isNew = !vendor;
      const scopeDefault = ctx.propertyScope && ctx.propertyScope !== 'both' ? ctx.propertyScope : '';
      const [v, setV] = useState(vendor || {
        name:'', company:'', serviceType:'', phone:'', email:'', rate:'', property:scopeDefault,
        schedule:{ recurring:false, freq:{count:1, unit:'months'}, dayOfWeek:'' },
        lastVisit:'', nextVisit:'', notes:''
      });
      const setField = (k, val) => setV(prev => ({...prev, [k]: val}));
      const setSched = (k, val) => setV(prev => ({...prev, schedule: {...prev.schedule, [k]: val}}));
      const setFreq = (k, val) => setV(prev => ({...prev, schedule: {...prev.schedule, freq: {...(prev.schedule.freq || {count:1, unit:'months'}), [k]: val}}}));

      const save = () => {
        const payload = {...v};
        if (!payload.schedule.recurring) payload.schedule = {...payload.schedule, recurring:false};
        if (isNew) ctx.addVendor(payload); else ctx.updateVendor(vendor.id, payload);
        ctx.showToast(isNew?'Vendor added':'Vendor updated');
        onClose();

      const remove = () => {
        if (window.confirm(`Delete ${vendor.company}?`)) { ctx.deleteVendor(vendor.id); ctx.showToast('Vendor deleted'); onClose(); }

        <>

              <div><label>Contact name</label><input value={v.name} onChange={e=>setField('name',e.target.value)} placeholder="Maria Castillo"/></div>

            </div>
            <div className="grid grid-cols-2 gap-3">
              <div><label>Phone</label><input type="tel" inputMode="tel" value={v.phone} onChange={e=>setField('phone',e.target.value)} placeholder="+1 415 555 0000"/></div>
              <div><label>Email</label><input type="email" inputMode="email" value={v.email} onChange={e=>setField('email',e.target.value)} placeholder="email@…"/></div>
            </div>
            <div><label>Property</label>
              <select value={v.property||''} onChange={e=>setField('property', e.target.value)}>
                <option value="">Both / unassigned</option>
                <option value="1619 Seattle">1619 Seattle</option>
                <option value="4322 Sun Valley">4322 Sun Valley</option>
              </select>
            </div>
            <div className="card-soft p-3.5">
              <div className="flex items-center justify-between">
                <label className="!mb-0">Recurring schedule</label>
                <button type="button" onClick={()=>setV(prev => ({...prev, schedule: {...prev.schedule, recurring: !prev.schedule.recurring, freq: prev.schedule.freq || {count:1, unit:'months'}}}))}
                  className={`w-11 h-6 rounded-full relative transition ${v.schedule.recurring?'bg-gold-500':'bg-ink-600'}`}>
                  <span className={`absolute top-0.5 ${v.schedule.recurring?'left-[1.4rem]':'left-0.5'} w-5 h-5 rounded-full bg-ink-100 transition-all`}></span>
                </button>
              </div>
              {v.schedule.recurring && (
                <div className="grid grid-cols-3 gap-2 mt-3">
                  <div><label>Every</label><input type="number" min="1" value={v.schedule.freq?.count || 1} onChange={e=>setFreq('count', Math.max(1, +e.target.value))}/></div>
                  <div><label>Unit</label>
                    <select value={v.schedule.freq?.unit || 'months'} onChange={e=>setFreq('unit', e.target.value)}>
                      <option value="days">days</option><option value="weeks">weeks</option><option value="months">months</option><option value="years">years</option>
                    </select>
                  </div>
                  <div><label>Day (opt.)</label>
                    <select value={v.schedule.dayOfWeek} onChange={e=>setSched('dayOfWeek', e.target.value)}>
                      <option value="">—</option>
                      {['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(d=><option key={d} value={d}>{d}</option>)}
                    </select>
                  </div>
                </div>
              )}
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div><label>Last visit</label><input type="date" value={v.lastVisit||''} onChange={e=>setField('lastVisit', e.target.value)}/></div>
              <div><label>Next visit</label><input type="date" value={v.nextVisit||''} onChange={e=>setField('nextVisit', e.target.value)}/></div>
            </div>
            <div><label>Notes</label><textarea rows="3" value={v.notes||''} onChange={e=>setField('notes', e.target.value)} placeholder="Gate code, key location, what they're great/bad at…"/></div>
          </div>
          <div className="px-5 md:px-6 py-4 border-t border-ink-600 flex items-center justify-between gap-2 sticky bottom-0 bg-ink-850/95 backdrop-blur">
            {!isNew ? <Btn variant="danger" icon="trash" onClick={remove}>Delete</Btn> : <span/>}
            <div className="flex gap-2">
              <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
              <Btn icon="check" onClick={save}>{isNew?'Add vendor':'Save'}</Btn>
            </div>
          </div>
        </>
      );

    /* ===================== MAINTENANCE ===================== */
    const MaintenanceView = () => {
      const ctx = useContext(Ctx);
      const { state, setModal } = ctx;
      const [tab, setTab] = useState('list'); // list | timeline
      const [query, setQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('all'); // all | overdue | soon | ok | none

      const sorted = useMemo(() => {
        return filterByScope(state.maintenance, ctx.propertyScope)
          .filter(m => {
            if (query) {
              const hay = `${m.name} ${m.notes||''} ${m.vendorHint||''}`.toLowerCase();
              if (!hay.includes(query.toLowerCase())) return false;
            }
            if (statusFilter !== 'all') {
              const n = daysUntil(maintenanceNextDue(m));
              const tone = n === null ? 'none' : n < 0 ? 'overdue' : n <= 30 ? 'soon' : 'ok';
              if (tone !== statusFilter) return false;
            }
            return true;
          })
          .sort((a,b) => {
            const an = daysUntil(maintenanceNextDue(a)) ?? 9e9;
            const bn = daysUntil(maintenanceNextDue(b)) ?? 9e9;
            return an - bn;
          });
      }, [state.maintenance, ctx.propertyScope, query, statusFilter]);

      const open = (t) => setModal(<TaskForm task={t} onClose={()=>setModal(null)} />);

      return (
        <div className="space-y-5 max-w-5xl">
          <div className="flex items-center justify-between gap-3">
            <p className="text-ink-300 text-sm hidden md:block max-w-2xl">Big-ticket recurring tasks. Mark complete and the next due date rolls forward automatically.</p>
            <Btn icon="plus" onClick={()=>open(null)}>Add task</Btn>
          </div>

          <div className="flex items-center gap-2 flex-wrap">
            <div className="inline-flex rounded-xl border border-ink-600 p-0.5 bg-ink-850">
              <button onClick={()=>setTab('list')}     className={`px-3.5 py-1.5 rounded-lg text-sm inline-flex items-center gap-2 ${tab==='list'?'bg-ink-700 text-ink-100':'text-ink-300'}`}><Icon name="list" size={14}/> List</button>
              <button onClick={()=>setTab('timeline')} className={`px-3.5 py-1.5 rounded-lg text-sm inline-flex items-center gap-2 ${tab==='timeline'?'bg-ink-700 text-ink-100':'text-ink-300'}`}><Icon name="calendar" size={14}/> 12-month timeline</button>
            </div>
            {tab === 'list' && (
              <div className="flex items-center gap-1.5 flex-wrap">
                {[['all','All'],['overdue','Overdue'],['soon','Due soon'],['ok','On track'],['none','No date']].map(([id,label]) => (
                  <button key={id} onClick={()=>setStatusFilter(id)}
                    className={`px-2.5 py-1.5 rounded-full text-xs border transition ${statusFilter===id?'border-gold-400/50 text-gold-300 bg-gold-400/10':'border-ink-600 text-ink-300 hover:text-ink-100'}`}>
                    {label}
                  </button>
                ))}
              </div>
            )}
          </div>

          {tab === 'list' && (
            <input type="search" value={query} onChange={e=>setQuery(e.target.value)}
              placeholder="Search tasks, notes, vendors…" className="max-w-sm" />
          )}

          {tab === 'list' ? (
            sorted.length === 0 ? (
              <Empty icon="wrench" title={query || statusFilter!=='all' ? 'No tasks match' : 'No tasks yet'}
                body={query || statusFilter!=='all' ? 'Try clearing the search or filter.' : 'Add your first recurring task and Home HQ will keep the schedule.'}
                cta={query || statusFilter!=='all'
                  ? <Btn variant="soft" onClick={()=>{setQuery(''); setStatusFilter('all');}}>Clear filters</Btn>
                  : <Btn variant="soft" icon="plus" onClick={()=>open(null)}>Add a task</Btn>} />
            ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              {sorted.map(m => <TaskCard key={m.id} m={m} onEdit={()=>open(m)} />)}
            </div>
            )
          ) : (
            <Timeline tasks={sorted} onPick={(m)=>open(m)} />
          )}
        </div>
      );
    };

    const TaskCard = ({ m, onEdit }) => {
      const ctx = useContext(Ctx);
      const next = maintenanceNextDue(m);
      const status = maintenanceStatus(m);
      const vendor = ctx.state.vendors.find(v => v.company === m.vendorHint);
      return (
        <div className="card p-4 md:p-5">
          <div className="flex items-start justify-between gap-3">
            <div className="min-w-0">
              <div className="text-sm font-medium leading-snug">{m.name}</div>
              <div className="text-ink-300 text-xs mt-0.5">{freqLabel(m.freq)}{m.estimatedCost?` · ~$${m.estimatedCost}`:''}</div>
            </div>
            <button onClick={onEdit} className="w-9 h-9 rounded-lg grid place-items-center text-ink-300 hover:bg-ink-700 shrink-0"><Icon name="edit" size={15}/></button>
          </div>
          <div className="mt-3 flex items-center gap-2 flex-wrap">
            <Pill tone={status.tone} dot>{status.label}</Pill>
            <span className="text-ink-300 text-xs">Last: {fmtDate(m.lastCompleted)}</span>
            <span className="text-ink-400 text-xs">·</span>
            <span className={`text-xs ${daysUntil(next) !== null && daysUntil(next) < 0 ? 'text-ember-400' : 'text-ink-300'}`}>
              {daysUntil(next) !== null && daysUntil(next) < 0 ? `Was due: ${fmtDate(next)}` : `Next: ${fmtDate(next)}`}
            </span>
          </div>
          {(m.notes || vendor || m.vendorHint) && (
            <div className="mt-3 text-ink-300 text-xs leading-relaxed">
              {(vendor || m.vendorHint) && <div className="mb-1"><span className="text-ink-400">Vendor:</span> {vendor?.company || m.vendorHint}</div>}
              {m.notes && <div className="line-clamp-2">{m.notes}</div>}
            </div>
          )}
          <div className="divider my-4"/>
          <div className="flex items-center gap-2">
            <button onClick={()=>{ ctx.completeTask(m.id); ctx.showToast(`Completed: ${m.name}`); }}
              className="flex-1 inline-flex items-center justify-center gap-2 py-2 rounded-lg bg-sage-500/10 text-sage-400 hover:bg-sage-500/15 border border-sage-500/25 text-sm">
              <Icon name="check" size={15}/> Mark complete
            </button>
          </div>
        </div>
      );
    };

    const TaskForm = ({ task, onClose }) => {
      const ctx = useContext(Ctx);
      const isNew = !task;
      const scopeDefault = ctx.propertyScope && ctx.propertyScope !== 'both' ? ctx.propertyScope : '';
      const [t, setT] = useState(task || { name:'', freq:{count:1, unit:'years'}, lastCompleted: toISO(today()), estimatedCost:0, notes:'', vendorHint:'', property:scopeDefault });
      const setField = (k, val) => setT(prev => ({...prev, [k]: val}));
      const setFreq = (k, val) => setT(prev => ({...prev, freq: {...prev.freq, [k]: val}}));
      const save = () => {
        if (isNew) ctx.addTask(t); else ctx.updateTask(task.id, t);
        ctx.showToast(isNew?'Task added':'Task updated');
        onClose();
      };
      const remove = () => { if (window.confirm(`Delete ${task.name}?`)) { ctx.deleteTask(task.id); ctx.showToast('Task deleted'); onClose(); } };
      const vendors = ctx.state.vendors;
      return (
        <>
          <ModalHeader title={isNew?'Add maintenance task':'Edit task'} subtitle={isNew?'Recurring big-ticket items.':t.name} onClose={onClose} />
          <div className="p-5 md:p-6 space-y-4">
            <div><label>Task name</label><input value={t.name} onChange={e=>setField('name', e.target.value)} placeholder="e.g. Gutter cleaning"/></div>
            <div className="grid grid-cols-2 gap-3">
              <div><label>Every</label><input type="number" min="1" value={t.freq.count} onChange={e=>setFreq('count', Math.max(1, +e.target.value))}/></div>
              <div><label>Unit</label>
                <select value={t.freq.unit} onChange={e=>setFreq('unit', e.target.value)}>
                  <option value="days">days</option><option value="weeks">weeks</option><option value="months">months</option><option value="years">years</option>
                </select>
              </div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div><label>Last completed</label><input type="date" value={t.lastCompleted||''} onChange={e=>setField('lastCompleted', e.target.value)}/></div>
              <div><label>Est. cost ($)</label><input type="number" min="0" value={t.estimatedCost||0} onChange={e=>setField('estimatedCost', +e.target.value)}/></div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div><label>Preferred vendor</label>
                <select value={t.vendorHint||''} onChange={e=>setField('vendorHint', e.target.value)}>
                  <option value="">— none —</option>
                  {vendors.map(v => <option key={v.id} value={v.company}>{v.company} · {v.serviceType}</option>)}
                </select>
              </div>
              <div><label>Property</label>
                <select value={t.property||''} onChange={e=>setField('property', e.target.value)}>
                  <option value="">Both / unassigned</option>
                  <option value="1619 Seattle">1619 Seattle</option>
                  <option value="4322 Sun Valley">4322 Sun Valley</option>
                </select>
              </div>
            </div>
            <div><label>Notes</label><textarea rows="3" value={t.notes||''} onChange={e=>setField('notes', e.target.value)} placeholder="Anything specific (paint code, sealant brand, prep, etc.)"/></div>
            {!isNew && (
              <div className="card-soft p-3 flex items-center justify-between">
                <div className="text-ink-300 text-xs">Next due: <span className="text-ink-100">{fmtDate(maintenanceNextDue(t))}</span></div>
                <Btn variant="soft" icon="check" onClick={()=>{ ctx.completeTask(task.id); ctx.showToast('Marked complete'); onClose(); }}>Mark complete now</Btn>
              </div>
            )}
          </div>
          <div className="px-5 md:px-6 py-4 border-t border-ink-600 flex items-center justify-between gap-2 sticky bottom-0 bg-ink-850/95 backdrop-blur">
            {!isNew ? <Btn variant="danger" icon="trash" onClick={remove}>Delete</Btn> : <span/>}
            <div className="flex gap-2">
              <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
              <Btn icon="check" onClick={save}>{isNew?'Add task':'Save'}</Btn>
            </div>
          </div>
        </>
      );
    };

    const Timeline = ({ tasks, onPick }) => {
      const months = useMemo(() => {
        const arr = [];
        const start = new Date(today().getFullYear(), today().getMonth(), 1);
        for (let i=0; i<12; i++) {
          const m = new Date(start.getFullYear(), start.getMonth()+i, 1);
          arr.push(m);
        }
        return arr;
      }, []);
      const buckets = useMemo(() => {
        const map = months.map(()=>[]);
        tasks.forEach(t => {
          const next = maintenanceNextDue(t); if (!next) return;
          const d = parseDate(next);
          // Overdue from a prior month → surface in the current month instead of vanishing
          if (d < months[0]) { map[0].push(t); return; }
          months.forEach((m, i) => {
            const end = new Date(m.getFullYear(), m.getMonth()+1, 1);
            if (d >= m && d < end) map[i].push(t);
          });
        });
        return map;
      }, [tasks, months]);
      const unscheduled = useMemo(() => tasks.filter(t => !maintenanceNextDue(t)), [tasks]);
      const totalCost = (mIdx) => buckets[mIdx].reduce((acc,t)=>acc + (t.estimatedCost||0), 0);
      return (
        <div className="card p-4 md:p-5">
          <div className="text-ink-300 text-xs mb-3">Next 12 months — clusters help with budget planning. Tap a task to edit.</div>
          <div className="space-y-3">
            {months.map((m, i) => (
              <div key={i} className="flex gap-4 items-start">
                <div className="w-20 md:w-24 shrink-0 pt-1">
                  <div className="text-ink-100 text-sm font-medium">{m.toLocaleDateString(undefined,{month:'short'})}</div>
                  <div className="text-ink-400 text-[11px]">{m.getFullYear()}</div>
                  {totalCost(i) > 0 && <div className="text-gold-400 text-[11px] mt-0.5 tabular-nums">~${totalCost(i).toLocaleString()}</div>}
                </div>
                <div className="flex-1 min-h-[2rem] border-l border-dashed border-ink-600 pl-4 py-1">
                  {buckets[i].length === 0 ? (
                    <div className="text-ink-500 text-xs italic">—</div>
                  ) : (
                    <div className="flex flex-wrap gap-1.5">
                      {buckets[i].map(t => {
                        const status = maintenanceStatus(t);
                        return (
                          <button key={t.id} onClick={()=>onPick(t)}
                            className={`text-[12px] px-2.5 py-1 rounded-lg border inline-flex items-center gap-1.5 transition hover:translate-y-[-1px] ${
                              status.tone==='overdue' ? 'border-ember-500/30 text-ember-400 bg-ember-500/10' :
                              status.tone==='soon'    ? 'border-gold-400/30 text-gold-300 bg-gold-400/10' :
                                                        'border-ink-600 text-ink-200 bg-ink-800'
                            }`}>
                            <span className="w-1.5 h-1.5 rounded-full bg-current opacity-70"/>
                            {t.name}
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>
            ))}
            {unscheduled.length > 0 && (
              <div className="flex gap-4 items-start pt-2 border-t border-ink-700">
                <div className="w-20 md:w-24 shrink-0 pt-1">
                  <div className="text-ink-300 text-sm font-medium">No date</div>
                  <div className="text-ink-400 text-[11px]">set last completed</div>
                </div>
                <div className="flex-1 min-h-[2rem] border-l border-dashed border-ink-600 pl-4 py-1">
                  <div className="flex flex-wrap gap-1.5">
                    {unscheduled.map(t => (
                      <button key={t.id} onClick={()=>onPick(t)}
                        className="text-[12px] px-2.5 py-1 rounded-lg border border-ink-600 text-ink-300 bg-ink-800 inline-flex items-center gap-1.5 transition hover:translate-y-[-1px]">
                        <span className="w-1.5 h-1.5 rounded-full bg-current opacity-40"/>
                        {t.name}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    /* ===================== APPLIANCES ===================== */
    const AppliancesView = () => {
      const ctx = useContext(Ctx);
      const { state, setModal } = ctx;
      const [query, setQuery] = useState('');
      const [filter, setFilter] = useState('all');

      const rooms = useMemo(() => {
        const set = new Set(state.appliances.map(a => a.room).filter(Boolean));
        return ['all', ...Array.from(set)];
      }, [state.appliances]);

      const filtered = useMemo(() => {
        return state.appliances.filter(a => {
          if (!inScope(a, ctx.propertyScope)) return false;
          if (filter !== 'all' && a.room !== filter) return false;
          if (query) {
            const q = query.toLowerCase();
            if (!`${a.name} ${a.brand} ${a.model} ${a.serial||''} ${a.notes||''}`.toLowerCase().includes(q)) return false;
          }
          return true;
        });
      }, [state.appliances, filter, query, ctx.propertyScope]);

      const open = (a) => setModal(<ApplianceForm appliance={a} onClose={()=>setModal(null)} />);

      return (
        <div className="space-y-5 max-w-5xl">
          <div className="flex items-center justify-between gap-3">
            <p className="text-ink-300 text-sm hidden md:block max-w-2xl">Major appliances + equipment, with model numbers and warranties. Tap to edit. Photograph the model plate for anything still marked unknown.</p>
            <Btn icon="plus" onClick={()=>open(null)}>Add appliance</Btn>
          </div>
          <div className="flex items-center gap-2">
            <div className="relative flex-1">
              <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-ink-400" />
              <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search appliances, models, serials…" className="!pl-9" />
            </div>
          </div>
          <div className="flex gap-2 overflow-x-auto no-bar -mx-1 px-1">
            {rooms.map(r => (
              <button key={r} onClick={()=>setFilter(r)}
                className={`shrink-0 px-3 py-1.5 rounded-full text-xs border transition ${filter===r ? 'bg-ink-100 text-ink-900 border-ink-100' : 'border-ink-600 text-ink-200 hover:bg-ink-800'}`}>
                {r === 'all' ? 'All rooms' : r}
              </button>
            ))}
          </div>
          {filtered.length === 0 ? (
            <Empty icon="cube" title="No appliances match" body="Try clearing the filter, or add a new appliance." cta={<Btn icon="plus" onClick={()=>open(null)}>Add appliance</Btn>} />
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              {filtered.map(a => <ApplianceCard key={a.id} a={a} onEdit={()=>open(a)} />)}
            </div>
          )}
        </div>
      );
    };

    const ApplianceCard = ({ a, onEdit }) => {
      const ctx = useContext(Ctx);
      const wn = daysUntil(a.warrantyExpires);
      const clean = (s) => (s && !/^\(unknown\)|^\(TBD\)|^\(per /i.test(s)) ? s : '';
      const brand = clean(a.brand), model = clean(a.model);
      return (
        <div className={phCard(a.placeholder) + ' p-4 md:p-5'}>
          <div className="flex items-start justify-between gap-3">
            <div className="min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <div className="text-[11px] uppercase tracking-wider text-ink-400">{a.room || '—'}</div>
                {a.placeholder && <PlaceholderBadge/>}
              </div>
              <div className="font-display text-lg leading-tight mt-0.5">{a.name}</div>

            className={`w-9 h-9 rounded-full border text-sm font-medium transition ${
              n <= value ? 'border-gold-400/60 bg-gold-400/15 text-gold-300' : 'border-ink-600 text-ink-400 hover:text-ink-200'

          </button>

    const OpenBottleForm = ({ bottle, onClose }) => {
      const ctx = useContext(Ctx);
      const [note, setNote] = useState('');
      const [rating, setRating] = useState(0);
      const left = Math.max(0, (bottle.qty || 0) - 1);
      const save = () => { ctx.openBottle(bottle, note.trim(), rating); onClose(); };
      return (
        <>
          <ModalHeader title="We opened one" subtitle={`${bottle.vintage} ${bottle.producer} ${bottle.label}`} onClose={onClose} />
          <div className="p-5 md:p-6 space-y-4">
            <div className="card-soft p-3.5 text-sm text-ink-200">
              {left === 0
                ? 'That was the last bottle — it moves out of the cellar once you log it.'
                : `${left} bottle${left===1?'':'s'} left after this one.`}
            </div>
            <div><label>How was it? (optional)</label>
              <textarea rows="3" autoFocus value={note} onChange={e=>setNote(e.target.value)}
                placeholder="Tasting note — how it showed, what you had it with…"/>
            </div>
            <div><label>Rating (optional)</label><RatingPicker value={rating} onChange={setRating} /></div>
          </div>
          <div className="px-5 md:px-6 py-4 border-t border-ink-600 flex items-center justify-end gap-2 sticky bottom-0 bg-ink-850/95 backdrop-blur">
            <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
            <Btn icon="wine" onClick={save}>Log it</Btn>
          </div>
        </>
      );
    };

    const WineForm = ({ bottle, onClose }) => {
      const ctx = useContext(Ctx);
      const isNew = !bottle;
      const [w, setW] = useState(bottle || {
        producer:'', label:'', varietal:'', vintage:'', region:'',
        qty:1, price:0, drinkStart:'', drinkEnd:'', location:'', notes:'',
      });
      const setField = (k, val) => setW(prev => ({...prev, [k]: val}));
      const save = () => {
        const payload = { ...w,
          vintage: w.vintage ? +w.vintage : '',
          qty: Math.max(0, +w.qty || 0),
          price: +w.price || 0,
          drinkStart: w.drinkStart ? +w.drinkStart : '',
          drinkEnd: w.drinkEnd ? +w.drinkEnd : '',
        };
        if (isNew) ctx.addBottle(payload); else ctx.updateBottle(bottle.id, payload);
        ctx.showToast(isNew ? 'Bottle added' : 'Bottle updated');
        onClose();
      };
      const remove = () => {
        if (window.confirm(`Remove ${w.producer} ${w.label} from the cellar?`)) {
          ctx.deleteBottle(bottle.id); ctx.showToast('Bottle removed'); onClose();
        }
      };
      return (
        <>
          <ModalHeader title={isNew ? 'Add a bottle' : 'Edit bottle'} subtitle={isNew ? 'Takes about 30 seconds.' : `${w.producer} ${w.label}`} onClose={onClose} />
          <div className="p-5 md:p-6 space-y-4">
            <div className="grid grid-cols-2 gap-3">
              <div><label>Producer</label><input value={w.producer} onChange={e=>setField('producer', e.target.value)} placeholder="Caymus"/></div>
              <div><label>Label / cuvée</label><input value={w.label} onChange={e=>setField('label', e.target.value)} placeholder="Napa Valley Cabernet"/></div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div><label>Varietal</label><input value={w.varietal} onChange={e=>setField('varietal', e.target.value)} placeholder="Cabernet Sauvignon"/></div>
              <div><label>Region</label><input value={w.region} onChange={e=>setField('region', e.target.value)} placeholder="Napa Valley"/></div>
            </div>
            <div className="grid grid-cols-3 gap-3">
              <div><label>Vintage</label><input type="number" inputMode="numeric" value={w.vintage} onChange={e=>setField('vintage', e.target.value)} placeholder="2018"/></div>
              <div><label>Qty</label><input type="number" min="0" inputMode="numeric" value={w.qty} onChange={e=>setField('qty', e.target.value)}/></div>
              <div><label>Price ($)</label><input type="number" min="0" inputMode="decimal" value={w.price} onChange={e=>setField('price', e.target.value)}/></div>
            </div>
            <div className="grid grid-cols-3 gap-3">
              <div><label>Drink from</label><input type="number" inputMode="numeric" value={w.drinkStart} onChange={e=>setField('drinkStart', e.target.value)} placeholder="2024"/></div>
              <div><label>Drink until</label><input type="number" inputMode="numeric" value={w.drinkEnd} onChange={e=>setField('drinkEnd', e.target.value)} placeholder="2030"/></div>
              <div><label>Location</label><input value={w.location} onChange={e=>setField('location', e.target.value)} placeholder="Cellar A2"/></div>
            </div>
            <div><label>Notes</label><textarea rows="3" value={w.notes||''} onChange={e=>setField('notes', e.target.value)} placeholder="Where it came from, what to pair it with…"/></div>
          </div>
          <div className="px-5 md:px-6 py-4 border-t border-ink-600 flex items-center justify-between gap-2 sticky bottom-0 bg-ink-850/95 backdrop-blur">
            {!isNew ? <Btn variant="danger" icon="trash" onClick={remove}>Remove</Btn> : <span/>}
            <div className="flex gap-2">
              <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
              <Btn icon="check" onClick={save}>{isNew ? 'Add bottle' : 'Save'}</Btn>
            </div>
          </div>
        </>
      );
    };

    const WineCard = ({ w, onEdit, onOpen }) => {
      const st = wineState(w);
      const meta = WINE_STATE_META[st];
      const empty = (w.qty || 0) <= 0;
      return (
        <div className={`card p-4 md:p-5 ${empty ? 'opacity-60' : ''}`}>
          <div className="flex items-start justify-between gap-3">
            <div className="min-w-0">
              <div className="text-[11px] uppercase tracking-wider text-ink-400">{w.region || '—'}</div>
              <div className="font-display text-lg leading-tight mt-0.5">{w.producer}</div>
              <div className="text-ink-200 text-sm">{w.label}</div>
              <div className="text-ink-300 text-xs mt-1">{w.vintage} · {w.varietal}</div>
            </div>
            <button onClick={onEdit} className="w-9 h-9 rounded-lg grid place-items-center text-ink-300 hover:bg-ink-700 shrink-0"><Icon name="edit" size={15}/></button>
          </div>
          <div className="mt-3 flex items-center gap-2 flex-wrap">
            <Pill tone={meta.tone} dot>
              {st === 'now' ? `peak ${w.drinkStart}–${w.drinkEnd}` : st === 'aging' ? `hold until ${w.drinkStart}` : `past peak (${w.drinkEnd})`}
            </Pill>
            <Pill tone="muted">{empty ? 'none left' : `×${w.qty}`}</Pill>
            {w.location && <span className="text-ink-400 text-xs">{w.location}</span>}
            {w.price ? <span className="text-ink-400 text-xs">${w.price}</span> : null}
          </div>
          {w.notes && <div className="text-ink-300 text-xs mt-3 line-clamp-2 leading-relaxed">{w.notes}</div>}
          <div className="divider my-4"/>
          <button onClick={onOpen} disabled={empty}
            className="w-full inline-flex items-center justify-center gap-2 py-2 rounded-lg bg-gold-400/10 text-gold-300 hover:bg-gold-400/15 border border-gold-400/25 text-sm disabled:opacity-40 disabled:cursor-not-allowed">
            <Icon name="wine" size={15}/> We opened one
          </button>
        </div>
      );
    };

    const WineView = () => {
      const ctx = useContext(Ctx);
      const { state, setModal } = ctx;
      const [filter, setFilter] = useState('all'); // all | now | aging | past
      const [query, setQuery] = useState('');
      const [pickIdx, setPickIdx] = useState(0);

      const bottles = state.wine || [];
      const counts = useMemo(() => {
        const c = { all: bottles.length, now:0, aging:0, past:0 };
        bottles.forEach(w => { c[wineState(w)]++; });
        return c;
      }, [bottles]);

      const filtered = useMemo(() => {
        return bottles
          .filter(w => filter === 'all' || wineState(w) === filter)
          .filter(w => {
            if (!query) return true;
            const hay = `${w.producer} ${w.label} ${w.varietal} ${w.region} ${w.notes||''}`.toLowerCase();
            return hay.includes(query.toLowerCase());
          })
          .sort((a,b) => (a.drinkEnd || 9999) - (b.drinkEnd || 9999));
      }, [bottles, filter, query]);

      // Tonight's pick: in window, in stock, closest to the end of its window,
      // skipping anything opened in the last 7 days so suggestions rotate.
      const picks = useMemo(() => {
        const recentIds = new Set(
          (state.wineLog||[])
            .filter(l => (Date.now() - new Date(l.openedAt).getTime()) < 7*24*3600*1000)
            .map(l => l.wineId)
        );
        const ready = bottles.filter(w => (w.qty||0) > 0 && wineState(w) === 'now');
        const fresh = ready.filter(w => !recentIds.has(w.id));
        return (fresh.length ? fresh : ready).sort((a,b) => (a.drinkEnd || 9999) - (b.drinkEnd || 9999));
      }, [bottles, state.wineLog]);
      const pick = picks.length ? picks[pickIdx % picks.length] : null;

      const openForm  = (w) => setModal(<WineForm bottle={w} onClose={()=>setModal(null)} />);
      const openLog   = (w) => setModal(<OpenBottleForm bottle={w} onClose={()=>setModal(null)} />);
      const recent = (state.wineLog || []).slice(0, 8);

      return (
        <div className="space-y-6 max-w-5xl">
          <div className="flex items-center justify-between gap-3">
            <p className="text-ink-300 text-sm hidden md:block max-w-2xl">The cellar. Log a bottle when you open it and the counts stay honest.</p>
            <Btn icon="plus" onClick={()=>openForm(null)}>Add bottle</Btn>
          </div>

          {/* Tonight's pick */}
          {pick && (
            <div className="card p-5 md:p-6 border-gold-400/25">
              <div className="flex items-start justify-between gap-4 flex-wrap">
                <div className="min-w-0">
                  <div className="text-[11px] uppercase tracking-[0.16em] text-gold-400 mb-1.5">What should we open tonight?</div>
                  <div className="font-display text-xl md:text-2xl leading-tight">{pick.vintage} {pick.producer} <span className="text-ink-200">{pick.label}</span></div>
                  <div className="text-ink-300 text-sm mt-1">
                    {pick.varietal} · {pick.region} · {pick.location}
                    {pick.drinkEnd ? <span className="text-ink-400"> — window closes {pick.drinkEnd}</span> : null}
                  </div>
                  {pick.notes && <div className="text-ink-300 text-xs mt-2 max-w-xl leading-relaxed">{pick.notes}</div>}
                </div>
                <div className="flex gap-2 shrink-0">
                  <Btn variant="ghost" onClick={()=>setPickIdx(i => i + 1)}>Another</Btn>
                  <Btn icon="wine" onClick={()=>openLog(pick)}>Open it</Btn>
                </div>
              </div>
            </div>
          )}

          {/* Filters + search */}
          <div className="flex items-center gap-1.5 flex-wrap">
            {[['all','All'],['now','Drink now'],['aging','Aging'],['past','Past peak']].map(([id,label]) => (
              <button key={id} onClick={()=>setFilter(id)}
                className={`px-2.5 py-1.5 rounded-full text-xs border transition ${filter===id?'border-gold-400/50 text-gold-300 bg-gold-400/10':'border-ink-600 text-ink-300 hover:text-ink-100'}`}>
                {label} <span className="opacity-60 tabular-nums">{counts[id]}</span>
              </button>
            ))}
          </div>
          <input type="search" value={query} onChange={e=>setQuery(e.target.value)}
            placeholder="Search producer, varietal, region…" className="max-w-sm" />

          {/* Bottles */}
          {filtered.length === 0 ? (
            <Empty icon="wine" title={query || filter !== 'all' ? 'No bottles match' : 'The cellar is empty'}
              body={query || filter !== 'all' ? 'Try clearing the search or filter.' : 'Add your first bottle and we’ll track its drink window.'}
              cta={query || filter !== 'all'
                ? <Btn variant="soft" onClick={()=>{setQuery(''); setFilter('all');}}>Clear filters</Btn>
                : <Btn variant="soft" icon="plus" onClick={()=>openForm(null)}>Add a bottle</Btn>} />
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
              {filtered.map(w => <WineCard key={w.id} w={w} onEdit={()=>openForm(w)} onOpen={()=>openLog(w)} />)}
            </div>
          )}

          {/* Recently opened */}
          {recent.length > 0 && (
            <section>
              <SectionHeader title="Recently opened" count={(state.wineLog||[]).length} hint="Tasting log — newest first." />
              <div className="space-y-2">
                {recent.map(l => (
                  <div key={l.id} className="card-soft p-3.5 flex items-start gap-3">
                    <div className="w-9 h-9 rounded-xl bg-ink-700 grid place-items-center text-gold-400 shrink-0"><Icon name="wine" size={16}/></div>
                    <div className="min-w-0 flex-1">
                      <div className="text-sm font-medium">{l.title}</div>
                      <div className="text-ink-400 text-[11px] mt-0.5">
                        {new Date(l.openedAt).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' })}
                        {l.rating ? <span className="text-gold-400"> · {'●'.repeat(l.rating)}{'○'.repeat(5-l.rating)}</span> : null}
                      </div>
                      {l.note && <div className="text-ink-300 text-xs mt-1.5 leading-relaxed">{l.note}</div>}
                    </div>
                  </div>
                ))}
              </div>
            </section>
          )}
        </div>
      );
    };
    // Wrapper class fragment — apply to a card div to give it a dashed/dim look
    const phCard = (isPh, base='card') => `${base}${isPh ? ' border-dashed border-gold-400/30 opacity-90' : ''}`;

    const LinkChips = ({ links, entityKind, entityId }) => {
      const ctx = useContext(Ctx);
      const [adding, setAdding] = useState(false);
      const [label, setLabel] = useState('');
      const [url, setUrl] = useState('');
      const canEdit = !!(entityKind && entityId && ctx.addLink);
      const hasLinks = links && links.length > 0;
      if (!hasLinks && !canEdit) return null;
      const open = (l, e) => {
        e?.stopPropagation();
        if (toBoxEmbed(l.url)) {
          ctx.setPreviewFile(l);
        } else {
          window.open(l.url, '_blank', 'noopener,noreferrer');
        }
      };
      const reset = () => { setAdding(false); setLabel(''); setUrl(''); };
      const submit = (e) => {
        e?.preventDefault?.();
        const u = (url || '').trim();
        if (!u) return;
        let labelToUse = (label || '').trim();
        if (!labelToUse) {
          // Derive a default label from the URL (Box file/folder/shared-id)
          try {
            const parsed = new URL(u);
            const seg = parsed.pathname.split('/').filter(Boolean);
            labelToUse = seg.length ? `Document ${seg[seg.length-1].slice(0,8)}` : 'Document';
          } catch { labelToUse = 'Document'; }
        }
        ctx.addLink(entityKind, entityId, { label: labelToUse, url: u });
        ctx.showToast?.('Link added');
        reset();
      };
      const removeAt = (idx, e) => {
        e?.stopPropagation();
        if (!canEdit) return;
        ctx.removeLink(entityKind, entityId, idx);
      };
      return (
        <>
          <div className="divider my-4"/>
          <div>
            <div className="text-[11px] uppercase tracking-wider text-ink-400 mb-2">Documents</div>
            <div className="flex flex-wrap gap-1.5 items-center">
              {(links || []).map((l, i) => {
                const inlineable = !!toBoxEmbed(l.url);
                return (
                  <span key={i} className="group inline-flex items-center rounded-lg bg-ink-700 hover:bg-ink-600 transition">
                    <button type="button" onClick={(e) => open(l, e)}
                       title={inlineable ? 'Preview inline' : 'Open in Box'}
                       className="inline-flex items-center gap-1.5 pl-2.5 pr-1.5 py-1 text-ink-100 text-xs">
                      <Icon name="link" size={12} className="text-gold-400" />
                      {l.label}
                      {!inlineable && (
                        <span className="text-ink-400 text-[10px] ml-0.5">↗</span>
                      )}
                    </button>
                    {canEdit && (
                      <button type="button" onClick={(e) => removeAt(i, e)}
                         title="Remove link"
                         className="px-1.5 py-1 text-ink-400 md:opacity-0 md:group-hover:opacity-100 hover:text-ember-400 transition">
                        <Icon name="x" size={11}/>
                      </button>
                    )}
                  </span>
                );
              })}
              {canEdit && !adding && (
                <>
                  <button type="button" onClick={(e) => { e.stopPropagation(); setAdding(true); }}
                     className="inline-flex items-center gap-1 px-2 py-1 rounded-lg border border-dashed border-ink-500 text-ink-300 hover:text-gold-300 hover:border-gold-500/50 text-xs transition">
                    <Icon name="plus" size={11}/> Add link
                  </button>
                  <PhotoUploadButton entityKind={entityKind} entityId={entityId} />
                </>
              )}
            </div>
            {canEdit && adding && (
              <form onSubmit={submit} onClick={(e) => e.stopPropagation()}
                 className="mt-2 flex flex-col sm:flex-row gap-2">
                <input
                  autoFocus
                  type="text"
                  placeholder="Label (optional)"
                  value={label}
                  onChange={(e) => setLabel(e.target.value)}
                  className="flex-1 sm:max-w-[180px] px-2.5 py-1.5 rounded-lg bg-ink-800 border border-ink-600 text-ink-100 text-xs focus:outline-none focus:border-gold-500/50"
                />
                <input
                  type="url"
                  placeholder="Box URL (https://app.box.com/file/... or /folder/... or /s/...)"
                  value={url}
                  onChange={(e) => setUrl(e.target.value)}
                  className="flex-1 px-2.5 py-1.5 rounded-lg bg-ink-800 border border-ink-600 text-ink-100 text-xs focus:outline-none focus:border-gold-500/50"
                />
                <div className="flex gap-1.5">
                  <button type="submit" disabled={!url.trim()}
                     className="px-2.5 py-1.5 rounded-lg bg-gold-500 hover:bg-gold-400 text-ink-900 text-xs font-medium disabled:opacity-40 disabled:cursor-not-allowed">
                    Save
                  </button>
                  <button type="button" onClick={reset}
                     className="px-2.5 py-1.5 rounded-lg bg-ink-700 hover:bg-ink-600 text-ink-200 text-xs">
                    Cancel
                  </button>
                </div>
              </form>
            )}
          </div>
        </>
      );
    };

    /* Global quick-capture bar — uploads photos to Inbox without tying to a card,
       plus a "Box settings" button that opens BoxSettingsModal directly. */
    const QuickCaptureBar = () => {
      const ctx = useContext(Ctx);
      const inputRef = useRef(null);
      const [busy, setBusy] = useState(false);
      const [showSettings, setShowSettings] = useState(false);
      const [pending, setPending] = useState(null);
      const [err, setErr] = useState(null);

      const trigger = () => {
        setErr(null);
        const { token, expired } = loadBoxToken();
        const folders = loadBoxFolders();
        if (!token || expired || !folders.inbox) { setShowSettings(true); return; }
        inputRef.current?.click();
      };

      const doUpload = async (file) => {
        setBusy(true); setErr(null);
        try {
          const { token } = loadBoxToken();
          const folders = loadBoxFolders();
          const result = await uploadFileToBox(file, folders.inbox, token);
          ctx.showToast?.('Photo uploaded to Box Inbox');
          // Open the result inline so the user knows it landed
          ctx.setPreviewFile?.({ label: result.name, url: result.sharedUrl });
        } catch (ex) {
          const msg = (ex && ex.message) || 'Upload failed';
          setErr(msg);
          if (/401|token|auth/i.test(msg)) { setPending(file); setShowSettings(true); }
          else ctx.showToast?.(`Upload failed — ${msg.slice(0, 60)}`);
        } finally { setBusy(false); }
      };

      const onFileChange = async (e) => {
        const f = e.target.files?.[0]; e.target.value = '';
        if (f) await doUpload(f);
      };
      const onSettingsSaved = async () => {
        if (pending) { const f = pending; setPending(null); await doUpload(f); }
      };
      return (
        <div className="card p-4 flex flex-wrap items-center gap-3">
          <div className="flex-1 min-w-0">
            <div className="text-[11px] uppercase tracking-wider text-ink-400">Quick capture</div>
            <div className="text-sm text-ink-200 mt-0.5">Snap a photo or upload a file straight to your Box Inbox.</div>
          </div>
          <div className="flex items-center gap-2">
            <button type="button" onClick={trigger} disabled={busy}
              className="btn-primary px-3 py-1.5 rounded-lg text-sm font-medium inline-flex items-center gap-1.5 disabled:opacity-50">
              <Icon name="camera" size={14}/>{busy ? 'Uploading…' : 'Take / upload photo'}
            </button>
            <button type="button" onClick={() => setShowSettings(true)} title="Box settings"
              className="px-2.5 py-1.5 rounded-lg text-sm bg-ink-700 hover:bg-ink-600 text-ink-200 inline-flex items-center gap-1.5">
              <Icon name="gear" size={14}/>Box
            </button>
          </div>
          {err && <div className="w-full text-[11px] text-ember-400">{err}</div>}
          <input ref={inputRef} type="file" accept="image/*" onChange={onFileChange} className="hidden"/>
          {showSettings && <BoxSettingsModal onClose={() => setShowSettings(false)} onSaved={onSettingsSaved} kindHighlight="inbox"/>}
        </div>
      );
    };

    const FilesView = () => {
      const ctx = useContext(Ctx);
      const { state } = ctx;
      const files = state.files || [];
      const grouped = useMemo(() => {
        const out = {};
        files.forEach(f => { (out[f.category] = out[f.category] || []).push(f); });
        return out;
      }, [files]);
      const order = ['Insurance','Property','Vehicles','Planning','Reference'];
      const cats = order.filter(c => grouped[c]).concat(Object.keys(grouped).filter(c => !order.includes(c)));
      return (
        <div className="space-y-7 max-w-5xl">
          <QuickCaptureBar />
          <p className="text-ink-300 text-sm hidden md:block max-w-2xl">Direct links to source documents — Box folders, manuals, reference sheets. Click to open in a new tab.</p>
          {cats.length === 0 ? (
            <Empty icon="folder" title="No files yet" body="Document links you add will appear here, grouped by topic." />
          ) : cats.map(cat => (
            <section key={cat}>
              <div className="flex items-baseline justify-between mb-3">
                <h2 className="font-display text-xl tracking-tight">{cat}</h2>
                <span className="text-ink-400 text-xs">{grouped[cat].length}</span>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {grouped[cat].map(f => {
                  const embeddable = !!toBoxEmbed(f.url);
                  const Inner = (
                    <>
                      <div className="w-10 h-10 rounded-xl bg-ink-700 grid place-items-center text-gold-400 shrink-0">
                        <Icon name={f.url.includes('/folder/') ? 'folder' : 'link'} size={18} />
                      </div>
                      <div className="min-w-0 flex-1">
                        <div className="text-sm font-medium text-ink-100 group-hover:text-gold-300 truncate">{f.label}</div>
                        {f.notes && <div className="text-ink-300 text-xs mt-0.5 line-clamp-2">{f.notes}</div>}
                        <div className="text-ink-400 text-[11px] mt-1.5 truncate">{(() => { try { return new URL(f.url).hostname; } catch { return f.url; } })()}</div>
                      </div>
                    </>
                  );
                  return embeddable ? (
                    <button key={f.id} type="button" onClick={() => ctx.setPreviewFile(f)}
                       className="card p-4 flex items-start gap-3 hover:border-gold-500/40 transition group text-left">
                      {Inner}

    async function decryptShared(password) {
      const data = Uint8Array.from(atob(ENCRYPTED_BLOB), c => c.charCodeAt(0));
      const salt = data.slice(0, 16);
      const nonce = data.slice(16, 28);
      const ct = data.slice(28);
      const enc = new TextEncoder();
      const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
        km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: nonce }, key, ct);
      return JSON.parse(new TextDecoder().decode(pt));
    }

    const UnlockScreen = ({ onUnlock }) => {
      const [pw, setPw] = useState('');
      const [remember, setRemember] = useState(true);
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      const submit = async (e) => {
        e?.preventDefault();
        if (!pw || busy) return;
        setBusy(true); setErr(null);
        try {
          const state = await decryptShared(pw);
          onUnlock(state, remember);
        } catch (ex) {
          setErr("Password didn't work. Try again.");
          setBusy(false);
        }
      };
      return (
        <div className="min-h-screen relative z-10 flex items-center justify-center px-6">
          <form onSubmit={submit} className="card p-8 md:p-10 w-full max-w-sm anim-in">
            <div className="flex items-center gap-3 mb-6">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 grid place-items-center text-ink-900 font-display font-semibold text-lg">H</div>
              <div>
                <div className="font-display text-xl tracking-tight leading-none">Home HQ</div>
                <div className="text-ink-400 text-[11px] uppercase tracking-wider mt-1">Shared view</div>
              </div>
            </div>
            <div className="text-ink-200 text-sm mb-1">Welcome.</div>
            <div className="text-ink-300 text-sm mb-5">Enter the household password to view.</div>
            <input
              type="password"
              autoFocus
              value={pw}
              onChange={e => setPw(e.target.value)}
              placeholder="Password"
              disabled={busy}
              className="w-full px-3 py-2.5 rounded-xl bg-ink-800 border border-ink-600 text-ink-100 text-sm focus:outline-none focus:border-gold-500/50"
            />
            {err && <div className="text-ember-400 text-xs mt-2">{err}</div>}
            <label className="flex items-center gap-2 mt-4 text-ink-300 text-xs cursor-pointer select-none">
              <input type="checkbox" checked={remember} onChange={e=>setRemember(e.target.checked)}
                style={{width:'1rem', height:'1rem', minHeight:0, accentColor:'#c19654'}} />
              Stay unlocked on this device
            </label>
            <button type="submit" disabled={busy || !pw}
              className="btn-primary w-full mt-4 px-3.5 py-2.5 rounded-xl text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed">
              {busy ? 'Unlocking…' : 'View dashboard'}
            </button>
            <div className="text-ink-500 text-[11px] mt-5 leading-relaxed">
              This is a private view of the McCullum household dashboard. Edits you make are saved on this device only.
            </div>
          </form>
        </div>
      );
    };

    const SharedRoot = () => {
      // "Stay unlocked": after a remembered unlock the decrypted state already lives
      // in this device's localStorage, so skipping the prompt adds no new exposure.
      const [decrypted, setDecrypted] = useState(() => {
        try {
          if (localStorage.getItem('homehq.unlockRemembered') === '1' && localStorage.getItem(STORAGE_KEY)) return true;
        } catch {}
        return null;
      });
      if (!decrypted) return <UnlockScreen onUnlock={(s, remember) => {
        // Auto-populate Finnhub key from baked state if not already set locally
        try {
          if (s._finnhubKey && !localStorage.getItem('homehq.finnhubKey')) {
            localStorage.setItem('homehq.finnhubKey', s._finnhubKey);
          }
          if (remember) localStorage.setItem('homehq.unlockRemembered', '1');
          else localStorage.removeItem('homehq.unlockRemembered');
        } catch {}
        // Strip the key out of state before saving — keep it in localStorage only
        const stateForApp = { ...s };
        delete stateForApp._finnhubKey;
        window.__SHARED_INIT__ = stateForApp;
        setDecrypted(stateForApp);
      }} />;
      return <App />;
    };

    root.render(<SharedRoot />);
  </script>
</body>
</html>
