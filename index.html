          <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
            <StatTile label="Overdue"      value={overdue.length}         tone="overdue" hint="now" />
            <StatTile label="To do"        value={upcomingTasks.length}   tone="soon"    hint="30d" />
            <StatTile label="Charges"      value={fmtMoneyK(chargeTotal)} tone="info"    hint="30d" onClick={()=>setView('subscriptions')} />
            <StatTile label="Renewals"     value={renewals.length}        tone="info"    hint="60d" onClick={()=>setView('insurance')} />
            <StatTile label="Warranties"   value={warranties.length}      tone="info"    hint="90d" onClick={()=>setView('appliances')} />
            <StatTile label="Drink now"    value={drinkNow.length}        tone="ok"      hint="ready" onClick={()=>setView('wine')} />
          </div>

          {/* Money summary + digest */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
            <PortfolioWidget onOpen={()=>setView('portfolio')} />
            <div className="card p-5 md:p-6 flex flex-col justify-between gap-4">
              <div>
                <div className="text-[11px] uppercase tracking-[0.18em] text-ink-400 mb-1">Digest</div>
                <div className="font-display text-lg tracking-tight">This week's digest</div>
                <div className="text-ink-300 text-sm mt-1.5 leading-relaxed">
                  A clean, forwardable summary of everything that needs attention — overdue items, the next 30 days, renewals and warranties.
                </div>
              </div>
              <div className="flex items-center gap-2 flex-wrap">
                <Btn icon="sparkles" onClick={generateDigest}>Generate</Btn>
                <span className="text-[11px] text-ink-400">
                  {digestCount} item{digestCount === 1 ? '' : 's'} would be included
                </span>
              </div>
            </div>
          </div>

          {/* Nothing at all to do — one calm card instead of two empty sections */}
          {overdue.length === 0 && upcomingTasks.length === 0 && (
            <Empty icon="check" title="Nothing needs you"
              body="No overdue items, and the next 30 days are clear. Work surfaces here as it comes due."
              cta={<Btn variant="soft" icon="plus" onClick={()=>setModal(<TaskForm onClose={()=>setModal(null)} />)}>Add a task</Btn>} />
          )}

          {/* Overdue */}
          {overdue.length > 0 && (
          <section>
            <SectionHeader title="Overdue" count={overdue.length} hint="Roll these forward when they're done." />
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              {(showAllOverdue ? overdue : overdue.slice(0, 5)).map(i => <DashboardItem key={i.kind+i.id} item={i} kind="overdue"
                onComplete={() => ctx.markDone(i)}
                onJump={() => setView(
                  i.kind==='maint'?'maintenance':
                  i.kind==='vendor'?'vendors':
                  i.kind==='property'?'property':
                  i.kind==='sub'?'subscriptions':
                  'appliances'
                )} />)}
            </div>
            {overdue.length > 5 && (
              <button onClick={()=>setShowAllOverdue(v=>!v)}
                className="mt-3 w-full py-2.5 rounded-xl border border-dashed border-ink-500 text-ink-300 hover:text-gold-300 hover:border-gold-500/50 text-sm transition">
                {showAllOverdue ? 'Show fewer' : `Show all ${overdue.length} overdue`}
              </button>
            )}
          </section>
          )}

          {/* Coming up — work that needs a person */}
          {(upcomingTasks.length > 0 || overdue.length > 0) && (
          <section>
            <SectionHeader title="Coming up" count={upcomingTasks.length} hint="Next 30 days — maintenance, vendor visits and property dues." />
            {upcomingTasks.length === 0 ? (
              <Empty icon="calendar" title="The next 30 days are clear" body="Nothing to prep. Add a task or schedule a vendor and it'll show up here."
                cta={<Btn variant="soft" icon="plus" onClick={()=>setModal(<TaskForm onClose={()=>setModal(null)} />)}>Add a task</Btn>} />
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {upcomingTasks.map(i => <DashboardItem key={i.kind+i.id} item={i} kind="soon"
                  onComplete={() => ctx.markDone(i)}
                  onJump={()=> setView(
                    i.kind==='maint'?'maintenance':
                    i.kind==='vendor'?'vendors':
                    i.kind==='property'?'property':
                    'appliances'
                  )} />)}
              </div>
            )}
          </section>
          )}

          {/* Recurring charges — money that moves on its own, so a compact ledger
              rather than 18 cards with checkboxes nobody should tick. */}
          {upcomingCharges.length > 0 && (
            <section>
              <SectionHeader title="Recurring charges" count={upcomingCharges.length}
                hint={`${fmtMoney(chargeTotal)} billing in the next 30 days — automatic, nothing to do.`}
                action={<button onClick={()=>setView('subscriptions')} className="text-xs text-gold-400 hover:text-gold-300 inline-flex items-center gap-1">Manage <Icon name="chevR" size={11}/></button>} />
              <div className="card p-2">
                <div className="grid grid-cols-1 md:grid-cols-2">
                  {upcomingCharges.map(c => (
                    <button key={c.id} onClick={()=>setView('subscriptions')}
                      className="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-ink-800 text-left transition">
                      <span className="text-sm text-ink-200 truncate flex-1">{c.title}</span>
                      <span className="text-[11px] text-ink-500 tabular-nums shrink-0">{fmtDate(c.when, {month:'short', day:'numeric'})}</span>
                      <span className="text-xs text-ink-100 tabular-nums shrink-0 w-16 text-right">{c.amount ? fmtMoney(c.amount) : '—'}</span>
                    </button>
                  ))}
                </div>
              </div>
            </section>
          )}

          {/* Insurance renewals — hidden entirely when empty to keep Today calm */}
          {renewals.length > 0 && (
          <section>
            <SectionHeader title="Insurance renewals" count={renewals.length} hint="Within 60 days — review coverage + premium." />
            {(
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {renewals.map(p => (
                  <button key={p.id} onClick={()=>setView('insurance')} className="card p-4 text-left flex items-start gap-3 hover:border-gold-400/40 transition">
                    <div className="w-10 h-10 rounded-xl bg-ink-700 grid place-items-center text-gold-400 shrink-0"><Icon name="shield" size={18}/></div>
                    <div className="min-w-0 flex-1">
                      <div className="text-sm font-medium truncate">{p.carrier} <span className="text-ink-300 font-normal">· {p.type}</span></div>
                      <div className="text-ink-300 text-xs mt-0.5 truncate">{p.coverageSummary || p.policyNumber || '—'}</div>
                      <div className="mt-2 flex items-center gap-2">
                        <Pill tone="soon" dot>Renews {fmtDate(p.renewalDate)}</Pill>
                        <span className="text-ink-400 text-xs">{fmtRelative(p.renewalDate)}</span>
                      </div>
                    </div>
                  </button>
                ))}
              </div>
            )}
          </section>
          )}

          {/* Warranties — hidden entirely when empty to keep Today calm */}
          {warranties.length > 0 && (
          <section>
            <SectionHeader title="Warranties expiring" count={warranties.length} hint="Within 90 days — time to evaluate or extend." />
            {(
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {warranties.map(a => (
                  <div key={a.id} className="card p-4 flex items-start gap-3">
                    <div className="w-10 h-10 rounded-xl bg-ink-700 grid place-items-center text-gold-400 shrink-0"><Icon name="cube" size={18}/></div>
                    <div className="min-w-0 flex-1">
                      <div className="text-sm font-medium truncate">{a.name}</div>
                      <div className="text-ink-300 text-xs mt-0.5 truncate">{a.brand} {a.model} · {a.room}</div>
                      <div className="mt-2 flex items-center gap-2">
                        <Pill tone="soon" dot>Expires {fmtDate(a.warrantyExpires)}</Pill>
                        <span className="text-ink-400 text-xs">{fmtRelative(a.warrantyExpires)}</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </section>
          )}

          {/* Gaps & opportunities — collapsed by default so Today stays calm */}
          {gaps.length > 0 && (
            <section>
              <button onClick={()=>setGapsOpen(v=>!v)} className="w-full flex items-end justify-between mb-3 text-left group">
                <div>
                  <div className="flex items-baseline gap-2">
                    <div className="font-display text-lg tracking-tight group-hover:text-gold-300 transition">Gaps & opportunities</div>
                    <span className="text-ink-400 text-sm tabular-nums">{gaps.length}</span>
                  </div>
                  <div className="text-ink-400 text-xs">Things that look missing — tap to {gapsOpen ? 'collapse' : 'review'}.</div>
                </div>
                <Icon name="chevR" size={16} className={`text-ink-400 transition-transform ${gapsOpen ? 'rotate-90' : ''}`} />
              </button>
              {gapsOpen && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {gaps.map((g, i) => (
                  <button key={i} onClick={() => setView(g.module)}
                     className="card p-4 text-left flex items-start gap-3 hover:border-gold-500/40 transition group">
                    <div className="w-10 h-10 rounded-xl bg-ink-700 grid place-items-center text-gold-400 shrink-0 group-hover:bg-ink-600 transition">
                      <Icon name={g.icon} size={18} />
                    </div>
                    <div className="min-w-0 flex-1">
                      <div className="flex items-center gap-2 flex-wrap">
                        <div className="text-sm font-medium text-ink-100 group-hover:text-gold-300 transition">{g.title}</div>
                        {g.property && (
                          <span className="text-[10px] uppercase tracking-wider text-ink-400 px-1.5 py-0.5 rounded border border-ink-600">
                            {g.property === '1619 Seattle' ? 'Seattle' : 'Sun Valley'}
                          </span>
                        )}
                      </div>
                      <div className="text-ink-300 text-xs mt-1.5 leading-relaxed">{g.why}</div>
                    </div>
                    <Icon name="chevR" size={14} className="text-ink-500 mt-1 opacity-0 group-hover:opacity-100 transition" />
                  </button>
                ))}
              </div>
              )}
            </section>
          )}

          {/* Drink now — hidden entirely when empty, like renewals and warranties */}
          {drinkNow.length > 0 && (
          <section>
            <SectionHeader title="Drink now" count={drinkNow.length} hint="In their peak window — open something tonight." />
            {(
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                {drinkNow.slice(0, 3).map(w => (
                  <button key={w.id} onClick={()=>setView('wine')} className="card p-4 text-left hover:border-gold-400/40 transition">
                    <div className="text-[11px] uppercase tracking-wider text-ink-400 mb-1">{w.region}</div>
                    <div className="font-display text-base leading-snug">{w.producer}</div>
                    <div className="text-ink-200 text-sm">{w.label}</div>
                    <div className="text-ink-300 text-xs mt-1">{w.vintage} · {w.varietal}</div>
                    <div className="mt-3 flex items-center justify-between">
                      <Pill tone="ok" dot>peak {w.drinkStart}–{w.drinkEnd}</Pill>
                      <span className="text-ink-400 text-xs">{w.location} · ×{w.qty}</span>
                    </div>
                  </button>
                ))}
              </div>
            )}
          </section>
          )}
        </div>
      );
    };

/* Vested/unvested split, computed live from today's date. */
const equityVesting = () => {
  const now = new Date();
  const fullMonths = (fromStr) => {
    const from = new Date(fromStr + 'T00:00:00');
    let m = (now.getFullYear() - from.getFullYear()) * 12 + (now.getMonth() - from.getMonth());
    if (now.getDate() < from.getDate()) m -= 1;
    return Math.max(0, m);
  };
  const perGrant = EQUITY_COMP.grants.map(g => {
    const m = fullMonths(g.vc);
    let vestedQty;
    if (g.vestedFrac != null) {
      vestedQty = Math.round(g.qty * g.vestedFrac);  // explicit fraction (per Justin)
    } else if (g.kind === 'option') {
      vestedQty = Math.min(g.qty, Math.floor(g.qty * Math.min(m, 48) / 48));  // monthly / 4 yr (assumed)
    } else {
      const tranches = m >= 15 ? 1 + Math.min(11, Math.floor((m - 15) / 3)) : 0;  // 15-mo cliff, then quarterly, 12 tranches
      vestedQty = Math.round(g.qty * tranches / 12);
    }
    const perShare = g.kind === 'option' ? Math.max(0, EQUITY_FMV.price - g.strike) : EQUITY_FMV.price;
    return { ...g, vestedQty, unvestedQty: g.qty - vestedQty,
             vestedValue: vestedQty * perShare, unvestedValue: (g.qty - vestedQty) * perShare };
  });
  return {
    perGrant,
    vestedValue:   perGrant.reduce((s,g) => s + g.vestedValue, 0),
    unvestedValue: perGrant.reduce((s,g) => s + g.unvestedValue, 0),
  };
};

   here is valued in dollars and nothing rolls into householdTotal() — unlike the
   Anthropic block above, which has a per-share valuation to price against.
   Add a `MERCURY_FMV` here the day Carta shows one. */
const MERCURY_EQUITY = {
  holder: 'Amanda',
  company: 'Mercury Technologies',
  source: 'Carta',
  asOf: '2026-08-29',
  grants: [
    { id:'ES-1881', kind:'option', type:'Options', subtype:'ISO/NSO split', issued:'2025-01-31',

      detail:'$3.51 strike · issued 1/31/25 · 1-yr cliff of 30,000 then 2,500/mo through 1/31/29 · early exercise permitted, so all 120,000 are exercisable today' },
    { id:'ES-4093', kind:'rsu', type:'RSUs', issued:null,
      granted:5644, vested:705, settled:0, vesting:null,
      detail:'Vesting schedule not in the Carta export — the vested count is Carta’s reported figure, not computed here. Nothing settled yet.' },
  ],
  notes: 'Vested-to-date is computed from each grant’s own schedule rather than read off Carta’s stored figure, and the two are compared side by side so a stale export shows up as a delta instead of passing silently. ES-4093 has no schedule in the export, so its count falls back to Carta’s number, flagged as such. Nothing exercised or settled yet. Share counts are hard facts; the dollar figures are indicative — they come from secondary-market marks, not a 409A, so they read high. The vested figure feeds the household total and carries that caveat with it.',
};

/* Every tranche a cliff-then-monthly schedule produces: [{date, shares, cumulative}]. */
const vestingTranches = (vs, granted) => {
  if (!vs || !vs.cliffDate) return [];
  const out = [];
  let cum = 0;
  if (vs.cliffShares) {
    cum = Math.min(granted, vs.cliffShares);
    out.push({ date: vs.cliffDate, shares: cum, cumulative: cum });
  }
  const end = parseDate(vs.fullyVestedDate);
  const monthly = vs.monthlyShares || 0;
  for (let i = 1; monthly > 0 && cum < granted; i++) {
    const date = addMonthsClamped(vs.cliffDate, i);
    if (end && parseDate(date) > end) break;
    const shares = Math.min(monthly, granted - cum);
    cum += shares;
    out.push({ date, shares, cumulative: cum });
  }
  // Remainder from an uneven schedule lands on the stated fully-vested date.
  if (cum < granted && vs.fullyVestedDate) out.push({ date: vs.fullyVestedDate, shares: granted - cum, cumulative: granted });
  return out;
};

/* Vested/unvested split computed live from the schedule. Carta's own `vested`
   figure rides along as `reportedVested` for cross-checking, never as the source
   of truth. Grants with no schedule fall back to it, marked `computedVested: null`. */
const mercuryVesting = (asOfISO) => {
  const on = asOfISO || toISO(today());
  const grants = MERCURY_EQUITY.grants.map(g => {
    const tranches = vestingTranches(g.vesting, g.granted);
    const passed = tranches.filter(t => t.date <= on);
    const computed = tranches.length ? (passed.length ? passed[passed.length - 1].cumulative : 0) : null;
    const nextT = tranches.find(t => t.date > on) || null;
    const vested = computed != null ? computed : (g.vested || 0);
    const reported = g.vested != null ? g.vested : null;
    return {
      ...g,
      tranches,
      computedVested: computed,
      reportedVested: reported,
      vested,
      unvested: Math.max(0, g.granted - vested),
      delta: (computed != null && reported != null) ? reported - computed : 0,
      pct: g.granted ? vested / g.granted * 100 : 0,
      next: nextT ? { ...nextT, grantId: g.id } : null,
      exerciseCost: g.strike != null ? g.granted * g.strike : null,
      vestedExerciseCost: g.strike != null ? vested * g.strike : null,
    };
  });
  const sum = (f) => grants.reduce((s, g) => s + (f(g) || 0), 0);
  return {
    grants,
    granted: sum(g => g.granted),
    vested: sum(g => g.vested),
    unvested: sum(g => g.unvested),
    exerciseCost: sum(g => g.exerciseCost),
    vestedExerciseCost: sum(g => g.vestedExerciseCost),
    nextVest: grants.map(g => g.next).filter(Boolean).sort((a, b) => a.date.localeCompare(b.date))[0] || null,
    discrepancies: grants.filter(g => g.delta !== 0),
  };
};

/* Indicative secondary-market marks — explicitly NOT a 409A. These are preferred and
   secondary prices; a 409A common valuation sits materially below them because preferred
   carries liquidation preferences common doesn't. Everything derived from these therefore
   reads HIGH, is labelled indicative wherever it appears, and stays out of householdTotal().
   The per-share figures come from secondary marketplaces working back from valuation and an
   estimated share count — not from a filing. Replace this whole block with a
   MERCURY_FMV = { price, asOf } the day Carta shows the real common FMV. */
const MERCURY_MARKS = [
  { source:'Forge',                 price:17.37, asOf:'2026-08-19', kind:'secondary',
    note:'Secondary marketplace mark — most recent, trade-based, so it headlines here' },
  { source:'Nasdaq Private Market', price:16.51, asOf:'2026-07-07', kind:'secondary',
    note:'Secondary marketplace estimate' },
  { source:'Series D (reported)',   price:17.72, asOf:'2026-05-20', kind:'preferred',
    note:'$200M at $5.2B led by TCV — per-share figure as reported by secondary marketplaces, not a filing' },
];
const MERCURY_REF_MARK = 'Forge';

/* Value a vesting split at one per-share mark: options at intrinsic spread over the
   strike (floored at zero), RSUs at the full mark — the same treatment the Anthropic
   block gives its 409A price. */
const mercuryValueAt = (v, price) => {
  const perShare = (g) => g.strike != null ? Math.max(0, price - g.strike) : price;
  const grants = v.grants.map(g => ({
    id: g.id,
    perShare: perShare(g),
    vestedValue: g.vested * perShare(g),
    unvestedValue: g.unvested * perShare(g),
  }));
  return {
    price,
    grants,
    byId: Object.fromEntries(grants.map(g => [g.id, g])),
    vestedValue:   grants.reduce((s, g) => s + g.vestedValue, 0),
    unvestedValue: grants.reduce((s, g) => s + g.unvestedValue, 0),
  };
};

/* Low/high across every mark, so the dashboard shows a range rather than pretending
   to a single price it doesn't have. */
const mercuryValueRange = (v) => {
  const all = MERCURY_MARKS.map(m => ({ ...m, value: mercuryValueAt(v, m.price) }));
  const span = (f) => ({ lo: Math.min(...all.map(f)), hi: Math.max(...all.map(f)) });
  return {
    all,
    ref: all.find(m => m.source === MERCURY_REF_MARK) || all[0],
    vested:   span(m => m.value.vestedValue),
    unvested: span(m => m.value.unvestedValue),
  };
};

/* Sign goes outside the currency symbol: -$1,234, not $-1,234. */
const fmtMoney  = (n) => n == null ? '—' : (n < 0 ? '-$' : '$') + Math.round(Math.abs(n)).toLocaleString();
const fmtMoneyK = (n) => {
  if (n == null) return '—';
  const a = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  if (a >= 1e6) return sign + '$' + (a/1e6).toFixed(2) + 'M';
  if (a >= 1e3) return sign + '$' + (a/1e3).toFixed(0) + 'K';
  return sign + '$' + Math.round(a);
};
const fmtPct = (n) => n == null ? '—' : n.toFixed(1) + '%';

/* Live pricing via Finnhub (free tier, 60 req/min, supports CORS).
   Only fetches Stock + ETF symbols — mutual funds rarely covered on free tier;
   money market always trades at $1; private equity has no public quote. */
const FINNHUB_KEY_STORAGE = 'homehq.finnhubKey';
const QUOTES_CACHE_STORAGE = 'homehq.quotes.v1';
/* How long a fetched quote may be overlaid on the holdings as a live price.
   Cached quotes older than this are kept (the bar reports their age) but are NOT
   applied — otherwise a reload days later silently reported week-old prices as
   live, with a "vs snapshot" delta computed against them. */
const QUOTES_FRESH_MS = 60 * 60 * 1000;  // 1 hour
const quotesFresh = (quotes) => {
  const newest = Object.values(quotes || {}).reduce((m, q) => Math.max(m, (q && q.asOf) || 0), 0);
  return newest > 0 && (Date.now() - newest) < QUOTES_FRESH_MS;
};

const usePriceQuotes = () => {
  const [apiKey, setApiKey] = useState(() => { try { return localStorage.getItem(FINNHUB_KEY_STORAGE) || ''; } catch { return ''; } });
  const [quotes, setQuotes] = useState(() => {
    try { return JSON.parse(localStorage.getItem(QUOTES_CACHE_STORAGE) || '{}'); } catch { return {}; }
  });
  const [loading, setLoading] = useState(false);
  const [progress, setProgress] = useState({ done: 0, total: 0 });
  const [error, setError] = useState(null);

  const setKey = (key) => {
    setApiKey(key);
    try { if (key) localStorage.setItem(FINNHUB_KEY_STORAGE, key); else localStorage.removeItem(FINNHUB_KEY_STORAGE); } catch {}
  };

  const refresh = async (symbols) => {
    if (!apiKey) { setError('Need a Finnhub API key — open Settings.'); return; }
    if (!symbols.length) return;
    setLoading(true); setError(null); setProgress({ done: 0, total: symbols.length });
    const next = { ...quotes };
    const failed = [];
    // Finnhub free tier = 60 calls/min. Batch 25 in parallel, then wait 27s
    // between batches (~55/min effective) so we never trip the rate limit.
    // 429s get one retry after the limit window resets.
    const BATCH = 25, GAP_MS = 27000;
    const fetchSym = async (sym, retried) => {
      try {
        const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(sym)}&token=${apiKey}`);
        if (r.status === 429 && !retried) {
          await new Promise(res => setTimeout(res, 31000));
          return fetchSym(sym, true);
        }
        if (!r.ok) { failed.push(sym); return; }
        const j = await r.json();
        // Finnhub returns {c:0} for unknown symbols
        if (typeof j.c === 'number' && j.c > 0) {
          next[sym] = { price: j.c, change: j.d, pctChange: j.dp, asOf: Date.now() };
        } else {
          failed.push(sym);
        }
      } catch (e) { failed.push(sym); }
    };
    for (let i = 0; i < symbols.length; i += BATCH) {
      const slice = symbols.slice(i, i + BATCH);
      await Promise.all(slice.map(sym => fetchSym(sym, false)));
      setProgress({ done: Math.min(i + BATCH, symbols.length), total: symbols.length });
      if (i + BATCH < symbols.length) await new Promise(r => setTimeout(r, GAP_MS));
    }
    setQuotes(next);
    try { localStorage.setItem(QUOTES_CACHE_STORAGE, JSON.stringify(next)); } catch {}
    setLoading(false);
    if (failed.length) setError(`Couldn't quote ${failed.length} symbol${failed.length===1?'':'s'} (often mutual funds / inactive).`);
  };

  const clearQuotes = () => {
    setQuotes({});
    try { localStorage.removeItem(QUOTES_CACHE_STORAGE); } catch {}
  };

  return { apiKey, setKey, quotes, refresh, loading, progress, error, clearQuotes };
};

const PortfolioPriceBar = ({ priceState, fetchableSymbols, onOpenSettings }) => {
  const { apiKey, quotes, refresh, loading, progress, error } = priceState;
  const quotedCount = fetchableSymbols.filter(s => quotes[s]).length;
  const newest = Object.values(quotes).reduce((m, q) => Math.max(m, q.asOf || 0), 0);
  const fresh = quotesFresh(quotes);
  const ageStr = (() => {
    if (!newest) return null;
    const min = Math.floor((Date.now() - newest) / 60000);
    if (min < 1) return 'just now';
    if (min < 60) return min + 'm ago';
    const hr = Math.floor(min/60);
    if (hr < 24) return hr + 'h ago';
    return Math.floor(hr/24) + 'd ago';
  })();
  return (
    <div className="card p-3 flex items-center gap-3 flex-wrap">
      <div className="flex items-center gap-2">
        <span className={`w-2 h-2 rounded-full ${quotedCount > 0 && fresh ? 'bg-sage-400 animate-pulse' : quotedCount > 0 ? 'bg-gold-400' : 'bg-ink-500'}`}/>
        <span className="text-xs text-ink-200 font-medium">
          {quotedCount === 0 ? 'Snapshot prices'
            : fresh ? `Live · ${quotedCount}/${fetchableSymbols.length} quoted${ageStr ? ' · ' + ageStr : ''}`
            : `Snapshot prices · cached quotes ${ageStr} are too old to use — refresh for live`}
        </span>
      </div>
      <div className="flex-1"/>
      {loading && (
        <div className="flex items-center gap-2 text-xs text-ink-400">
          <div className="w-32 h-1 bg-ink-700 rounded overflow-hidden">
            <div className="h-full bg-gold-400 transition-all" style={{width: progress.total ? (progress.done / progress.total * 100) + '%' : '0%'}}/>
          </div>
          {progress.done}/{progress.total}
        </div>
      )}
      <button onClick={onOpenSettings} title="Pricing settings"
         className="w-8 h-8 rounded-lg grid place-items-center text-ink-300 hover:bg-ink-700">
        <Icon name="filter" size={14} />
      </button>
      <button onClick={() => refresh(fetchableSymbols)} disabled={loading}
         className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${
           loading ? 'bg-ink-700 text-ink-400 cursor-wait' :
           apiKey ? 'bg-gradient-to-b from-gold-400 to-gold-500 text-ink-900 hover:from-gold-300' :
           'bg-ink-700 text-ink-200 hover:bg-ink-600'
         }`}>
        {loading ? 'Refreshing…' : apiKey ? (quotedCount > 0 ? 'Refresh' : 'Get live prices') : 'Set up live prices'}
      </button>
      {error && <div className="w-full text-[11px] text-ember-400">{error}</div>}
    </div>
  );
};

/* ---------- Photo upload button ----------
   Appears on each entity card. Click → opens camera on mobile, file picker on desktop.
   Uploads to the section's Box folder (or Inbox), then attaches the resulting shared link
   as a Documents chip via ctx.addLink. If no token/folder configured, opens BoxSettingsModal first. */
const PhotoUploadButton = ({ entityKind, entityId, label = 'Photo' }) => {
  const ctx = useContext(Ctx);
  const inputRef = useRef(null);
  const [busy, setBusy] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [pendingFile, setPendingFile] = useState(null);
  const [err, setErr] = useState(null);

  const trigger = (e) => {
    e?.stopPropagation();
    setErr(null);
    const { token, expired } = loadBoxToken();
    const folders = loadBoxFolders();
    const folderId = pickBoxFolder(folders, entityKind);
    if (!token || expired || !folderId) {
      // Need configuration first — open settings, then user re-clicks
      setShowSettings(true);
      return;
    }
    inputRef.current?.click();
  };

  const onFileChange = async (e) => {
    const file = e.target.files?.[0];
    e.target.value = ''; // allow re-pick of same file
    if (!file) return;
    await doUpload(file);
  };

  const doUpload = async (file) => {
    setBusy(true); setErr(null);
    try {
      const { token } = loadBoxToken();
      const folders = loadBoxFolders();
      const folderId = pickBoxFolder(folders, entityKind);
      const result = await uploadFileToBox(file, folderId, token);
      if (entityKind && entityId && ctx.addLink) {
        const labelText = `Photo ${new Date().toLocaleDateString(undefined, { month:'short', day:'numeric' })}`;
        ctx.addLink(entityKind, entityId, { label: labelText, url: result.sharedUrl });
      }
      ctx.showToast?.('Photo uploaded to Box');
      setPendingFile(null);
    } catch (ex) {
      console.error('Box upload failed', ex);
      const msg = (ex && ex.message) || 'Upload failed';
      setErr(msg);
      // If token-related, prompt for new token
      if (/401|token|auth/i.test(msg)) {
        setPendingFile(file);
        setShowSettings(true);
      } else {
        ctx.showToast?.(`Upload failed — ${msg.slice(0, 60)}`);
      }
    } finally {
      setBusy(false);
    }
  };

  const onSettingsSaved = async () => {
    if (pendingFile) {
      const f = pendingFile;
      setPendingFile(null);
      await doUpload(f);
    }
  };

  return (
    <>
      <button type="button" onClick={trigger} disabled={busy}
        className="inline-flex items-center gap-1 px-2 py-1 rounded-lg border border-dashed border-ink-500 text-ink-300 hover:text-gold-300 hover:border-gold-500/50 text-xs transition disabled:opacity-50 disabled:cursor-wait">
        <Icon name="camera" size={11}/> {busy ? 'Uploading…' : label}
      </button>
      <input ref={inputRef} type="file" accept="image/*"
        onChange={onFileChange} className="hidden" />
      {err && !showSettings && (
        <span className="text-ember-400 text-[10px] ml-1">{err.slice(0, 60)}</span>
      )}
      {showSettings && (
        <BoxSettingsModal
          onClose={() => setShowSettings(false)}
          onSaved={onSettingsSaved}
          kindHighlight={pickBoxFolder(loadBoxFolders(), entityKind) ? null : 'inbox'}
        />
      )}
    </>
  );
};

  const accounts = ['__all__', ...d.accounts.map(a => a.name), ...OUTSIDE_SCOPES];
  const isOutside = OUTSIDE_SCOPES.includes(scope);

  // Symbols we can quote on the free tier (Stock + ETF; skip MF/MMF/PE)
  const fetchableSymbols = useMemo(() => {
    const s = new Set();
    d.holdings.forEach(h => { if (h.securityType === 'Stock' || h.securityType === 'ETF') s.add(h.symbol); });
    return Array.from(s).sort();
  }, []);

  // Apply live quotes to holdings (overlay; baseline preserved)
  const pricesFresh = quotesFresh(priceState.quotes);
  const liveHoldings = useMemo(() => {
    if (!pricesFresh) return d.holdings;   // stale cache: show the snapshot, not last week's prices
    return d.holdings.map(h => {
      const q = priceState.quotes[h.symbol];
      if (q && (h.securityType === 'Stock' || h.securityType === 'ETF') && h.quantity != null) {
        const liveValue = q.price * h.quantity;
        const live = {
          ...h,
          baselineValue: h.value,
          baselinePrice: h.price,
          value: liveValue,
          price: q.price,
          livePctChange: q.pctChange,
          live: true,
        };
        // Recompute unrealized G/L from live value if cost basis present
        if (h.costBasis != null) {
          live.unrealizedGL = liveValue - h.costBasis;
          live.unrealizedGLPct = h.costBasis ? (live.unrealizedGL / h.costBasis * 100) : null;

/* BofA Charitable Gift Fund (DAF) — value log with growth tracking. Log a balance whenever you check the fund. */
const DafPanel = () => {
  const ctx = useContext(Ctx);
  const [val, setVal] = useState('');
  const [date, setDate] = useState(() => new Date().toISOString().slice(0,10));
  const raw = ctx.state.dafValues || [];
  const rawIdx = new Map(raw.map((e, i) => [e.id, i]));
  // sort oldest → newest; ties on date break by insertion order (new entries are prepended, so lower raw index = newer)
  const log = [...raw].filter(e => e.value != null).sort((a,b) => {
    const c = (a.date||'').localeCompare(b.date||'');
    return c !== 0 ? c : (rawIdx.get(b.id) - rawIdx.get(a.id));
  });
  const latest = log[log.length - 1];
  const prev = log.length > 1 ? log[log.length - 2] : null;
  const first = log[0];
  const delta = (a, b) => a && b ? a.value - b.value : null;
  const pct = (a, b) => (a && b && typeof b.value === 'number' && b.value !== 0)
    ? ((a.value - b.value) / b.value * 100) : null;
  const submit = () => {
    const v = parseFloat(String(val).replace(/[$,]/g, ''));
    if (!isFinite(v) || v <= 0) return;
    ctx.addDafValue({ date, value: v, note: 'Logged manually' });
    ctx.showToast('DAF balance logged');
    setVal('');
  };
  const dSince = delta(latest, prev), pSince = pct(latest, prev);
  const dStart = delta(latest, first), pStart = pct(latest, first);
  return (
    <div className="space-y-4">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <PortfolioStat label="Current value" value={latest ? fmtMoney(latest.value) : '—'} />
        <PortfolioStat label="Since last check" value={dSince == null ? '— first entry' : `${dSince >= 0 ? '+' : ''}${fmtMoneyK(dSince)} (${pSince >= 0 ? '+' : ''}${pSince.toFixed(1)}%)`} tone={dSince == null ? 'muted' : dSince >= 0 ? 'ok' : 'overdue'} />
        <PortfolioStat label="Since start" value={dStart ? `${dStart >= 0 ? '+' : ''}${fmtMoneyK(dStart)} (${pStart >= 0 ? '+' : ''}${pStart.toFixed(1)}%)` : '—'} tone={!dStart ? 'muted' : dStart >= 0 ? 'ok' : 'overdue'} />
        <PortfolioStat label="As of" value={latest ? latest.date : '—'} />
      </div>
      <div className="card p-4 md:p-5">
        <SectionHeader title="BofA Charitable Gift Fund" hint="Donor-advised fund — already given away, so it's tracked here but never counted in the household total."
          action={<a href="https://bofa.donorfirst.org" target="_blank" rel="noreferrer" className="text-xs text-gold-400 hover:text-gold-300 inline-flex items-center gap-1"><Icon name="link" size={12}/> DAF login</a>} />
        <div className="flex flex-wrap items-end gap-2 mb-4">
          <div>
            <label className="block text-[10px] uppercase tracking-wider text-ink-400 mb-1">New balance</label>
            <input value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>{ if (e.key==='Enter') submit(); }} placeholder="$54,000"
              className="w-32 bg-ink-900 border border-ink-600 rounded-lg px-3 py-2 text-sm text-ink-100 placeholder-ink-500 focus:border-gold-400/50 outline-none" />
          </div>
          <div>
            <label className="block text-[10px] uppercase tracking-wider text-ink-400 mb-1">Date</label>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)}
              className="bg-ink-900 border border-ink-600 rounded-lg px-3 py-2 text-sm text-ink-100 focus:border-gold-400/50 outline-none" />
          </div>
          <button onClick={submit} className="px-3.5 py-2 rounded-full btn-primary text-[12px] font-medium">Log balance</button>
        </div>
        <div className="space-y-1.5">
          {[...log].reverse().map((e, i, arr) => {
            const older = arr[i + 1];
            const d = older ? e.value - older.value : null;
            return (
              <div key={e.id} className="flex items-center gap-3 text-sm border-t border-ink-700/60 pt-1.5 first:border-t-0 group/daf">
                <span className="text-ink-400 text-[11px] w-24 shrink-0 tabular-nums">{e.date}</span>
                <span className="text-ink-100 tabular-nums">{fmtMoney(e.value)}</span>
                {d != null && <span className={`text-[11px] tabular-nums ${d >= 0 ? 'text-sage-400' : 'text-ember-400'}`}>{d >= 0 ? '+' : ''}{fmtMoneyK(d)}</span>}
                <span className="text-ink-500 text-[11px] flex-1 truncate">{e.note || ''}</span>
                <button onClick={() => { if (window.confirm('Delete this entry?')) ctx.deleteDafValue(e.id); }}
                  className="opacity-0 group-hover/daf:opacity-100 transition text-ink-500 hover:text-ember-400 p-1"><Icon name="x" size={12}/></button>
              </div>
            );
          })}
        </div>
        <div className="text-[11px] text-ink-400 mt-3 pt-3 border-t border-ink-700 leading-relaxed">
          Log the balance whenever you check the fund — the deltas above track growth/decline between checks. Pairs with the “gift high-gain PLTR lots to the DAF” suggestion: gifted shares land here.
        </div>
      </div>
    </div>
  );
};

const OutsideMerrillPanel = ({ scope }) => {

        const out = { 'Today': [], 'This week': [], 'This month': [], 'Earlier': [] };
        const now = new Date();

        const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate() - now.getDay()); startOfWeek.setHours(0,0,0,0);
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
        filtered.forEach(l => {
          const d = new Date(l.completedAt);
          if (d >= startOfDay) out['Today'].push(l);
          else if (d >= startOfWeek) out['This week'].push(l);
          else if (d >= startOfMonth) out['This month'].push(l);
          else out['Earlier'].push(l);

          if (!inScope(v, ctx.propertyScope)) return false;
          if (filter !== 'all' && v.serviceType !== filter) return false;
          if (thisWeek) { const n = daysUntil(v.nextVisit); if (n === null || n < 0 || n > 7) return false; }
          if (query) {
            const q = query.toLowerCase();
            if (!`${v.name} ${v.company} ${v.serviceType} ${v.notes||''}`.toLowerCase().includes(q)) return false;
          }
          return true;
        });
      }, [state.vendors, filter, thisWeek, query, ctx.propertyScope]);

      const open = (v) => setModal(<VendorForm vendor={v} onClose={()=>setModal(null)} />);

      return (
        <div className="space-y-5 max-w-5xl">
          <div className="flex items-center justify-between gap-3">
            <p className="text-ink-300 text-sm hidden md:block max-w-2xl">Everyone who works on the house. Tap to edit. Use the call/text/email buttons to reach out fast.</p>
            <Btn icon="plus" onClick={()=>open(null)}>Add vendor</Btn>
          </div>

          <div className="flex items-center gap-2">
            <div className="relative flex-1">
              <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-ink-400" />
              <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search vendors, notes, services…" className="!pl-9" />
            </div>
            <button onClick={()=>setThisWeek(s=>!s)} className={`shrink-0 inline-flex items-center gap-2 px-3 py-2 rounded-xl text-sm border ${thisWeek?'bg-gold-400/12 border-gold-400/40 text-gold-300':'border-ink-600 text-ink-200 hover:bg-ink-800'}`}>
              <Icon name="calendar" size={15} /> This week
            </button>
          </div>

          <div className="flex gap-2 overflow-x-auto no-bar -mx-1 px-1">
            {types.map(t => (
              <button key={t} onClick={()=>setFilter(t)}
                className={`shrink-0 px-3 py-1.5 rounded-full text-xs border transition ${filter===t ? 'bg-ink-100 text-ink-900 border-ink-100' : 'border-ink-600 text-ink-200 hover:bg-ink-800'}`}>
                {t === 'all' ? 'All' : t}
              </button>
            ))}
          </div>

          {filtered.length === 0 ? (
            <Empty icon="users" title="No vendors match" body="Try clearing the filter, or add a new vendor." cta={<Btn icon="plus" onClick={()=>open(null)}>Add vendor</Btn>} />
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              {filtered.map(v => <VendorCard key={v.id} v={v} onEdit={()=>open(v)} />)}
            </div>
          )}
        </div>
      );
    };

    const VendorCard = ({ v, onEdit }) => {
      const ctx = useContext(Ctx);
      const nextN = daysUntil(v.nextVisit);
      const sched = v.schedule?.recurring ? freqLabel(v.schedule.freq) + (v.schedule.dayOfWeek?` · ${v.schedule.dayOfWeek}s`:'') : 'On-demand';
      return (
        <div className={phCard(v.placeholder) + ' p-4 md:p-5'}>
          <div className="flex items-start justify-between gap-3">
            <div className="min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <div className="text-[11px] uppercase tracking-wider text-ink-400">{v.serviceType}</div>
                {v.placeholder && <PlaceholderBadge/>}
              </div>
              <div className="font-display text-lg leading-tight mt-0.5">{v.company}</div>
              <div className="text-ink-200 text-sm">{v.name}</div>
            </div>
            <button onClick={onEdit} aria-label="Edit" title="Edit" className="w-9 h-9 rounded-lg grid place-items-center text-ink-300 hover:bg-ink-700 shrink-0"><Icon name="edit" size={15}/></button>
          </div>
          <div className="mt-3 flex items-center gap-2 flex-wrap">
            {v.nextVisit && (
              <Pill tone={nextN<0?'overdue':nextN<=7?'soon':'info'} dot>
                {nextN<0?`${Math.abs(nextN)}d overdue`:`Next ${fmtDate(v.nextVisit,{month:'short',day:'numeric'})}`}
              </Pill>
            )}
            <Pill tone="muted">{sched}</Pill>
            {v.rate && <Pill tone="muted">{v.rate}</Pill>}
          </div>
          {v.notes && <div className="text-ink-300 text-xs mt-3 line-clamp-2 leading-relaxed">{v.notes}</div>}
          <div className="divider my-4" />
          {/* Only offer the channels this vendor actually has — a Call button that
              dials "tel:undefined" is worse than no button. */}
          {(v.phone || v.email) ? (
            <div className="flex items-center gap-2">
              {v.phone && <a href={`tel:${v.phone}`} className="flex-1 inline-flex items-center justify-center gap-2 py-2 rounded-lg bg-ink-700 hover:bg-ink-600 text-ink-100 text-sm"><Icon name="phone" size={15}/> Call</a>}
              {v.phone && <a href={`sms:${v.phone}`} className="flex-1 inline-flex items-center justify-center gap-2 py-2 rounded-lg bg-ink-700 hover:bg-ink-600 text-ink-100 text-sm"><Icon name="message" size={15}/> Text</a>}
              {v.email && <a href={`mailto:${v.email}`} className="flex-1 inline-flex items-center justify-center gap-2 py-2 rounded-lg bg-ink-700 hover:bg-ink-600 text-ink-100 text-sm"><Icon name="mail" size={15}/> Email</a>}
            </div>
          ) : (
            <button onClick={onEdit}
              className="w-full py-2 rounded-lg border border-dashed border-ink-600 text-ink-400 hover:text-gold-300 hover:border-gold-400/40 text-xs transition">
              No phone or email yet — add one
            </button>
          )}
        <LinkChips links={v.links} entityKind="vendors" entityId={v.id} />
        </div>
      );
    };

    const VendorForm = ({ vendor, onClose }) => {
      const ctx = useContext(Ctx);
      const isNew = !vendor;
      const scopeDefault = ctx.propertyScope && ctx.propertyScope !== 'both' ? ctx.propertyScope : '';
      // Merge over defaults rather than substituting them only for a brand-new vendor:
      // every seeded vendor predates the `schedule` field, and reading v.schedule.recurring
      // on one took the entire app down to the ErrorBoundary.
      const [v, setV] = useState(() => ({
        name:'', company:'', serviceType:'', phone:'', email:'', rate:'', property:scopeDefault,
        lastVisit:'', nextVisit:'', notes:'',
        ...(vendor || {}),
        schedule: { recurring:false, freq:{count:1, unit:'months'}, dayOfWeek:'',
                    ...((vendor && vendor.schedule) || {}) },
      }));
      const setField = (k, val) => setV(prev => ({...prev, [k]: val}));
      const setSched = (k, val) => setV(prev => ({...prev, schedule: {...prev.schedule, [k]: val}}));
      const setFreq = (k, val) => setV(prev => ({...prev, schedule: {...prev.schedule, freq: {...(prev.schedule.freq || {count:1, unit:'months'}), [k]: val}}}));

      const save = () => {
        const payload = {...v};
        if (!payload.schedule.recurring) payload.schedule = {...payload.schedule, recurring:false};
        if (isNew) ctx.addVendor(payload); else ctx.updateVendor(vendor.id, payload);
        ctx.showToast(isNew?'Vendor added':'Vendor updated');
        onClose();
      };
      const remove = () => {
        if (window.confirm(`Delete ${vendor.company}?`)) { ctx.deleteVendor(vendor.id); ctx.showToast('Vendor deleted'); onClose(); }
      };
      return (
        <>
          <ModalHeader title={isNew?'Add vendor':'Edit vendor'} subtitle={isNew?'Takes about 30 seconds.':v.company} onClose={onClose} />
          <div className="p-5 md:p-6 space-y-4">
            <div className="grid grid-cols-2 gap-3">
              <div><label>Service type</label><input value={v.serviceType} onChange={e=>setField('serviceType',e.target.value)} placeholder="e.g. House Cleaner"/></div>
              <div><label>Company</label><input value={v.company} onChange={e=>setField('company',e.target.value)} placeholder="Castillo Cleaning"/></div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div><label>Contact name</label><input value={v.name} onChange={e=>setField('name',e.target.value)} placeholder="Maria Castillo"/></div>
              <div><label>Rate</label><input value={v.rate} onChange={e=>setField('rate',e.target.value)} placeholder="$220 / visit"/></div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div><label>Phone</label><input type="tel" inputMode="tel" value={v.phone} onChange={e=>setField('phone',e.target.value)} placeholder="+1 415 555 0000"/></div>
              <div><label>Email</label><input type="email" inputMode="email" value={v.email} onChange={e=>setField('email',e.target.value)} placeholder="email@…"/></div>
            </div>
            <div><label>Property</label>
              <select value={v.property||''} onChange={e=>setField('property', e.target.value)}>
                <option value="">Both / unassigned</option>
                <option value="1619 Seattle">1619 Seattle</option>
                <option value="4322 Sun Valley">4322 Sun Valley</option>
              </select>
            </div>
            <div className="card-soft p-3.5">
              <div className="flex items-center justify-between">
                <label className="!mb-0">Recurring schedule</label>
                <button type="button" onClick={()=>setV(prev => ({...prev, schedule: {...prev.schedule, recurring: !prev.schedule.recurring, freq: prev.schedule.freq || {count:1, unit:'months'}}}))}
                  className={`w-11 h-6 rounded-full relative transition ${v.schedule.recurring?'bg-gold-500':'bg-ink-600'}`}>
                  <span className={`absolute top-0.5 ${v.schedule.recurring?'left-[1.4rem]':'left-0.5'} w-5 h-5 rounded-full bg-ink-100 transition-all`}></span>
                </button>
              </div>
              {v.schedule.recurring && (
                <div className="grid grid-cols-3 gap-2 mt-3">
                  <div><label>Every</label><input type="number" min="1" value={v.schedule.freq?.count || 1} onChange={e=>setFreq('count', Math.max(1, +e.target.value))}/></div>
                  <div><label>Unit</label>
                    <select value={v.schedule.freq?.unit || 'months'} onChange={e=>setFreq('unit', e.target.value)}>
                      <option value="days">days</option><option value="weeks">weeks</option><option value="months">months</option><option value="years">years</option>
                    </select>
                  </div>
                  <div><label>Day (opt.)</label>
                    <select value={v.schedule.dayOfWeek} onChange={e=>setSched('dayOfWeek', e.target.value)}>
                      <option value="">—</option>
                      {['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(d=><option key={d} value={d}>{d}</option>)}
                    </select>
                  </div>
                </div>
              )}
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div><label>Last visit</label><input type="date" value={v.lastVisit||''} onChange={e=>setField('lastVisit', e.target.value)}/></div>
              <div><label>Next visit</label><input type="date" value={v.nextVisit||''} onChange={e=>setField('nextVisit', e.target.value)}/></div>
            </div>
            <div><label>Notes</label><textarea rows="3" value={v.notes||''} onChange={e=>setField('notes', e.target.value)} placeholder="Gate code, key location, what they're great/bad at…"/></div>
          </div>
          <div className="px-5 md:px-6 py-4 border-t border-ink-600 flex items-center justify-between gap-2 sticky bottom-0 bg-ink-850/95 backdrop-blur">
            {!isNew ? <Btn variant="danger" icon="trash" onClick={remove}>Delete</Btn> : <span/>}
            <div className="flex gap-2">
              <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
              <Btn icon="check" onClick={save}>{isNew?'Add vendor':'Save'}</Btn>
            </div>
          </div>
        </>
      );
    };

    /* ===================== MAINTENANCE ===================== */
    const MaintenanceView = () => {
      const ctx = useContext(Ctx);
      const { state, setModal } = ctx;
      const [tab, setTab] = useState('list'); // list | timeline
      const [query, setQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('all'); // all | overdue | soon | ok | none

      const sorted = useMemo(() => {
        return filterByScope(state.maintenance, ctx.propertyScope)
          .filter(m => {
            if (query) {
              const hay = `${m.name} ${m.notes||''} ${m.vendorHint||''}`.toLowerCase();
              if (!hay.includes(query.toLowerCase())) return false;
            }
            if (statusFilter !== 'all') {
              const n = daysUntil(maintenanceNextDue(m));
              const tone = n === null ? 'none' : n < 0 ? 'overdue' : n <= 30 ? 'soon' : 'ok';
              if (tone !== statusFilter) return false;
            }
            return true;
          })
          .sort((a,b) => {
            const an = daysUntil(maintenanceNextDue(a)) ?? 9e9;
            const bn = daysUntil(maintenanceNextDue(b)) ?? 9e9;
            return an - bn;
          });
      }, [state.maintenance, ctx.propertyScope, query, statusFilter]);

      const open = (t) => setModal(<TaskForm task={t} onClose={()=>setModal(null)} />);

      return (
        <div className="space-y-5 max-w-5xl">
          <div className="flex items-center justify-between gap-3">
            <p className="text-ink-300 text-sm hidden md:block max-w-2xl">Big-ticket recurring tasks. Mark complete and the next due date rolls forward automatically.</p>
            <Btn icon="plus" onClick={()=>open(null)}>Add task</Btn>
          </div>

          <div className="flex items-center gap-2 flex-wrap">
            <div className="inline-flex rounded-xl border border-ink-600 p-0.5 bg-ink-850">
              <button onClick={()=>setTab('list')}     className={`px-3.5 py-1.5 rounded-lg text-sm inline-flex items-center gap-2 ${tab==='list'?'bg-ink-700 text-ink-100':'text-ink-300'}`}><Icon name="list" size={14}/> List</button>
              <button onClick={()=>setTab('timeline')} className={`px-3.5 py-1.5 rounded-lg text-sm inline-flex items-center gap-2 ${tab==='timeline'?'bg-ink-700 text-ink-100':'text-ink-300'}`}><Icon name="calendar" size={14}/> 12-month timeline</button>
            </div>
            {tab === 'list' && (
              <div className="flex items-center gap-1.5 flex-wrap">
                {[['all','All'],['overdue','Overdue'],['soon','Due soon'],['ok','On track'],['none','No date']].map(([id,label]) => (
                  <button key={id} onClick={()=>setStatusFilter(id)}
                    className={`px-2.5 py-1.5 rounded-full text-xs border transition ${statusFilter===id?'border-gold-400/50 text-gold-300 bg-gold-400/10':'border-ink-600 text-ink-300 hover:text-ink-100'}`}>
                    {label}
                  </button>
                ))}
              </div>
            )}
          </div>

          {tab === 'list' && (
            <input type="search" value={query} onChange={e=>setQuery(e.target.value)}
              placeholder="Search tasks, notes, vendors…" className="max-w-sm" />
          )}

          {tab === 'list' ? (
            sorted.length === 0 ? (
              <Empty icon="wrench" title={query || statusFilter!=='all' ? 'No tasks match' : 'No tasks yet'}
                body={query || statusFilter!=='all' ? 'Try clearing the search or filter.' : 'Add your first recurring task and Home HQ will keep the schedule.'}
                cta={query || statusFilter!=='all'
                  ? <Btn variant="soft" onClick={()=>{setQuery(''); setStatusFilter('all');}}>Clear filters</Btn>
                  : <Btn variant="soft" icon="plus" onClick={()=>open(null)}>Add a task</Btn>} />
            ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              {sorted.map(m => <TaskCard key={m.id} m={m} onEdit={()=>open(m)} />)}
            </div>
            )
          ) : (
            <Timeline tasks={sorted} onPick={(m)=>open(m)} />
          )}
        </div>
      );
    };

    const TaskCard = ({ m, onEdit }) => {
      const ctx = useContext(Ctx);
      const next = maintenanceNextDue(m);
      const status = maintenanceStatus(m);
      const vendor = ctx.state.vendors.find(v => v.company === m.vendorHint);
      return (
        <div className="card p-4 md:p-5">
          <div className="flex items-start justify-between gap-3">
            <div className="min-w-0">
              <div className="text-sm font-medium leading-snug">{m.name}</div>
              <div className="text-ink-300 text-xs mt-0.5">{freqLabel(m.freq)}{m.estimatedCost?` · ~$${m.estimatedCost}`:''}</div>
            </div>
            <button onClick={onEdit} aria-label="Edit" title="Edit" className="w-9 h-9 rounded-lg grid place-items-center text-ink-300 hover:bg-ink-700 shrink-0"><Icon name="edit" size={15}/></button>
          </div>
          <div className="mt-3 flex items-center gap-2 flex-wrap">
            <Pill tone={status.tone} dot>{status.label}</Pill>
            <span className="text-ink-300 text-xs">Last: {fmtDate(m.lastCompleted)}</span>
            <span className="text-ink-400 text-xs">·</span>
            <span className={`text-xs ${daysUntil(next) !== null && daysUntil(next) < 0 ? 'text-ember-400' : 'text-ink-300'}`}>
              {daysUntil(next) !== null && daysUntil(next) < 0 ? `Was due: ${fmtDate(next)}` : `Next: ${fmtDate(next)}`}
            </span>
          </div>
          {(m.notes || vendor || m.vendorHint) && (
            <div className="mt-3 text-ink-300 text-xs leading-relaxed">
              {(vendor || m.vendorHint) && <div className="mb-1"><span className="text-ink-400">Vendor:</span> {vendor?.company || m.vendorHint}</div>}
              {m.notes && <div className="line-clamp-2">{m.notes}</div>}
            </div>
          )}
          <div className="divider my-4"/>
          <div className="flex items-center gap-2">
            <button onClick={()=>ctx.completeTask(m.id)}
              className="flex-1 inline-flex items-center justify-center gap-2 py-2 rounded-lg bg-sage-500/10 text-sage-400 hover:bg-sage-500/15 border border-sage-500/25 text-sm">
              <Icon name="check" size={15}/> Mark complete
            </button>
          </div>
        </div>
      );
    };

    const TaskForm = ({ task, onClose }) => {
      const ctx = useContext(Ctx);
      const isNew = !task;
      const scopeDefault = ctx.propertyScope && ctx.propertyScope !== 'both' ? ctx.propertyScope : '';
      const [t, setT] = useState(task || { name:'', freq:{count:1, unit:'years'}, lastCompleted: toISO(today()), estimatedCost:0, notes:'', vendorHint:'', property:scopeDefault });
      const setField = (k, val) => setT(prev => ({...prev, [k]: val}));
      const setFreq = (k, val) => setT(prev => ({...prev, freq: {...prev.freq, [k]: val}}));
      const save = () => {
        if (isNew) ctx.addTask(t); else ctx.updateTask(task.id, t);
        ctx.showToast(isNew?'Task added':'Task updated');
        onClose();
      };
      const remove = () => { if (window.confirm(`Delete ${task.name}?`)) { ctx.deleteTask(task.id); ctx.showToast('Task deleted'); onClose(); } };
      const vendors = ctx.state.vendors;
      return (
        <>
          <ModalHeader title={isNew?'Add maintenance task':'Edit task'} subtitle={isNew?'Recurring big-ticket items.':t.name} onClose={onClose} />
          <div className="p-5 md:p-6 space-y-4">
            <div><label>Task name</label><input value={t.name} onChange={e=>setField('name', e.target.value)} placeholder="e.g. Gutter cleaning"/></div>
            <div className="grid grid-cols-2 gap-3">
              <div><label>Every</label><input type="number" min="1" value={t.freq.count} onChange={e=>setFreq('count', Math.max(1, +e.target.value))}/></div>
              <div><label>Unit</label>
                <select value={t.freq.unit} onChange={e=>setFreq('unit', e.target.value)}>
                  <option value="days">days</option><option value="weeks">weeks</option><option value="months">months</option><option value="years">years</option>
                </select>
              </div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div><label>Last completed</label><input type="date" value={t.lastCompleted||''} onChange={e=>setField('lastCompleted', e.target.value)}/></div>
              <div><label>Est. cost ($)</label><input type="number" min="0" value={t.estimatedCost||0} onChange={e=>setField('estimatedCost', +e.target.value)}/></div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div><label>Preferred vendor</label>
                <select value={t.vendorHint||''} onChange={e=>setField('vendorHint', e.target.value)}>
                  <option value="">— none —</option>
                  {vendors.map(v => <option key={v.id} value={v.company}>{v.company} · {v.serviceType}</option>)}
                </select>
              </div>
              <div><label>Property</label>
                <select value={t.property||''} onChange={e=>setField('property', e.target.value)}>
                  <option value="">Both / unassigned</option>
                  <option value="1619 Seattle">1619 Seattle</option>
                  <option value="4322 Sun Valley">4322 Sun Valley</option>
                </select>
              </div>
            </div>
            <div><label>Notes</label><textarea rows="3" value={t.notes||''} onChange={e=>setField('notes', e.target.value)} placeholder="Anything specific (paint code, sealant brand, prep, etc.)"/></div>
            {!isNew && (
              <div className="card-soft p-3 flex items-center justify-between">
                <div className="text-ink-300 text-xs">Next due: <span className="text-ink-100">{fmtDate(maintenanceNextDue(t))}</span></div>
                <Btn variant="soft" icon="check" onClick={()=>{ ctx.completeTask(task.id); ctx.showToast('Marked complete'); onClose(); }}>Mark complete now</Btn>
              </div>
            )}
          </div>
          <div className="px-5 md:px-6 py-4 border-t border-ink-600 flex items-center justify-between gap-2 sticky bottom-0 bg-ink-850/95 backdrop-blur">
            {!isNew ? <Btn variant="danger" icon="trash" onClick={remove}>Delete</Btn> : <span/>}
            <div className="flex gap-2">
              <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
              <Btn icon="check" onClick={save}>{isNew?'Add task':'Save'}</Btn>
            </div>
          </div>
        </>
      );
    };

    const Timeline = ({ tasks, onPick }) => {
      const months = useMemo(() => {
        const arr = [];
        const start = new Date(today().getFullYear(), today().getMonth(), 1);
        for (let i=0; i<12; i++) {
          const m = new Date(start.getFullYear(), start.getMonth()+i, 1);
          arr.push(m);
        }
        return arr;
      }, []);
      const buckets = useMemo(() => {
        const map = months.map(()=>[]);
        tasks.forEach(t => {
          const next = maintenanceNextDue(t); if (!next) return;
          const d = parseDate(next);
          // Overdue from a prior month → surface in the current month instead of vanishing
          if (d < months[0]) { map[0].push(t); return; }
          months.forEach((m, i) => {
            const end = new Date(m.getFullYear(), m.getMonth()+1, 1);
            if (d >= m && d < end) map[i].push(t);
          });
        });
        return map;
      }, [tasks, months]);
      const unscheduled = useMemo(() => tasks.filter(t => !maintenanceNextDue(t)), [tasks]);
      const totalCost = (mIdx) => buckets[mIdx].reduce((acc,t)=>acc + (t.estimatedCost||0), 0);
      return (
        <div className="card p-4 md:p-5">
          <div className="text-ink-300 text-xs mb-3">Next 12 months — clusters help with budget planning. Tap a task to edit.</div>
          <div className="space-y-3">
            {months.map((m, i) => (
              <div key={i} className="flex gap-4 items-start">
                <div className="w-20 md:w-24 shrink-0 pt-1">
                  <div className="text-ink-100 text-sm font-medium">{m.toLocaleDateString(undefined,{month:'short'})}</div>
                  <div className="text-ink-400 text-[11px]">{m.getFullYear()}</div>
                  {totalCost(i) > 0 && <div className="text-gold-400 text-[11px] mt-0.5 tabular-nums">~${totalCost(i).toLocaleString()}</div>}
                </div>
                <div className="flex-1 min-h-[2rem] border-l border-dashed border-ink-600 pl-4 py-1">
                  {buckets[i].length === 0 ? (
                    <div className="text-ink-500 text-xs italic">—</div>
                  ) : (
                    <div className="flex flex-wrap gap-1.5">
                      {buckets[i].map(t => {
                        const status = maintenanceStatus(t);
                        return (
                          <button key={t.id} onClick={()=>onPick(t)}
                            className={`text-[12px] px-2.5 py-1 rounded-lg border inline-flex items-center gap-1.5 transition hover:translate-y-[-1px] ${
                              status.tone==='overdue' ? 'border-ember-500/30 text-ember-400 bg-ember-500/10' :
                              status.tone==='soon'    ? 'border-gold-400/30 text-gold-300 bg-gold-400/10' :

    const WineForm = ({ bottle, onClose }) => {

        const payload = { ...w,
          vintage: w.vintage ? +w.vintage : '',
          qty: Math.max(0, +w.qty || 0),
          price: +w.price || 0,
          drinkStart: w.drinkStart ? +w.drinkStart : '',
          drinkEnd: w.drinkEnd ? +w.drinkEnd : '',
        };

            {!isNew ? <Btn variant="danger" icon="trash" onClick={remove}>Remove</Btn> : <span/>}

    const WineCard = ({ w, onEdit, onOpen }) => {
      const st = wineState(w);
      const meta = WINE_STATE_META[st];
      const empty = (w.qty || 0) <= 0;
      return (
        <div className={`card p-4 md:p-5 ${empty ? 'opacity-60' : ''}`}>
          <div className="flex items-start justify-between gap-3">
            <div className="min-w-0">
              <div className="text-[11px] uppercase tracking-wider text-ink-400">{w.region || '—'}</div>
              <div className="font-display text-lg leading-tight mt-0.5">{w.producer}</div>
              <div className="text-ink-200 text-sm">{w.label}</div>
              <div className="text-ink-300 text-xs mt-1">{w.vintage} · {w.varietal}</div>
            </div>
            <button onClick={onEdit} aria-label="Edit" title="Edit" className="w-9 h-9 rounded-lg grid place-items-center text-ink-300 hover:bg-ink-700 shrink-0"><Icon name="edit" size={15}/></button>
          </div>
          <div className="mt-3 flex items-center gap-2 flex-wrap">
            <Pill tone={meta.tone} dot>
              {st === 'now' ? `peak ${w.drinkStart}–${w.drinkEnd}` : st === 'aging' ? `hold until ${w.drinkStart}` : `past peak (${w.drinkEnd})`}
            </Pill>
            <Pill tone="muted">{empty ? 'none left' : `×${w.qty}`}</Pill>
            {w.location && <span className="text-ink-400 text-xs">{w.location}</span>}
            {w.price ? <span className="text-ink-400 text-xs">${w.price}</span> : null}
          </div>
          {w.notes && <div className="text-ink-300 text-xs mt-3 line-clamp-2 leading-relaxed">{w.notes}</div>}
          <div className="divider my-4"/>
          <button onClick={onOpen} disabled={empty}
            className="w-full inline-flex items-center justify-center gap-2 py-2 rounded-lg bg-gold-400/10 text-gold-300 hover:bg-gold-400/15 border border-gold-400/25 text-sm disabled:opacity-40 disabled:cursor-not-allowed">
            <Icon name="wine" size={15}/> We opened one
          </button>
        </div>
      );
    };

    const WineView = () => {
      const ctx = useContext(Ctx);
      const { state, setModal } = ctx;
      const [filter, setFilter] = useState('all'); // all | now | aging | past
      const [query, setQuery] = useState('');
      const [pickIdx, setPickIdx] = useState(0);

      const bottles = state.wine || [];
      const counts = useMemo(() => {
        const c = { all: bottles.length, now:0, aging:0, past:0 };
        bottles.forEach(w => { c[wineState(w)]++; });
        return c;
      }, [bottles]);

      const filtered = useMemo(() => {
        return bottles
          .filter(w => filter === 'all' || wineState(w) === filter)
          .filter(w => {
            if (!query) return true;
            const hay = `${w.producer} ${w.label} ${w.varietal} ${w.region} ${w.notes||''}`.toLowerCase();
            return hay.includes(query.toLowerCase());
          })
          .sort((a,b) => (a.drinkEnd || 9999) - (b.drinkEnd || 9999));
      }, [bottles, filter, query]);

      // Tonight's pick: in window, in stock, closest to the end of its window,
      // skipping anything opened in the last 7 days so suggestions rotate.
      const picks = useMemo(() => {
        const recentIds = new Set(
          (state.wineLog||[])
            .filter(l => (Date.now() - new Date(l.openedAt).getTime()) < 7*24*3600*1000)
            .map(l => l.wineId)
        );
        const ready = bottles.filter(w => (w.qty||0) > 0 && wineState(w) === 'now');
        const fresh = ready.filter(w => !recentIds.has(w.id));
        return (fresh.length ? fresh : ready).sort((a,b) => (a.drinkEnd || 9999) - (b.drinkEnd || 9999));
      }, [bottles, state.wineLog]);
      const pick = picks.length ? picks[pickIdx % picks.length] : null;

      const openForm  = (w) => setModal(<WineForm bottle={w} onClose={()=>setModal(null)} />);
      const openLog   = (w) => setModal(<OpenBottleForm bottle={w} onClose={()=>setModal(null)} />);
      const recent = (state.wineLog || []).slice(0, 8);

      return (
        <div className="space-y-6 max-w-5xl">

            <p className="text-ink-300 text-sm hidden md:block max-w-2xl">The cellar. Log a bottle when you open it and the counts stay honest.</p>
            <Btn icon="plus" onClick={()=>openForm(null)}>Add bottle</Btn>
          </div>

          {/* Tonight's pick */}
          {pick && (
            <div className="card p-5 md:p-6 border-gold-400/25">
              <div className="flex items-start justify-between gap-4 flex-wrap">
                <div className="min-w-0">
                  <div className="text-[11px] uppercase tracking-[0.16em] text-gold-400 mb-1.5">What should we open tonight?</div>
                  <div className="font-display text-xl md:text-2xl leading-tight">{pick.vintage} {pick.producer} <span className="text-ink-200">{pick.label}</span></div>
                  <div className="text-ink-300 text-sm mt-1">
                    {pick.varietal} · {pick.region} · {pick.location}
                    {pick.drinkEnd ? <span className="text-ink-400"> — window closes {pick.drinkEnd}</span> : null}
                  </div>
                  {pick.notes && <div className="text-ink-300 text-xs mt-2 max-w-xl leading-relaxed">{pick.notes}</div>}
                </div>
                <div className="flex gap-2 shrink-0">
                  <Btn variant="ghost" onClick={()=>setPickIdx(i => i + 1)}>Another</Btn>
                  <Btn icon="wine" onClick={()=>openLog(pick)}>Open it</Btn>
                </div>
              </div>
            </div>
          )}

          {/* Filters + search — nothing to filter in an empty cellar */}
          {bottles.length > 0 && (
            <>
              <div className="flex items-center gap-1.5 flex-wrap">
                {[['all','All'],['now','Drink now'],['aging','Aging'],['past','Past peak']].map(([id,label]) => (
                  <button key={id} onClick={()=>setFilter(id)}
                    className={`px-2.5 py-1.5 rounded-full text-xs border transition ${filter===id?'border-gold-400/50 text-gold-300 bg-gold-400/10':'border-ink-600 text-ink-300 hover:text-ink-100'}`}>
                    {label} <span className="opacity-60 tabular-nums">{counts[id]}</span>
                  </button>
                ))}
              </div>
              <input type="search" value={query} onChange={e=>setQuery(e.target.value)}
                placeholder="Search producer, varietal, region…" className="max-w-sm" aria-label="Search the cellar" />
            </>
          )}

          {/* Bottles */}
          {filtered.length === 0 ? (
            <Empty icon="wine" title={query || filter !== 'all' ? 'No bottles match' : 'The cellar is empty'}
              body={query || filter !== 'all' ? 'Try clearing the search or filter.' : 'Add your first bottle and we’ll track its drink window.'}
              cta={query || filter !== 'all'
                ? <Btn variant="soft" onClick={()=>{setQuery(''); setFilter('all');}}>Clear filters</Btn>
                : <Btn variant="soft" icon="plus" onClick={()=>openForm(null)}>Add a bottle</Btn>} />
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
              {filtered.map(w => <WineCard key={w.id} w={w} onEdit={()=>openForm(w)} onOpen={()=>openLog(w)} />)}
            </div>

          {recent.length > 0 && (
            <section>
              <SectionHeader title="Recently opened" count={(state.wineLog||[]).length} hint="Tasting log — newest first." />
