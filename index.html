<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0d0b" />
  <title>Home HQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: {
              950: '#0a0907',
              900: '#0e0d0b',
              850: '#141210',
              800: '#181612',
              750: '#1d1b16',
              700: '#211f1a',
              600: '#2a2723',
              500: '#3a3631',
              400: '#5a554c',
              300: '#8b8478',
              200: '#bcb5a6',
              100: '#e8e2d4',
              50:  '#f5f0e3',
            },
            gold: {
              300: '#e6c895',
              400: '#d4a96a',
              500: '#c19654',
              600: '#a07a3e',
            },
            sage:   { 400: '#8aa78b', 500: '#6f8c70' },
            ember:  { 400: '#e07856', 500: '#c9603f' },
            amber2: { 400: '#d4a96a' },
          },
          fontFamily: {
            display: ['Fraunces', 'ui-serif', 'Georgia', 'serif'],
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    html, body { background: #0e0d0b; color: #e8e2d4; -webkit-font-smoothing: antialiased; }
    body { font-family: 'Inter', system-ui, sans-serif; font-feature-settings: "ss01","cv11"; }
    .font-display { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2723; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3631; }
    /* Subtle texture */
    .grain::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background-image: radial-gradient(rgba(255,255,255,0.012) 1px, transparent 1px);
      background-size: 3px 3px; opacity: .35; z-index: 0;
    }
    /* Card */
    .card {
      background: linear-gradient(180deg, #1a1814 0%, #181612 100%);
      border: 1px solid #2a2723;
      border-radius: 18px;
    }
    .card-soft {
      background: #161410;
      border: 1px solid #24211c;
      border-radius: 16px;
    }
    .btn-primary {
      background: linear-gradient(180deg,#d4a96a,#c19654);
      color: #1a140a;
      font-weight: 600;
    }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-ghost { background: transparent; color: #e8e2d4; }
    .btn-ghost:hover { background: #211f1a; }
    .pill { display: inline-flex; align-items: center; gap: .35rem; padding: .25rem .55rem; border-radius: 999px; font-size: .72rem; font-weight: 500; line-height: 1; }
    .pill-overdue { background: rgba(224,120,86,0.12); color: #e9886a; border: 1px solid rgba(224,120,86,0.28); }
    .pill-soon    { background: rgba(212,169,106,0.12); color: #e6c895; border: 1px solid rgba(212,169,106,0.25); }
    .pill-ok      { background: rgba(138,167,139,0.12); color: #a6c1a7; border: 1px solid rgba(138,167,139,0.25); }
    .pill-info    { background: rgba(140,160,200,0.10); color: #b5c2dc; border: 1px solid rgba(140,160,200,0.22); }
    .pill-muted   { background: #211f1a; color: #8b8478; border: 1px solid #2a2723; }
    .divider { height: 1px; background: linear-gradient(90deg, transparent, #2a2723, transparent); }
    input, select, textarea {
      background: #131210 !important; border: 1px solid #2a2723 !important; color: #e8e2d4 !important;
      border-radius: 12px; padding: .65rem .85rem; width: 100%; font-size: .95rem;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #c19654 !important; box-shadow: 0 0 0 3px rgba(193,150,84,.18); }
    label { font-size: .75rem; color: #8b8478; font-weight: 500; letter-spacing: .02em; text-transform: uppercase; margin-bottom: .35rem; display: block; }
    .modal-backdrop { background: rgba(8,7,5,0.7); backdrop-filter: blur(8px); }
    .modal-shell { background: #161410; border: 1px solid #2a2723; border-radius: 22px; }
    /* Anim */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }
    .anim-in { animation: fadeUp .25s ease-out both; }
    /* Hide scrollbar on horizontal chip rows */
    .no-bar::-webkit-scrollbar { display: none; }
    .no-bar { -ms-overflow-style: none; scrollbar-width: none; }
    /* iOS safe area */
    .pb-safe { padding-bottom: calc(.75rem + env(safe-area-inset-bottom)); }
    .pt-safe { padding-top: calc(.5rem + env(safe-area-inset-top)); }
  </style>
</head>
<body class="grain">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useRef, useCallback, createContext, useContext } = React;

    /* ---------- date helpers ---------- */
    const DAY = 1000*60*60*24;
    const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
    const parseDate = (s) => { if (!s) return null; const d = new Date(s+'T00:00:00'); return isNaN(d) ? null : d; };
    const toISO = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return x.toISOString().slice(0,10); };
    const daysBetween = (a, b) => Math.round((parseDate(b) - parseDate(a)) / DAY);
    const daysUntil = (s) => { const d = parseDate(s); if (!d) return null; return Math.round((d - today())/DAY); };
    const fmtDate = (s, opts) => {
      const d = parseDate(s); if (!d) return '—';
      return d.toLocaleDateString(undefined, opts || { month:'short', day:'numeric', year:'numeric' });
    };
    const fmtRelative = (s) => {
      const n = daysUntil(s); if (n === null) return '—';
      if (n === 0) return 'today';
      if (n === 1) return 'tomorrow';
      if (n === -1) return 'yesterday';
      if (n < 0) return `${Math.abs(n)} days overdue`;
      if (n < 7) return `in ${n} days`;
      if (n < 30) return `in ${Math.round(n/7)} wk`;
      if (n < 365) return `in ${Math.round(n/30)} mo`;
      return `in ${(n/365).toFixed(1)} yr`;
    };
    const addInterval = (iso, freq) => {
      const d = parseDate(iso); if (!d || !freq) return null;
      const n = freq.count || 1;
      const x = new Date(d);
      if (freq.unit === 'days') x.setDate(x.getDate()+n);
      else if (freq.unit === 'weeks') x.setDate(x.getDate()+n*7);
      else if (freq.unit === 'months') x.setMonth(x.getMonth()+n);
      else if (freq.unit === 'years') x.setFullYear(x.getFullYear()+n);
      return toISO(x);
    };
    const freqLabel = (f) => {
      if (!f) return '—';
      const u = f.count === 1 ? f.unit.replace(/s$/,'') : f.unit;
      return `every ${f.count} ${u}`;
    };
    const uid = () => Math.random().toString(36).slice(2,10);

    /* ---------- icons (inline SVG, hairline weight) ---------- */
    const Icon = ({ name, size=18, className='' }) => {
      const props = { width:size, height:size, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:1.6, strokeLinecap:'round', strokeLinejoin:'round', className };
      const paths = {
        home:        <><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></>,
        users:       <><circle cx="9" cy="8" r="3.2"/><path d="M2.5 19c.7-3.1 3.4-5 6.5-5s5.8 1.9 6.5 5"/><circle cx="17" cy="9" r="2.6"/><path d="M21.5 18c-.4-2.2-2-3.6-4.5-3.6"/></>,
        wrench:      <><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4 2.5-2.5z"/></>,
        cube:        <><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></>,
        wine:        <><path d="M8 3h8l-1 7a4 4 0 1 1-6 0l-1-7z"/><path d="M12 17v4"/><path d="M9 21h6"/></>,
        plus:        <><path d="M12 5v14"/><path d="M5 12h14"/></>,
        sparkles:    <><path d="M12 4v3M12 17v3M4 12h3M17 12h3M6.3 6.3l2.1 2.1M15.6 15.6l2.1 2.1M6.3 17.7l2.1-2.1M15.6 8.4l2.1-2.1"/></>,
        phone:       <><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.7.6 2.5a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.8.3 1.6.5 2.5.6a2 2 0 0 1 1.7 2z"/></>,
        message:     <><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></>,
        mail:        <><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></>,
        edit:        <><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></>,
        trash:       <><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6 18 20a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></>,
        check:       <><path d="m5 12 5 5L20 7"/></>,
        calendar:    <><rect x="3" y="4.5" width="18" height="17" rx="2"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></>,
        list:        <><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r=".8"/><circle cx="3.5" cy="12" r=".8"/><circle cx="3.5" cy="18" r=".8"/></>,
        clock:       <><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></>,
        x:           <><path d="M6 6l12 12M18 6 6 18"/></>,
        chevR:       <><path d="m9 6 6 6-6 6"/></>,
        dot:         <circle cx="12" cy="12" r="3"/>,
        filter:      <><path d="M3 5h18"/><path d="M6 12h12"/><path d="M10 19h4"/></>,
        leaf:        <><path d="M5 21c0-9 7-16 16-16-1 9-7 15-16 16z"/><path d="M5 21c4-4 7-7 16-16"/></>,
        copy:        <><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></>,
        search:      <><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></>,
        shield:      <><path d="M12 3 4 6v6c0 4.5 3.2 8.4 8 9 4.8-.6 8-4.5 8-9V6l-8-3z"/></>,
        zap:         <><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></>,
        receipt:     <><path d="M5 3v18l3-2 3 2 3-2 3 2 3-2V3l-3 2-3-2-3 2-3-2-3 2z"/><path d="M9 9h6M9 13h6M9 17h4"/></>,
        key:         <><circle cx="8" cy="15" r="4"/><path d="m10.8 12.8 8.2-8.2 2 2-2 2 2 2-2 2-2-2-2 2"/></>,
        car:         <><path d="M5 17h14M3 13l2-6a2 2 0 0 1 2-1.5h10a2 2 0 0 1 2 1.5l2 6"/><path d="M3 13v5a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-2M21 13v5a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-2"/><circle cx="7.5" cy="14.5" r="1"/><circle cx="16.5" cy="14.5" r="1"/></>,
        heart:       <><path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.6l-1-1a5.5 5.5 0 0 0-7.8 7.8L12 22l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></>,
        link:        <><path d="M10 14a4 4 0 0 0 5.6 0l3-3a4 4 0 0 0-5.6-5.6l-1 1"/><path d="M14 10a4 4 0 0 0-5.6 0l-3 3a4 4 0 0 0 5.6 5.6l1-1"/></>,
        building:    <><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 8h.01M15 8h.01M9 12h.01M15 12h.01M9 16h.01M15 16h.01M10 21v-4h4v4"/></>,
        more:        <><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></>,
      };
      return <svg {...props}>{paths[name] || null}</svg>;
    };

    /* ---------- storage ---------- */
    const STORAGE_KEY = 'homehq.public.v1';
    const loadState = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch { return null; }
    };
    const saveState = (state) => {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
    };

    /* ---------- seed data ---------- */
    const todayISO = toISO(today());
    const offsetISO = (n) => toISO(new Date(today().getTime() + n*DAY));

    const seedVendors = [];

    const seedMaintenance = [];

    const seedAppliances = [];

    /* ---------- NEW MODULE SEEDS ---------- */
    const seedInsurance = [];

    const seedVehicles = [];

    const seedUtilities = [];

    const seedProperty = [];

    const seedSubscriptions = [];

    const seedBenefits = [];

    const seedWine = [];

    const initialState = {
      vendors: seedVendors,
      maintenance: seedMaintenance,
      appliances: seedAppliances,
      wine: seedWine,
      wineLog: [],
      insurance: seedInsurance,
      vehicles: seedVehicles,
      utilities: seedUtilities,
      property: seedProperty,
      subscriptions: seedSubscriptions,
      benefits: seedBenefits,
    };

    /* ---------- derived helpers ---------- */
    const maintenanceNextDue = (m) => addInterval(m.lastCompleted, m.freq);
    const maintenanceStatus = (m) => {
      const due = maintenanceNextDue(m);
      const n = daysUntil(due);
      if (n === null) return { tone:'muted', label:'no date' };
      if (n < 0) return { tone:'overdue', label:`${Math.abs(n)}d overdue` };
      if (n <= 30) return { tone:'soon', label:`due in ${n}d` };
      return { tone:'ok', label:`in ${n}d` };
    };
    const wineState = (w) => {
      const y = new Date().getFullYear();
      if (y < (w.drinkStart || 0)) return 'aging';
      if (y > (w.drinkEnd || 9999)) return 'past';
      return 'now';
    };

    /* ---------- App ---------- */
    const Ctx = createContext(null);

    const App = () => {
      const [state, setState] = useState(() => {
        const saved = loadState();
        const base = window.__SHARED_INIT__ || initialState;
        if (!saved) return base;
        // Migration: add new modules if user is on an older version
        const migrated = { ...saved };
        ['insurance','vehicles','utilities','property','subscriptions','benefits'].forEach(k => {
          if (!Array.isArray(migrated[k])) migrated[k] = base[k];
        });
        if (!Array.isArray(migrated.wineLog)) migrated.wineLog = [];
        return migrated;
      });
      const [view, setView] = useState('dashboard');
      const [modal, setModal] = useState(null);
      const [toast, setToast] = useState(null);

      useEffect(() => { saveState(state); }, [state]);

      const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(null), 2400); };

      // generic CRUD factory for the new flat-list modules
      const mk = (key) => ({
        add:    (item)        => setState(s => ({...s, [key]:[{...item, id:uid()}, ...(s[key]||[])]})),
        update: (id, patch)   => setState(s => ({...s, [key]: (s[key]||[]).map(x => x.id===id?{...x,...patch}:x)})),
        delete: (id)          => setState(s => ({...s, [key]: (s[key]||[]).filter(x => x.id!==id)})),
      });
      const insOps  = mk('insurance');
      const vehOps  = mk('vehicles');
      const utiOps  = mk('utilities');
      const proOps  = mk('property');
      const subOps  = mk('subscriptions');
      const benOps  = mk('benefits');

      const ctx = {
        state, setState, view, setView, modal, setModal, showToast,
        // vendors
        addVendor: (v) => setState(s => ({...s, vendors:[{...v, id:uid()}, ...s.vendors]})),
        updateVendor: (id, patch) => setState(s => ({...s, vendors: s.vendors.map(v => v.id===id?{...v,...patch}:v)})),
        deleteVendor: (id) => setState(s => ({...s, vendors: s.vendors.filter(v => v.id!==id)})),
        // maintenance
        addTask: (t) => setState(s => ({...s, maintenance:[{...t, id:uid()}, ...s.maintenance]})),
        updateTask: (id, patch) => setState(s => ({...s, maintenance: s.maintenance.map(t => t.id===id?{...t,...patch}:t)})),
        deleteTask: (id) => setState(s => ({...s, maintenance: s.maintenance.filter(t => t.id!==id)})),
        completeTask: (id) => setState(s => ({...s, maintenance: s.maintenance.map(t => t.id===id ? {...t, lastCompleted: todayISO} : t)})),
        // appliances
        addAppliance: (a) => setState(s => ({...s, appliances:[{...a, id:uid()}, ...s.appliances]})),
        updateAppliance: (id, patch) => setState(s => ({...s, appliances: s.appliances.map(a => a.id===id?{...a,...patch}:a)})),
        deleteAppliance: (id) => setState(s => ({...s, appliances: s.appliances.filter(a => a.id!==id)})),
        // wine
        addBottle: (w) => setState(s => ({...s, wine:[{...w, id:uid()}, ...s.wine]})),
        updateBottle: (id, patch) => setState(s => ({...s, wine: s.wine.map(w => w.id===id?{...w,...patch}:w)})),
        deleteBottle: (id) => setState(s => ({...s, wine: s.wine.filter(w => w.id!==id)})),
        // new modules
        addInsurance: insOps.add, updateInsurance: insOps.update, deleteInsurance: insOps.delete,
        addVehicle: vehOps.add, updateVehicle: vehOps.update, deleteVehicle: vehOps.delete,
        addUtility: utiOps.add, updateUtility: utiOps.update, deleteUtility: utiOps.delete,
        addProperty: proOps.add, updateProperty: proOps.update, deleteProperty: proOps.delete,
        addSubscription: subOps.add, updateSubscription: subOps.update, deleteSubscription: subOps.delete,
        addBenefit: benOps.add, updateBenefit: benOps.update, deleteBenefit: benOps.delete,
        // reset
        resetAll: () => { setState(initialState); showToast('Reset to seed data'); },
      };

      return (
        <Ctx.Provider value={ctx}>
          <div className="min-h-screen relative">
            <Shell view={view} setView={setView}>
              {view === 'dashboard'    && <DashboardView />}
              {view === 'vendors'      && <VendorsView />}
              {view === 'maintenance'  && <MaintenanceView />}
              {view === 'appliances'   && <AppliancesView />}
              {view === 'insurance'    && <InsuranceView />}
              {view === 'property'     && <PropertyView />}
              {view === 'utilities'    && <UtilitiesView />}
              {view === 'subscriptions'&& <SubscriptionsView />}
              {view === 'vehicles'     && <VehiclesView />}
              {view === 'benefits'     && <BenefitsView />}
              {view === 'wine'         && <PlaceholderView title="Wine Cellar" subtitle="Coming after Appliances — drink-now, aging, pairings." icon="wine" />}
            </Shell>
            {modal && <Modal onClose={()=>setModal(null)}>{modal}</Modal>}
            {toast && <Toast>{toast}</Toast>}
          </div>
        </Ctx.Provider>
      );
    };

    /* ---------- Shell ---------- */
    const NAV_PRIMARY = [
      { id:'dashboard',   label:'Today',       icon:'home' },
      { id:'vendors',     label:'Vendors',     icon:'users' },
      { id:'maintenance', label:'Maintenance', icon:'wrench' },
      { id:'appliances',  label:'Appliances',  icon:'cube' },
    ];
    const NAV_RECORDS = [
      { id:'insurance',     label:'Insurance',     icon:'shield' },
      { id:'property',      label:'Property',      icon:'key' },
      { id:'utilities',     label:'Utilities',     icon:'zap' },
      { id:'subscriptions', label:'Subscriptions', icon:'receipt' },
      { id:'vehicles',      label:'Vehicles',      icon:'car' },
      { id:'benefits',      label:'Benefits',      icon:'heart' },
    ];
    const NAV_OTHER = [
      { id:'wine',        label:'Wine',        icon:'wine' },
    ];
    const NAV_ALL = [...NAV_PRIMARY, ...NAV_RECORDS, ...NAV_OTHER];
    // Mobile bottom nav: 5 most used + "More"
    const NAV_MOBILE = [...NAV_PRIMARY, { id:'_more', label:'More', icon:'more' }];

    const Shell = ({ view, setView, children }) => {
      const [moreOpen, setMoreOpen] = useState(false);
      const greeting = (() => {
        const h = new Date().getHours();
        if (h < 5) return 'Late night';
        if (h < 12) return 'Good morning';
        if (h < 17) return 'Good afternoon';
        if (h < 21) return 'Good evening';
        return 'Good evening';
      })();
      const nice = new Date().toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
      const title = NAV_ALL.find(n=>n.id===view)?.label || '';

      const NavLink = ({ n }) => (
        <button onClick={()=>setView(n.id)}
          className={`w-full flex items-center gap-3 px-3 py-2 rounded-xl text-sm transition ${view===n.id?'bg-ink-700 text-ink-50':'text-ink-300 hover:text-ink-100 hover:bg-ink-800'}`}>
          <Icon name={n.icon} size={17} className={view===n.id?'text-gold-400':''} />
          <span>{n.label}</span>
          {view===n.id && <span className="ml-auto w-1.5 h-1.5 rounded-full bg-gold-400" />}
        </button>
      );

      return (
        <div className="min-h-screen relative z-10 md:flex">
          {/* Side rail (desktop) */}
          <aside className="hidden md:flex md:flex-col md:w-60 md:shrink-0 md:h-screen md:sticky md:top-0 border-r border-ink-600 bg-ink-900/80 backdrop-blur">
            <div className="px-6 pt-7 pb-5">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 grid place-items-center text-ink-900 font-display font-semibold">H</div>
                <div className="font-display text-lg tracking-tight">Home HQ</div>
              </div>
            </div>
            <nav className="px-3 mt-2 flex-1 overflow-y-auto">
              {NAV_PRIMARY.map(n => <NavLink key={n.id} n={n} />)}
              <div className="px-3 pt-4 pb-1.5 text-[10px] uppercase tracking-[0.18em] text-ink-400">Records</div>
              {NAV_RECORDS.map(n => <NavLink key={n.id} n={n} />)}
              <div className="px-3 pt-4 pb-1.5 text-[10px] uppercase tracking-[0.18em] text-ink-400">Pleasure</div>
              {NAV_OTHER.map(n => <NavLink key={n.id} n={n} />)}
            </nav>
            <div className="px-6 py-5 text-[11px] text-ink-400 leading-relaxed">
              <div className="font-display text-ink-200 text-sm mb-1">The McCullum house</div>
              <div>v0.2 · local data</div>
            </div>
          </aside>

          {/* Main */}
          <main className="flex-1 min-w-0 pb-24 md:pb-12">
            {/* Top bar */}
            <header className="px-5 md:px-10 pt-safe md:pt-10">
              <div className="md:hidden flex items-center justify-between mb-4">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 grid place-items-center text-ink-900 font-display font-semibold">H</div>
                  <div className="font-display text-base tracking-tight">Home HQ</div>
                </div>
                <div className="text-[11px] uppercase tracking-wider text-ink-400">{nice}</div>
              </div>
              <div className="md:flex md:items-end md:justify-between md:gap-6">
                <div>
                  <div className="hidden md:block text-[11px] uppercase tracking-[0.18em] text-ink-400 mb-2">{nice}</div>
                  <h1 className="font-display text-3xl md:text-[2.4rem] tracking-tight leading-tight">
                    {view === 'dashboard' ? <>{greeting}, <span className="text-gold-400">Justin.</span></> : title}
                  </h1>
                  {view === 'dashboard' && <p className="text-ink-300 text-sm md:text-base mt-1.5 max-w-xl">A calm view of the household. Take a look — anything that needs attention is right here.</p>}
                </div>
              </div>
            </header>

            <section className="px-5 md:px-10 mt-6 md:mt-8">
              {children}
            </section>
          </main>

          {/* Bottom nav (mobile) */}
          <nav className="md:hidden fixed bottom-0 inset-x-0 bg-ink-900/95 backdrop-blur border-t border-ink-600 z-30 pb-safe">
            <div className="flex justify-around">
              {NAV_MOBILE.map(n => {
                const active = n.id === '_more' ? false : view === n.id;
                return (
                  <button key={n.id} onClick={()=> n.id==='_more' ? setMoreOpen(true) : setView(n.id)}
                    className={`flex-1 flex flex-col items-center justify-center py-2.5 gap-1 ${active?'text-gold-400':'text-ink-300'}`}>
                    <Icon name={n.icon} size={20} />
                    <span className="text-[10px] tracking-wide">{n.label}</span>
                  </button>
                );
              })}
            </div>
          </nav>

          {/* Mobile "More" sheet */}
          {moreOpen && (
            <div className="md:hidden fixed inset-0 z-40 modal-backdrop flex items-end" onClick={()=>setMoreOpen(false)}>
              <div className="modal-shell w-full anim-in" onClick={e=>e.stopPropagation()}>
                <ModalHeader title="More" subtitle="Records & references" onClose={()=>setMoreOpen(false)} />
                <div className="p-4 grid grid-cols-2 gap-2.5 pb-safe">
                  {[...NAV_RECORDS, ...NAV_OTHER].map(n => (
                    <button key={n.id} onClick={()=>{ setView(n.id); setMoreOpen(false); }}
                      className={`card-soft p-4 flex items-center gap-3 text-left ${view===n.id?'border-gold-400/40':''}`}>
                      <div className="w-10 h-10 rounded-xl bg-ink-700 grid place-items-center text-gold-400 shrink-0">
                        <Icon name={n.icon} size={18} />
                      </div>
                      <div className="text-sm font-medium">{n.label}</div>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    /* ---------- shared UI ---------- */
    const SectionHeader = ({ title, count, action, hint }) => (
      <div className="flex items-end justify-between mb-3">
        <div>
          <div className="flex items-baseline gap-2">
            <h2 className="font-display text-xl md:text-2xl tracking-tight">{title}</h2>
            {typeof count === 'number' && <span className="text-ink-400 text-sm tabular-nums">{count}</span>}
          </div>
          {hint && <div className="text-ink-400 text-xs mt-0.5">{hint}</div>}
        </div>
        {action}
      </div>
    );

    const Pill = ({ tone='muted', children, dot=false }) => (
      <span className={`pill pill-${tone}`}>
        {dot && <span className="w-1.5 h-1.5 rounded-full bg-current opacity-80" />}
        {children}
      </span>
    );

    const Empty = ({ icon='sparkles', title, body, cta }) => (
      <div className="card p-8 text-center">
        <div className="mx-auto w-12 h-12 rounded-2xl bg-ink-700 grid place-items-center text-gold-400 mb-3">
          <Icon name={icon} size={22} />
        </div>
        <div className="font-display text-lg">{title}</div>
        {body && <div className="text-ink-300 text-sm mt-1.5 max-w-md mx-auto">{body}</div>}
        {cta && <div className="mt-4">{cta}</div>}
      </div>
    );

    const Modal = ({ children, onClose }) => {
      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        document.body.style.overflow = 'hidden';
        return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
      }, [onClose]);
      return (
        <div className="fixed inset-0 z-50 modal-backdrop flex items-end md:items-center justify-center px-3 md:px-6 pb-3 md:pb-0">
          <div className="modal-shell w-full max-w-lg max-h-[90vh] overflow-y-auto anim-in" onClick={e=>e.stopPropagation()}>
            {children}
          </div>
        </div>
      );
    };

    const ModalHeader = ({ title, subtitle, onClose }) => (
      <div className="flex items-start justify-between p-5 md:p-6 border-b border-ink-600 sticky top-0 bg-ink-850/95 backdrop-blur">
        <div>
          <div className="font-display text-xl tracking-tight">{title}</div>
          {subtitle && <div className="text-ink-300 text-sm mt-0.5">{subtitle}</div>}
        </div>
        <button onClick={onClose} className="w-9 h-9 rounded-full grid place-items-center text-ink-300 hover:bg-ink-700 hover:text-ink-100">
          <Icon name="x" size={18} />
        </button>
      </div>
    );

    const Toast = ({ children }) => (
      <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 anim-in">
        <div className="card px-4 py-2.5 text-sm flex items-center gap-2 shadow-2xl">
          <Icon name="check" size={16} className="text-sage-400" />
          <span>{children}</span>
        </div>
      </div>
    );

    const Btn = ({ variant='primary', icon, children, ...rest }) => (
      <button {...rest}
        className={`inline-flex items-center justify-center gap-2 px-3.5 py-2 rounded-xl text-sm font-medium transition ${
          variant==='primary' ? 'btn-primary' :
          variant==='soft'    ? 'bg-ink-700 hover:bg-ink-600 text-ink-100' :
          variant==='ghost'   ? 'btn-ghost border border-ink-600' :
          variant==='danger'  ? 'bg-ember-500/15 text-ember-400 hover:bg-ember-500/20 border border-ember-500/30' :
          ''
        } ${rest.className||''}`}>
        {icon && <Icon name={icon} size={16} />}
        {children}
      </button>
    );

    /* ===================== DASHBOARD ===================== */
    const DashboardView = () => {
      const ctx = useContext(Ctx);
      const { state, setView, setModal } = ctx;

      const overdue = useMemo(() => {
        const items = [];
        // maintenance
        state.maintenance.forEach(m => {
          const next = maintenanceNextDue(m);
          const n = daysUntil(next);
          if (n !== null && n < 0) items.push({ kind:'maint', id:m.id, title:m.name, when:next, n });
        });
        // vendors next visit overdue
        state.vendors.forEach(v => {
          if (v.nextVisit && daysUntil(v.nextVisit) < 0) items.push({ kind:'vendor', id:v.id, title:`${v.serviceType} — ${v.company}`, when:v.nextVisit, n:daysUntil(v.nextVisit), sub:v.name });
        });
        // warranties expired
        state.appliances.forEach(a => {
          const n = daysUntil(a.warrantyExpires);
          if (n !== null && n < 0) items.push({ kind:'warranty', id:a.id, title:`${a.name} warranty`, when:a.warrantyExpires, n });
        });
        return items.sort((a,b)=>a.n-b.n);
      }, [state]);

      const upcoming = useMemo(() => {
        const items = [];
        state.maintenance.forEach(m => {
          const next = maintenanceNextDue(m);
          const n = daysUntil(next);
          if (n !== null && n >= 0 && n <= 30) items.push({ kind:'maint', id:m.id, title:m.name, when:next, n, sub:`~$${m.estimatedCost}` });
        });
        state.vendors.forEach(v => {
          const n = daysUntil(v.nextVisit);
          if (n !== null && n >= 0 && n <= 30) items.push({ kind:'vendor', id:v.id, title:`${v.serviceType} — ${v.company}`, when:v.nextVisit, n, sub:v.name });
        });
        // property dues in next 30 days
        (state.property || []).forEach(p => {
          const n = daysUntil(p.nextDue);
          if (n !== null && n >= 0 && n <= 30) items.push({ kind:'property', id:p.id, title:p.label, when:p.nextDue, n, sub:p.cadence ? `${p.cadence}${p.amount?` · $${p.amount}`:''}` : '' });
        });
        // subscription renewals in next 30 days
        (state.subscriptions || []).forEach(s => {
          const n = daysUntil(s.renewalDate);
          if (n !== null && n >= 0 && n <= 30) items.push({ kind:'sub', id:s.id, title:s.name, when:s.renewalDate, n, sub:s.cost?`$${s.cost} ${s.cadence}`:'' });
        });
        return items.sort((a,b)=>a.n-b.n);
      }, [state]);

      const warranties = useMemo(() => {
        return state.appliances
          .filter(a => { const n = daysUntil(a.warrantyExpires); return n !== null && n >= 0 && n <= 90; })
          .sort((a,b) => daysUntil(a.warrantyExpires) - daysUntil(b.warrantyExpires));
      }, [state]);

      const renewals = useMemo(() => {
        return (state.insurance || [])
          .filter(p => { const n = daysUntil(p.renewalDate); return n !== null && n >= 0 && n <= 60; })
          .sort((a,b) => daysUntil(a.renewalDate) - daysUntil(b.renewalDate));
      }, [state]);

      const drinkNow = useMemo(() => state.wine.filter(w => wineState(w) === 'now').slice(0, 3), [state]);

      const generateDigest = () => {
        const lines = [];
        const datestr = new Date().toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
        lines.push(`Home HQ — Weekly digest · ${datestr}`);
        lines.push('');
        if (overdue.length) {
          lines.push(`⚠︎ Overdue (${overdue.length})`);
          overdue.slice(0,8).forEach(i => lines.push(`  • ${i.title} — ${Math.abs(i.n)}d overdue`));
          lines.push('');
        }
        if (upcoming.length) {
          lines.push(`Coming up — next 30 days (${upcoming.length})`);
          upcoming.slice(0,12).forEach(i => lines.push(`  • ${i.title} — ${fmtRelative(i.when)} (${fmtDate(i.when,{month:'short',day:'numeric'})})`));
          lines.push('');
        }
        if (renewals.length) {
          lines.push(`Insurance renewals — next 60 days (${renewals.length})`);
          renewals.forEach(p => lines.push(`  • ${p.carrier} ${p.type} — ${fmtDate(p.renewalDate,{month:'short',day:'numeric',year:'numeric'})}`));
          lines.push('');
        }
        if (warranties.length) {
          lines.push(`Warranties expiring — next 90 days (${warranties.length})`);
          warranties.forEach(a => lines.push(`  • ${a.name} — ${fmtDate(a.warrantyExpires,{month:'short',day:'numeric',year:'numeric'})}`));
          lines.push('');
        }
        if (drinkNow.length) {
          lines.push(`Drink now (${drinkNow.length})`);
          drinkNow.forEach(w => lines.push(`  • ${w.vintage} ${w.producer} ${w.label} — ${w.location} (×${w.qty})`));
          lines.push('');
        }
        const totalCost = upcoming.filter(i=>i.kind==='maint').reduce((acc,i)=>{
          const m = state.maintenance.find(x=>x.id===i.id); return acc + (m?.estimatedCost||0);
        },0);
        if (totalCost) lines.push(`Estimated maintenance cost in next 30 days: ~$${totalCost.toLocaleString()}`);
        const text = lines.join('\n');
        setModal(<DigestModal text={text} onClose={()=>setModal(null)} />);
      };

      return (
        <div className="space-y-8 max-w-5xl">

          {/* Tile row: stats */}
          <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
            <StatTile label="Overdue"      value={overdue.length}  tone="overdue" hint="needs attention" />
            <StatTile label="Next 30 days" value={upcoming.length} tone="soon"    hint="upcoming" />
            <StatTile label="Renewals"     value={renewals.length} tone="info"    hint="≤ 60 days" />
            <StatTile label="Warranties"   value={warranties.length} tone="info"  hint="≤ 90 days" />
            <StatTile label="Drink now"    value={drinkNow.length} tone="ok"      hint="in window" />
          </div>

          {/* Generate digest */}
          <div className="card p-5 md:p-6 flex items-center justify-between gap-4">
            <div>
              <div className="font-display text-lg tracking-tight">This week's digest</div>
              <div className="text-ink-300 text-sm mt-1">A clean, forwardable summary of everything that needs attention.</div>
            </div>
            <Btn icon="sparkles" onClick={generateDigest}>Generate</Btn>
          </div>

          {/* Overdue */}
          <section>
            <SectionHeader title="Overdue" count={overdue.length} hint="Roll these forward when they're done." />
            {overdue.length === 0 ? (
              <Empty icon="check" title="Nothing overdue" body="Great — the house is caught up. New items will surface here as they fall behind."/>
            ) : (
              <div className="grid md:grid-cols-2 gap-3">
                {overdue.map(i => <DashboardItem key={i.kind+i.id} item={i} kind="overdue" onComplete={i.kind==='maint' ? ()=>{ ctx.completeTask(i.id); ctx.showToast('Marked complete'); } : null} onJump={()=> setView(i.kind==='maint'?'maintenance':i.kind==='vendor'?'vendors':'appliances')} />)}
              </div>
            )}
          </section>

          {/* Coming up */}
          <section>
            <SectionHeader title="Coming up" count={upcoming.length} hint="Next 30 days — maintenance, vendors, dues, subscriptions." />
            {upcoming.length === 0 ? (
              <Empty icon="calendar" title="The next 30 days are clear" body="Nothing to prep. Add or edit a vendor, task, or subscription and it'll show up here." />
            ) : (
              <div className="grid md:grid-cols-2 gap-3">
                {upcoming.map(i => <DashboardItem key={i.kind+i.id} item={i} kind="soon"
                  onJump={()=> setView(
                    i.kind==='maint'?'maintenance':
                    i.kind==='vendor'?'vendors':
                    i.kind==='property'?'property':
                    i.kind==='sub'?'subscriptions':
                    'appliances'
                  )} />)}
              </div>
            )}
          </section>

          {/* Insurance renewals */}
          <section>
            <SectionHeader title="Insurance renewals" count={renewals.length} hint="Within 60 days — review coverage + premium." />
            {renewals.length === 0 ? (
              <Empty icon="shield" title="No insurance renewals on the cliff" body="When a policy is within 60 days of renewal, it'll appear here." />
            ) : (
              <div className="grid md:grid-cols-2 gap-3">
                {renewals.map(p => (
                  <button key={p.id} onClick={()=>setView('insurance')} className="card p-4 text-left flex items-start gap-3 hover:border-gold-400/40 transition">
                    <div className="w-10 h-10 rounded-xl bg-ink-700 grid place-items-center text-gold-400 shrink-0"><Icon name="shield" size={18}/></div>
                    <div className="min-w-0 flex-1">
                      <div className="text-sm font-medium truncate">{p.carrier} <span className="text-ink-300 font-normal">· {p.type}</span></div>
                      <div className="text-ink-300 text-xs mt-0.5 truncate">{p.coverageSummary || p.policyNumber || '—'}</div>
                      <div className="mt-2 flex items-center gap-2">
                        <Pill tone="soon" dot>Renews {fmtDate(p.renewalDate)}</Pill>
                        <span className="text-ink-400 text-xs">{fmtRelative(p.renewalDate)}</span>
                      </div>
                    </div>
                  </button>
                ))}
              </div>
            )}
          </section>

          {/* Warranties */}
          <section>
            <SectionHeader title="Warranties expiring" count={warranties.length} hint="Within 90 days — time to evaluate or extend." />
            {warranties.length === 0 ? (
              <Empty icon="cube" title="No warranties on the cliff" body="When something's within 90 days of expiring, it'll appear here so you can decide whether to extend." />
            ) : (
              <div className="grid md:grid-cols-2 gap-3">
                {warranties.map(a => (
                  <div key={a.id} className="card p-4 flex items-start gap-3">
                    <div className="w-10 h-10 rounded-xl bg-ink-700 grid place-items-center text-gold-400 shrink-0"><Icon name="cube" size={18}/></div>
                    <div className="min-w-0 flex-1">
                      <div className="text-sm font-medium truncate">{a.name}</div>
                      <div className="text-ink-300 text-xs mt-0.5 truncate">{a.brand} {a.model} · {a.room}</div>
                      <div className="mt-2 flex items-center gap-2">
                        <Pill tone="soon" dot>Expires {fmtDate(a.warrantyExpires)}</Pill>
                        <span className="text-ink-400 text-xs">{fmtRelative(a.warrantyExpires)}</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </section>

          {/* Drink now */}
          <section>
            <SectionHeader title="Drink now" count={drinkNow.length} hint="In their peak window — open something tonight." />
            {drinkNow.length === 0 ? (
              <Empty icon="wine" title="No bottles in window" body="Add wines with drink windows and we'll surface 2–3 here when they're ready." />
            ) : (
              <div className="grid md:grid-cols-3 gap-3">
                {drinkNow.map(w => (
                  <div key={w.id} className="card p-4">
                    <div className="text-[11px] uppercase tracking-wider text-ink-400 mb-1">{w.region}</div>
                    <div className="font-display text-base leading-snug">{w.producer}</div>
                    <div className="text-ink-200 text-sm">{w.label}</div>
                    <div className="text-ink-300 text-xs mt-1">{w.vintage} · {w.varietal}</div>
                    <div className="mt-3 flex items-center justify-between">
                      <Pill tone="ok" dot>peak {w.drinkStart}–{w.drinkEnd}</Pill>
                      <span className="text-ink-400 text-xs">{w.location} · ×{w.qty}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </section>
        </div>
      );
    };

    const StatTile = ({ label, value, tone, hint }) => (
      <div className="card p-4 md:p-5 flex flex-col gap-1.5">
        <div className="text-[11px] uppercase tracking-[0.16em] text-ink-400">{label}</div>
        <div className="flex items-baseline gap-2">
          <div className={`font-display text-3xl md:text-4xl tabular-nums ${
            tone==='overdue' ? 'text-ember-400' :
            tone==='soon'    ? 'text-gold-400'  :
            tone==='ok'      ? 'text-sage-400'  :
            'text-ink-100'
          }`}>{value}</div>
          {hint && <div className="text-ink-400 text-xs">{hint}</div>}
        </div>
      </div>
    );

    const DashboardItem = ({ item, kind, onComplete, onJump }) => (
      <div className="card p-4 flex items-start gap-3">
        <div className={`w-10 h-10 rounded-xl grid place-items-center shrink-0 ${kind==='overdue'?'bg-ember-500/12 text-ember-400':'bg-ink-700 text-gold-400'}`}>
          <Icon name={
            item.kind==='maint'?'wrench':
            item.kind==='vendor'?'users':
            item.kind==='property'?'key':
            item.kind==='sub'?'receipt':
            'cube'
          } size={18} />
        </div>
        <div className="min-w-0 flex-1">
          <div className="text-sm font-medium truncate">{item.title}</div>
          {item.sub && <div className="text-ink-300 text-xs mt-0.5 truncate">{item.sub}</div>}
          <div className="mt-2 flex items-center gap-2 flex-wrap">
            <Pill tone={kind==='overdue'?'overdue':'soon'} dot>{kind==='overdue'?`${Math.abs(item.n)}d overdue`:fmtRelative(item.when)}</Pill>
            <span className="text-ink-400 text-xs">{fmtDate(item.when,{month:'short',day:'numeric'})}</span>
          </div>
        </div>
        <div className="flex flex-col gap-1.5">
          {onComplete && <button onClick={onComplete} title="Mark done" className="w-9 h-9 rounded-lg grid place-items-center text-sage-400 hover:bg-ink-700"><Icon name="check" size={16}/></button>}
          <button onClick={onJump} title="Open" className="w-9 h-9 rounded-lg grid place-items-center text-ink-300 hover:bg-ink-700"><Icon name="chevR" size={16}/></button>
        </div>
      </div>
    );

    const DigestModal = ({ text, onClose }) => {
      const [copied, setCopied] = useState(false);
      const copy = async () => {
        try { await navigator.clipboard.writeText(text); setCopied(true); setTimeout(()=>setCopied(false), 1500); } catch {}
      };
      const mailto = () => {
        const url = `mailto:?subject=${encodeURIComponent("Home HQ weekly digest")}&body=${encodeURIComponent(text)}`;
        window.location.href = url;
      };
      return (
        <>
          <ModalHeader title="This week's digest" subtitle="Forward this to yourself or your spouse." onClose={onClose} />
          <div className="p-5 md:p-6">
            <textarea readOnly value={text} className="font-mono text-[12.5px] leading-relaxed h-72 resize-none" />
            <div className="flex items-center justify-end gap-2 mt-4">
              <Btn variant="ghost" icon="mail" onClick={mailto}>Email</Btn>
              <Btn icon="copy" onClick={copy}>{copied ? 'Copied' : 'Copy'}</Btn>
            </div>
          </div>
        </>
      );
    };

    /* ===================== VENDORS ===================== */
    const VendorsView = () => {
      const ctx = useContext(Ctx);
      const { state, setModal } = ctx;
      const [filter, setFilter] = useState('all');
      const [thisWeek, setThisWeek] = useState(false);
      const [query, setQuery] = useState('');

      const types = useMemo(() => {
        const set = new Set(state.vendors.map(v => v.serviceType));
        return ['all', ...Array.from(set).sort()];
      }, [state.vendors]);

      const filtered = useMemo(() => {
        return state.vendors.filter(v => {
          if (filter !== 'all' && v.serviceType !== filter) return false;
          if (thisWeek) { const n = daysUntil(v.nextVisit); if (n === null || n < 0 || n > 7) return false; }
          if (query) {
            const q = query.toLowerCase();

    const VendorForm = ({ vendor, onClose }) => {
      const ctx = useContext(Ctx);
      const isNew = !vendor;

      });

      const setSched = (k, val) => setV(prev => ({...prev, schedule: {...prev.schedule, [k]: val}}));
      const setFreq = (k, val) => setV(prev => ({...prev, schedule: {...prev.schedule, freq: {...prev.schedule.freq, [k]: val}}}));

        const payload = {...v};

              <div><label>Company</label><input value={v.company} onChange={e=>setField('company',e.target.value)} placeholder="Castillo Cleaning"/></div>

            <div className="grid grid-cols-2 gap-3">

        return [...state.maintenance].sort((a,b) => {
          const an = daysUntil(maintenanceNextDue(a)) ?? 9e9;

        <div className="space-y-5 max-w-5xl">

            <button onClick={()=>setTab('timeline')} className={`px-3.5 py-1.5 rounded-lg text-sm inline-flex items-center gap-2 ${tab==='timeline'?'bg-ink-700 text-ink-100':'text-ink-300'}`}><Icon name="calendar" size={14}/> 12-month timeline</button>

          {tab === 'list' ? (

            <Timeline tasks={sorted} onPick={(m)=>open(m)} />

    const TaskCard = ({ m, onEdit }) => {
      const ctx = useContext(Ctx);
      const next = maintenanceNextDue(m);
      const status = maintenanceStatus(m);
      const vendor = ctx.state.vendors.find(v => v.company === m.vendorHint);
      return (
        <div className="card p-4 md:p-5">
          <div className="flex items-start justify-between gap-3">
            <div className="min-w-0">
              <div className="text-sm font-medium leading-snug">{m.name}</div>
              <div className="text-ink-300 text-xs mt-0.5">{freqLabel(m.freq)}{m.estimatedCost?` · ~$${m.estimatedCost}`:''}</div>
            </div>
            <button onClick={onEdit} className="w-9 h-9 rounded-lg grid place-items-center text-ink-300 hover:bg-ink-700 shrink-0"><Icon name="edit" size={15}/></button>
          </div>
          <div className="mt-3 flex items-center gap-2 flex-wrap">

          {(m.notes || vendor || m.vendorHint) && (
            <div className="mt-3 text-ink-300 text-xs leading-relaxed">
              {(vendor || m.vendorHint) && <div className="mb-1"><span className="text-ink-400">Vendor:</span> {vendor?.company || m.vendorHint}</div>}
              {m.notes && <div className="line-clamp-2">{m.notes}</div>}
            </div>
          )}
          <div className="divider my-4"/>
          <div className="flex items-center gap-2">
            <button onClick={()=>{ ctx.completeTask(m.id); ctx.showToast(`Completed: ${m.name}`); }}
              className="flex-1 inline-flex items-center justify-center gap-2 py-2 rounded-lg bg-sage-500/10 text-sage-400 hover:bg-sage-500/15 border border-sage-500/25 text-sm">
              <Icon name="check" size={15}/> Mark complete
            </button>
          </div>
        </div>
      );
    };

    const TaskForm = ({ task, onClose }) => {
      const ctx = useContext(Ctx);
      const isNew = !task;
      const [t, setT] = useState(task || { name:'', freq:{count:1, unit:'years'}, lastCompleted: todayISO, estimatedCost:0, notes:'', vendorHint:'' });
      const setField = (k, val) => setT(prev => ({...prev, [k]: val}));
      const setFreq = (k, val) => setT(prev => ({...prev, freq: {...prev.freq, [k]: val}}));
      const save = () => {
        if (isNew) ctx.addTask(t); else ctx.updateTask(task.id, t);
        ctx.showToast(isNew?'Task added':'Task updated');
        onClose();
      };
      const remove = () => { if (window.confirm(`Delete ${task.name}?`)) { ctx.deleteTask(task.id); ctx.showToast('Task deleted'); onClose(); } };
      const vendors = ctx.state.vendors;
      return (
        <>
          <ModalHeader title={isNew?'Add maintenance task':'Edit task'} subtitle={isNew?'Recurring big-ticket items.':t.name} onClose={onClose} />
          <div className="p-5 md:p-6 space-y-4">
            <div><label>Task name</label><input value={t.name} onChange={e=>setField('name', e.target.value)} placeholder="e.g. Gutter cleaning"/></div>
            <div className="grid grid-cols-2 gap-3">
              <div><label>Every</label><input type="number" min="1" value={t.freq.count} onChange={e=>setFreq('count', Math.max(1, +e.target.value))}/></div>
              <div><label>Unit</label>
                <select value={t.freq.unit} onChange={e=>setFreq('unit', e.target.value)}>
                  <option value="days">days</option><option value="weeks">weeks</option><option value="months">months</option><option value="years">years</option>

              </div>

              <div className="card-soft p-3 flex items-center justify-between">

            <div className="flex gap-2">
              <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
              <Btn icon="check" onClick={save}>{isNew?'Add task':'Save'}</Btn>
            </div>
          </div>
        </>
      );
    };

    const Timeline = ({ tasks, onPick }) => {
      const months = useMemo(() => {
        const arr = [];
        const start = new Date(today().getFullYear(), today().getMonth(), 1);
        for (let i=0; i<12; i++) {
          const m = new Date(start.getFullYear(), start.getMonth()+i, 1);
          arr.push(m);
        }
        return arr;
      }, []);
      const buckets = useMemo(() => {
        const map = months.map(()=>[]);
        tasks.forEach(t => {
          const next = maintenanceNextDue(t); if (!next) return;
          const d = parseDate(next);
          months.forEach((m, i) => {
            const end = new Date(m.getFullYear(), m.getMonth()+1, 1);
            if (d >= m && d < end) map[i].push(t);
          });
        });
        return map;
      }, [tasks, months]);
      const totalCost = (mIdx) => buckets[mIdx].reduce((acc,t)=>acc + (t.estimatedCost||0), 0);
      return (
        <div className="card p-4 md:p-5">
          <div className="text-ink-300 text-xs mb-3">Next 12 months — clusters help with budget planning. Tap a task to edit.</div>
          <div className="space-y-3">
            {months.map((m, i) => (
              <div key={i} className="flex gap-4 items-start">
                <div className="w-20 md:w-24 shrink-0 pt-1">
                  <div className="text-ink-100 text-sm font-medium">{m.toLocaleDateString(undefined,{month:'short'})}</div>
                  <div className="text-ink-400 text-[11px]">{m.getFullYear()}</div>
                  {totalCost(i) > 0 && <div className="text-gold-400 text-[11px] mt-0.5 tabular-nums">~${totalCost(i).toLocaleString()}</div>}
                </div>
                <div className="flex-1 min-h-[2rem] border-l border-dashed border-ink-600 pl-4 py-1">
                  {buckets[i].length === 0 ? (
                    <div className="text-ink-500 text-xs italic">—</div>
                  ) : (
                    <div className="flex flex-wrap gap-1.5">
                      {buckets[i].map(t => {
                        const status = maintenanceStatus(t);
                        return (
                          <button key={t.id} onClick={()=>onPick(t)}
                            className={`text-[12px] px-2.5 py-1 rounded-lg border inline-flex items-center gap-1.5 transition hover:translate-y-[-1px] ${
                              status.tone==='overdue' ? 'border-ember-500/30 text-ember-400 bg-ember-500/10' :
                              status.tone==='soon'    ? 'border-gold-400/30 text-gold-300 bg-gold-400/10' :
                                                        'border-ink-600 text-ink-200 bg-ink-800'
                            }`}>
                            <span className="w-1.5 h-1.5 rounded-full bg-current opacity-70"/>
                            {t.name}
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    /* ===================== APPLIANCES ===================== */
    const AppliancesView = () => {
      const ctx = useContext(Ctx);
      const { state, setModal } = ctx;
      const [query, setQuery] = useState('');
      const [filter, setFilter] = useState('all');

      const rooms = useMemo(() => {
        const set = new Set(state.appliances.map(a => a.room).filter(Boolean));

      const filtered = useMemo(() => {
        return state.appliances.filter(a => {
          if (filter !== 'all' && a.room !== filter) return false;
          if (query) {
            const q = query.toLowerCase();
            if (!`${a.name} ${a.brand} ${a.model} ${a.serial||''} ${a.notes||''}`.toLowerCase().includes(q)) return false;
          }
          return true;
        });
      }, [state.appliances, filter, query]);

      const open = (a) => setModal(<ApplianceForm appliance={a} onClose={()=>setModal(null)} />);

      return (
        <div className="space-y-5 max-w-5xl">

            <Btn icon="plus" onClick={()=>open(null)}>Add appliance</Btn>
          </div>
          <div className="flex items-center gap-2">
            <div className="relative flex-1">
              <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-ink-400" />
              <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search appliances, models, serials…" className="!pl-9" />
            </div>
          </div>
          <div className="flex gap-2 overflow-x-auto no-bar -mx-1 px-1">

              <button key={r} onClick={()=>setFilter(r)}
                className={`shrink-0 px-3 py-1.5 rounded-full text-xs border transition ${filter===r ? 'bg-ink-100 text-ink-900 border-ink-100' : 'border-ink-600 text-ink-200 hover:bg-ink-800'}`}>
                {r === 'all' ? 'All rooms' : r}

            <div className="grid md:grid-cols-2 gap-3">

    const ApplianceForm = ({ appliance, onClose }) => {

      const monthly = useMemo(() => {
        return list.reduce((acc, s) => acc + (s.cost || 0) / (s.cadence === 'annual' ? 12 : 1), 0);

      return (
        <div className="space-y-5 max-w-5xl">

            <div className="card-soft p-3 flex items-center justify-between">

    async function decryptShared(password) {
      const data = Uint8Array.from(atob(ENCRYPTED_BLOB), c => c.charCodeAt(0));
      const salt = data.slice(0, 16);
      const nonce = data.slice(16, 28);
      const ct = data.slice(28);
      const enc = new TextEncoder();
      const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
        km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: nonce }, key, ct);
      return JSON.parse(new TextDecoder().decode(pt));
    }
    const UnlockScreen = ({ onUnlock }) => {
      const [pw, setPw] = useState('');
      const [busy, setBusy] = useState(false);
      const [err, setErr] = useState(null);
      const submit = async (e) => {
        e?.preventDefault();
        if (!pw || busy) return;
        setBusy(true); setErr(null);
        try { onUnlock(await decryptShared(pw)); }
        catch (ex) { setErr("Password didn't work. Try again."); setBusy(false); }
      };
      return (
        <div className="min-h-screen relative z-10 flex items-center justify-center px-6">
          <form onSubmit={submit} className="card p-8 md:p-10 w-full max-w-sm anim-in">
            <div className="flex items-center gap-3 mb-6">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 grid place-items-center text-ink-900 font-display font-semibold text-lg">H</div>
              <div>
                <div className="font-display text-xl tracking-tight leading-none">Home HQ</div>
                <div className="text-ink-400 text-[11px] uppercase tracking-wider mt-1">Private dashboard</div>
              </div>
            </div>
            <div className="text-ink-200 text-sm mb-1">Welcome.</div>
            <div className="text-ink-300 text-sm mb-5">Enter the password to view.</div>
            <input type="password" autoFocus value={pw} onChange={e => setPw(e.target.value)} placeholder="Password" disabled={busy} />
            {err && <div className="text-ember-400 text-xs mt-2">{err}</div>}
            <button type="submit" disabled={busy || !pw} className="btn-primary w-full mt-4 px-3.5 py-2.5 rounded-xl text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed">
              {busy ? 'Unlocking…' : 'View dashboard'}
            </button>
          </form>
        </div>
      );
    };
    const SharedRoot = () => {
      const [decrypted, setDecrypted] = useState(null);
      if (!decrypted) return <UnlockScreen onUnlock={(s) => { window.__SHARED_INIT__ = s; setDecrypted(s); }} />;
      return <App />;
    };

    root.render(<SharedRoot />);
  </script>
