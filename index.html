    html, body { background: #0e0d0b; color: #e8e2d4; -webkit-font-smoothing: antialiased; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2723; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3631; }
    /* Subtle texture */
    .grain::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;

      background: #161410;
      border: 1px solid #24211c;
      border-radius: 16px;

    .pill-muted   { background: #211f1a; color: #8b8478; border: 1px solid #2a2723; }
    .divider { height: 1px; background: linear-gradient(90deg, transparent, #2a2723, transparent); }
    input, select, textarea {
      background: #131210 !important; border: 1px solid #2a2723 !important; color: #e8e2d4 !important;
      border-radius: 12px; padding: .65rem .85rem; width: 100%; font-size: .95rem; min-height: 44px;
    }
    input[type="checkbox"], input[type="radio"] { min-height: 0; width: auto; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #c19654 !important; box-shadow: 0 0 0 3px rgba(193,150,84,.18); }
    button:focus-visible, a:focus-visible { outline: 2px solid #c19654; outline-offset: 2px; border-radius: 8px; }
    label { font-size: .75rem; color: #8b8478; font-weight: 500; letter-spacing: .02em; text-transform: uppercase; margin-bottom: .35rem; display: block; }
    .modal-backdrop { background: rgba(8,7,5,0.7); backdrop-filter: blur(8px); }
    .modal-shell { background: #161410; border: 1px solid #2a2723; border-radius: 22px; }
    /* Anim */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }
    .anim-in { animation: fadeUp .25s ease-out both; }
    /* Hide scrollbar on horizontal chip rows */
    .no-bar::-webkit-scrollbar { display: none; }
    .no-bar { -ms-overflow-style: none; scrollbar-width: none; }

    .pb-safe { padding-bottom: calc(.75rem + env(safe-area-inset-bottom)); }

  <!-- Pinned to Babel 7: unversioned "latest" broke the app when unpkg began serving
       Babel 8 (preset-react now defaults to the automatic runtime, which emits import
       statements that can't run in a plain <script>). Do not unpin. -->

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useRef, useCallback, createContext, useContext } = React;

    /* ---------- date helpers ---------- */
    const DAY = 1000*60*60*24;
    const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
    const parseDate = (s) => { if (!s) return null; const d = new Date(s+'T00:00:00'); return isNaN(d) ? null : d; };
    const toISO = (d) => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };
    const daysBetween = (a, b) => Math.round((parseDate(b) - parseDate(a)) / DAY);
    const daysUntil = (s) => { const d = parseDate(s); if (!d) return null; return Math.round((d - today())/DAY); };
    const fmtDate = (s, opts) => {
      const d = parseDate(s); if (!d) return '—';
      return d.toLocaleDateString(undefined, opts || { month:'short', day:'numeric', year:'numeric' });
    };
    const fmtRelative = (s) => {
      const n = daysUntil(s); if (n === null) return '—';
      if (n === 0) return 'today';
      if (n === 1) return 'tomorrow';
      if (n === -1) return 'yesterday';
      if (n < 0) return `${Math.abs(n)} days overdue`;
      if (n < 7) return `in ${n} days`;
      if (n < 30) return `in ${Math.round(n/7)} wk`;
      if (n < 365) return `in ${Math.round(n/30)} mo`;
      return `in ${(n/365).toFixed(1)} yr`;
    };
    const addInterval = (iso, freq) => {
      const d = parseDate(iso); if (!d || !freq) return null;
      const n = freq.count || 1;
      const x = new Date(d);
      if (freq.unit === 'days') x.setDate(x.getDate()+n);
      else if (freq.unit === 'weeks') x.setDate(x.getDate()+n*7);
      else if (freq.unit === 'months') x.setMonth(x.getMonth()+n);
      else if (freq.unit === 'years') x.setFullYear(x.getFullYear()+n);
      return toISO(x);
    };
    const freqLabel = (f) => {
      if (!f) return '—';
      const u = f.count === 1 ? f.unit.replace(/s$/,'') : f.unit;
      return `every ${f.count} ${u}`;
    };
    const uid = () => Math.random().toString(36).slice(2,10);

    // Box only honors session cookies on shared-link embeds (/s/<id>).
    // /file/<id> and /folder/<id> embed endpoints fall back to anonymous CAPTCHA,
    // so we treat those as "open in new tab" instead of inline-previewable.
    const toBoxEmbed = (url) => {
      if (!url) return null;
      try {
        const u = new URL(url);
        if (!u.hostname.endsWith('box.com')) return null;
        const m = u.pathname.match(/^\/s\/([^/]+)/);
        if (m) return `https://app.box.com/embed/s/${m[1]}`;
      } catch {}
      return null;
    };

    const isBoxLink = (url) => {
      try { return new URL(url).hostname.endsWith('box.com'); } catch { return false; }
    };

    /* ---------- Box upload (per-section + catchall folders) ---------- */
    // Storage keys for the Box upload feature
    const BOX_TOKEN_STORAGE   = 'homehq.boxToken';        // dev token (60-min expiry)
    const BOX_TOKEN_EXP_STORAGE = 'homehq.boxTokenExp';   // unix ms when token expires
    const BOX_FOLDERS_STORAGE = 'homehq.boxFolders.v1';   // {inbox, vendors, ...} folder IDs

    // Default folder mapping — all uploads land in Inbox unless a per-section folder is configured.
    // User can edit IDs in BoxSettingsModal. `inbox` is the catchall.
    const DEFAULT_BOX_FOLDERS = {
      inbox: '',          // catchall — required for uploads to work
      vendors: '',
      maintenance: '',
      appliances: '',
      insurance: '',
      property: '',
      vehicles: '',
      benefits: '',
      utilities: '',
    };

    const loadBoxFolders = () => {
      try {
        const raw = localStorage.getItem(BOX_FOLDERS_STORAGE);
        if (!raw) return { ...DEFAULT_BOX_FOLDERS };
        return { ...DEFAULT_BOX_FOLDERS, ...JSON.parse(raw) };
      } catch { return { ...DEFAULT_BOX_FOLDERS }; }
    };
    const saveBoxFolders = (f) => {
      try { localStorage.setItem(BOX_FOLDERS_STORAGE, JSON.stringify(f)); } catch {}
    };
    const loadBoxToken = () => {
      try {
        const tok = localStorage.getItem(BOX_TOKEN_STORAGE);
        const exp = parseInt(localStorage.getItem(BOX_TOKEN_EXP_STORAGE) || '0', 10);
        if (!tok) return { token: '', expired: true };
        const expired = exp ? Date.now() > exp : false;
        return { token: tok, expired, exp };
      } catch { return { token: '', expired: true }; }
    };
    const saveBoxToken = (token) => {
      try {
        if (token) {
          localStorage.setItem(BOX_TOKEN_STORAGE, token);
          // Default 55 min expiry (dev tokens last 60 min — buffer for clock skew)
          localStorage.setItem(BOX_TOKEN_EXP_STORAGE, String(Date.now() + 55 * 60 * 1000));
        } else {
          localStorage.removeItem(BOX_TOKEN_STORAGE);
          localStorage.removeItem(BOX_TOKEN_EXP_STORAGE);
        }
      } catch {}
    };

    // Pick the destination folder for an entity kind, fallback to inbox
    const pickBoxFolder = (folders, kind) => {
      if (!folders) return '';
      const specific = folders[kind];
      if (specific && String(specific).trim()) return String(specific).trim();
      return String(folders.inbox || '').trim();
    };

    // Upload a file to Box via dev token. Returns { id, name, sharedUrl } or throws.
    // Uses the upload API + creates a shared link so the asset becomes embeddable in our preview modal.
    const uploadFileToBox = async (file, folderId, token) => {
      if (!file) throw new Error('No file selected');
      if (!folderId) throw new Error('No Box folder configured. Open Box Settings to add an Inbox folder ID.');
      if (!token) throw new Error('No Box token. Open Box Settings to paste a 60-min dev token.');

      // Derive a clean filename — prefix with date so uploads sort nicely in Box
      const ts = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
      const ext = (file.name.match(/\.[A-Za-z0-9]+$/)?.[0]) || (file.type === 'image/jpeg' ? '.jpg' : (file.type === 'image/png' ? '.png' : ''));
      const baseName = file.name.replace(/\.[A-Za-z0-9]+$/, '') || 'photo';
      const name = `${ts}__${baseName}${ext}`;

      // 1) Upload — POST multipart to upload.box.com
      const fd = new FormData();
      fd.append('attributes', JSON.stringify({ name, parent: { id: String(folderId) } }));
      fd.append('file', file, name);
      const upRes = await fetch('https://upload.box.com/api/2.0/files/content', {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` },
        body: fd,
      });
      if (!upRes.ok) {
        const txt = await upRes.text().catch(() => '');
        throw new Error(`Upload failed (${upRes.status}): ${txt.slice(0, 240)}`);
      }
      const upJson = await upRes.json();
      const fileObj = (upJson.entries && upJson.entries[0]) || upJson;
      const fileId = fileObj.id;
      if (!fileId) throw new Error('Upload returned no file id');

      // 2) Create shared link so we can render inline + share the URL
      let sharedUrl = '';
      try {
        const shRes = await fetch(`https://api.box.com/2.0/files/${fileId}`, {
          method: 'PUT',
          headers: {
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ shared_link: { access: 'open' } }),
        });
        if (shRes.ok) {
          const shJson = await shRes.json();
          sharedUrl = shJson?.shared_link?.url || '';
        }
      } catch {}
      // Fallback to a regular file URL if shared link failed
      if (!sharedUrl) sharedUrl = `https://app.box.com/file/${fileId}`;
      return { id: fileId, name, sharedUrl };
    };


    /* ---------- icons (inline SVG, hairline weight) ---------- */

      const paths = {

        users:       <><circle cx="9" cy="8" r="3.2"/><path d="M2.5 19c.7-3.1 3.4-5 6.5-5s5.8 1.9 6.5 5"/><circle cx="17" cy="9" r="2.6"/><path d="M21.5 18c-.4-2.2-2-3.6-4.5-3.6"/></>,
        wrench:      <><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4 2.5-2.5z"/></>,
        cube:        <><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></>,
        wine:        <><path d="M8 3h8l-1 7a4 4 0 1 1-6 0l-1-7z"/><path d="M12 17v4"/><path d="M9 21h6"/></>,
        plus:        <><path d="M12 5v14"/><path d="M5 12h14"/></>,
        sparkles:    <><path d="M12 4v3M12 17v3M4 12h3M17 12h3M6.3 6.3l2.1 2.1M15.6 15.6l2.1 2.1M6.3 17.7l2.1-2.1M15.6 8.4l2.1-2.1"/></>,
        phone:       <><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.7.6 2.5a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.8.3 1.6.5 2.5.6a2 2 0 0 1 1.7 2z"/></>,
        message:     <><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></>,

        receipt:     <><path d="M5 3v18l3-2 3 2 3-2 3 2 3-2V3l-3 2-3-2-3 2-3-2-3 2z"/><path d="M9 9h6M9 13h6M9 17h4"/></>,
        key:         <><circle cx="8" cy="15" r="4"/><path d="m10.8 12.8 8.2-8.2 2 2-2 2 2 2-2 2-2-2-2 2"/></>,
        car:         <><path d="M5 17h14M3 13l2-6a2 2 0 0 1 2-1.5h10a2 2 0 0 1 2 1.5l2 6"/><path d="M3 13v5a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-2M21 13v5a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-2"/><circle cx="7.5" cy="14.5" r="1"/><circle cx="16.5" cy="14.5" r="1"/></>,
        heart:       <><path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.6l-1-1a5.5 5.5 0 0 0-7.8 7.8L12 22l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></>,
        folder:      <><path d="M3 6.5a2 2 0 0 1 2-2h4l2 2.2h8a2 2 0 0 1 2 2v8.8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></>,
        link:        <><path d="M10 14a4 4 0 0 0 5.6 0l3-3a4 4 0 0 0-5.6-5.6l-1 1"/><path d="M14 10a4 4 0 0 0-5.6 0l-3 3a4 4 0 0 0 5.6 5.6l1-1"/></>,
        building:    <><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 8h.01M15 8h.01M9 12h.01M15 12h.01M9 16h.01M15 16h.01M10 21v-4h4v4"/></>,

        chart:       <><path d="M3 21V3"/><path d="M3 21h18"/><path d="M7 17V11"/><path d="M12 17V7"/><path d="M17 17V13"/></>,
        camera:      <><path d="M3 7a2 2 0 0 1 2-2h2.5l1.5-2h6l1.5 2H19a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></>,
        upload:      <><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2"/></>,
        gear:        <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></>,
      };
      return <svg {...props}>{paths[name] || null}</svg>;
    };

    /* ---------- storage ---------- */
    const STORAGE_KEY = 'homehq.shared.v1';
    const SCOPE_KEY = 'homehq.scope';
    const loadState = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch { return null; }
    };
    const saveState = (state) => {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
    };
    const loadScope = () => {
      try { return localStorage.getItem(SCOPE_KEY) || 'both'; } catch { return 'both'; }
    };
    const saveScope = (scope) => {
      try { localStorage.setItem(SCOPE_KEY, scope); } catch {}
    };

    /* ---------- property scope ---------- */
    const PROPERTIES = [
      { id:'both',           label:'Both',       short:'Both' },
      { id:'1619 Seattle',   label:'Seattle',    short:'Seattle' },
      { id:'4322 Sun Valley',label:'Sun Valley', short:'Sun Valley' },
    ];
    // Returns true if an item belongs to the given scope.
    // - scope='both' shows everything

      if (n === null) return { tone:'muted', label:'no date' };
      if (n < 0) return { tone:'overdue', label:`${Math.abs(n)}d overdue` };
      if (n <= 30) return { tone:'soon', label:`due in ${n}d` };
      return { tone:'ok', label:`in ${n}d` };
    };
    const wineState = (w) => {
      const y = new Date().getFullYear();
      if (y < (w.drinkStart || 0)) return 'aging';
      if (y > (w.drinkEnd || 9999)) return 'past';
      return 'now';
    };

    /* ---------- App ---------- */
    const Ctx = createContext(null);

    /* Error boundary — one bad module should show a recovery card, not a blank page. */
    class ErrorBoundary extends React.Component {
      constructor(props){ super(props); this.state = { error: null }; }
      static getDerivedStateFromError(error){ return { error }; }
      componentDidCatch(error, info){ try { console.error('HomeHQ crash:', error, info); } catch {} }
      render(){
        if (this.state.error) {
          return (
            <div className="min-h-screen relative z-10 flex items-center justify-center px-6">
              <div className="card p-8 w-full max-w-md anim-in">
                <div className="font-display text-xl tracking-tight mb-2">Something went wrong</div>
                <div className="text-ink-300 text-sm leading-relaxed mb-3">
                  The app hit an error while rendering. Reloading usually fixes it. If it keeps happening,
                  reset the saved data on this device — the built-in entries come back, but edits made on this device are cleared.
                </div>
                <div className="text-ember-400 text-[11px] font-mono mb-5 break-all">{String((this.state.error && this.state.error.message) || this.state.error)}</div>
                <div className="flex gap-2">
                  <button onClick={()=>window.location.reload()} className="btn-primary px-3.5 py-2 rounded-xl text-sm font-medium">Reload</button>
                  <button onClick={()=>{ if (window.confirm('Reset saved data on this device? Edits made on this device will be lost.')) { try { localStorage.removeItem(STORAGE_KEY); } catch {} window.location.reload(); } }}
                    className="px-3.5 py-2 rounded-xl text-sm bg-ink-700 hover:bg-ink-600 text-ink-200">Reset data</button>
                </div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const App = () => {
      const [state, setState] = useState(() => {
        const saved = loadState();
        if (!saved && window.__SHARED_INIT__) return window.__SHARED_INIT__;
        if (!saved) return initialState;
        // Migration: merge-with-defaults FIRST so any key added in newer builds
        // (wine, portfolio, future modules) is auto-backfilled — a stale save can
        // never crash the app by missing a top-level key.
        const migrated = { ...initialState, ...saved };
        const ENTITY_KEYS = ['vendors','maintenance','appliances','wine','insurance','vehicles','utilities','property','subscriptions','benefits','files'];
        ENTITY_KEYS.forEach(k => {
          if (!Array.isArray(migrated[k])) migrated[k] = initialState[k];
        });
        // Merge fresh `links` from master into existing entries (by id) when missing.
        ['vendors','maintenance','appliances','insurance','vehicles','property','benefits'].forEach(k => {
          const baseList = initialState[k] || [];
          if (!baseList.length) return;
          const baseById = Object.fromEntries(baseList.map(x => [x.id, x]));
          migrated[k] = (migrated[k]||[]).map(item => {
            const b = baseById[item.id];
            if (b && Array.isArray(b.links) && b.links.length && (!item.links || item.links.length === 0)) {
              return { ...item, links: b.links };
            }
            return item;
          });
        });
        if (!Array.isArray(migrated.wineLog)) migrated.wineLog = [];
        if (!Array.isArray(migrated.completedLog)) migrated.completedLog = [];
        // One-time: drop UHC, ensure Blue Cross CA is present
        if (Array.isArray(migrated.benefits)) {
          const hasUHC = migrated.benefits.some(b => b.id === 'b-uhc');
          const hasBCCA = migrated.benefits.some(b => b.id === 'b-bcca');
          if (hasUHC || !hasBCCA) {
            migrated.benefits = migrated.benefits.filter(b => b.id !== 'b-uhc');
            if (!hasBCCA) {
              const seedBCCA = (initialState.benefits || []).find(b => b.id === 'b-bcca');
              if (seedBCCA) migrated.benefits = [seedBCCA, ...migrated.benefits];
            }
          }
        }
        // One-time: remove deleted placeholders (SV mortgage + SV hot tub) — confirmed N/A by user
        if (Array.isArray(migrated.property))   migrated.property   = migrated.property.filter(p   => p.id !== 'p-ph-mortgage-sv');
        if (Array.isArray(migrated.appliances)) migrated.appliances = migrated.appliances.filter(a => a.id !== 'a-ph-sv-hot-tub');
        // Merge in NEW seed entries (e.g. placeholders) by id — preserves user edits to existing items
        ['vendors','maintenance','appliances','insurance','vehicles','property','benefits','utilities','subscriptions','files'].forEach(k => {
          const baseList = initialState[k] || [];
          if (!baseList.length) return;
          const have = new Set((migrated[k]||[]).map(x => x.id));
          const newOnes = baseList.filter(x => !have.has(x.id));
          if (newOnes.length) migrated[k] = [...(migrated[k]||[]), ...newOnes];
        });
        // Backfill `property` field on maintenance/appliances if user is on an older save without it
        if (Array.isArray(migrated.maintenance)) {
          const seedById = Object.fromEntries((initialState.maintenance||[]).map(m => [m.id, m]));
          migrated.maintenance = migrated.maintenance.map(m => (!m.property && seedById[m.id]?.property) ? { ...m, property: seedById[m.id].property } : m);
        }
        if (Array.isArray(migrated.appliances)) {
          const seedById = Object.fromEntries((initialState.appliances||[]).map(a => [a.id, a]));
          migrated.appliances = migrated.appliances.map(a => (!a.property && seedById[a.id]?.property) ? { ...a, property: seedById[a.id].property } : a);
        }
        return migrated;
      });
      const [view, setView] = useState('dashboard');
      const [modal, setModal] = useState(null);
      const [previewFile, setPreviewFile] = useState(null);
      const [toast, setToast] = useState(null);
      const [propertyScope, setPropertyScope] = useState(loadScope);

      useEffect(() => { saveState(state); }, [state]);
      useEffect(() => { saveScope(propertyScope); }, [propertyScope]);

      const toastTimer = useRef(null);
      const showToast = (msg, action) => {
        setToast(action ? { msg, action } : msg);
        if (toastTimer.current) clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(()=>setToast(null), action ? 5000 : 2400);
      };

      // shared undo core — used by ctx.undoDone and by the toast Undo button
      const undoDoneById = (logId) => {
        setState(s => {
          const entry = (s.completedLog || []).find(l => l.id === logId);
          if (!entry) return s;
          const next = { ...s, completedLog: (s.completedLog||[]).filter(l => l.id !== logId) };
          if (entry.kind === 'warranty') {
            next.appliances = (s.appliances||[]).map(a => a.id === entry.refId ? { ...a, warrantyDismissed: false } : a);
          } else if (entry.kind === 'vendor' && entry.originalDue) {
            next.vendors = (s.vendors||[]).map(v => v.id === entry.refId ? { ...v, nextVisit: entry.originalDue } : v);
          } else if (entry.kind === 'maint' && entry.prevValue !== undefined) {
            next.maintenance = (s.maintenance||[]).map(t => t.id === entry.refId ? { ...t, lastCompleted: entry.prevValue } : t);
          } else if (entry.kind === 'property' && entry.originalDue) {
            next.property = (s.property||[]).map(p => p.id === entry.refId ? { ...p, nextDue: entry.originalDue } : p);
          } else if (entry.kind === 'sub' && entry.originalDue) {
            next.subscriptions = (s.subscriptions||[]).map(x => x.id === entry.refId ? { ...x, renewalDate: entry.originalDue } : x);
          }
          return next;
        });
      };

      // generic CRUD factory for the new flat-list modules
      const mk = (key) => ({
        add:    (item)        => setState(s => ({...s, [key]:[{...item, id:uid()}, ...(s[key]||[])]})),
        update: (id, patch)   => setState(s => ({...s, [key]: (s[key]||[]).map(x => x.id===id?{...x,...patch}:x)})),
        delete: (id)          => setState(s => ({...s, [key]: (s[key]||[]).filter(x => x.id!==id)})),
      });
      const insOps  = mk('insurance');
      const vehOps  = mk('vehicles');
      const utiOps  = mk('utilities');
      const proOps  = mk('property');
      const subOps  = mk('subscriptions');
      const benOps  = mk('benefits');

      const ctx = {
        state, setState, view, setView, modal, setModal, showToast,
        previewFile, setPreviewFile,
        propertyScope, setPropertyScope,
        // vendors
        addVendor: (v) => setState(s => ({...s, vendors:[{...v, id:uid()}, ...s.vendors]})),
        updateVendor: (id, patch) => setState(s => ({...s, vendors: s.vendors.map(v => v.id===id?{...v,...patch}:v)})),
        deleteVendor: (id) => setState(s => ({...s, vendors: s.vendors.filter(v => v.id!==id)})),
        // maintenance
        addTask: (t) => setState(s => ({...s, maintenance:[{...t, id:uid()}, ...s.maintenance]})),
        updateTask: (id, patch) => setState(s => ({...s, maintenance: s.maintenance.map(t => t.id===id?{...t,...patch}:t)})),
        deleteTask: (id) => setState(s => ({...s, maintenance: s.maintenance.filter(t => t.id!==id)})),
        completeTask: (id) => setState(s => {
          const t0 = (s.maintenance||[]).find(t => t.id === id);
          if (!t0) return s;
          const nowISO = toISO(today());
          const logEntry = {
            id: uid(), kind:'maint', refId:id, title: t0.name || '', sub:'',
            originalDue: maintenanceNextDue(t0) || '', prevValue: t0.lastCompleted || '',
            completedAt: new Date().toISOString(),
          };
          return {
            ...s,
            maintenance: (s.maintenance||[]).map(t => t.id===id ? {...t, lastCompleted: nowISO} : t),
            completedLog: [logEntry, ...(s.completedLog||[])],
          };
        }),
        // appliances
        addAppliance: (a) => setState(s => ({...s, appliances:[{...a, id:uid()}, ...s.appliances]})),
        updateAppliance: (id, patch) => setState(s => ({...s, appliances: s.appliances.map(a => a.id===id?{...a,...patch}:a)})),
        deleteAppliance: (id) => setState(s => ({...s, appliances: s.appliances.filter(a => a.id!==id)})),
        // wine
        addBottle: (w) => setState(s => ({...s, wine:[{...w, id:uid()}, ...s.wine]})),
        // "we opened a bottle" — decrement qty + append a tasting entry to wineLog
        openBottle: (w, note, rating) => {
          setState(s => ({
            ...s,
            wine: (s.wine||[]).map(x => x.id === w.id ? { ...x, qty: Math.max(0, (x.qty||0) - 1) } : x),
            wineLog: [{
              id: uid(), wineId: w.id,
              title: `${w.vintage || ''} ${w.producer || ''} ${w.label || ''}`.trim(),
              note: note || '', rating: rating || 0,
              openedAt: new Date().toISOString(),
            }, ...(s.wineLog||[])],
          }));
          showToast(`Logged: ${w.producer} ${w.label}`);
        },
        updateBottle: (id, patch) => setState(s => ({...s, wine: s.wine.map(w => w.id===id?{...w,...patch}:w)})),
        deleteBottle: (id) => setState(s => ({...s, wine: s.wine.filter(w => w.id!==id)})),
        // new modules
        addInsurance: insOps.add, updateInsurance: insOps.update, deleteInsurance: insOps.delete,
        addVehicle: vehOps.add, updateVehicle: vehOps.update, deleteVehicle: vehOps.delete,
        addUtility: utiOps.add, updateUtility: utiOps.update, deleteUtility: utiOps.delete,
        addProperty: proOps.add, updateProperty: proOps.update, deleteProperty: proOps.delete,
        addSubscription: subOps.add, updateSubscription: subOps.update, deleteSubscription: subOps.delete,
        addBenefit: benOps.add, updateBenefit: benOps.update, deleteBenefit: benOps.delete,
        // mark a dashboard item done — applies kind-specific side effect + appends to completedLog
        markDone: (item) => {
          if (!item || !item.kind || !item.id) return;
          const stamp = new Date().toISOString();
          const nowISO = toISO(today());
          const logId = uid();
          const cadenceFreq = (cadence) =>
            cadence === 'monthly'   ? {count:1, unit:'months'} :
            cadence === 'quarterly' ? {count:3, unit:'months'} :
            (cadence === 'annual' || cadence === 'yearly') ? {count:1, unit:'years'} : null;
          setState(s => {
            const prevValue = item.kind === 'maint'
              ? (((s.maintenance||[]).find(t => t.id === item.id) || {}).lastCompleted || '')
              : '';
            const logEntry = {
              id: logId,
              kind: item.kind,                      // maint | vendor | warranty | property | sub
              refId: item.id,                       // original entity id
              title: item.title || '',
              sub: item.sub || '',
              originalDue: item.when || '',
              prevValue,                            // for undo (maint lastCompleted)
              completedAt: stamp,
            };
            const next = { ...s, completedLog: [logEntry, ...(s.completedLog || [])] };
            // kind-specific side effects
            if (item.kind === 'maint') {
              next.maintenance = (s.maintenance||[]).map(t => t.id === item.id ? { ...t, lastCompleted: nowISO } : t);
            } else if (item.kind === 'vendor') {
              // roll recurring vendors forward instead of killing the schedule
              next.vendors = (s.vendors||[]).map(v => v.id === item.id
                ? { ...v, lastVisit: nowISO, nextVisit: (v.schedule?.recurring && v.schedule.freq) ? addInterval(nowISO, v.schedule.freq) : '' }
                : v);
            } else if (item.kind === 'warranty') {
              // dismiss the warranty alert without changing the warrantyExpires field
              next.appliances = (s.appliances||[]).map(a => a.id === item.id ? { ...a, warrantyDismissed: true } : a);
            } else if (item.kind === 'property') {
              // roll by cadence when known; otherwise clear
              next.property = (s.property||[]).map(p => {
                if (p.id !== item.id) return p;
                const f = cadenceFreq(p.cadence);
                return { ...p, nextDue: (f && p.nextDue) ? addInterval(p.nextDue, f) : '' };
              });
            } else if (item.kind === 'sub') {
              next.subscriptions = (s.subscriptions||[]).map(x => {
                if (x.id !== item.id) return x;
                const f = cadenceFreq(x.cadence);
                return { ...x, renewalDate: (f && x.renewalDate) ? addInterval(x.renewalDate, f) : '' };
              });
            }
            return next;
          });
          showToast(`Done: ${item.title || 'item'}`, { label:'Undo', fn: () => undoDoneById(logId) });
        },
        undoDone: (logId) => {
          undoDoneById(logId);
          showToast('Undone');
        },
        clearCompleted: () => {
          if (!confirm('Clear the entire completion history? This cannot be undone.')) return;
          setState(s => ({ ...s, completedLog: [] }));
          showToast('History cleared');
        },
        // generic links manipulation (any module that supports a `links` array)
        addLink: (kind, id, link) => {
          if (!link || !link.url) return;
          setState(s => ({
            ...s,
            [kind]: (s[kind]||[]).map(e =>
              e.id === id ? { ...e, links: [...(e.links || []), link] } : e
            )
          }));
        },
        removeLink: (kind, id, idx) => {
          setState(s => ({
            ...s,
            [kind]: (s[kind]||[]).map(e => {
              if (e.id !== id) return e;
              const next = [...(e.links || [])];
              next.splice(idx, 1);
              return { ...e, links: next };
            })
          }));
        },
        // reset
        resetAll: () => { setState(initialState); showToast('Reset to seed data'); },
      };

      return (
        <Ctx.Provider value={ctx}>
          <ErrorBoundary>
          <div className="min-h-screen relative">
            <Shell view={view} setView={setView}>
              {view === 'dashboard'    && <DashboardView />}
              {view === 'vendors'      && <VendorsView />}
              {view === 'maintenance'  && <MaintenanceView />}
              {view === 'appliances'   && <AppliancesView />}
              {view === 'insurance'    && <InsuranceView />}
              {view === 'property'     && <PropertyView />}
              {view === 'utilities'    && <UtilitiesView />}
              {view === 'subscriptions'&& <SubscriptionsView />}
              {view === 'vehicles'     && <VehiclesView />}
              {view === 'benefits'     && <BenefitsView />}
              {view === 'files'        && <FilesView />}
              {view === 'portfolio'    && <PortfolioView />}
              {view === 'done'         && <DoneView />}
              {view === 'wine'         && <WineView />}
            </Shell>
            {modal && <Modal onClose={()=>setModal(null)}>{modal}</Modal>}
            {previewFile && <FilePreviewModal file={previewFile} onClose={()=>setPreviewFile(null)} />}
            {toast && <Toast toast={toast} onAction={()=>setToast(null)} />}
          </div>
          </ErrorBoundary>
        </Ctx.Provider>
      );
    };

    /* ---------- Shell ---------- */
    const NAV_PRIMARY = [
      { id:'dashboard',   label:'Today',       icon:'home' },
      { id:'vendors',     label:'Vendors',     icon:'users' },
      { id:'maintenance', label:'Maintenance', icon:'wrench' },
      { id:'appliances',  label:'Appliances',  icon:'cube' },
    ];
    const NAV_RECORDS = [
      { id:'insurance',     label:'Insurance',     icon:'shield' },
      { id:'property',      label:'Property',      icon:'key' },
      { id:'utilities',     label:'Utilities',     icon:'zap' },
      { id:'subscriptions', label:'Subscriptions', icon:'receipt' },
      { id:'vehicles',      label:'Vehicles',      icon:'car' },
      { id:'benefits',      label:'Benefits',      icon:'heart' },
      { id:'portfolio',     label:'Portfolio',     icon:'chart' },
      { id:'files',         label:'Files',         icon:'folder' },
      { id:'done',          label:'Done',          icon:'check' },
    ];
    const NAV_OTHER = [
      { id:'wine',        label:'Wine',        icon:'wine' },
    ];
    const NAV_ALL = [...NAV_PRIMARY, ...NAV_RECORDS, ...NAV_OTHER];
    // Mobile bottom nav: 5 most used + "More"
    const NAV_MOBILE = [...NAV_PRIMARY, { id:'_more', label:'More', icon:'more' }];

    /* Property scope segmented control */
    const PropertyScopeBar = () => {
      const ctx = useContext(Ctx);
      const scope = ctx.propertyScope || 'both';
      const setScope = ctx.setPropertyScope;
      // Views where the scope filter is meaningful
      const SCOPED_VIEWS = ['dashboard','vendors','maintenance','appliances','insurance','property','utilities'];
      // Portfolio is intentionally NOT scoped — investments aren't tied to a property
      const active = SCOPED_VIEWS.includes(ctx.view);
      // Counts per property (for non-empty pill hints)
      const allItems = useMemo(() => {
        const s = ctx.state;
        return [
          ...(s.vendors||[]), ...(s.maintenance||[]), ...(s.appliances||[]),
          ...(s.insurance||[]), ...(s.property||[]), ...(s.utilities||[]),
        ];
      }, [ctx.state]);
      const counts = useMemo(() => {
        const c = { 'both': allItems.length, '1619 Seattle': 0, '4322 Sun Valley': 0 };
        allItems.forEach(i => { if (i.property === '1619 Seattle') c['1619 Seattle']++; else if (i.property === '4322 Sun Valley') c['4322 Sun Valley']++; });
        return c;
      }, [allItems]);
      return (
        <div className="inline-flex p-0.5 rounded-full bg-ink-800 border border-ink-600 self-start">
          {PROPERTIES.map(p => {
            const isOn = scope === p.id;
            const dim = !active;
            return (
              <button
                key={p.id}
                onClick={() => setScope(p.id)}
                title={dim ? 'Scope filter is paused on this view' : `${counts[p.id]} items`}
                className={`relative px-3 md:px-3.5 py-1.5 rounded-full text-xs md:text-[13px] font-medium transition whitespace-nowrap ${
                  isOn
                    ? 'bg-gradient-to-b from-gold-400 to-gold-500 text-ink-900 shadow-sm'
                    : 'text-ink-300 hover:text-ink-100'
                } ${dim ? 'opacity-50' : ''}`}
              >
                {p.short}
              </button>
            );
          })}
        </div>
      );
    };

    /* Quick-add sheet — one tap from anywhere to the 4 fastest entry paths */
    const QuickAdd = ({ onClose }) => {
      const ctx = useContext(Ctx);
      const open = (form) => ctx.setModal(form);
      const items = [
        { label:'Vendor',    sub:'Someone who works on the house', icon:'users',  form:()=><VendorForm onClose={()=>ctx.setModal(null)} /> },
        { label:'Task',      sub:'Recurring maintenance',          icon:'wrench', form:()=><TaskForm onClose={()=>ctx.setModal(null)} /> },
        { label:'Appliance', sub:'Equipment worth tracking',       icon:'cube',   form:()=><ApplianceForm onClose={()=>ctx.setModal(null)} /> },
        { label:'Bottle',    sub:'Add to the cellar',              icon:'wine',   form:()=><WineForm onClose={()=>ctx.setModal(null)} /> },
      ];
      return (
        <>
          <ModalHeader title="Add something" subtitle="Takes about 30 seconds." onClose={onClose} />
          <div className="p-4 grid grid-cols-2 gap-2.5">
            {items.map(it => (
              <button key={it.label} onClick={()=>open(it.form())}
                className="card-soft p-4 flex flex-col items-start gap-2 text-left hover:border-gold-400/40 transition">
                <div className="w-10 h-10 rounded-xl bg-ink-700 grid place-items-center text-gold-400"><Icon name={it.icon} size={18}/></div>
                <div>
                  <div className="text-sm font-medium">{it.label}</div>
                  <div className="text-ink-400 text-[11px] mt-0.5">{it.sub}</div>
                </div>
              </button>
            ))}
          </div>
        </>
      );
    };

    const Shell = ({ view, setView, children }) => {
      const ctx = useContext(Ctx);
      const [moreOpen, setMoreOpen] = useState(false);
      useEffect(() => { window.scrollTo(0, 0); }, [view]);
      const attention = useMemo(() => {
        const s = ctx.state;
        let n = (s.maintenance||[]).filter(m => { const d = daysUntil(maintenanceNextDue(m)); return d !== null && d < 0; }).length;
        n += (s.vendors||[]).filter(v => v.nextVisit && daysUntil(v.nextVisit) < 0).length;
        n += (s.property||[]).filter(p => { const d = daysUntil(p.nextDue); return d !== null && d < 0; }).length;
        return n;
      }, [ctx.state]);
      const drinkNowCount = useMemo(() => (ctx.state.wine||[]).filter(w => w.qty > 0 && wineState(w) === 'now').length, [ctx.state]);
      const greeting = (() => {
        const h = new Date().getHours();
        if (h < 5) return 'Late night';
        if (h < 12) return 'Good morning';
        if (h < 17) return 'Good afternoon';
        if (h < 21) return 'Good evening';
        return 'Good evening';
      })();
      const nice = new Date().toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
      const title = NAV_ALL.find(n=>n.id===view)?.label || '';

      const NavLink = ({ n }) => (
        <button onClick={()=>setView(n.id)}
          className={`w-full flex items-center gap-3 px-3 py-2 rounded-xl text-sm transition ${view===n.id?'bg-ink-700 text-ink-50':'text-ink-300 hover:text-ink-100 hover:bg-ink-800'}`}>
          <Icon name={n.icon} size={17} className={view===n.id?'text-gold-400':''} />
          <span>{n.label}</span>
          {view===n.id && <span className="ml-auto w-1.5 h-1.5 rounded-full bg-gold-400" />}
        </button>
      );

      return (
        <div className="min-h-screen relative z-10 md:flex">
          {/* Side rail (desktop) */}
          <aside className="hidden md:flex md:flex-col md:w-60 md:shrink-0 md:h-screen md:sticky md:top-0 border-r border-ink-600 bg-ink-900/80 backdrop-blur">
            <div className="px-6 pt-7 pb-5">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 grid place-items-center text-ink-900 font-display font-semibold">H</div>
                <div className="font-display text-lg tracking-tight">Home HQ</div>
              </div>
            </div>
            <nav className="px-3 mt-2 flex-1 overflow-y-auto">
              {NAV_PRIMARY.map(n => <NavLink key={n.id} n={n} />)}
              <div className="px-3 pt-4 pb-1.5 text-[10px] uppercase tracking-[0.18em] text-ink-400">Records</div>
              {NAV_RECORDS.map(n => <NavLink key={n.id} n={n} />)}
              <div className="px-3 pt-4 pb-1.5 text-[10px] uppercase tracking-[0.18em] text-ink-400">Pleasure</div>
              {NAV_OTHER.map(n => <NavLink key={n.id} n={n} />)}
            </nav>
            <div className="px-6 py-5 text-[11px] text-ink-400 leading-relaxed">
              <div className="font-display text-ink-200 text-sm mb-1">The McCullum house</div>
              <div>v0.2 · local data</div>
            </div>
          </aside>

          {/* Main */}
          <main className="flex-1 min-w-0 pb-24 md:pb-12">
            {/* Top bar */}
            <header className="px-5 md:px-10 pt-safe md:pt-10"><div className="max-w-6xl mx-auto">
              <div className="md:hidden flex items-center justify-between mb-4">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 grid place-items-center text-ink-900 font-display font-semibold">H</div>
                  <div className="font-display text-base tracking-tight">Home HQ</div>
                </div>
                <div className="text-[11px] uppercase tracking-wider text-ink-400">{nice}</div>
              </div>
              <div className="md:flex md:items-end md:justify-between md:gap-6">
                <div>
                  <div className="hidden md:block text-[11px] uppercase tracking-[0.18em] text-ink-400 mb-2">{nice}</div>
                  <h1 className="font-display text-3xl md:text-[2.4rem] tracking-tight leading-tight">
                    {view === 'dashboard' ? <>{greeting}, <span className="text-gold-400">Justin.</span></> : title}
                  </h1>
                  {view === 'dashboard' && (
                    <p className="text-ink-300 text-sm md:text-base mt-1.5 max-w-xl">
                      {attention === 0
                        ? 'The house is caught up. Nothing needs you today.'
                        : `${attention} thing${attention===1?'':'s'} need${attention===1?'s':''} attention — right below.`}
                    </p>
                  )}
                </div>
                <div className="mt-4 md:mt-0 md:pb-1.5 flex items-center gap-2.5">
                  <PropertyScopeBar />
                  <button onClick={()=>ctx.setModal(<QuickAdd onClose={()=>ctx.setModal(null)} />)}
                    className="hidden md:inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full btn-primary text-[13px] font-medium">
                    <Icon name="plus" size={14}/> Add
                  </button>
                </div>
              </div>
            </div></header>

            <section className="px-5 md:px-10 mt-6 md:mt-8">
              <div className="max-w-6xl mx-auto">
                {children}
              </div>
            </section>
          </main>

          {/* Bottom nav (mobile) */}
          <nav className="md:hidden fixed bottom-0 inset-x-0 bg-ink-900/95 backdrop-blur border-t border-ink-600 z-30 pb-safe">
            <div className="flex justify-around">
              {NAV_MOBILE.map(n => {
                const moreActive = !NAV_PRIMARY.some(p => p.id === view);
                const active = n.id === '_more' ? moreActive : view === n.id;
                return (
                  <button key={n.id} onClick={()=> n.id==='_more' ? setMoreOpen(true) : setView(n.id)}
                    className={`flex-1 flex flex-col items-center justify-center py-2.5 gap-1 ${active?'text-gold-400':'text-ink-300'}`}>
                    <Icon name={n.icon} size={20} />
                    <span className="text-[10px] tracking-wide">{n.label}</span>
                  </button>
                );
              })}
            </div>
          </nav>

          {/* Quick-add FAB (mobile) */}
          <button onClick={()=>ctx.setModal(<QuickAdd onClose={()=>ctx.setModal(null)} />)}
            aria-label="Add"
            className="md:hidden fixed right-4 bottom-[calc(4.6rem+env(safe-area-inset-bottom))] z-30 w-14 h-14 rounded-full btn-primary shadow-2xl grid place-items-center">
            <Icon name="plus" size={22} />
          </button>

          {/* Mobile "More" sheet */}
          {moreOpen && (
            <div className="md:hidden fixed inset-0 z-40 modal-backdrop flex items-end" onClick={()=>setMoreOpen(false)}>
              <div className="modal-shell w-full anim-in" onClick={e=>e.stopPropagation()}>
                <ModalHeader title="More" subtitle="Records & references" onClose={()=>setMoreOpen(false)} />
                <div className="p-4 grid grid-cols-2 gap-2.5 pb-safe max-h-[70vh] overflow-y-auto">
                  <div className="col-span-2 text-[10px] uppercase tracking-[0.18em] text-ink-400 px-1">Records</div>
                  {NAV_RECORDS.map(n => {
                    const badge = n.id === 'done' ? (ctx.state.completedLog||[]).length : null;
                    return (
                    <button key={n.id} onClick={()=>{ setView(n.id); setMoreOpen(false); }}
                      className={`card-soft p-4 flex items-center gap-3 text-left ${view===n.id?'border-gold-400/40':''}`}>
                      <div className="w-10 h-10 rounded-xl bg-ink-700 grid place-items-center text-gold-400 shrink-0">
                        <Icon name={n.icon} size={18} />
                      </div>
                      <div className="text-sm font-medium flex-1">{n.label}</div>
                      {badge > 0 && <span className="text-[10px] text-ink-400 tabular-nums">{badge}</span>}
                    </button>
                  );})}
                  <div className="col-span-2 text-[10px] uppercase tracking-[0.18em] text-ink-400 px-1 pt-2">Pleasure</div>
                  {NAV_OTHER.map(n => (
                    <button key={n.id} onClick={()=>{ setView(n.id); setMoreOpen(false); }}
                      className={`card-soft p-4 flex items-center gap-3 text-left ${view===n.id?'border-gold-400/40':''}`}>
                      <div className="w-10 h-10 rounded-xl bg-ink-700 grid place-items-center text-gold-400 shrink-0">
                        <Icon name={n.icon} size={18} />
                      </div>
                      <div className="text-sm font-medium flex-1">{n.label}</div>
                      {n.id === 'wine' && drinkNowCount > 0 && <span className="pill pill-ok">{drinkNowCount} ready</span>}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    /* ---------- shared UI ---------- */
    const SectionHeader = ({ title, count, action, hint }) => (
      <div className="flex items-end justify-between mb-3">
        <div>
          <div className="flex items-baseline gap-2">
            <h2 className="font-display text-xl md:text-2xl tracking-tight">{title}</h2>
            {typeof count === 'number' && <span className="text-ink-400 text-sm tabular-nums">{count}</span>}
          </div>
          {hint && <div className="text-ink-400 text-xs mt-0.5">{hint}</div>}
        </div>
        {action}
      </div>
    );

    const Pill = ({ tone='muted', children, dot=false }) => (
      <span className={`pill pill-${tone}`}>
        {dot && <span className="w-1.5 h-1.5 rounded-full bg-current opacity-80" />}
        {children}
      </span>
    );

    const Empty = ({ icon='sparkles', title, body, cta }) => (
      <div className="card p-8 text-center">
        <div className="mx-auto w-12 h-12 rounded-2xl bg-ink-700 grid place-items-center text-gold-400 mb-3">
          <Icon name={icon} size={22} />
        </div>
        <div className="font-display text-lg">{title}</div>
        {body && <div className="text-ink-300 text-sm mt-1.5 max-w-md mx-auto">{body}</div>}
        {cta && <div className="mt-4">{cta}</div>}
      </div>
    );

    const Modal = ({ children, onClose }) => {
      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        document.body.style.overflow = 'hidden';
        return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
      }, [onClose]);
      return (
        <div className="fixed inset-0 z-50 modal-backdrop flex items-end md:items-center justify-center px-3 md:px-6 pb-3 md:pb-0" onClick={onClose}>
          <div className="modal-shell w-full max-w-lg max-h-[90vh] overflow-y-auto anim-in" onClick={e=>e.stopPropagation()}>
            {children}
          </div>
        </div>
      );
    };

    const ModalHeader = ({ title, subtitle, onClose }) => (
      <div className="flex items-start justify-between p-5 md:p-6 border-b border-ink-600 sticky top-0 bg-ink-850/95 backdrop-blur">
        <div>
          <div className="font-display text-xl tracking-tight">{title}</div>
          {subtitle && <div className="text-ink-300 text-sm mt-0.5">{subtitle}</div>}
        </div>
        <button onClick={onClose} className="w-9 h-9 rounded-full grid place-items-center text-ink-300 hover:bg-ink-700 hover:text-ink-100">
          <Icon name="x" size={18} />
        </button>
      </div>
    );

    const Toast = ({ toast, onAction }) => {
      const msg = typeof toast === 'string' ? toast : toast.msg;
      const action = typeof toast === 'object' ? toast.action : null;
      return (
        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 anim-in">
          <div className="card px-4 py-2.5 text-sm flex items-center gap-2 shadow-2xl">
            <Icon name="check" size={16} className="text-sage-400" />
            <span>{msg}</span>
            {action && (
              <button onClick={()=>{ action.fn(); onAction && onAction(); }}
                className="ml-1 px-2 py-1 rounded-lg text-gold-400 hover:text-gold-300 text-xs font-medium border border-gold-500/30">
                {action.label || 'Undo'}
              </button>
            )}
          </div>
        </div>
      );
    };

    const Btn = ({ variant='primary', icon, children, ...rest }) => (
      <button {...rest}
        className={`inline-flex items-center justify-center gap-2 px-3.5 py-2 rounded-xl text-sm font-medium transition ${
          variant==='primary' ? 'btn-primary' :
          variant==='soft'    ? 'bg-ink-700 hover:bg-ink-600 text-ink-100' :
          variant==='ghost'   ? 'btn-ghost border border-ink-600' :
          variant==='danger'  ? 'bg-ember-500/15 text-ember-400 hover:bg-ember-500/20 border border-ember-500/30' :
          ''
        } ${rest.className||''}`}>
        {icon && <Icon name={icon} size={16} />}
        {children}
      </button>
    );

    /* ===================== DASHBOARD ===================== */
    const DashboardView = () => {
      const ctx = useContext(Ctx);
      const { state, setView, setModal } = ctx;
      const scope = ctx.propertyScope;
      const inS = (x) => inScope(x, scope);

      const [showAllOverdue, setShowAllOverdue] = useState(false);
      const [gapsOpen, setGapsOpen] = useState(false);
      const overdue = useMemo(() => {
        const items = [];
        state.maintenance.forEach(m => {
          if (!inS(m)) return;
          const next = maintenanceNextDue(m);
          const n = daysUntil(next);
          if (n !== null && n < 0) items.push({ kind:'maint', id:m.id, title:m.name, when:next, n });
        });
        state.vendors.forEach(v => {
          if (!inS(v)) return;
          if (v.nextVisit && daysUntil(v.nextVisit) < 0) items.push({ kind:'vendor', id:v.id, title:`${v.serviceType} — ${v.company}`, when:v.nextVisit, n:daysUntil(v.nextVisit), sub:v.name });
        });
        state.appliances.forEach(a => {
          if (!inS(a)) return;
          if (a.warrantyDismissed) return;
          const n = daysUntil(a.warrantyExpires);
          if (n !== null && n < 0) items.push({ kind:'warranty', id:a.id, title:`${a.name} warranty`, when:a.warrantyExpires, n });
        });
        (state.property || []).forEach(p => {
          if (!inS(p)) return;
          const n = daysUntil(p.nextDue);
          if (n !== null && n < 0) items.push({ kind:'property', id:p.id, title:p.label, when:p.nextDue, n, sub:p.cadence ? `${p.cadence}${p.amount?` · $${p.amount}`:''}` : '' });
        });
        (state.subscriptions || []).forEach(sb => {
          const n = daysUntil(sb.renewalDate);
          if (n !== null && n < 0) items.push({ kind:'sub', id:sb.id, title:sb.name, when:sb.renewalDate, n, sub:sb.cost?`$${sb.cost} ${sb.cadence}`:'' });
        });
        return items.sort((a,b)=>a.n-b.n);
      }, [state, scope]);

      const upcoming = useMemo(() => {
        const items = [];
        state.maintenance.forEach(m => {
          if (!inS(m)) return;
          const next = maintenanceNextDue(m);
          const n = daysUntil(next);
          if (n !== null && n >= 0 && n <= 30) items.push({ kind:'maint', id:m.id, title:m.name, when:next, n, sub:`~$${m.estimatedCost}` });
        });
        state.vendors.forEach(v => {
          if (!inS(v)) return;
          const n = daysUntil(v.nextVisit);
          if (n !== null && n >= 0 && n <= 30) items.push({ kind:'vendor', id:v.id, title:`${v.serviceType} — ${v.company}`, when:v.nextVisit, n, sub:v.name });
        });
        (state.property || []).forEach(p => {
          if (!inS(p)) return;
          const n = daysUntil(p.nextDue);
          if (n !== null && n >= 0 && n <= 30) items.push({ kind:'property', id:p.id, title:p.label, when:p.nextDue, n, sub:p.cadence ? `${p.cadence}${p.amount?` · $${p.amount}`:''}` : '' });
        });
        // subscriptions are personal, not property-bound — show always
        (state.subscriptions || []).forEach(s => {
          const n = daysUntil(s.renewalDate);
          if (n !== null && n >= 0 && n <= 30) items.push({ kind:'sub', id:s.id, title:s.name, when:s.renewalDate, n, sub:s.cost?`$${s.cost} ${s.cadence}`:'' });
        });
        return items.sort((a,b)=>a.n-b.n);
      }, [state, scope]);

      const warranties = useMemo(() => {
        return state.appliances
          .filter(a => inS(a) && !a.warrantyDismissed && (() => { const n = daysUntil(a.warrantyExpires); return n !== null && n >= 0 && n <= 90; })())
          .sort((a,b) => daysUntil(a.warrantyExpires) - daysUntil(b.warrantyExpires));
      }, [state, scope]);

      const renewals = useMemo(() => {
        return (state.insurance || [])
          .filter(p => inS(p) && (() => { const n = daysUntil(p.renewalDate); return n !== null && n >= 0 && n <= 60; })())
          .sort((a,b) => daysUntil(a.renewalDate) - daysUntil(b.renewalDate));
      }, [state, scope]);

      const drinkNow = useMemo(() => (state.wine || []).filter(w => wineState(w) === 'now').slice(0, 3), [state]);

      // Gap analysis — surface things that look missing for a full home profile.
      // Items flagged `placeholder:true` are treated as gaps until filled in.
      const gaps = useMemo(() => {
        const out = [];
        const checkSV  = scope === 'both' || scope === '4322 Sun Valley';
        const checkSEA = scope === 'both' || scope === '1619 Seattle';
        const real = (list) => (list || []).filter(x => !x.placeholder);
        const vendors    = real(state.vendors);
        const appliances = real(state.appliances);
        const insurance  = real(state.insurance);
        const property   = real(state.property);
        const hasVendor = (prop, re) => vendors.some(v => v.property === prop && (re instanceof RegExp ? re.test(`${v.serviceType||''} ${v.company||''}`) : v.serviceType === re));
        const hasAppliance = (prop, re) => appliances.some(a => a.property === prop && re.test(`${a.name||''} ${a.brand||''}`));
        const hasInsurance = (re) => insurance.some(p => re.test(`${p.type||''} ${p.coverageSummary||''} ${p.carrier||''}`));
        if (checkSV) {
          if (!hasVendor('4322 Sun Valley', /plumb/i))            out.push({ icon:'wrench', title:'Sun Valley plumber',         property:'4322 Sun Valley', module:'vendors',   why:'Mountain pipes freeze — no plumber on call.' });
          if (!hasVendor('4322 Sun Valley', /electric/i))         out.push({ icon:'zap',    title:'Sun Valley electrician',     property:'4322 Sun Valley', module:'vendors',   why:'No electrician tracked at Sun Valley.' });
          if (!hasVendor('4322 Sun Valley', /HVAC|heat|furnace/i))out.push({ icon:'wrench', title:'Sun Valley HVAC service',    property:'4322 Sun Valley', module:'vendors',   why:'JSR installed the furnace — no recurring service vendor.' });
          if (!hasVendor('4322 Sun Valley', /snow|plow/i))        out.push({ icon:'wrench', title:'Sun Valley snow plow',       property:'4322 Sun Valley', module:'vendors',   why:'Critical for winter access. Alpine Lodging may handle this — confirm.' });
          if (!hasVendor('4322 Sun Valley', /pest/i))             out.push({ icon:'wrench', title:'Sun Valley pest control',    property:'4322 Sun Valley', module:'vendors',   why:'Rodents are common in mountain homes between visits.' });
          if (!hasAppliance('4322 Sun Valley', /water heater|tankless/i)) out.push({ icon:'cube', title:'Sun Valley water heater', property:'4322 Sun Valley', module:'appliances', why:'Not tracked as appliance — needs annual flush.' });
          if (!hasAppliance('4322 Sun Valley', /washer|dryer/i))   out.push({ icon:'cube',   title:'Sun Valley washer/dryer',    property:'4322 Sun Valley', module:'appliances', why:'Only 1619 laundry tracked.' });
          if (!hasAppliance('4322 Sun Valley', /dishwash/i))       out.push({ icon:'cube',   title:'Sun Valley dishwasher',      property:'4322 Sun Valley', module:'appliances', why:'Not tracked.' });
          if (!insurance.some(p => p.property === '4322 Sun Valley' && /landlord|rental|short-term/i.test(p.coverageSummary||''))) out.push({ icon:'shield', title:'Short-term rental rider', property:'4322 Sun Valley', module:'insurance', why:'4322 is rented via Alpine Lodging — confirm Safeco covers STR.' });
        }
        if (checkSEA) {
          if (!hasAppliance('1619 Seattle', /dishwash/i))          out.push({ icon:'cube',   title:'1619 dishwasher',            property:'1619 Seattle',   module:'appliances', why:'Not tracked as appliance.' });
          if (!hasAppliance('1619 Seattle', /water heater|tankless/i)) out.push({ icon:'cube', title:'1619 water heater',        property:'1619 Seattle',   module:'appliances', why:'Maintenance task exists — add the device too.' });
          if (!hasAppliance('1619 Seattle', /microwave/i))         out.push({ icon:'cube',   title:'1619 microwave',             property:'1619 Seattle',   module:'appliances', why:'Common omission.' });
          if (!hasAppliance('1619 Seattle', /thermostat|nest/i))   out.push({ icon:'cube',   title:'Nest thermostat',            property:'1619 Seattle',   module:'appliances', why:'You have Nest Renew utility — track the device too.' });
          if (!hasAppliance('1619 Seattle', /garage/i))            out.push({ icon:'cube',   title:'1619 garage door opener',    property:'1619 Seattle',   module:'appliances', why:'Annual tune-up needed; not tracked.' });
          if (!hasInsurance(/flood/i))                              out.push({ icon:'shield', title:'Flood insurance (1619)',     property:'1619 Seattle',   module:'insurance',  why:'Confirm flood zone via FEMA. Currently no flood policy.' });
        }
        // Cross-property / personal
        if (!property.some(p => p.kind === 'security')) {
          out.push({ icon:'shield', title:'Security/alarm system',  property:'',           module:'property',    why:'No security provider tracked (Ring, ADT, SimpliSafe?).' });
        }
        if (!insurance.some(p => /personal articles|valuables|jewelry|wine collection/i.test(p.coverageSummary||''))) {
          out.push({ icon:'shield', title:'Personal articles floater', property:'',         module:'insurance',  why:'Wine cellar, jewelry, collectibles — typically a rider on home insurance.' });
        }
        // (Sun Valley mortgage and Sun Valley hot tub gap rules dropped — confirmed N/A)
        return out.slice(0, 10);
      }, [state, scope]);

      const generateDigest = () => {
        const lines = [];
        const datestr = new Date().toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
        const scopeLabel = scope === '1619 Seattle' ? ' · Seattle only' : scope === '4322 Sun Valley' ? ' · Sun Valley only' : '';
        // resolve which house an item belongs to, for [SEA]/[SV] tags
        const propTag = (i) => {
          const src = i.kind==='maint' ? state.maintenance : i.kind==='vendor' ? state.vendors : i.kind==='property' ? state.property : i.kind==='warranty' ? state.appliances : null;
          const it = src ? (src||[]).find(x => x.id === i.id) : null;
          const p = it && it.property;
          return p ? (p === '1619 Seattle' ? ' [SEA]' : ' [SV]') : '';
        };
        lines.push(`Home HQ — Weekly digest · ${datestr}${scopeLabel}`);
        lines.push('');
        if (overdue.length) {
          lines.push(`⚠︎ Overdue (${overdue.length})`);
          overdue.slice(0,8).forEach(i => lines.push(`  • ${i.title}${propTag(i)} — ${Math.abs(i.n)}d overdue`));
          lines.push('');
        }
        if (upcoming.length) {
          lines.push(`Coming up — next 30 days (${upcoming.length})`);
          upcoming.slice(0,12).forEach(i => lines.push(`  • ${i.title}${propTag(i)} — ${fmtRelative(i.when)} (${fmtDate(i.when,{month:'short',day:'numeric'})})`));
          lines.push('');
        }
        if (renewals.length) {
          lines.push(`Insurance renewals — next 60 days (${renewals.length})`);
          renewals.forEach(p => lines.push(`  • ${p.carrier} ${p.type} — ${fmtDate(p.renewalDate,{month:'short',day:'numeric',year:'numeric'})}`));
          lines.push('');
        }
        if (warranties.length) {
          lines.push(`Warranties expiring — next 90 days (${warranties.length})`);
          warranties.forEach(a => lines.push(`  • ${a.name} — ${fmtDate(a.warrantyExpires,{month:'short',day:'numeric',year:'numeric'})}`));
          lines.push('');
        }
        if (drinkNow.length) {
          lines.push(`Drink now (${drinkNow.length})`);
          drinkNow.forEach(w => lines.push(`  • ${w.vintage} ${w.producer} ${w.label} — ${w.location} (×${w.qty})`));
          lines.push('');
        }
        const totalCost = upcoming.filter(i=>i.kind==='maint').reduce((acc,i)=>{
          const m = state.maintenance.find(x=>x.id===i.id); return acc + (m?.estimatedCost||0);
        },0);
        if (totalCost) lines.push(`Estimated maintenance cost in next 30 days: ~$${totalCost.toLocaleString()}`);
        const text = lines.join('\n');
        setModal(<DigestModal text={text} onClose={()=>setModal(null)} />);
      };

      return (
        <div className="space-y-8 max-w-5xl">

          {/* Tile row: stats */}
          <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
            <StatTile label="Overdue"      value={overdue.length}  tone="overdue" hint="needs attention" />
            <StatTile label="Next 30 days" value={upcoming.length} tone="soon"    hint="upcoming" />
            <StatTile label="Renewals"     value={renewals.length} tone="info"    hint="≤ 60 days" />
            <StatTile label="Warranties"   value={warranties.length} tone="info"  hint="≤ 90 days" />
            <StatTile label="Drink now"    value={drinkNow.length} tone="ok"      hint="in window" />
          </div>

          {/* Generate digest */}
          <div className="card p-5 md:p-6 flex items-center justify-between gap-4">
            <div>
              <div className="font-display text-lg tracking-tight">This week's digest</div>
              <div className="text-ink-300 text-sm mt-1">A clean, forwardable summary of everything that needs attention.</div>
            </div>
            <Btn icon="sparkles" onClick={generateDigest}>Generate</Btn>
          </div>

          {/* Overdue */}
          <section>
            <SectionHeader title="Overdue" count={overdue.length} hint="Roll these forward when they're done." />
            {overdue.length === 0 ? (
              <Empty icon="check" title="Nothing overdue" body="Great — the house is caught up. New items will surface here as they fall behind."/>
            ) : (
              <>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">

/* Live pricing via Finnhub (free tier, 60 req/min, supports CORS).
   Only fetches Stock + ETF symbols — mutual funds rarely covered on free tier;
   money market always trades at $1; private equity has no public quote. */
const FINNHUB_KEY_STORAGE = 'homehq.finnhubKey';
const QUOTES_CACHE_STORAGE = 'homehq.quotes.v1';
const QUOTES_FRESH_MS = 5 * 60 * 1000;  // 5 min freshness

const usePriceQuotes = () => {
  const [apiKey, setApiKey] = useState(() => { try { return localStorage.getItem(FINNHUB_KEY_STORAGE) || ''; } catch { return ''; } });
  const [quotes, setQuotes] = useState(() => {
    try { return JSON.parse(localStorage.getItem(QUOTES_CACHE_STORAGE) || '{}'); } catch { return {}; }
  });
  const [loading, setLoading] = useState(false);
  const [progress, setProgress] = useState({ done: 0, total: 0 });
  const [error, setError] = useState(null);

  const setKey = (key) => {
    setApiKey(key);
    try { if (key) localStorage.setItem(FINNHUB_KEY_STORAGE, key); else localStorage.removeItem(FINNHUB_KEY_STORAGE); } catch {}
  };

  const refresh = async (symbols) => {
    if (!apiKey) { setError('Need a Finnhub API key — open Settings.'); return; }
    if (!symbols.length) return;
    setLoading(true); setError(null); setProgress({ done: 0, total: symbols.length });
    const next = { ...quotes };
    const failed = [];
    // Finnhub free tier = 60 calls/min. Batch 25 in parallel, then wait 27s
    // between batches (~55/min effective) so we never trip the rate limit.
    // 429s get one retry after the limit window resets.
    const BATCH = 25, GAP_MS = 27000;
    const fetchSym = async (sym, retried) => {
      try {
        const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(sym)}&token=${apiKey}`);
        if (r.status === 429 && !retried) {
          await new Promise(res => setTimeout(res, 31000));
          return fetchSym(sym, true);
        }
        if (!r.ok) { failed.push(sym); return; }
        const j = await r.json();
        // Finnhub returns {c:0} for unknown symbols
        if (typeof j.c === 'number' && j.c > 0) {
          next[sym] = { price: j.c, change: j.d, pctChange: j.dp, asOf: Date.now() };
        } else {
          failed.push(sym);
        }
      } catch (e) { failed.push(sym); }
    };
    for (let i = 0; i < symbols.length; i += BATCH) {
      const slice = symbols.slice(i, i + BATCH);
      await Promise.all(slice.map(sym => fetchSym(sym, false)));
      setProgress({ done: Math.min(i + BATCH, symbols.length), total: symbols.length });
      if (i + BATCH < symbols.length) await new Promise(r => setTimeout(r, GAP_MS));
    }
    setQuotes(next);
    try { localStorage.setItem(QUOTES_CACHE_STORAGE, JSON.stringify(next)); } catch {}
    setLoading(false);
    if (failed.length) setError(`Couldn't quote ${failed.length} symbol${failed.length===1?'':'s'} (often mutual funds / inactive).`);
  };

  const clearQuotes = () => {
    setQuotes({});
    try { localStorage.removeItem(QUOTES_CACHE_STORAGE); } catch {}
  };

  return { apiKey, setKey, quotes, refresh, loading, progress, error, clearQuotes };
};

  );
};

/* ---------- Photo upload button ----------
   Appears on each entity card. Click → opens camera on mobile, file picker on desktop.
   Uploads to the section's Box folder (or Inbox), then attaches the resulting shared link
   as a Documents chip via ctx.addLink. If no token/folder configured, opens BoxSettingsModal first. */
const PhotoUploadButton = ({ entityKind, entityId, label = 'Photo' }) => {
  const ctx = useContext(Ctx);
  const inputRef = useRef(null);
  const [busy, setBusy] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [pendingFile, setPendingFile] = useState(null);
  const [err, setErr] = useState(null);

  const trigger = (e) => {
    e?.stopPropagation();
    setErr(null);
    const { token, expired } = loadBoxToken();
    const folders = loadBoxFolders();
    const folderId = pickBoxFolder(folders, entityKind);
    if (!token || expired || !folderId) {
      // Need configuration first — open settings, then user re-clicks
      setShowSettings(true);
      return;
    }
    inputRef.current?.click();
  };

  const onFileChange = async (e) => {
    const file = e.target.files?.[0];
    e.target.value = ''; // allow re-pick of same file
    if (!file) return;
    await doUpload(file);
  };

  const doUpload = async (file) => {
    setBusy(true); setErr(null);
    try {
      const { token } = loadBoxToken();
      const folders = loadBoxFolders();
      const folderId = pickBoxFolder(folders, entityKind);
      const result = await uploadFileToBox(file, folderId, token);
      if (entityKind && entityId && ctx.addLink) {
        const labelText = `Photo ${new Date().toLocaleDateString(undefined, { month:'short', day:'numeric' })}`;
        ctx.addLink(entityKind, entityId, { label: labelText, url: result.sharedUrl });
      }
      ctx.showToast?.('Photo uploaded to Box');
      setPendingFile(null);
    } catch (ex) {
      console.error('Box upload failed', ex);
      const msg = (ex && ex.message) || 'Upload failed';
      setErr(msg);
      // If token-related, prompt for new token
      if (/401|token|auth/i.test(msg)) {
        setPendingFile(file);
        setShowSettings(true);
      } else {
        ctx.showToast?.(`Upload failed — ${msg.slice(0, 60)}`);
      }
    } finally {
      setBusy(false);
    }
  };

  const onSettingsSaved = async () => {
    if (pendingFile) {
      const f = pendingFile;
      setPendingFile(null);
      await doUpload(f);
    }
  };

  return (
    <>
      <button type="button" onClick={trigger} disabled={busy}
        className="inline-flex items-center gap-1 px-2 py-1 rounded-lg border border-dashed border-ink-500 text-ink-300 hover:text-gold-300 hover:border-gold-500/50 text-xs transition disabled:opacity-50 disabled:cursor-wait">
        <Icon name="camera" size={11}/> {busy ? 'Uploading…' : label}
      </button>
      <input ref={inputRef} type="file" accept="image/*"
        onChange={onFileChange} className="hidden" />
      {err && !showSettings && (
        <span className="text-ember-400 text-[10px] ml-1">{err.slice(0, 60)}</span>
      )}
      {showSettings && (
        <BoxSettingsModal
          onClose={() => setShowSettings(false)}
          onSaved={onSettingsSaved}
          kindHighlight={pickBoxFolder(loadBoxFolders(), entityKind) ? null : 'inbox'}
        />
      )}
    </>
  );
};

const PortfolioView = () => {
  const [scope, setScope] = useState('__all__');
  const [showSettings, setShowSettings] = useState(false);
  const priceState = usePriceQuotes();
  const d = PORTFOLIO_DATA;
  const accounts = ['__all__', ...d.accounts.map(a => a.name)];

  // Symbols we can quote on the free tier (Stock + ETF; skip MF/MMF/PE)
  const fetchableSymbols = useMemo(() => {
    const s = new Set();
    d.holdings.forEach(h => { if (h.securityType === 'Stock' || h.securityType === 'ETF') s.add(h.symbol); });
    return Array.from(s).sort();
  }, []);

  // Apply live quotes to holdings (overlay; baseline preserved)
  const liveHoldings = useMemo(() => {
    return d.holdings.map(h => {
      const q = priceState.quotes[h.symbol];
      if (q && (h.securityType === 'Stock' || h.securityType === 'ETF') && h.quantity != null) {
        const liveValue = q.price * h.quantity;
        const live = {
          ...h,
          baselineValue: h.value,
          baselinePrice: h.price,
          value: liveValue,
          price: q.price,
          livePctChange: q.pctChange,
          live: true,
        };
        // Recompute unrealized G/L from live value if cost basis present
        if (h.costBasis != null) {
          live.unrealizedGL = liveValue - h.costBasis;
          live.unrealizedGLPct = h.costBasis ? (live.unrealizedGL / h.costBasis * 100) : null;
        }
        return live;
      }
      return h;
    });
  }, [priceState.quotes]);

  const rows = useMemo(() => scope === '__all__' ? liveHoldings : liveHoldings.filter(h => h.account === scope), [scope, liveHoldings]);
  const total = useMemo(() => rows.reduce((s,h) => s + (h.value||0), 0), [rows]);
  const baselineTotal = useMemo(() => rows.reduce((s,h) => s + (h.baselineValue != null ? h.baselineValue : (h.value||0)), 0), [rows]);
  const liveDelta = total - baselineTotal;
  const isLive = Object.keys(priceState.quotes).length > 0;

  const aggBy = (key) => {
    const m = {};
    rows.forEach(r => { const k = r[key] || 'Other'; m[k] = (m[k]||0) + (r.value||0); });
    return Object.entries(m).map(([key,value]) => ({key, value, pct: total ? value/total : 0})).sort((a,b) => b.value - a.value);
  };

  const ac = aggBy('assetClass').sort((a,b) => PORTFOLIO_AC_ORDER.indexOf(a.key) - PORTFOLIO_AC_ORDER.indexOf(b.key));
  const st = aggBy('securityType');

  const top10 = useMemo(() => {
    const m = {};
    rows.forEach(h => { if (!m[h.symbol]) m[h.symbol] = { symbol:h.symbol, value:0 }; m[h.symbol].value += (h.value||0); });
    return Object.values(m).sort((a,b) => b.value - a.value).slice(0, 10);
  }, [rows]);

  const stocks = rows.filter(h => h.securityType === 'Stock');
  const stockTot = stocks.reduce((s,h) => s + (h.value||0), 0) || 1;
  const sectors = (() => {
    const m = {};

  })();

  const pltrVal = rows.filter(h => h.symbol === 'PLTR').reduce((s,h) => s + (h.value||0), 0);
  const amznVal = rows.filter(h => h.symbol === 'AMZN').reduce((s,h) => s + (h.value||0), 0);
  const cashVal = rows.filter(h => h.assetClass === 'Cash & Equivalents').reduce((s,h) => s + (h.value||0), 0);

              <div className="font-display text-5xl text-gold-400 leading-none my-1">{d.grade?.overall || 'B−'}</div>

    /* ====================== DONE / COMPLETED LOG ====================== */
    const DoneView = () => {
      const ctx = useContext(Ctx);
      const log = ctx.state.completedLog || [];
      const [filter, setFilter] = useState('all');

      const filtered = useMemo(() => {
        return filter === 'all' ? log : log.filter(l => l.kind === filter);
      }, [log, filter]);

      // Group by relative bucket
      const buckets = useMemo(() => {
        const out = { 'Today': [], 'This week': [], 'This month': [], 'Earlier': [] };
        const now = new Date();
        const startOfDay = new Date(now); startOfDay.setHours(0,0,0,0);
        const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate() - now.getDay()); startOfWeek.setHours(0,0,0,0);
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
        filtered.forEach(l => {
          const d = new Date(l.completedAt);
          if (d >= startOfDay) out['Today'].push(l);
          else if (d >= startOfWeek) out['This week'].push(l);
          else if (d >= startOfMonth) out['This month'].push(l);
          else out['Earlier'].push(l);
        });
        return out;
      }, [filtered]);

      const KIND_LABELS = { maint:'Maintenance', vendor:'Vendor', warranty:'Warranty', property:'Property', sub:'Subscription' };
      const KIND_ICONS  = { maint:'wrench', vendor:'users', warranty:'cube', property:'key', sub:'receipt' };

      const counts = useMemo(() => {
        const c = { all: log.length };
        log.forEach(l => { c[l.kind] = (c[l.kind]||0) + 1; });
        return c;
      }, [log]);

      const kinds = ['all', ...Object.keys(KIND_LABELS).filter(k => counts[k])];

      return (
        <div className="space-y-5 max-w-4xl">
          <div className="flex items-baseline justify-between gap-3 flex-wrap">
            <p className="text-ink-300 text-sm max-w-2xl">
              Running history of items checked off the dashboard. {log.length} total · most recent first.
            </p>
            {log.length > 0 && (
              <button onClick={ctx.clearCompleted} className="text-ink-400 hover:text-ember-400 text-xs underline-offset-2 hover:underline transition">
                Clear history
              </button>
            )}
          </div>

          {log.length === 0 ? (
            <Empty icon="check" title="Nothing completed yet"
              body="When you tick the round checkbox on overdue or upcoming items, they'll be logged here." />
          ) : (
            <>
              <div className="flex gap-2 overflow-x-auto no-bar -mx-1 px-1">
                {kinds.map(k => (
                  <button key={k} onClick={() => setFilter(k)}
                     className={`shrink-0 px-3 py-1.5 rounded-full text-xs border transition whitespace-nowrap ${
                       filter === k ? 'bg-ink-100 text-ink-900 border-ink-100' : 'border-ink-600 text-ink-200 hover:bg-ink-800'
                     }`}>
                    {k === 'all' ? `All · ${counts.all}` : `${KIND_LABELS[k]} · ${counts[k]}`}
                  </button>
                ))}
              </div>

              {Object.entries(buckets).filter(([_,items]) => items.length > 0).map(([bucket, items]) => (
                <section key={bucket}>
                  <div className="text-[11px] uppercase tracking-[0.18em] text-ink-400 mb-2.5">{bucket}</div>
                  <div className="space-y-2">
                    {items.map(l => {
                      const d = new Date(l.completedAt);
                      const when = d.toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
                      return (
                        <div key={l.id} className="card p-3 md:p-4 flex items-start gap-3 group">
                          <div className="w-7 h-7 rounded-full bg-sage-400/15 grid place-items-center text-sage-400 shrink-0 mt-0.5">
                            <Icon name="check" size={13} />
                          </div>
                          <div className="w-9 h-9 rounded-lg bg-ink-700 grid place-items-center text-ink-300 shrink-0">
                            <Icon name={KIND_ICONS[l.kind]||'dot'} size={15} />
                          </div>
                          <div className="min-w-0 flex-1">
                            <div className="text-sm text-ink-100 line-through decoration-ink-500/40 decoration-1">{l.title}</div>
                            {l.sub && <div className="text-ink-400 text-xs mt-0.5 truncate">{l.sub}</div>}
                            <div className="text-ink-400 text-[11px] mt-1">
                              <span className="uppercase tracking-wider">{KIND_LABELS[l.kind]||l.kind}</span> · {when}
                              {l.originalDue && <span className="text-ink-500"> · was due {fmtDate(l.originalDue,{month:'short',day:'numeric'})}</span>}
                            </div>
                          </div>
                          <button onClick={() => ctx.undoDone(l.id)} title="Undo"
                             className="md:opacity-0 md:group-hover:opacity-100 transition text-ink-300 hover:text-gold-300 text-xs px-3 py-2 rounded-lg bg-ink-700/60">
                            Undo
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </section>
              ))}
            </>
          )}
        </div>
      );
    };
